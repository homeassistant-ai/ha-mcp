ignore_missing_imports = true


[tool.ruff]
# Apply the excludes below to explicit paths too: lefthook passes
# {staged_files} and Fast Checks passes the changed files, so without this the
# vendored trees get reformatted or fail the format gate.
force-exclude = true
extend-exclude = [
    "tests/initial_test_state",
    # Vendored libraries — upstream's code style, not ours. Kept in sync
    # with PATHS_IGNORE in scripts/codeql_quality_gate.py.
    "src/ha_mcp/_vendor/websockets",
    "src/ha_mcp/_vendor/fastmcp",
    "src/ha_mcp/_vendor/mcp",
    "src/ha_mcp/_vendor/mcp_types",
    # Vendored skills submodule (src/ha_mcp/resources/skills-vendor) — upstream's
    # code, shipped as package data. Kept in sync with PATHS_IGNORE in
    # scripts/codeql_quality_gate.py.
    "src/ha_mcp/resources/skills-vendor",
    # HA integration manifests must be strict JSON (no trailing commas);
    # ruff 0.15+ formats .json files as JSONC and inserts trailing commas
    # which makes Python's json.load() reject the file at HA startup.
    "custom_components/**/*.json",
]


# 3.13 syntax where an older Python must still parse the code: the package's
# Python-version guard (to print its error instead of a SyntaxError), and the
# Webhook Proxy, whose component runs on the user's Home Assistant.
[tool.ruff.per-file-target-version]
"src/ha_mcp/__init__.py" = "py313"
"homeassistant-addon-webhook-proxy/**" = "py313"
"homeassistant-addon-webhook-proxy-dev/**" = "py313"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "C90",   # mccabe complexity
    "UP",    # pyupgrade
    "RUF",   # ruff-specific rules
    "PIE",   # misc lints
    "PERF",  # performance anti-patterns
    "ASYNC", # async best practices
    "A",     # builtin shadowing
    "LOG",   # logging best practices
    "SIM",   # simplify
    "PLE",   # pylint errors (real bugs: bad logging args, await outside async)
    "BLE001", # blind except: catches Exception without re-raising or logging the traceback
    # Targeted pylint conventions/refactors/warnings. The PL family is NOT
    # selected wholesale: PLC0415 (import-outside-top-level) fights the
    # deliberate lazy-init architecture, and PLR2004 (magic values),
    # PLR0913/PLR0917 (wide FastMCP tool signatures) and PLR0911 (too many
    # returns -- a separate signal from C901's cyclomatic complexity, and
    # noisy on this codebase's early-return validation style) are noise
    # here. Add codes individually so a new upstream PLR rule does not land
    # enabled by default.
    "PLC0206", # dict-index-missing-items
    "PLC0207", # missing-maxsplit-arg
    "PLR0402", # manual-from-import
    "PLR0915", # too-many-statements (default limit 50)
    "PLR1711", # useless-return
    "PLR1714", # repeated-equality-comparison
    "PLR1730", # if-stmt-min-max
    "PLR5501", # collapsible-else-if
    "PLW0108", # unnecessary-lambda
    "PLW0602", # global-variable-not-assigned
    "PLW1510", # subprocess-run-without-check
    "PLW2901", # redefined-loop-name
]
ignore = [
    "E501",    # line too long — formatter handles this
    "B008",    # function calls in defaults — FastMCP pattern
    "SIM102",  # collapsible-if — sometimes less readable
    "SIM108",  # ternary — sometimes less readable
    "SIM105",  # contextlib.suppress — style preference
    "ASYNC109",# timeout params are standard in HA API patterns
    "RUF001",  # ambiguous unicode — HA entity names use degree symbols etc
    "RUF003",  # ambiguous unicode in comments
    "RUF010",  # explicit f-string type conversion — str(x) is clearer than !s
    "RUF059",  # unused unpacked variable
    "SIM118",  # in-dict-keys — style preference
    "PIE810",  # multiple-starts-ends-with — style preference
    "RUF005",  # collection-literal-concatenation
    "RUF022",  # unsorted-dunder-all
    "RUF013",  # implicit-optional
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]
# C901 is enforced repo-wide with no per-file exemptions (the grandfathered
# list was fully cleared by issue #925). Do NOT add "path" = ["C901"] entries
# here — extract helpers to bring the function below the threshold instead:
# "some/path.py" = ["C901"]  <- never this
# Every other blind except carries an inline noqa, which RUF100 fails once it
# is unused. These two are exempt here because a pull request cannot edit the
# stable tree, and an edit to the dev tree needs an app version bump.
"homeassistant-addon-webhook-proxy/start.py" = ["BLE001"]
"homeassistant-addon-webhook-proxy-dev/start.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A parametrize list that resolves to nothing is a guard that silently stopped
# running: pytest reports "got empty parameter set", and the summary counts it
# as neither a failure nor a real skip. Make it a collection error instead.
empty_parameter_set_mark = "fail_at_collect"

# Unregistered markers and unknown config keys are errors. Set here, not as
# --strict-* in addopts: pytest 9.0 (the version Core's test package pins)
# silently ignores those flags in addopts.
strict_markers = true
strict_config = true

# Command line options
addopts = [
    "--verbose",
    "--tb=short",
    "--maxfail=3",
    "-ra",
    "--durations=10",
    # Core's test plugin (pytest-homeassistant, dev group) blocks sockets,
    # fails tests that leave threads or tasks behind, and needs a fresh event
    # loop per test. The unit and app (add-on) trees load it from their
    # conftest; E2E sessions, which share one loop and reach real containers,
    # must not get it from the installed entry point.
    "-p",
    "no:pytest_homeassistant",
    # respx's entry point imports httpx before Home Assistant can alias it to
    # httpx2, which Core refuses at import. Core's plugin imports respx itself.
    "-p",
    "no:respx",
]

# Test markers
markers = [
    # Test speed
    "slow: marks tests as slow (use -m 'not slow' to skip)",
    "addon_disruptive: restarts the server-under-test's own process (addon self-restart); must never run concurrently with other tests on lanes where the MCP server is out-of-process - the lane workflow runs these in a single-worker phase AFTER the parallel run",

    # Test types
    "unit: unit tests (isolated, fast)",
    "e2e: end-to-end tests with full system",
    "performance: performance and load tests",

    # E2E test categories
    "automation: automation lifecycle tests",
    "blueprint: blueprint management tests",
    "calendar: calendar event management tests",
    "device: device control tests",
    "script: script orchestration tests",
    "helper: helper integration tests",
    "integrations: integration management tests (config entries)",
    "labels: label management tests",
    "registry: entity and device registry tests",
    "services: service discovery tests",
    "todo: todo/shopping list management tests",
    "convenience: convenience tools tests (scene, weather, energy, docs)",
    "updates: update management tools tests",
    "system: system management tests (restart, reload, health)",
    "themes: frontend theme management tests",
    "error_handling: error handling and edge case tests",
    "cleanup: tests that create entities needing cleanup",
    "area: area management tests",
    "floor: floor management tests",
    "zone: zone management tests",
    "group: entity group management tests",
    "hacs: HACS (Home Assistant Community Store) tests",
    "update_path: component (stable tag + working tree) x new-server in-process update-path e2e (dedicated lane; runs only with E2E_UPDATE_PATH=1; #1783/#1785)",
    "core: core tool tests (state, service, bulk control, history, templates)",
    "config: configuration management tests (helpers, labels)",
    "filesystem: filesystem access tools tests",
    "haos_only: skip unless HAOS_TEST_IMAGE_PATH is set (HAOS-QEMU backend required; #1281)",
    "beta_haos_only: beta HAOS image lanes with Supervisor/Core version expectations configured",
    "container_only: skip when HAOS backend is active (testcontainer-specific behavior; #1281)",
    "embedded_only: only the embedded testcontainer backend (E2E_BACKEND=embedded), the one lane that installs ha-mcp into the HA image (#2245)",
    "external_only: in-process-server tiers only - skip for inaddon, stdio, container-embedded, and HAOS-embedded servers; #1349, #1527, #2233",
    "inaddon_only: HAOS inaddon mode only - exercises is_running_in_addon()=True paths; #1349",
    "haos_stdio_only: HAOS stdio mode only - exercises the installed ha-mcp command over a real stdio subprocess transport; #2233",
    "haos_tls: final HAOS embedded scenario that restarts Core with HTTPS in the existing worker VM, then restores HTTP; #2241",
    "haos_embedded_only: HAOS embedded mode only (HAOS_TEST_MODE=embedded) - the server shares Home Assistant's process and event loop; #2357",
    "not_on_embedded: skip on the embedded backend (E2E_BACKEND=embedded) - provably redundant with the lane's own in-process ha_mcp_server session backend; #1527",
    "not_on_haos_embedded: skip on the haos_embedded backend (HAOS_TEST_MODE=embedded) - provably redundant with the lane's own session backend, which enables the entry once and drives the in-process server for the whole suite; #1527",
    "requires_tools_entry: needs the File & YAML Tools config entry - skipped on E2E_NO_TOOLS_ENTRY=1 lanes (#2292)",
    "no_tools_only: runs only on E2E_NO_TOOLS_ENTRY=1 lanes (#2292)",
    "requires_component_surface: needs an active ha_mcp_tools config entry - skipped on the no-tools lanes without an active server entry (plain container, HAOS inaddon, where it is absent or disabled); #2584",
]

# A fresh event loop per test, as Core's test plugin requires. The E2E tree
# runs its tests and fixtures on one session loop instead (session-scoped
# mcp_server, mcp_client and ha_client share it); see
# tests/src/e2e/_conftest_collection.py.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

# Per-test timeout (pytest-timeout). A stuck server-side await otherwise
# stalls the run silently until the JOB timeout - observed as a 22-minute
# hang in test_zone_search_discovery on the HAOS in-addon backend. 300s is
# ~10x the slowest legitimate test (~30s deliberate-timeout tests). The signal
# method fails the hung test and lets the run go on, where the thread method
# would end the whole worker process with os._exit(). It calls pytest.fail() in
# whatever frame runs when it fires. In an async test that awaits, that frame is
# the event loop: the traceback ends in the loop's selector, not at the stuck
# await. The test's task would stay pending on the session-scoped loop and
# could resume while a later test runs; tests/src/timed_out_task.py cancels it
# before the test ends, within a bound.
timeout = 300
timeout_method = "signal"
# Bill the timeout to the TEST FUNCTION only. Session fixtures (container
# boot, the embedded backend's server bring-up, HAOS staging) legitimately
# exceed 300s and were being killed mid-setup on the first test per worker,
# preempting their own diagnostics. Runaway fixtures are still bounded by
# the CI job timeouts.
timeout_func_only = true

# Log capture
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Treat warnings as errors to enforce clean tests
filterwarnings = [
    "error",
    # Allow specific non-critical warnings that don't affect functionality
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # Allow all ResourceWarnings, including those emitted during test cleanup
    "ignore::ResourceWarning",
    # Core's http component keeps a plain string key on its aiohttp app.
    "ignore::aiohttp.web_exceptions.NotAppKeyWarning",
]

[dependency-groups]
dev = [
    # Real Home Assistant Core and Core's own test package: unit tests run
    # against Core's modules and its `hass` fixture instead of hand-written
    # fakes, and uv.lock resolves Core's exact pins for the packages ha-mcp
    # shares with the embedded install (packages Core pins only in
    # package_constraints.txt are moved by check_ha_constraint_alignment.py
    # --sync-lock). Both stay on the Core version of the
    # e2e image (tests/test_constants.py); Renovate bumps all three together.
    # renovate: datasource=docker depName=ghcr.io/home-assistant/home-assistant
    "homeassistant==2026.11.1",
    # renovate: datasource=docker depName=ghcr.io/home-assistant/home-assistant
    "pytest-homeassistant==2026.11.1",
    # Test infrastructure imports the SHARED websockets directly (the HAOS
    # runtime harness, the image bake, wait_helpers) to talk to Home
    # Assistant's own WebSocket API — that is test tooling driving HA, not
    # ha-mcp code, so it does not go through the vendored copy. Declared
    # here so the test suite never depends on it arriving transitively;
    # it is NOT a runtime dependency (see the note in [project.dependencies]).
    "websockets>=15.0.1",
    "docker>=7.1.0",
    # Shared SDK for the component's llm_api.py tests; mirrors HA Core's 1.x line.
    "mcp>=1.26.0,<2",
    "mypy>=1.17.0",
    "openai>=1.0.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.1.0",
    "pytest-timeout>=2.3.0",
    # Exercise the component's real sandbox thread affinity in focused unit tests.
    "quickjs-ng==0.17.0.2",
    "pytest-rerunfailures>=15.0",
    # Real voluptuous-openapi for the embedded e2e LLM-API test: it converts
    # the REAL tool-schema catalog exactly like llm_api.py does at runtime.
    # HA core shipped it through 2026.8; from 2026.9 the component manifest
    # is what installs it. aiohttp, voluptuous and probatio (what core 2026.9
    # converts with) come with homeassistant above.
    "voluptuous-openapi>=0.4.1",
    "pytest-xdist>=3.8.0",
    "requests>=2.25.0",
    "lefthook>=1.10.0",
    "ruamel.yaml>=0.18.0",
    "ruff>=0.12.12",
    "testcontainers>=4.13.0",
    "ast-grep-cli>=0.42.0",
    # Renders templates/CHANGELOG.md.j2 in test_changelog_template.py. Keep the
    # version equal to the action pinned in .github/workflows/semver-release.yml,
    # so the test renders with the release that writes the real notes.
    "python-semantic-release==10.7.0",
    # Provides `uv run hamcp-test-env` without shipping it in the ha-mcp wheel.
    "hamcp-test-env",
    # The requirements of the Core integrations whose own handlers the unit
    # tests run, as Core's test suite does: Thread and OTBR, Z-Wave JS, ZHA,
    # KNX, Local Calendar and Remote Calendar, plus usb, hassio,
    # homeassistant_hardware and infrared, which those load. Only the device,
    # bus or server below each library is replaced. Each pin
    # equals the integration's manifest in the Core above;
    # test_dev_integration_pins.py keeps them equal.
    "python-otbr-api==3.1.0",
    "pyroute2==0.9.6",
    "zwave-js-server-python==0.74.0",
    "zha==2.4.3",
    "zha-quirks==2.4.1",
    "aiousbwatcher==1.1.2",
    "serialx==1.15.1",
    "aiohasupervisor==0.8.1",
    "universal-silabs-flasher==1.3.0",
    "ha-silabs-firmware-client==0.4.0",
    "pygbl==1.2.0",
    "infrared-protocols==10.5.0",
    "xknx==4.1.1",
    "xknxproject==3.10.0",
    "knx-frontend==2026.11.8.11926",
    "knx-telegram-store[sqlite,postgres]==0.15.2",
    "ical==14.3.1",
]

[tool.uv]
# The dev group's homeassistant requires Python >=3.14.2; the published
# package keeps >=3.14, so only the lock is narrowed.
environments = ["python_full_version >= '3.14.2'"]

[tool.uv.sources]
hamcp-test-env = { path = "tests/test-env", editable = true }

# Semantic versioning configuration
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
# The HACS component shares the server's version and pins the server build it
# ships with, so each release commit stamps all three below as well as
# project.version (#2427).
version_variables = [
    "custom_components/ha_mcp_tools/manifest.json:version",
    "custom_components/ha_mcp_tools/manifest.json:ha-mcp",
    "custom_components/ha_mcp_tools/const.py:COMPONENT_VERSION",
]
build_command = """
pip install uv && uv lock
git add uv.lock
"""

# Commit message parsing
commit_parser = "angular"
commit_parser_options = { patch_tags = ["fix", "perf", "refactor"] }

# Changelog configuration
[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^.*\\(site\\).*$",           # Commits with (site) scope
    '''chore\(addon\): [Ss]ync changelog.*''',  # Changelog sync commits
    '''chore\(addon\): [Pp]ublish dev addon version.*''',  # One per master merge
]

# Publish configuration (v10 syntax)
[tool.semantic_release.publish]
# semver-release.yml creates the GitHub release itself, with notes cut from
# CHANGELOG.md.
upload_to_vcs_release = false
