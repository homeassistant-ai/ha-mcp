[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-mcp"
version = "8.4.3"
description = "Home Assistant MCP Server - Complete control of Home Assistant through MCP"
readme = "README.md"
# Upper bound widened to <3.15 so the package installs on Home Assistant's
# interpreter when run in-process by the ha_mcp_tools component (HA
# core-2026.7 ships Python 3.14). src/ stays 3.13-compatible.
requires-python = ">=3.13,<3.15"
license = {text = "MIT"}
authors = [
    {name = "Julien", email = "github@qc-h.net"}
]
keywords = ["mcp", "home-assistant", "ai", "automation", "smart-home"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastmcp==3.4.7",
    # Shared with the embedded HA process: admit Core's versions, including
    # compatible updates, instead of requiring it to keep our exact pin.
    # uv.lock selects standalone versions; HA's own constraints select
    # the embedded versions. Check both the HACS minimum and current Core
    # before raising these floors; standalone lock updates can move independently.
    "httpx[socks]>=0.28.1,<0.29",
    "pydantic>=2.13.4,<3",
    "python-dotenv==1.2.3",
    "truststore==0.10.4",
    # websockets is deliberately ABSENT from this list: ha-mcp ships its own
    # private copy (src/ha_mcp/_vendor/websockets, pinned in the vendor
    # requirements.txt and synced by scripts/vendor_websockets.py) and never
    # imports the shared site-packages copy. Inside Home Assistant that
    # shared copy is unowned — ~20 integration libraries drag it in with
    # conflicting version demands and any of their installs can replace or
    # tear it in place (#2135/#2146); a declared dependency here would make
    # ha-mcp PIN that contested copy, which is what forced the in-place
    # replacements. A shared copy can still arrive transitively (fastmcp
    # declares one), so what keeps us off it is the vendored import path,
    # not the absence of this line — and the embedded no-stomp e2e guard is
    # what proves no install of ours ever replaces the shared copy.
    # Range (not a hard pin) so the resolver can satisfy Home Assistant's own
    # cryptography constraint when ha-mcp is installed into the HA venv for
    # in-process embedding (HA 2026.6 pins cryptography==48.0.0, 2026.7 pins
    # 48.0.1 — the floor must admit every supported core's pin; live-found on
    # the embedded e2e lane against the HA 2026.6.4 image).
    # cryptography is a transitive dependency only — never imported in src/.
    "cryptography>=48.0.0,<51",
    "pydantic-monty==0.0.18",
    "tzdata>=2024.1",
    "packaging>=24.0",
]

[project.urls]
"Homepage" = "https://github.com/homeassistant-ai/ha-mcp"
"Bug Tracker" = "https://github.com/homeassistant-ai/ha-mcp/issues"
"Repository" = "https://github.com/homeassistant-ai/ha-mcp"

[project.scripts]
ha-mcp = "ha_mcp.__main__:main"
ha-mcp-smoke-test = "ha_mcp.smoke_test:main"
hamcp-test-env = "tests.test_env_manager:main"
ha-mcp-web = "ha_mcp.__main__:main_web"
ha-mcp-oauth = "ha_mcp.__main__:main_oauth"
ha-mcp-oidc = "ha_mcp.__main__:main_oidc"

[tool.setuptools]
package-dir = {"" = "src", "tests" = "tests"}
packages = { find = { where = ["src", "."], include = ["ha_mcp*", "tests"] } }

[tool.setuptools.package-data]
ha_mcp = ["py.typed", "_pypi_marker", "settings_ui/settings.html", "settings_ui/settings.js", "settings_ui/settings.css", "settings_ui/locales/*.json", "settings_ui/locales/README.md", "resources/skills-vendor/**/*"]
# The vendored websockets tree's non-Python files: the upstream LICENSE
# (BSD-3 requires shipping it), the VENDORED provenance marker, and the
# renovate-managed pin file the drift test reads.
"ha_mcp._vendor" = ["requirements.txt"]
"ha_mcp._vendor.websockets" = ["LICENSE", "VENDORED", "MANIFEST.sha256", "py.typed"]
"ha_mcp._vendor.fastmcp" = ["LICENSE", "VENDORED", "REQUIRES.txt", "MANIFEST.sha256", "py.typed", "**/*.json", "**/*.md"]
"ha_mcp._vendor.mcp" = ["LICENSE", "VENDORED", "REQUIRES.txt", "MANIFEST.sha256", "py.typed"]
"ha_mcp._vendor.mcp_types" = ["LICENSE", "VENDORED", "REQUIRES.txt", "MANIFEST.sha256", "py.typed"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
# /tmp keeps the cache on Linux tmpfs — avoids the slow Windows FS in WSL2.
# Windows-native contributors can remove this line or override with MYPY_CACHE_DIR.
cache_dir = "/tmp/.mypy_cache"
# Vendored skills submodule: upstream's code, not ours to type-check. This is
# the exclusion that was actually failing a local run, because `mypy src/`
# recurses into the submodule when it is initialized while CI's lint job checks
# out without `submodules: true` and never sees it.
# A regex, NOT a [[tool.mypy.overrides]] module entry like the ha_mcp._vendor.*
# one below: `skills-vendor` contains a hyphen, so it has no importable module
# path for a module pattern to match. Do not "simplify" it into that block.
exclude = ['^src/ha_mcp/resources/skills-vendor/']
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "fastmcp.*",
    "jq",
    "pydantic_monty",
    "pydantic_monty.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Vendored websockets: upstream's typing, not ours to check. follow_imports
# skip keeps our client code checked against Any instead of dragging the
# vendored tree into the run.
module = ["ha_mcp._vendor.*"]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "homeassistant.*",
    "aiohasupervisor",
    "aiohasupervisor.*",
    "aiohttp",
    "awesomeversion",
    "yarl",
    "voluptuous",
    # Ships with HA core at runtime (helpers.llm schema conversion, #1745);
    # not installed in this dev environment.
    "voluptuous_openapi",
    "jsonschema",
    "requests",
    "requests.*",
]
ignore_missing_imports = true


[tool.ruff]
target-version = "py313"
line-length = 88
# Apply the excludes below to explicit paths too: lefthook passes
# {staged_files} and Fast Checks passes the changed files, so without this the
# vendored trees get reformatted or fail the format gate.
force-exclude = true
extend-exclude = [
    "tests/initial_test_state",
    # Vendored libraries — upstream's code style, not ours. Kept in sync
    # with PATHS_IGNORE in scripts/codeql_quality_gate.py.
    "src/ha_mcp/_vendor/websockets",
    "src/ha_mcp/_vendor/fastmcp",
    "src/ha_mcp/_vendor/mcp",
    "src/ha_mcp/_vendor/mcp_types",
    # Vendored skills submodule (src/ha_mcp/resources/skills-vendor) — upstream's
    # code, shipped as package data. Kept in sync with PATHS_IGNORE in
    # scripts/codeql_quality_gate.py.
    "src/ha_mcp/resources/skills-vendor",
    # HA integration manifests must be strict JSON (no trailing commas);
    # ruff 0.15+ formats .json files as JSONC and inserts trailing commas
    # which makes Python's json.load() reject the file at HA startup.
    "custom_components/**/*.json",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "C90",   # mccabe complexity
    "UP",    # pyupgrade
    "RUF",   # ruff-specific rules
    "PIE",   # misc lints
    "PERF",  # performance anti-patterns
    "ASYNC", # async best practices
    "A",     # builtin shadowing
    "LOG",   # logging best practices
    "SIM",   # simplify
    "PLE",   # pylint errors (real bugs: bad logging args, await outside async)
    # Targeted pylint conventions/refactors/warnings. The PL family is NOT
    # selected wholesale: PLC0415 (import-outside-top-level) fights the
    # deliberate lazy-init architecture, and PLR2004 (magic values),
    # PLR0913/PLR0917 (wide FastMCP tool signatures) and PLR0911 (too many
    # returns -- a separate signal from C901's cyclomatic complexity, and
    # noisy on this codebase's early-return validation style) are noise
    # here. Add codes individually so a new upstream PLR rule does not land
    # enabled by default.
    "PLC0206", # dict-index-missing-items
    "PLC0207", # missing-maxsplit-arg
    "PLR0402", # manual-from-import
    "PLR1711", # useless-return
    "PLR1714", # repeated-equality-comparison
    "PLR1730", # if-stmt-min-max
    "PLR5501", # collapsible-else-if
    "PLW0108", # unnecessary-lambda
    "PLW0602", # global-variable-not-assigned
    "PLW1510", # subprocess-run-without-check
    "PLW2901", # redefined-loop-name
]
ignore = [
    "E501",    # line too long — formatter handles this
    "B008",    # function calls in defaults — FastMCP pattern
    "SIM102",  # collapsible-if — sometimes less readable
    "SIM108",  # ternary — sometimes less readable
    "SIM105",  # contextlib.suppress — style preference
    "ASYNC109",# timeout params are standard in HA API patterns
    "RUF001",  # ambiguous unicode — HA entity names use degree symbols etc
    "RUF003",  # ambiguous unicode in comments
    "RUF010",  # explicit f-string type conversion — str(x) is clearer than !s
    "RUF059",  # unused unpacked variable
    "SIM118",  # in-dict-keys — style preference
    "PIE810",  # multiple-starts-ends-with — style preference
    "RUF005",  # collection-literal-concatenation
    "RUF022",  # unsorted-dunder-all
    "RUF013",  # implicit-optional
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["E501", "B011"]
# Temporary: the equivalent PLC0207/PLR5501 fixes landed in
# homeassistant-addon-webhook-proxy-dev/ only, per the dev-first/promote-only
# flow (allow-stable-edit is for exceptional stable-only repairs, not routine sweeps —
# see homeassistant-addon-webhook-proxy/AGENTS.md "Dev-first, promote-only").
# The -dev entries name where a reset-dev-from-stable run puts those same two
# stable files (start.py stays put, mcp_proxy/ is renamed to mcp_proxy_dev/),
# so the auto-opened reset PR lints clean. Scoped per file and per rule so
# both rules stay live everywhere else in both trees — the -dev tree is where
# all new webhook-proxy code is authored. Remove all four once the next
# promote carries the fixes into stable.
"homeassistant-addon-webhook-proxy/start.py" = ["PLR5501"]
"homeassistant-addon-webhook-proxy/mcp_proxy/__init__.py" = ["PLC0207"]
"homeassistant-addon-webhook-proxy-dev/start.py" = ["PLR5501"]
"homeassistant-addon-webhook-proxy-dev/mcp_proxy_dev/__init__.py" = ["PLC0207"]
# C901 is enforced repo-wide with no per-file exemptions (the grandfathered
# list was fully cleared by issue #925). Do NOT add "path" = ["C901"] entries
# here — extract helpers to bring the function below the threshold instead:
# "some/path.py" = ["C901"]  <- never this

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# A parametrize list that resolves to nothing is a guard that silently stopped
# running: pytest reports "got empty parameter set", and the summary counts it
# as neither a failure nor a real skip. Make it a collection error instead.
empty_parameter_set_mark = "fail_at_collect"

# Command line options
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--maxfail=3",
    "-ra",
    "--durations=10",
]

# Test markers
markers = [
    # Test speed
    "slow: marks tests as slow (use -m 'not slow' to skip)",
    "addon_disruptive: restarts the server-under-test's own process (addon self-restart); must never run concurrently with other tests on lanes where the MCP server is out-of-process - the lane workflow runs these in a single-worker phase AFTER the parallel run",

    # Test types
    "unit: unit tests (isolated, fast)",
    "integration: integration tests requiring external services",
    "e2e: end-to-end tests with full system",
    "performance: performance and load tests",

    # E2E test categories
    "automation: automation lifecycle tests",
    "blueprint: blueprint management tests",
    "calendar: calendar event management tests",
    "device: device control tests",
    "script: script orchestration tests",
    "helper: helper integration tests",
    "integrations: integration management tests (config entries)",
    "labels: label management tests",
    "registry: entity and device registry tests",
    "services: service discovery tests",
    "todo: todo/shopping list management tests",
    "convenience: convenience tools tests (scene, weather, energy, docs)",
    "updates: update management tools tests",
    "system: system management tests (restart, reload, health)",
    "themes: frontend theme management tests",
    "error_handling: error handling and edge case tests",
    "cleanup: tests that create entities needing cleanup",
    "area: area management tests",
    "floor: floor management tests",
    "zone: zone management tests",
    "group: entity group management tests",
    "hacs: HACS (Home Assistant Community Store) tests",
    "update_path: component (stable tag + working tree) x new-server in-process update-path e2e (dedicated lane; runs only with E2E_UPDATE_PATH=1; #1783/#1785)",
    "core: core tool tests (state, service, bulk control, history, templates)",
    "config: configuration management tests (helpers, labels)",
    "filesystem: filesystem access tools tests",
    "haos_only: skip unless HAOS_TEST_IMAGE_PATH is set (HAOS-QEMU backend required; #1281)",
    "beta_haos_only: beta HAOS image lanes with Supervisor/Core version expectations configured",
    "container_only: skip when HAOS backend is active (testcontainer-specific behavior; #1281)",
    "embedded_only: only the embedded testcontainer backend (E2E_BACKEND=embedded), the one lane that installs ha-mcp into the HA image (#2245)",
    "external_only: in-process-server tiers only - skip for inaddon, stdio, container-embedded, and HAOS-embedded servers; #1349, #1527, #2233",
    "inaddon_only: HAOS inaddon mode only - exercises is_running_in_addon()=True paths; #1349",
    "haos_stdio_only: HAOS stdio mode only - exercises the installed ha-mcp command over a real stdio subprocess transport; #2233",
    "haos_tls: final HAOS embedded scenario that restarts Core with HTTPS in the existing worker VM, then restores HTTP; #2241",
    "haos_embedded_only: HAOS embedded mode only (HAOS_TEST_MODE=embedded) - the server shares Home Assistant's process and event loop; #2357",
    "not_on_embedded: skip on the embedded backend (E2E_BACKEND=embedded) - provably redundant with the lane's own in-process ha_mcp_server session backend; #1527",
    "not_on_haos_embedded: skip on the haos_embedded backend (HAOS_TEST_MODE=embedded) - provably redundant with the lane's own session backend, which enables the entry once and drives the in-process server for the whole suite; #1527",
    "requires_tools_entry: needs the File & YAML Tools config entry - skipped on E2E_NO_TOOLS_ENTRY=1 lanes (#2292)",
    "no_tools_only: runs only on E2E_NO_TOOLS_ENTRY=1 lanes (#2292)",
]

# Async support - session-scoped loop lets session-scoped fixtures
# (mcp_server, mcp_client, ha_client) share one event loop with tests.
# Without this, each test gets a new loop and session-scoped httpx
# clients fail with "Event loop is closed".
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# Per-test timeout (pytest-timeout). A stuck server-side await otherwise
# stalls the run silently until the JOB timeout - observed as a 22-minute
# hang in test_zone_search_discovery on the HAOS in-addon backend. 300s is
# ~10x the slowest legitimate test (~30s deliberate-timeout tests). The signal
# method interrupts only the hung test and raises inside the running coroutine,
# so the failure traceback names the exact stuck await.
timeout = 300
timeout_method = "signal"
# Bill the timeout to the TEST FUNCTION only. Session fixtures (container
# boot, the embedded backend's server bring-up, HAOS staging) legitimately
# exceed 300s and were being killed mid-setup on the first test per worker,
# preempting their own diagnostics. Runaway fixtures are still bounded by
# the CI job timeouts.
timeout_func_only = true

# Log capture
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Treat warnings as errors to enforce clean tests
filterwarnings = [
    "error",
    # Allow specific non-critical warnings that don't affect functionality
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # Allow all ResourceWarnings, including those emitted during test cleanup
    "ignore::ResourceWarning",
]

[dependency-groups]
dev = [
    # Real aiohttp so tests can pin the ClientTimeout defaults the custom
    # component's relay and the webhook-proxy addon rely on (both are stubbed
    # in unit tests; nothing else would catch stub drift). NOT a runtime
    # dependency — src/ never imports aiohttp; HA core provides it in-process.
    # Floor = the aiohttp HA core 2026.6 pins (2026.7 pins 3.14.1, 2026.8.dev
    # pins 3.14.3), so the version tested here is one a supported HA runs.
    "aiohttp>=3.13.5",
    "build>=1.2.2",
    # Test infrastructure imports the SHARED websockets directly (the HAOS
    # runtime harness, the image bake, wait_helpers) to talk to Home
    # Assistant's own WebSocket API — that is test tooling driving HA, not
    # ha-mcp code, so it does not go through the vendored copy. Declared
    # here so the test suite never depends on it arriving transitively;
    # it is NOT a runtime dependency (see the note in [project.dependencies]).
    "websockets>=15.0.1",
    "docker>=7.1.0",
    "httpx2>=2.4.0",
    "mypy>=1.17.0",
    "openai>=1.0.0",
    "jsonschema>=4.25.1",
    "pyinstaller>=6.0.0",
    "pynacl>=1.6.0",
    "psutil>=7.0.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-rerunfailures>=15.0",
    # Real voluptuous for the config-flow tests (the component's
    # config_flow imports it; HA provides it at runtime, tests need it here).
    "voluptuous>=0.15.2",
    # Real voluptuous-openapi for the embedded e2e LLM-API test: it converts
    # the REAL tool-schema catalog exactly like llm_api.py does at runtime.
    # HA core shipped it through 2026.8; from 2026.9 the component manifest
    # is what installs it. Unit tests stub it.
    "voluptuous-openapi>=0.4.1",
    # What core 2026.9 switched to, and converts with when the manifest
    # requirement above is missing. Needed to assert the round trip an
    # LLM-API tool schema actually makes there (#2361): voluptuous-openapi
    # alone cannot show the defect, since it spells an exclusive bound in the
    # numeric form Anthropic accepts.
    "probatio>=0.11.4",
    "pytest-xdist>=3.8.0",
    "requests>=2.25.0",
    "lefthook>=1.10.0",
    "ruamel.yaml>=0.18.0",
    "ruff>=0.12.12",
    "testcontainers>=4.13.0",
    "ast-grep-cli>=0.42.0",
    "pyyaml>=6.0",
]

# Semantic versioning configuration
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = """
pip install uv && uv lock
git add uv.lock
"""
dist_path = "dist/"
upload_to_PyPI = true
upload_to_release = true
remove_dist = false

# Commit message parsing
commit_parser = "angular"
commit_parser_options = { major_tags = ["BREAKING", "!"], minor_tags = ["feat"], patch_tags = ["fix", "perf", "refactor"] }

# Changelog configuration
[tool.semantic_release.changelog]
template_dir = "templates"
exclude_commit_patterns = [
    "^.*\\(site\\).*$",           # Commits with (site) scope
    '''chore\(addon\): [Ss]ync changelog.*''',  # Changelog sync commits
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

# Version scheme
major_on_zero = true
allow_zero_version = false

# Branch and tag configuration
branch = "master"

# Publish configuration (v10 syntax)
[tool.semantic_release.publish]
# GitHub release is created by build-binary.yml workflow to include binaries
upload_to_vcs_release = false
