[build-system]
requires = ["uv_build>=0.12.17,<0.14"]
build-backend = "uv_build"

[project]
name = "ha-mcp"
version = "9.2.0"
description = "Configure and automate Home Assistant with Claude, ChatGPT, and other AI assistants."
readme = "README.md"
# Upper bound widened to <3.15 so the package installs on Home Assistant's
# interpreter when run in-process by the ha_mcp_tools component (HA
# core-2026.7 ships Python 3.14).
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Julien", email = "github@qc-h.net"}
]
keywords = ["mcp", "home-assistant", "ai", "automation", "smart-home"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # fastmcp/mcp/mcp-types are vendored (scripts/vendor_fastmcp.py) so HA
    # Core's own mcp 1.x pin can't conflict. Below: their runtime requirements.
    "anyio>=4.10",
    "authlib>=1.6.11",
    "certifi>=2026.10.19",
    "cyclopts>=4.0.0",
    "exceptiongroup>=1.2.2",
    "griffelib>=2.0.0",
    "httpx2>=2.10.0",
    "joserfc>=1.5.0",
    "jsonref>=1.1.0",
    "jsonschema>=4.20.0",
    "jsonschema-path>=0.3.4",
    "openapi-pydantic>=0.6.0",
    "opentelemetry-api>=1.28.0",
    "platformdirs>=4.0.0",
    "psutil>=7.0.0",
    "py-key-value-aio[filetree,keyring,memory]>=0.4.4,<0.5.0",
    "pydantic-settings>=2.0.0",
    "pyjwt[crypto]>=2.10.1",
    "pyperclip>=1.9.0",
    "python-multipart>=0.0.26",
    "pywin32>=311; sys_platform == 'win32'",
    "pyyaml>=6.0,<7.0",
    "rich>=13.9.4",
    "sse-starlette>=3.0.0",
    "starlette>=1.0.1",
    "typing-extensions>=4.13.0",
    "typing-inspection>=0.4.1",
    "uncalled-for>=0.4.0",
    "uvicorn>=0.35; sys_platform != 'emscripten'",
    "watchfiles>=1.0.0",
    # Shared with the embedded HA process: admit Core's versions, including
    # compatible updates, instead of requiring it to keep our exact pin.
    # uv.lock selects standalone versions; HA's own constraints select
    # the embedded versions. Check both the HACS minimum and current Core
    # before raising these floors; standalone lock updates can move independently.
    "httpx[socks]>=0.28.1,<0.29",
    "pydantic[email]>=2.13.4,<3",
    "python-dotenv>=1.2.4,<2",
    "truststore>=0.10.4,<0.11",
    # websockets is deliberately ABSENT from this list: ha-mcp ships its own
    # private copy (src/ha_mcp/_vendor/websockets, pinned in the vendor
    # requirements.txt and synced by scripts/vendor_websockets.py) and never
    # imports the shared site-packages copy. Inside Home Assistant that
    # shared copy is unowned — ~20 integration libraries drag it in with
    # conflicting version demands and any of their installs can replace or
    # tear it in place (#2135/#2146); a declared dependency here would make
    # ha-mcp PIN that contested copy, which is what forced the in-place
    # replacements. Home Assistant's environment carries a shared copy anyway
    # (Core and other integrations install it), so what keeps us off it is the
    # vendored import path, not the absence of this line — and the embedded no-stomp e2e guard is
    # what proves no install of ours ever replaces the shared copy.
    # Range (not a hard pin) so the resolver can satisfy Home Assistant's own
    # cryptography constraint when ha-mcp is installed into the HA venv for
    # in-process embedding (HA 2026.6 pins cryptography==48.0.0, 2026.7 pins
    # 48.0.1 — the floor must admit every supported core's pin; live-found on
    # the embedded e2e lane against the HA 2026.6.4 image).
    # Only the vendored fastmcp and mcp trees import cryptography; our own code does not.
    "cryptography>=48.0.0,<51",
    "pydantic-monty==0.0.18",
    "tzdata>=2024.1",
    "packaging>=24.0",
]

[project.urls]
"Homepage" = "https://github.com/homeassistant-ai/ha-mcp"
"Bug Tracker" = "https://github.com/homeassistant-ai/ha-mcp/issues"
"Repository" = "https://github.com/homeassistant-ai/ha-mcp"

[project.scripts]
ha-mcp = "ha_mcp.__main__:main"
ha-mcp-smoke-test = "ha_mcp.smoke_test:main"
ha-mcp-web = "ha_mcp.__main__:main_web"
ha-mcp-oauth = "ha_mcp.__main__:main_oauth"
ha-mcp-oidc = "ha_mcp.__main__:main_oidc"

[tool.uv.build-backend]
# Explicit because publish-dev.yml renames the project to ha-mcp-dev, which
# would otherwise make the module name ha_mcp_dev.
module-name = "ha_mcp"
# Every file under src/ha_mcp ships unless excluded here. Of the skills
# submodule only skills/ and LICENSE ship; its evals, scripts, docs, git and
# CI files are not read at runtime, and neither is the settings UI's agent
# guide.
source-exclude = [
    "src/ha_mcp/resources/skills-vendor/.*",
    "src/ha_mcp/resources/skills-vendor/*.md",
    "src/ha_mcp/resources/skills-vendor/evals",
    "src/ha_mcp/resources/skills-vendor/scripts",
    "src/ha_mcp/settings_ui/AGENTS.md",
    "src/ha_mcp/settings_ui/CLAUDE.md",
]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
# /tmp keeps the cache on Linux tmpfs — avoids the slow Windows FS in WSL2.
# Windows-native contributors can remove this line or override with MYPY_CACHE_DIR.
cache_dir = "/tmp/.mypy_cache"
# Vendored skills submodule: upstream's code, not ours to type-check. This is
# the exclusion that was actually failing a local run, because `mypy src/`
# recurses into the submodule when it is initialized while CI's lint job checks
# out without `submodules: true` and never sees it.
# A regex, NOT a [[tool.mypy.overrides]] module entry like the ha_mcp._vendor.*
# one below: `skills-vendor` contains a hyphen, so it has no importable module
# path for a module pattern to match. Do not "simplify" it into that block.
exclude = ['^src/ha_mcp/resources/skills-vendor/']
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# Vendored websockets: upstream's typing, not ours to check. follow_imports
# skip keeps our client code checked against Any instead of dragging the
# vendored tree into the run.
module = ["ha_mcp._vendor.*"]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
# Core 2026.11 installs probatio as ``voluptuous`` at import; the component and
# the webhook proxy run on Core versions before and after that switch, so
# voluptuous schemas stay untyped rather than typed as either library.
module = ["voluptuous", "voluptuous.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# The unit and app (add-on) tests are checked against Core's real types: a
# value Core's declared type does not allow is an error where mypy knows the
# object's type. An untyped test and a helper returning Any are allowed
# (AGENTS.md, Code Conventions), and an untyped fixture parameter is Any, which
# mypy does not check. A test also imports things mypy cannot resolve (a
# script loaded by path, a library without stubs); that says nothing about
# Core's types, so those two codes are off here.
module = ["tests.*"]
disallow_untyped_defs = false
warn_return_any = false
disable_error_code = ["import-not-found", "import-untyped"]

[[tool.mypy.overrides]]
# Test files written before mypy ran on the tests (and the E2E helpers they
