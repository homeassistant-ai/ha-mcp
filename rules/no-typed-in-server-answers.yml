# A unit test that replaces a server function handing back what Home Assistant
# Core, the ha_mcp_tools component, the Supervisor or PyPI answered, and types
# the answer in, asserts against a guess of that answer (#3023). The reply rule
# (no-hand-made-core-replies) knows the client's methods only; this one covers
# the functions between the client and the tools. Reach the state through the
# real thing instead: the component set up in `hass`, Core's own integrations,
# Core's Supervisor test support, a local HTTP server for PyPI.
# The rule knows a replacement by its call: `patch`, `patch.object`,
# `patch.multiple`, `setattr`. Importing `patch` under another name would hide
# one, so that is refused too. A name held in a variable is left to review.
# No file is exempt.
id: no-typed-in-server-answers
language: python
utils:
  # An answer written in the test. A spy on the real function (wraps=real_fn)
  # or a failure (side_effect=SomeError) carries none and stays. A lambda is
  # refused wherever it sits: nothing here can tell one that calls the real
  # function from one that returns a value, and a spy needs none.
  typed-in-answer:
    any:
      - regex: '\breturn_value\s*='
      - has:
          kind: lambda
          stopBy: end
  # The function named by its dotted path, first or as target=:
  # patch("pkg.mod.get_component_caps", ...),
  # monkeypatch.setattr("pkg.mod._fetch_x", ...)
  names-dotted-target:
    has:
      field: arguments
      any:
        - has:
            nthChild: 1
            kind: string
            regex: '^\w*["''][\w.]*\.(get_component_caps|component_serves|component_supports|get_addon_info|get_update_info|_?fetch_\w+)["'']$'
        - has:
            kind: keyword_argument
            regex: '^target\s*=\s*\w*["''][\w.]*\.(get_component_caps|component_serves|component_supports|get_addon_info|get_update_info|_?fetch_\w+)["'']$'
  # The function named as an attribute, second:
  # patch.object(mod, "get_update_info", ...),
  # monkeypatch.setattr(mod, "_fetch_x", ...)
  names-second-argument:
    has:
      field: arguments
      has:
        nthChild: 2
        kind: string
        regex: '^\w*["''](get_component_caps|component_serves|component_supports|get_addon_info|get_update_info|_?fetch_\w+)["'']$'
rule:
  any:
    # The function is named where the call names what it replaces, and nowhere
    # else: a listed name inside a replacement's value is no match.
    - all:
        - kind: call
        - any:
            - all:
                - has:
                    field: function
                    regex: '^(\w+\.)*(patch|setattr)$'
                - matches: names-dotted-target
            # patch.object names the attribute second or as attribute=; its
            # name= only names the mock.
            - all:
                - has:
                    field: function
                    regex: '^(\w+\.)*patch\.object$'
                - any:
                    - matches: names-second-argument
                    - has:
                        field: arguments
                        has:
                          kind: keyword_argument
                          regex: '^attribute\s*=\s*\w*["''](get_component_caps|component_serves|component_supports|get_addon_info|get_update_info|_?fetch_\w+)["'']$'
            # setattr names it second or as name=.
            - all:
                - has:
                    field: function
                    regex: '^(\w+\.)*setattr$'
                - any:
                    - matches: names-second-argument
                    - has:
                        field: arguments
                        has:
                          kind: keyword_argument
                          regex: '^name\s*=\s*\w*["''](get_component_caps|component_serves|component_supports|get_addon_info|get_update_info|_?fetch_\w+)["'']$'
        - matches: typed-in-answer
    # patch.multiple(mod, get_update_info=...): the answer is read from that
    # keyword alone. DEFAULT puts a mock in place that answers for the function.
    - all:
        - kind: call
        - has:
            field: function
            regex: '^(\w+\.)*patch\.multiple$'
        - has:
            field: arguments
            has:
              kind: keyword_argument
              regex: '^(get_component_caps|component_serves|component_supports|get_addon_info|get_update_info|_?fetch_\w+)\s*='
              any:
                - matches: typed-in-answer
                - regex: '=\s*(\w+\.)*DEFAULT$'
    # A patch with nothing but its target: the mock it puts in place answers
    # for the function, and the test sets that answer through the alias
    # (`with patch(...) as caps: caps.return_value = ...`).
    - kind: call
      regex: '^(\w+\.)*patch\(\s*(target\s*=\s*)?["''][\w.]*\.(get_component_caps|component_serves|component_supports|get_addon_info|get_update_info|_?fetch_\w+)["'']\s*,?\s*\)$'
    - kind: call
      regex: '^(\w+\.)*patch\.object\(\s*(target\s*=\s*)?[\w.]+\s*,\s*(attribute\s*=\s*)?["''](get_component_caps|component_serves|component_supports|get_addon_info|get_update_info|_?fetch_\w+)["'']\s*,?\s*\)$'
    # from unittest.mock import patch as replace
    - kind: aliased_import
      has:
        field: name
        regex: '^patch$'
files:
  - "tests/src/unit/**"
  - "tests/addon/**"
