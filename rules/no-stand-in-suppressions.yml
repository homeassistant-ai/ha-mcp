# The real-Core checks on the unit and app tests (tests/AGENTS.md, "Unit Tests
# Run on Real Home Assistant Core") are not switched off line by line. A
# suppression comment exempts a test without it appearing on any list.
id: no-stand-in-suppressions
language: python
rule:
  any:
    - kind: comment
      regex: 'ast-grep-ignore|noqa:[^#]*\bSLF|noqa\s*($|#)|^#\s*mypy:|mypy:\s*(ignore-errors|disable-error-code)|type:\s*ignore(\s*$|\s+#|\[[^\]]*\b(assignment|attr-defined|misc)\b)'
    # typing.no_type_check makes mypy skip a function or a class.
    - kind: identifier
      regex: '^no_type_check$'
files:
  - "tests/src/unit/**"
  - "tests/addon/**"
message: |
  Do not switch a real-Core check off for one line or one file.
  `ast-grep-ignore`, `noqa: SLF001`, a bare `noqa`, any `# mypy:` setting
  comment, `no_type_check`, a bare `type: ignore` and a `type: ignore` for a
  Core object's declared type (`assignment`, `attr-defined`, `misc`) each exempt
  a test from a check without listing it. Write the test against real Core
  instead. See tests/AGENTS.md, "Unit Tests Run on Real Home Assistant Core".
severity: error
