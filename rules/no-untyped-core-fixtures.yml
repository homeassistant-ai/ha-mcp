# mypy checks the unit and app tests against Core's real types, but only what
# it knows the type of. A fixture parameter with no annotation, or typed `Any`,
# is unchecked: `hass.data = None` passes. Tests are otherwise exempt from the
# type-hint rule; the Core fixtures are the exception.
id: no-untyped-core-fixtures
language: python
rule:
  any:
    # def test_x(hass): ...
    - kind: identifier
      regex: '^(hass|hass_ws_client|core_client|component_core_client|entity_registry|device_registry|area_registry)$'
      inside:
        kind: parameters
    # def helper(hass=None): ...
    - kind: default_parameter
      regex: '^(hass|hass_ws_client|core_client|component_core_client|entity_registry|device_registry|area_registry)\s*='
    # def test_x(hass: Any): ...
    - kind: typed_parameter
      regex: '^(hass|hass_ws_client|core_client|component_core_client|entity_registry|device_registry|area_registry)\s*:\s*(typing\.)?(Any|object)$'
    - kind: typed_default_parameter
      regex: '^(hass|hass_ws_client|core_client|component_core_client|entity_registry|device_registry|area_registry)\s*:\s*(typing\.)?(Any|object)\s*='
files:
  - "tests/src/unit/**"
  - "tests/addon/**"
ignores: []
message: |
  Annotate the Core fixtures a test takes with their real types
  (`hass: HomeAssistant`, `core_client: HomeAssistantClient`,
  `entity_registry: er.EntityRegistry`, `hass_ws_client: WebSocketGenerator`),
  not `Any`. mypy checks nothing done to an unannotated parameter, so a value
  Core's types do not allow would pass. See tests/AGENTS.md, "Unit Tests Run on
  Real Home Assistant Core".
severity: error
