# A command's wording is for display. A specific code is authoritative even
# when an unrelated failure happens to mention the same words.
id: no-error-text-classification
language: python
files:
  - "src/ha_mcp/**/*.py"
  - "custom_components/**/*.py"
rule:
  any:
    - pattern: '"not found" in str($ERR).lower()'
    - all:
        - pattern: core_error_message($REPLY.get("error", $$$)) == $TEXT
        - has:
            stopBy: end
            kind: string
            regex: "ID doesn't exist"
    - all:
        - kind: boolean_operator
        - any:
            - pattern: $CODE == $VALUE or $FALLBACK
            - pattern: $FALLBACK or $CODE == $VALUE
        - has:
            stopBy: end
            kind: comparison_operator
            regex: '["''](?:not found|unknown command|already exists)["'']\s+in\s+'
        - has:
            stopBy: end
            kind: string
            regex: '^["''](?:not_found|config_not_found|unknown_command|already_exists)["'']$'
message: |
  Use the command's structured refusal code to decide the outcome. Preserve
  its message for display. A different refusal can contain the same words.
severity: error
