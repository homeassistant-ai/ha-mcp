# A test module is not a library. Importing from another test module, or
# taking the old `mock_client` fixture, brings in that file's hand-written
# Home Assistant client without the stand-in rules seeing it in the importing
# file. The three old fake-client helper modules, and the removed
# `_logbook_fallback`, are refused for the same reason. A shared helper that builds no stand-in goes in a `_*.py` module.
id: no-shared-fake-clients
language: python
rule:
  any:
    # from .test_x import y, from ..test_x import y, from tests.src.unit.test_x
    # import y, from . import test_x, import tests.src.unit.test_x
    - all:
        - any:
            - kind: import_from_statement
              regex: '^from\s+(\.+|tests\.)([\w.]*\.)?test_\w+\s+import'
            - kind: import_from_statement
              regex: '^from\s+(\.+|tests(\.\w+)*)\s+import\s+[^#]*\btest_\w+'
            - kind: import_statement
              regex: '^import\s+tests\.([\w.]*\.)?test_\w+'
        # tests/test_constants.py holds constants, not tests. An E2E test
        # module runs on a live Home Assistant and has no fake client.
        - not:
            regex: '\btest_constants\b|\be2e\b'
    - kind: import_from_statement
      regex: '^from\s+[\w.]*\b(_backup_snapshot_fakes|_component_routing_helpers|_error_log_test_helpers|_logbook_fallback)\s+import'
    - kind: identifier
      regex: '^mock_client$'
      inside:
        kind: parameters
        stopBy: end
files:
  - "tests/src/unit/**"
  - "tests/addon/**"
ignores:
  - "tests/src/unit/test_search_related_graph.py"
  - "tests/src/unit/test_set_dashboard_metadata.py"
  - "tests/src/unit/test_smart_search_scene_phase25.py"
  - "tests/src/unit/test_tools_addons.py"
  - "tests/src/unit/test_tools_assist_pipeline.py"
  - "tests/src/unit/test_tools_bug_report.py"
  - "tests/src/unit/test_tools_camera.py"
  - "tests/src/unit/test_tools_config_automations.py"
  - "tests/src/unit/test_tools_config_scenes.py"
  - "tests/src/unit/test_tools_config_scripts.py"
  - "tests/src/unit/test_tools_entities.py"
  - "tests/src/unit/test_tools_get_states.py"
  - "tests/src/unit/test_tools_history.py"
  - "tests/src/unit/test_tools_integrations.py"
  - "tests/src/unit/test_tools_resources.py"
  - "tests/src/unit/test_tools_todo_bridge.py"
  - "tests/src/unit/test_wait_helpers.py"
  - "tests/src/unit/test_wait_parameter.py"
  - "tests/src/unit/test_yaml_find_key.py"
message: |
  Do not import from another test module or from the old fake-client helpers,
  and do not take the `mock_client` fixture: each hands this file a hand-written
  Home Assistant client. Use the `core_client` fixture; put a shared helper that
  builds no stand-in in a `_*.py` module. See tests/AGENTS.md, "Unit Tests Run
  on Real Home Assistant Core".
severity: error
