message: |
  Do not import from another test module or from the old fake-client helpers,
  and do not take the `mock_client` fixture: each hands this file a hand-written
  Home Assistant client. Use the `core_client` fixture; put a shared helper that
  builds no stand-in in a `_*.py` module. See tests/AGENTS.md, "Unit Tests Run
  on Real Home Assistant Core".
severity: error
