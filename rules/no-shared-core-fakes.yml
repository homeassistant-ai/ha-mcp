id: no-shared-core-fakes
language: python
rule:
  any:
    - pattern: from .test_component_ws_search import $$$NAMES
    - pattern: from .test_component_ws_phase2_async import $$$NAMES
    - pattern: from ._component_ws_fakes import $$$NAMES
files:
  - "tests/src/unit/**"
# Files written before the unit tests ran on real Home Assistant Core. They are
# to be converted and removed from this list; never add a file to it.
ignores:
message: |
  These modules hold hand-written stand-ins for Home Assistant (FakeHass, fake
  registries, a fake WebSocket API) that older tests still use. Do not build
  new tests on them: use the real `hass` fixture, and import `wsapi` from
  `._component_ws_api`. See tests/AGENTS.md, "Unit Tests Run on Real Home
  Assistant Core".
severity: error
