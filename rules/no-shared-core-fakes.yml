id: no-shared-core-fakes
language: python
rule:
  any:
    - pattern: from .test_component_ws_search import $$$NAMES
    - pattern: from .test_component_ws_phase2_async import $$$NAMES
    - pattern: from ._component_ws_fakes import $$$NAMES
files:
  - "tests/src/unit/**"
# Files written before the unit tests ran on real Home Assistant Core. They are
# to be converted and removed from this list; never add a file to it.
ignores:
  - "tests/src/unit/test_component_bulk_call_service_contract.py"
  - "tests/src/unit/test_component_call_service_contract.py"
  - "tests/src/unit/test_component_config_entries_contract.py"
  - "tests/src/unit/test_component_dashboard_edit.py"
  - "tests/src/unit/test_component_dashboards_contract.py"
  - "tests/src/unit/test_component_entity_lookup_contract.py"
  - "tests/src/unit/test_component_flow_helper_domains.py"
  - "tests/src/unit/test_component_helper_collections.py"
  - "tests/src/unit/test_component_helpers_list.py"
  - "tests/src/unit/test_component_info_report_contract.py"
  - "tests/src/unit/test_component_oauth_callbacks_ws.py"
  - "tests/src/unit/test_component_readapi_contract.py"
  - "tests/src/unit/test_component_registries_contract.py"
  - "tests/src/unit/test_component_registry_lookup_contract.py"
  - "tests/src/unit/test_component_search_contract.py"
  - "tests/src/unit/test_component_search_locations.py"
  - "tests/src/unit/test_component_search_visibility_contract.py"
  - "tests/src/unit/test_component_server_entry_update_contract.py"
  - "tests/src/unit/test_component_services_list_contract.py"
  - "tests/src/unit/test_component_system_snapshot_contract.py"
  - "tests/src/unit/test_component_template_diagnose.py"
  - "tests/src/unit/test_component_ws_config_references.py"
  - "tests/src/unit/test_component_ws_logbook.py"
  - "tests/src/unit/test_component_ws_phase2_async.py"
  - "tests/src/unit/test_component_ws_search.py"
  - "tests/src/unit/test_config_subentry_backup.py"
  - "tests/src/unit/test_core_contract.py"
  - "tests/src/unit/test_ha_dev_manage_server_component_contract.py"
message: |
  These modules hold hand-written stand-ins for Home Assistant (FakeHass, fake
  registries, a fake WebSocket API) that older tests still use. Do not build
  new tests on them: use the real `hass` fixture, and import `wsapi` from
  `._component_ws_api`. See tests/AGENTS.md, "Unit Tests Run on Real Home
  Assistant Core".
severity: error
