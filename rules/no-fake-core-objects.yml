id: no-fake-core-objects
language: python
rule:
  kind: class_definition
  has:
    field: name
    regex: ^_?(Fake|Stub)\w*(Hass|Registry|Reg|RegEntry|State|States|Entry|Entries|Subentry|Bus|Connection|WSApi|Store|Storage\w*|Device|Area|Floor|Label|Category|Issue|Lovelace\w*|Dashboard|Template\w*|Entity|Component|Services|Config|Module)$
files:
  - "tests/src/unit/**"
  - "tests/addon/**"
# Files written before the unit tests ran on real Home Assistant Core. They are
# to be converted and removed from this list; never add a file to it.
ignores:
  - "tests/src/unit/_component_ws_fakes.py"
  - "tests/src/unit/test_component_diagnostics.py"
  - "tests/src/unit/test_component_entity_restore.py"
  - "tests/src/unit/test_component_helper_collections.py"
  - "tests/src/unit/test_component_template_diagnose.py"
  - "tests/src/unit/test_component_ws_phase2_async.py"
  - "tests/src/unit/test_component_ws_search.py"
  - "tests/src/unit/test_entity_backup.py"
  - "tests/src/unit/test_tools_entry_lifecycle.py"
  - "tests/src/unit/test_tools_resources_patch.py"
  - "tests/src/unit/test_websocket_pool_lookup.py"
message: |
  Do not write a stand-in for a Home Assistant object (hass, a registry or its
  entries, a state, a config entry, a WebSocket connection, a store, ...).
  Build the real one in the `hass` fixture: a hand-written copy asserts against
  a guess of what Core does. A double of this repository's own classes is fine
  under another name. See tests/AGENTS.md, "Unit Tests Run on Real Home
  Assistant Core".
severity: error
