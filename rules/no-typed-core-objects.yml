# A Core state, registry row or config entry in a unit test comes from Core
# (tests/AGENTS.md, "Unit Tests Run on Real Home Assistant Core": "Data handed
# straight to a pure helper follows the same rule: get it from Core"). A dict
# typed into the test with that shape is a guess of what Core holds. A dict in
# an assert is what our code is expected to return, not Core's data.
id: no-typed-core-objects
language: python
rule:
  kind: dictionary
  not:
    any:
      - inside:
          kind: assert_statement
          stopBy: end
      # A registry file Core loads at startup (``hass_storage[key] = ...``): the
      # only way Core holds a row it would not create at runtime, such as an
      # entity whose config entry is gone.
      - inside:
          kind: assignment
          stopBy: end
          has:
            field: left
            pattern: hass_storage[$KEY]
      # A trigger, condition or action of an automation or script config: what
      # a user writes, which also names entity_id and a state.
      - has:
          kind: pair
          has:
            field: key
            regex: '^["''](condition|trigger|service|action)["'']$'
  any:
    # A state: it always carries its attributes or timestamps besides the
    # value (a scene's ``{"entity_id", "state"}`` entry is a user's config).
    - all:
        - has:
            kind: pair
            has:
              field: key
              regex: '^["'']entity_id["'']$'
        - has:
            kind: pair
            has:
              field: key
              regex: '^["'']state["'']$'
        - has:
            kind: pair
            has:
              field: key
              regex: '^["''](attributes|last_changed|last_updated|last_reported|context)["'']$'
    # An entity registry row. ``platform`` alone is not enough: trigger and
    # condition configs pair it with ``entity_id``.
    - all:
        - has:
            kind: pair
            has:
              field: key
              regex: '^["'']entity_id["'']$'
        - has:
            kind: pair
            has:
              field: key
              regex: '^["''](unique_id|config_entry_id|original_name)["'']$'
    # A device registry row.
    - all:
        - has:
            kind: pair
            has:
              field: key
              regex: '^["'']id["'']$'
        - has:
            kind: pair
            has:
              field: key
              regex: '^["''](identifiers|manufacturer|via_device_id|name_by_user)["'']$'
    # A config entry. Tools take ``domain`` with ``entry_id`` as arguments;
    # an entry also has its ``title``.
    - all:
        - has:
            kind: pair
            has:
              field: key
              regex: '^["'']entry_id["'']$'
        - has:
            kind: pair
            has:
              field: key
              regex: '^["'']title["'']$'
files:
  - "tests/src/unit/**"
  - "tests/addon/**"
message: |
  Do not type a Home Assistant state, registry row or config entry into a test.
  Set Core up (`hass.states.async_set`, a registry fixture, `MockConfigEntry`)
  and read the object back from Core, or let the tool read it. See
  tests/AGENTS.md, "Unit Tests Run on Real Home Assistant Core".
severity: error
