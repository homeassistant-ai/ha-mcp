# A unit test that replaces the Home Assistant client and types in what Core
# "answered" asserts against a guess of Core (#2752). The stand-in rules from
# #3009 see a faked Core object; this one sees the faked reply. Use the
# `core_client` fixture (tests/src/unit/_core_client.py): the server's own
# client connected to the real `hass`.
id: no-hand-made-core-replies
language: python
rule:
  all:
    - any:
        # client.send_websocket_message = AsyncMock(...), and the
        # .return_value / .side_effect forms.
        - kind: assignment
          regex: '^[^=]*\.(abort_config_flow|abort_config_subentry_flow|abort_options_flow|call_service|check_config|delete_automation_config|delete_config_entry|delete_config_subentry|delete_scene_config|delete_script_config|fire_event|get_addon_logs|get_automation_config|get_config|get_config_entry|get_entity_state|get_error_log|get_logbook|get_scene_config|get_script_config|get_services|get_states|guarded_request|list_config_entries|list_config_subentries|list_device_registry|list_entity_registry|render_template|resolve_scene_id|send_websocket_message|start_config_flow|start_config_subentry_flow|start_options_flow|start_reconfigure_flow|submit_config_flow_step|submit_config_subentry_flow_step|submit_options_flow_step|test_connection|token_is_admin|upsert_automation_config|upsert_scene_config|upsert_script_config|_request|_raw_request|send_command|send_command_with_event|send_json_message|subscribe_command|subscribe_events|unsubscribe_events|unsubscribe_command|release_subscription)(\.(return_value|side_effect))?\s*(:[^=]+)?=[^=]'
        # A fake client written as class attributes: get_states = AsyncMock(...)
        - kind: assignment
          regex: '^(abort_config_flow|abort_config_subentry_flow|abort_options_flow|call_service|check_config|delete_automation_config|delete_config_entry|delete_config_subentry|delete_scene_config|delete_script_config|fire_event|get_addon_logs|get_automation_config|get_config|get_config_entry|get_entity_state|get_error_log|get_logbook|get_scene_config|get_script_config|get_services|get_states|guarded_request|list_config_entries|list_config_subentries|list_device_registry|list_entity_registry|render_template|resolve_scene_id|send_websocket_message|start_config_flow|start_config_subentry_flow|start_options_flow|start_reconfigure_flow|submit_config_flow_step|submit_config_subentry_flow_step|submit_options_flow_step|test_connection|token_is_admin|upsert_automation_config|upsert_scene_config|upsert_script_config|_request|_raw_request|send_command|send_command_with_event|send_json_message|subscribe_command|subscribe_events|unsubscribe_events|unsubscribe_command|release_subscription)\s*(:[^=]+)?=\s*((Async|Magic|NonCallable|NonCallableMagic)?Mock|PropertyMock|staticmethod|lambda\b)'
        # MagicMock(get_states=AsyncMock(...))
        - kind: keyword_argument
          regex: '^(abort_config_flow|abort_config_subentry_flow|abort_options_flow|call_service|check_config|delete_automation_config|delete_config_entry|delete_config_subentry|delete_scene_config|delete_script_config|fire_event|get_addon_logs|get_automation_config|get_config|get_config_entry|get_entity_state|get_error_log|get_logbook|get_scene_config|get_script_config|get_services|get_states|guarded_request|list_config_entries|list_config_subentries|list_device_registry|list_entity_registry|render_template|resolve_scene_id|send_websocket_message|start_config_flow|start_config_subentry_flow|start_options_flow|start_reconfigure_flow|submit_config_flow_step|submit_config_subentry_flow_step|submit_options_flow_step|test_connection|token_is_admin|upsert_automation_config|upsert_scene_config|upsert_script_config|_request|_raw_request|send_command|send_command_with_event|send_json_message|subscribe_command|subscribe_events|unsubscribe_events|unsubscribe_command|release_subscription)\s*='
        # A hand-written client: async def send_websocket_message(self, ...)
        - kind: function_definition
          regex: '^(async\s+)?def\s+(abort_config_flow|abort_config_subentry_flow|abort_options_flow|call_service|check_config|delete_automation_config|delete_config_entry|delete_config_subentry|delete_scene_config|delete_script_config|fire_event|get_addon_logs|get_automation_config|get_config|get_config_entry|get_entity_state|get_error_log|get_logbook|get_scene_config|get_script_config|get_services|get_states|guarded_request|list_config_entries|list_config_subentries|list_device_registry|list_entity_registry|render_template|resolve_scene_id|send_websocket_message|start_config_flow|start_config_subentry_flow|start_options_flow|start_reconfigure_flow|submit_config_flow_step|submit_config_subentry_flow_step|submit_options_flow_step|token_is_admin|upsert_automation_config|upsert_scene_config|upsert_script_config|_request|_raw_request|send_command|send_command_with_event|send_json_message|subscribe_command|subscribe_events|unsubscribe_events|unsubscribe_command|release_subscription)\s*\(\s*self\b'
        # patch.object(client, "get_states", ...), monkeypatch.setattr(client,
        # "get_states", ...), setattr(...), patch("pkg.Client.get_states"),
        # configure_mock(...): the method, or where the client comes from, is
        # named in a string.
        - kind: call
          regex: '^(\w+\.)*(patch(\.object|\.multiple)?|setattr|configure_mock)\('
          has:
            kind: string
            regex: '^\w*["'']([\w.]*\.)?((abort_config_flow|abort_config_subentry_flow|abort_options_flow|call_service|check_config|delete_automation_config|delete_config_entry|delete_config_subentry|delete_scene_config|delete_script_config|fire_event|get_addon_logs|get_automation_config|get_config|get_config_entry|get_entity_state|get_error_log|get_logbook|get_scene_config|get_script_config|get_services|get_states|guarded_request|list_config_entries|list_config_subentries|list_device_registry|list_entity_registry|render_template|resolve_scene_id|send_websocket_message|start_config_flow|start_config_subentry_flow|start_options_flow|start_reconfigure_flow|submit_config_flow_step|submit_config_subentry_flow_step|submit_options_flow_step|test_connection|token_is_admin|upsert_automation_config|upsert_scene_config|upsert_script_config|_request|_raw_request|send_command|send_command_with_event|send_json_message|subscribe_command|subscribe_events|unsubscribe_events|unsubscribe_command|release_subscription)|get_websocket_client|websocket_manager(\.\w+)?|httpx_client|HomeAssistantClient(\.\w+)?|HomeAssistantWebSocketClient(\.\w+)?)(\.(return_value|side_effect))?["'']$'
            stopBy: end
        # MagicMock(**{"get_states.return_value": [...]})
        - kind: string
          regex: '^\w*["'']([\w.]*\.)?(abort_config_flow|abort_config_subentry_flow|abort_options_flow|call_service|check_config|delete_automation_config|delete_config_entry|delete_config_subentry|delete_scene_config|delete_script_config|fire_event|get_addon_logs|get_automation_config|get_config|get_config_entry|get_entity_state|get_error_log|get_logbook|get_scene_config|get_script_config|get_services|get_states|guarded_request|list_config_entries|list_config_subentries|list_device_registry|list_entity_registry|render_template|resolve_scene_id|send_websocket_message|start_config_flow|start_config_subentry_flow|start_options_flow|start_reconfigure_flow|submit_config_flow_step|submit_config_subentry_flow_step|submit_options_flow_step|test_connection|token_is_admin|upsert_automation_config|upsert_scene_config|upsert_script_config|_request|_raw_request|send_command|send_command_with_event|send_json_message|subscribe_command|subscribe_events|unsubscribe_events|unsubscribe_command|release_subscription)\.(return_value|side_effect)["'']$'
        # patch.object(websocket_manager, "get_client", ...): the place every
        # tool gets its WebSocket client from.
        - kind: call
          regex: '^(\w+\.)*(patch\.object|setattr)\(\s*[\w.]*websocket_manager\s*,\s*["'']get_client["'']'
        # The transport under the client: client.httpx_client = ...
        - kind: assignment
          regex: '^[^=]*\.httpx_client(\.\w+)*\s*(:[^=]+)?=[^=]'
    # One replacement stays: making the client give no answer at all, which
    # Core cannot be made to do in a unit test. The statement sets a
    # side_effect that raises a transport error and nothing else. An error
    # reply (HomeAssistantAPIError, HomeAssistantCommandError) is Core's answer
    # and comes from Core.
    # A spy stays too: wraps= calls through to the real method, so the reply is
    # still Core's and the test can count or forbid a call.
    - not:
        any:
          - regex: '\bwraps\s*=\s*\w+(\.\w+)+\s*[,)]'
          - regex: 'side_effect\s*=\s*([\w.]+\.)?(HomeAssistantConnectionError|HomeAssistantCommandNotSent|HomeAssistantCommandTimeout|WebSocketException|ConnectionClosed\w*|TimeoutError|ConnectionError|ConnectionResetError|OSError|ConnectError|ConnectTimeout|ReadTimeout|ReadError|TimeoutException|NetworkError|TransportError|RemoteProtocolError)\b[^\[\]{}]*$'
files:
  - "tests/src/unit/**"
  - "tests/addon/**"
