  Do not type in what Home Assistant answered. A replaced client method that
  returns a hand-written reply (or a hand-written client class) asserts against
  a guess of what Core does. Take the `core_client` fixture (or
  `component_core_client`) and pass it where the tool takes its client: every
  REST and WebSocket reply is then Core's own, error replies included. The one
  replacement left is the client getting no answer at all (a dropped
  connection, a timeout), raised as a `side_effect`:
  `client.send_websocket_message = AsyncMock(side_effect=HomeAssistantConnectionError(...))`.
  See tests/AGENTS.md, "Unit Tests Run on Real Home Assistant Core".
