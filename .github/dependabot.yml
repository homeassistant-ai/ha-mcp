version: 2
updates:
  # Docker updates are now handled by Renovate (see renovate.json)
  # Dependabot's Docker ecosystem removed to avoid duplicate PRs

  # Update GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  # Update Python dependencies via uv (reads uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # Held at the pin in pyproject.toml. pydantic-monty 0.0.19 replaced the
      # single-shot `Monty(code, ...)` + `run_async(external_functions=...)`
      # API with a subprocess worker pool (`AsyncMonty` -> `checkout()` ->
      # `feed_run(external_lookup=...)`), which breaks every code path in
      # src/ha_mcp/tools/tools_code.py. The FastMCP version we vendor pins
      # ==0.0.18 for its code-mode extra as well, so nothing is pulling us
      # forward. Monty is 0.0.x, so every release is a patch by semver and
      # there is no narrower update-type that holds the line.
      # Drop this entry when tools_code.py is ported to the pool API.
      - dependency-name: "pydantic-monty"
      # A shared mcp stays on HA Core's 1.x line; ha-mcp's own 2.x SDK is
      # vendored under src/ha_mcp/_vendor.
      - dependency-name: "mcp"
        update-types:
          - "version-update:semver-major"
    groups:
      # Group dev dependencies together
      dev-dependencies:
        patterns:
          - "pytest*"
          - "black"
          - "ruff"
          - "mypy"
          - "isort"
        update-types:
          - "minor"
          - "patch"
      # Group production dependencies
      production-dependencies:
        patterns:
          - "httpx"
          - "pydantic"
          - "websockets"
        update-types:
          - "patch"

  # Renovate alone updates src/ha_mcp/_vendor/requirements.txt, because each
  # pin bump must regenerate its vendored tree (renovate.json). Dependabot
  # security updates still scan the file and would open a pin-only duplicate
  # that fails the vendored-tree tests; this entry ignores every dependency
  # there for both update kinds. The alerts themselves stay on: Renovate's
  # vulnerabilityAlerts reads them to open its own security PR.
  - package-ecosystem: "pip"
    directory: "/src/ha_mcp/_vendor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
