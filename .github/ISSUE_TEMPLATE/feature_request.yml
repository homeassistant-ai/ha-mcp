name: "💡 Feature Request"
description: "Suggest a new feature or improvement"
title: "[FEATURE] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        ## 💡 Suggest a Feature

        Tell us what you'd like to see added to ha-mcp!

  - type: textarea
    id: feature_description
    attributes:
      label: "What would you like to see?"
      description: "Describe the feature or improvement you want."
      placeholder: |
        Example: "Add a tool to manage Home Assistant scenes"
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: "Why do you need this?"
      description: "What problem does this solve? What would you use it for?"
      placeholder: |
        Example: "I have 10 scenes for different times of day, and I want the AI to activate them based on context without needing to write automations."
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: "📋 ha_report_issue Report"
      description: |
        **Required.** Ask your AI agent: *"Request this feature with the ha_report_issue tool."* Run it in a session where your agent tried to do what you are asking for, so its tool calls show the feature does not exist yet or show the problem it should solve.
        Paste its full output here, with tokens and passwords removed. It collects the versions,
        install type, client, settings and tool calls we otherwise have to ask for.

        Only if a report cannot show anything relevant to this request (for example, it is about
        packaging or the docs site rather than something an agent can try), write `N/A` here and
        explain why in the next field. Issues with neither are closed automatically.
      placeholder: "Paste the full ha_report_issue output here"
    validations:
      required: true

  - type: textarea
    id: no_report_reason
    attributes:
      label: "Why there is no ha_report_issue report"
      description: |
        Explain why a report cannot show anything relevant to this request, or that ha-mcp does
        not start or connect. Leaving it out or not wanting to run the tool does not count.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: "Additional context"
      description: "Any other details, examples, or related issues?"
      placeholder: "Optional: screenshots, examples, links to similar features..."
    validations:
      required: false
