name: "🤖 AI Agent Behavior Feedback"
description: "Report AI agent inefficiency, wrong tool usage, or suggest workflow improvements"
title: "[AGENT] "
labels: ["agent-behavior"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🤖 Report AI Agent Behavior

        Use this template when the AI agent:
        - Used the wrong tool or made inefficient choices
        - Should have done something differently
        - Misinterpreted tool output or provided bad parameters

        **This is NOT for bugs in ha-mcp** (use Runtime Bug template instead).

        > 📝 **Title tip:** replace the default `[AGENT] ` with a one-line summary
        > of what the agent did wrong (e.g. `[AGENT] re-runs ha_search
        > instead of caching the result`), not a bare `[AGENT]`.
        >
        > **Easier:** ask your AI agent to report it with the `ha_report_issue` tool and
        > file the issue for you. It can open the issue itself (GitHub CLI, a GitHub
        > connector, or your browser), save the report as a file for you to paste into a
        > blank issue, or give you a link that opens an issue with the report filled in.

  - type: textarea
    id: user_commentary
    attributes:
      label: "💬 Why Are You Reporting This?"
      description: |
        **In your own words** (not AI-generated), tell us:
        - What bothered you about the agent's approach?
        - What were you trying to accomplish?
        - Why do you think it could be better?

        **Examples:**
        - "The agent searched for entities 3 times instead of using the result from the first search"
        - "It used ha_search when I just needed the state of one light"
        - "The agent kept retrying the same failed command without adjusting its approach"
        - "I'm not sure why it's wrong, but it felt slow and inefficient"

        **Note:** Just share your perspective - don't worry about being technical.
      placeholder: |
        Example: "The agent made 5 API calls when I think 1 would have been enough..."
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---

        ## 🚨 Use the `ha_report_issue` Tool (Required)

        **Tell your AI agent:**

        > "You struggled with [describe the issue from your first field]. Report it with the ha_report_issue tool and file the issue for me."

        The agent will collect:
        - Tool call history
        - Environment information
        - Timestamps and performance data

  - type: textarea
    id: report
    attributes:
      label: "📋 ha_report_issue Report"
      description: |
        **Required.** Ask your AI agent: *"Report this with the ha_report_issue tool."* Run it in
        the session where the problem happened. Paste the whole report it generates here (from its
        Auto-Generated heading to the end), with tokens and passwords removed. It collects the
        versions, install type, client, settings and tool calls we otherwise have to ask for.

        If no report can exist, for example because ha-mcp does not start or connect or the problem
        was found by reading the code, typing `N/A` here is acceptable; say why in the next field.
      placeholder: "Paste the whole ha_report_issue report here, or N/A"
    validations:
      required: true

  - type: textarea
    id: no_report_reason
    attributes:
      label: "Why there is no ha_report_issue report"
      description: |
        If you typed N/A above, say why there is no report. A short reason, even "N/A", is enough.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        That's it! We'll analyze the agent's behavior and see how we can improve it.

        **Privacy reminder:** Remove any sensitive data (tokens, passwords) before submitting.
