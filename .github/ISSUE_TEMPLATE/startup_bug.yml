name: "🚀 Startup/Installation Bug"
description: "Report a bug preventing ha-mcp from starting, installing, or connecting"
title: "[BUG] "
labels: ["bug", "startup-bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 Report a Startup/Installation Bug

        Use this template when:
        - ha-mcp won't start or install
        - Connection to Home Assistant fails
        - Your AI client can't connect to ha-mcp

  - type: checkboxes
    id: connect_preflight
    attributes:
      label: "🔌 Connection Pre-flight"
      description: |
        If your AI client can't connect, rule these out first — they cause most reports filed here.
        Details: [Claude.ai connects from my browser but the connector fails](https://homeassistant-ai.github.io/ha-mcp/faq/#claude-ai-hosted-requirements).
      options:
        - label: "My connector URL uses standard HTTPS with **no port** (`https://ha.example.com/...`, not `:8123`) — Anthropic's backend only connects on 443"
        - label: "The URL loads on my **phone with Wi-Fi off**, so it is reachable from the public internet and not just my LAN"
        - label: "Anthropic's egress range `160.79.104.0/21` is not blocked by a WAF, geo-block, or AI-bot filter (Cloudflare's \"Block AI training bots\" included)"
        - label: "Not applicable — this isn't an AI-client connection problem"

  - type: textarea
    id: what_went_wrong
    attributes:
      label: "💬 What Went Wrong?"
      description: |
        **In your own words** (not AI-generated), tell us:
        - What happened when you tried to start/install ha-mcp?
        - What error did you see?
        - What were you trying to accomplish?

        **Examples:**
        - "The server starts then immediately exits"
        - "Claude Desktop shows 'MCP server disconnected' every time"
        - "I get a Python error about missing modules"
        - "Docker container won't stay running"

        **Note:** No AI-generated content please - just describe what happened.
      placeholder: |
        Example: "When I restart Claude Desktop, it says the MCP server failed to start..."
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: "📋 ha_report_issue Report"
      description: |
        **Required.** Ask your AI agent: *"Report this with the ha_report_issue tool."* Run it in
        the session where the problem happened. Paste the whole report it generates here (from its
        Auto-Generated heading to the end), with tokens and passwords removed. It collects the
        versions, install type, client, settings and tool calls we otherwise have to ask for.

        If no report can exist, for example because ha-mcp does not start or connect or the problem
        was found by reading the code, typing `N/A` here is acceptable; say why in the next field.
      placeholder: "Paste the whole ha_report_issue report here, or N/A"
    validations:
      required: true

  - type: textarea
    id: no_report_reason
    attributes:
      label: "Why there is no ha_report_issue report"
      description: |
        If you typed N/A above, say why there is no report, and paste your startup logs and
        configuration here (remove tokens).
    validations:
      required: false

  - type: dropdown
    id: client
    attributes:
      label: "🖥️ Client Application"
      description: "Which client are you using?"
      options:
        - "Claude Desktop"
        - "Claude Code"
        - "Continue"
        - "Cline"
        - "Open WebUI"
        - "Gemini CLI"
        - "VSCode (via Continue or other)"
        - "Cursor"
        - "Zed"
        - "Other (specify below)"
    validations:
      required: true

  - type: dropdown
    id: installation_method
    attributes:
      label: "📦 Installation Method"
      description: "How did you install ha-mcp?"
      options:
        - "uvx ha-mcp"
        - "pip install ha-mcp"
        - "uv pip install ha-mcp"
        - "Docker (ghcr.io/homeassistant-ai/ha-mcp)"
        - "Home Assistant Add-on"
        - "Binary download (GitHub releases)"
        - "Git clone + uv sync"
        - "Other (specify below)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "💻 Operating System"
      description: "Which OS?"
      options:
        - "macOS"
        - "Windows"
        - "Linux"
        - "WSL (Windows Subsystem for Linux)"
        - "Other"
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: "OS Version"
      description: "Specific version (e.g., 'macOS 15.2', 'Ubuntu 24.04', 'Windows 11')"
      placeholder: "macOS 15.2"
    validations:
      required: true

  - type: input
    id: setup_guide_url
    attributes:
      label: "📖 Setup Guide Followed"
      description: "Which setup guide did you follow? See https://homeassistant-ai.github.io/ha-mcp/setup/"
      placeholder: "https://homeassistant-ai.github.io/ha-mcp/guide-macos/"
    validations:
      required: true

  - type: textarea
    id: exact_steps
    attributes:
      label: "🔄 Exact Steps You Followed"
      description: |
        Describe the **exact steps** you took:
        - Installation command you ran
        - Configuration changes you made
        - When the error occurred

        **Be specific!** This helps us reproduce the issue.
      placeholder: |
        1. Opened Terminal
        2. Ran: uvx ha-mcp
        3. Added config to Claude Desktop at ~/Library/Application Support/Claude/claude_desktop_config.json
        4. Set HOMEASSISTANT_URL and HOMEASSISTANT_TOKEN
        5. Restarted Claude Desktop
        6. Got error: "MCP server failed to start"
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: "🐍 Python Version"
      description: "Output of `python --version` or `python3 --version`"
      placeholder: "Python 3.13.0"
    validations:
      required: false

  - type: input
    id: ha_mcp_version
    attributes:
      label: "📦 ha-mcp Version"
      description: "If known (or 'latest')"
      placeholder: "6.4.0 or 'latest from PyPI'"
    validations:
      required: false

  - type: input
    id: home_assistant_version
    attributes:
      label: "🏠 Home Assistant Version"
      description: "If known"
      placeholder: "2025.1.0"
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: "💡 Additional Context"
      description: |
        Any other relevant information:
        - Network setup (proxy, VPN, firewall)
        - Previous versions that worked
        - Workarounds you found
        - Anything else that might help
      placeholder: "Additional details..."
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        **Privacy reminder:** Remove tokens, passwords, and API keys before submitting!
