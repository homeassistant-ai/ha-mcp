name: Release on tag

# Canonical copy: this file lives in the main repo (homeassistant-ai/ha-mcp)
# at .github/integration-mirror-workflows/release-on-tag.yml and is synced
# into the ha-mcp-integration mirror by sync-integration-mirror.yml. Do not
# hand-edit it in the mirror -- edits are overwritten on the next sync.
#
# The monorepo sync pushes vX.Y.Z stable tags and vX.Y.Z-dev.N pre-release
# tags (deploy keys cannot call the GitHub
# API to create a release directly, only push git refs -- including
# annotated tags and, per this same sync workflow, this file). Since the
# deploy key can't set a release body via the API either, the tag itself
# carries the body: the sync workflow creates an ANNOTATED tag whose message
# is the generated component release notes, and this job uses that message
# verbatim as the release body. Tags predating this change (or any that
# somehow end up lightweight/empty) fall back to the old generic stub so
# behavior degrades gracefully instead of shipping a blank release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Serialize runs: a dev pre-release tag and the stable tag that supersedes
# it can arrive minutes apart, each starting its own run. Without
# serialization the stable run's retire scan can list releases before the
# dev run has published its pre-release, orphaning it until the next
# stable release. cancel-in-progress stays false so a queued stable run
# is never evicted.
concurrency:
  group: release-on-tag
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A shallow, ref-only checkout of a tag-push event is not
          # guaranteed to bring down the full annotated tag object (only
          # the commit it points to) -- fetch full history and tags so the
          # tag message is actually present locally for the next step.
          fetch-depth: 0
          fetch-tags: true

      - name: Extract tag message
        run: |
          # A lightweight tag has no message of its own — %(contents) on one
          # falls through to the pointed-to COMMIT's message, so an emptiness
          # check cannot detect it (review finding). Check the tag object's
          # actual type instead: only a real annotated tag ("tag" object)
          # carries the generated release notes; anything else gets the stub.
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag" ]; then
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > /tmp/notes.md
          else
            : > /tmp/notes.md
          fi
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "Component snapshot synced from homeassistant-ai/ha-mcp." > /tmp/notes.md
          fi

      - name: Copy the upstream integration ZIP
        if: hashFiles('.github/component-zip-source.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXPECTED_DIGEST=$(python3 -c "import json; print(json.load(open('.github/component-zip-source.json'))['digest'])")
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          # gh's lookup includes drafts left by interrupted uploads; the REST
          # tag endpoint only guarantees published releases.
          MIRROR_DIGEST=""
          if MIRROR_RELEASE_ID=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json databaseId --jq .databaseId 2>/dev/null); then
            MIRROR_DIGEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${MIRROR_RELEASE_ID}" \
              --jq '.assets[] | select(.name == "ha_mcp_tools.zip" and .state == "uploaded" and .size > 0) | .digest')
          fi
          if [[ "$MIRROR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            if [ "$MIRROR_DIGEST" != "$EXPECTED_DIGEST" ]; then
              echo "::error::The counted mirror asset differs from the tagged ZIP digest."
              exit 1
            fi
            echo "The mirror already has the uploaded ZIP; preserving its download history."
            exit 0
          fi
          SOURCE_REPOSITORY=$(python3 -c "import json; print(json.load(open('.github/component-zip-source.json'))['repository'])")
          SOURCE_TAG=$(python3 -c "import json; print(json.load(open('.github/component-zip-source.json'))['tag'])")
          mkdir -p dist/integration
          # The stable publisher may still be finalizing its draft after PyPI
          # becomes available. Copy the published asset; never rebuild it here.
          for attempt in $(seq 1 40); do
            DIGEST=$(gh api "repos/${SOURCE_REPOSITORY}/releases/tags/${SOURCE_TAG}" \
              --jq '.assets[] | select(.name == "ha_mcp_tools.zip") | .digest' 2>/dev/null || true)
            if [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              if [ "$DIGEST" != "$EXPECTED_DIGEST" ]; then
                echo "::error::The upstream ZIP changed after snapshot verification."
                exit 1
              fi
              gh release download "$SOURCE_TAG" --repo "$SOURCE_REPOSITORY" \
                --pattern ha_mcp_tools.zip --dir dist/integration --clobber
              echo "${EXPECTED_DIGEST#sha256:}  dist/integration/ha_mcp_tools.zip" | sha256sum --check -
              exit 0
            fi
            sleep 15
          done
          echo "::error::The upstream integration ZIP was not published with a digest."
          exit 1

      - name: Create release for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # Check existence explicitly instead of `|| echo "release exists"`:
          # that pattern treated EVERY create failure (auth, rate limit, bad
          # notes file) as already-exists and reported green with no release
          # published (review finding). Now only a genuine duplicate no-ops;
          # a real create failure fails the job visibly.
          if MIRROR_RELEASE_ID=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json databaseId --jq .databaseId 2>/dev/null); then
            # Backfill a missing asset on recovery without replacing one that
            # already has a download history.
            DIGEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${MIRROR_RELEASE_ID}" \
              --jq '.assets[] | select(.name == "ha_mcp_tools.zip" and .state == "uploaded" and .size > 0) | .digest')
            if [ -f .github/component-zip-source.json ] && [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              EXPECTED_DIGEST=$(python3 -c "import json; print(json.load(open('.github/component-zip-source.json'))['digest'])")
              [ "$DIGEST" = "$EXPECTED_DIGEST" ] || { echo "::error::The mirror asset differs from the tagged ZIP digest."; exit 1; }
            fi
            if [ -f dist/integration/ha_mcp_tools.zip ] && ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              # Replace only an incomplete upload, never a usable counted asset.
              gh release upload "$GITHUB_REF_NAME" dist/integration/ha_mcp_tools.zip --repo "$GITHUB_REPOSITORY" --clobber
            fi
            if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
            fi
            echo "release exists"
            exit 0
          fi
          # -dev. tags are the dev channel: the prerelease flag is what keeps
          # them away from stable HACS users (HACS filters on it unless the
          # repository's "Pre-release" switch entity is on) and out of
          # GitHub's "latest" release.
          PRERELEASE_FLAG=""
          case "$GITHUB_REF_NAME" in
            *-dev.*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          ASSETS=()
          if [ -f dist/integration/ha_mcp_tools.zip ]; then
            ASSETS+=(dist/integration/ha_mcp_tools.zip)
          fi
          # With an asset, gh stages the upload before publishing and attempts
          # cleanup on failure; explicit --draft would disable that cleanup.
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "$VER" -F /tmp/notes.md $PRERELEASE_FLAG

      - name: Retire superseded dev pre-releases
        # A stable release supersedes every dev pre-release cut before it:
        # the component version on master only moves forward, so when the
        # bare v<version> lands, any existing -dev. tag is for a version at
        # or below it. HACS's newest-first scan already stops offering those
        # builds once the stable release exists - this step just keeps the
        # releases page and the HACS version dropdown from accumulating
        # stale dev builds. The base-version guard (not a blanket wipe)
        # protects a dev build for a HIGHER version that races in between.
        if: ${{ !contains(github.ref_name, '-dev.') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # Capture instead of piping into the loop: the default GHA shell
          # has no pipefail, so a failed gh api would otherwise read as
          # "nothing to retire" and pass silently.
          TAGS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.prerelease) | .tag_name')
          # Process every tag, THEN fail if any deletion errored: aborting
          # mid-loop (plain set -e) leaves later tags unprocessed, while
          # `|| echo warning` would mask a persistent failure forever - the
          # same anti-pattern the create step's history warns about. A red
          # run here is self-healing (the release is already published and
          # the next stable release re-runs the full scan).
          FAILED=0
          for TAG in $TAGS; do
            case "$TAG" in *-dev.*) ;; *) continue ;; esac
            BASE="${TAG#v}"
            BASE="${BASE%%-dev.*}"
            if [ "$(printf '%s\n%s\n' "$BASE" "$VER" | sort -V | tail -n1)" = "$VER" ]; then
              echo "retiring superseded pre-release ${TAG}"
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || FAILED=1
            else
              echo "keeping ${TAG} (newer than ${VER})"
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::one or more pre-release retirements failed; the next stable release re-runs the scan"
            exit 1
          fi

      - name: Keep the newest five dev pre-releases
        # The main repository keeps its newest five dev pre-releases
        # (publish-dev.yml); the mirror keeps the same number. HACS reads a
        # repository's 30 newest releases and installs the default branch
        # when none of them is stable, so a dev channel left to grow for a
        # whole release cycle pushes the stable release out of reach.
        if: ${{ contains(github.ref_name, '-dev.') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAGS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.prerelease) | .tag_name')
          # The listing can miss the release created moments ago, so count
          # this tag explicitly. Newest first by version, so dev.1000 sorts
          # above dev.999.
          OLD=$(printf '%s\n' "$GITHUB_REF_NAME" $TAGS | grep -e '-dev\.' \
            | sort -rV | uniq | tail -n +6)
          FAILED=0
          for TAG in $OLD; do
            echo "pruning old pre-release ${TAG}"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || FAILED=1
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::one or more pre-release deletions failed; the next dev build re-runs the prune"
            exit 1
          fi
