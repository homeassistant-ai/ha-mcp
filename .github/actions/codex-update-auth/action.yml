name: Refresh Codex auth secret
description: Persist auth.json when Codex refreshes it during a workflow.

inputs:
  codex-auth-path:
    description: Path to auth.json after Codex exits.
    required: true
  original-codex-auth:
    description: Path to the pre-run auth.json snapshot.
    required: true
  gh-token:
    description: Token allowed to update Actions secrets in the target repository.
    required: true
  repository:
    description: Target repository in owner/name form.
    required: true
  secret-name:
    description: Repository secret to update.
    required: false
    default: CODEX_AUTH
  force-update:
    description: Rewrite the secret even when auth.json is unchanged.
    required: false
    default: "false"

outputs:
  updated:
    description: Whether the secret changed.
    value: ${{ steps.refresh.outputs.updated }}

runs:
  using: composite
  steps:
    - id: refresh
      shell: bash
      env:
        CODEX_AUTH_PATH: ${{ inputs.codex-auth-path }}
        ORIGINAL_CODEX_AUTH: ${{ inputs.original-codex-auth }}
        GH_TOKEN: ${{ inputs.gh-token }}
        TARGET_REPOSITORY: ${{ inputs.repository }}
        SECRET_NAME: ${{ inputs.secret-name }}
        FORCE_UPDATE: ${{ inputs.force-update }}
      run: |
        set -euo pipefail
        echo "updated=false" >> "$GITHUB_OUTPUT"

        if [[ -z "${GH_TOKEN:-}" ]]; then
          echo "::error::gh-token is required to persist refreshed Codex auth."
          exit 1
        fi
        if [[ ! -f "$CODEX_AUTH_PATH" || ! -f "$ORIGINAL_CODEX_AUTH" ]]; then
          echo "::error::Codex auth file or original snapshot is missing."
          exit 1
        fi
        force_update="${FORCE_UPDATE,,}"
        if [[ "$force_update" != "true" && "$force_update" != "false" ]]; then
          echo "::error::force-update must be true or false."
          exit 1
        fi
        if [[ "$force_update" == "false" ]] && cmp -s "$ORIGINAL_CODEX_AUTH" "$CODEX_AUTH_PATH"; then
          echo "Codex auth unchanged; no secret update needed."
          exit 0
        fi

        gh secret set "$SECRET_NAME" \
          --repo "$TARGET_REPOSITORY" \
          < "$CODEX_AUTH_PATH"
        echo "updated=true" >> "$GITHUB_OUTPUT"
        echo "Updated $SECRET_NAME in $TARGET_REPOSITORY."
