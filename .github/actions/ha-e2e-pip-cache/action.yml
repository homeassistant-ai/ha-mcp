name: Cache testcontainer pip wheels
description: >
  Restore and save the host directory the testcontainer E2E lanes bind over the
  Home Assistant image's pip cache, and export HA_E2E_PIP_CACHE so their
  in-container preinstalls reuse wheels instead of downloading the dependency
  tree on every run.

# Each testcontainer worker builds its own container and runs pip inside it —
# the component's manifest requirements, plus the checkout wheel and its
# dependency tree on the embedded lane. Without this, every PR pays those
# downloads per worker (about 18 containers across pr.yml's five testcontainer
# jobs) and inherits PyPI's latency from required checks.
# The HA image alone is already cached by the surrounding workflows; this is
# the other half of the bring-up cost.
#
# The cache key carries the image reference, the lane and the component
# manifest because the pinned ha-mcp build, the install path and the
# interpreter inside the image decide which wheels apply. uv.lock covers the
# checkout's own dependency set. Restores fall back to the same
# arch+lane+image prefix, so a lockfile change still reuses every wheel that
# did not move.
#
# The lane belongs in the key: the embedded lane resolves the checkout wheel
# under Home Assistant's package constraints, while the plain container lane
# resolves the manifest's server pin without them, so their wheel sets diverge
# on the shared dependencies. Cache entries are immutable and the first job to
# save a key wins, so a shared key would leave whichever lane saved second
# re-downloading its variant forever.

inputs:
  ha-image:
    description: >
      Home Assistant image reference used by the lane. Part of the cache key so
      wheels never cross image/interpreter versions.
    required: true
  lane:
    description: >
      Which lane's install set this entry holds. Embedded lanes resolve the
      checkout wheel under Home Assistant's package constraints; the plain
      container lane resolves the manifest's server pin without them.
    required: false
    default: container

runs:
  using: composite
  steps:
    - name: Restore and save the pip cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/ha-e2e-pip
        key: ha-e2e-pip-${{ runner.arch }}-${{ inputs.lane }}-${{ inputs.ha-image }}-${{ hashFiles('uv.lock', 'custom_components/ha_mcp_tools/manifest.json') }}
        restore-keys: |
          ha-e2e-pip-${{ runner.arch }}-${{ inputs.lane }}-${{ inputs.ha-image }}-

    - name: Point the lanes at the cache
      shell: bash
      run: |
        cache_dir="${RUNNER_TEMP}/ha-e2e-pip"
        mkdir -p "$cache_dir"
        echo "HA_E2E_PIP_CACHE=$cache_dir" >> "$GITHUB_ENV"
