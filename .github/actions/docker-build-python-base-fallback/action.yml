name: Build image with python base fallback
description: >-
  docker/build-push-action, repeated from Docker Hub's copy of the python base
  image when the build from ECR Public fails. ECR Public's anonymous data limit
  is shared by every GitHub runner; the Dockerfile's PYTHON_BASE pin names the
  same manifest digest Docker Hub serves. The buildx docker-container builder
  pulls on its own, so only a repeated build reaches the other registry.

inputs:
  file:
    description: Dockerfile path; its ARG PYTHON_BASE line names the ECR pin.
    required: true
  context:
    description: Build context.
    required: false
    default: .
  push:
    description: Push the image.
    required: false
    default: "false"
  platforms:
    description: Target platforms.
    required: false
    default: ""
  tags:
    description: Image tags.
    required: false
    default: ""
  labels:
    description: Image labels.
    required: false
    default: ""
  cache-from:
    description: Cache sources.
    required: false
    default: ""
  cache-to:
    description: Cache destinations.
    required: false
    default: ""
  build-args:
    description: Build args; PYTHON_BASE is appended on the Docker Hub attempt.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: base
      shell: bash
      env:
        DOCKERFILE: ${{ inputs.file }}
      run: |
        pin=$(sed -n 's/^ARG PYTHON_BASE=//p' "$DOCKERFILE")
        [ -n "$pin" ] || { echo "::error::$DOCKERFILE has no ARG PYTHON_BASE line"; exit 1; }
        echo "dockerhub=docker.io/library/${pin#public.ecr.aws/docker/library/}" >> "$GITHUB_OUTPUT"

    - id: ecr
      continue-on-error: true
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: ${{ inputs.push }}
        platforms: ${{ inputs.platforms }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
        build-args: ${{ inputs.build-args }}

    - if: steps.ecr.outcome == 'failure'
      shell: bash
      env:
        DOCKERHUB: ${{ steps.base.outputs.dockerhub }}
      run: echo "Build from ECR Public failed; repeating with PYTHON_BASE=$DOCKERHUB"

    - if: steps.ecr.outcome == 'failure'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: ${{ inputs.push }}
        platforms: ${{ inputs.platforms }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
        build-args: |
          ${{ inputs.build-args }}
          PYTHON_BASE=${{ steps.base.outputs.dockerhub }}
