name: Run Codex agent
description: Run arbitrary caller-provided instructions with Codex in the checked-out repository.

inputs:
  instructions:
    description: Instructions passed to Codex verbatim on stdin.
    required: true
  codex-auth:
    description: Raw auth.json content stored in the CODEX_AUTH secret.
    required: true
  codex-version:
    description: Exact @openai/codex version to install.
    required: false
    default: "0.151.0"
  working-directory:
    description: Repository-relative directory used as the Codex working root.
    required: false
    default: "."
  sandbox:
    description: Codex filesystem sandbox (read-only or workspace-write).
    required: false
    default: read-only
  model:
    description: Optional model override. Empty uses the authenticated account default.
    required: false
    default: ""
  reasoning-effort:
    description: Optional reasoning effort override.
    required: false
    default: ""
  output-schema:
    description: Optional repository-relative JSON Schema for the final response.
    required: false
    default: ""

outputs:
  output-path:
    description: Absolute path to the final Codex message.
    value: ${{ steps.prepare.outputs.output-path }}
  auth-path:
    description: Absolute path to auth.json after Codex exits.
    value: ${{ steps.prepare.outputs.auth-path }}
  original-auth-path:
    description: Absolute path to the pre-run auth.json snapshot.
    value: ${{ steps.prepare.outputs.original-auth-path }}
  codex-version:
    description: Installed Codex CLI version.
    value: ${{ steps.install.outputs.codex-version }}

runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      env:
        CODEX_AUTH_INPUT: ${{ inputs.codex-auth }}
        INSTRUCTIONS_INPUT: ${{ inputs.instructions }}
        WORKING_DIRECTORY_INPUT: ${{ inputs.working-directory }}
        SANDBOX_INPUT: ${{ inputs.sandbox }}
        OUTPUT_SCHEMA_INPUT: ${{ inputs.output-schema }}
      run: |
        set -euo pipefail

        if [[ -z "${CODEX_AUTH_INPUT:-}" ]]; then
          echo "::error::The CODEX_AUTH secret is missing."
          exit 1
        fi
        if [[ -z "${INSTRUCTIONS_INPUT:-}" ]]; then
          echo "::error::Codex instructions must not be empty."
          exit 1
        fi
        case "$SANDBOX_INPUT" in
          read-only|workspace-write) ;;
          *)
            echo "::error::sandbox must be read-only or workspace-write."
            exit 1
            ;;
        esac

        case "$WORKING_DIRECTORY_INPUT" in
          /*) workdir_candidate="$WORKING_DIRECTORY_INPUT" ;;
          *) workdir_candidate="$GITHUB_WORKSPACE/$WORKING_DIRECTORY_INPUT" ;;
        esac
        workdir="$(realpath "$workdir_candidate")"
        case "$workdir/" in
          "$GITHUB_WORKSPACE/"*) ;;
          *)
            echo "::error::working-directory must stay inside GITHUB_WORKSPACE."
            exit 1
            ;;
        esac

        codex_home="$(mktemp -d "$RUNNER_TEMP/codex-home.XXXXXX")"
        chmod 700 "$codex_home"
        auth_path="$codex_home/auth.json"
        original_auth_path="$RUNNER_TEMP/codex-auth-original.json"
        printf '%s' "$CODEX_AUTH_INPUT" > "$auth_path"
        chmod 600 "$auth_path"
        jq -e 'type == "object" and (.auth_mode | type == "string")' "$auth_path" >/dev/null
        cp "$auth_path" "$original_auth_path"
        chmod 600 "$original_auth_path"

        output_path="$RUNNER_TEMP/codex-last-message.md"
        : > "$output_path"

        schema_path=""
        if [[ -n "$OUTPUT_SCHEMA_INPUT" ]]; then
          case "$OUTPUT_SCHEMA_INPUT" in
            /*) schema_candidate="$OUTPUT_SCHEMA_INPUT" ;;
            *) schema_candidate="$GITHUB_WORKSPACE/$OUTPUT_SCHEMA_INPUT" ;;
          esac
          schema_path="$(realpath "$schema_candidate")"
          if [[ ! -f "$schema_path" ]]; then
            echo "::error::output-schema does not point to a file."
            exit 1
          fi
        fi

        {
          echo "CODEX_HOME=$codex_home"
          echo "CODEX_ACTION_WORKDIR=$workdir"
          echo "CODEX_ACTION_OUTPUT=$output_path"
          echo "CODEX_ACTION_SCHEMA=$schema_path"
        } >> "$GITHUB_ENV"
        {
          echo "output-path=$output_path"
          echo "auth-path=$auth_path"
          echo "original-auth-path=$original_auth_path"
        } >> "$GITHUB_OUTPUT"

    - id: install
      shell: bash
      env:
        CODEX_VERSION_INPUT: ${{ inputs.codex-version }}
      run: |
        set -euo pipefail
        if [[ ! "$CODEX_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::codex-version must be an exact semantic version."
          exit 1
        fi
        npm install --global --no-audit --no-fund "@openai/codex@$CODEX_VERSION_INPUT"
        installed="$(codex --version | awk '{print $2}')"
        if [[ "$installed" != "$CODEX_VERSION_INPUT" ]]; then
          echo "::error::Expected Codex $CODEX_VERSION_INPUT, installed $installed."
          exit 1
        fi
        echo "codex-version=$installed" >> "$GITHUB_OUTPUT"
        echo "Using Codex CLI $installed"

    - name: Prepare Bubblewrap sandbox on Ubuntu
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail

        sudo apt-get update --quiet
        sudo apt-get install --yes --no-install-recommends \
          apparmor-profiles \
          apparmor-utils \
          bubblewrap

        profile_source=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
        profile_target=/etc/apparmor.d/bwrap-userns-restrict
        if [[ -f "$profile_source" ]]; then
          sudo install -m 0644 "$profile_source" "$profile_target"
          if sudo apparmor_parser -r "$profile_target"; then
            echo "Loaded the Bubblewrap AppArmor profile."
          else
            echo "::warning::Could not load the Bubblewrap AppArmor profile; using the sysctl fallback."
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
        elif [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" == "1" ]]; then
          echo "::warning::Bubblewrap AppArmor profile unavailable; using the sysctl fallback."
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi

        bwrap --version

    - id: agent
      name: Run Codex
      shell: bash
      env:
        INSTRUCTIONS_INPUT: ${{ inputs.instructions }}
        SANDBOX_INPUT: ${{ inputs.sandbox }}
        MODEL_INPUT: ${{ inputs.model }}
        REASONING_EFFORT_INPUT: ${{ inputs.reasoning-effort }}
      run: |
        set -euo pipefail

        args=(
          exec
          --ignore-user-config
          -c apps._default.enabled=false
          --ephemeral
          --color never
          --sandbox "$SANDBOX_INPUT"
          --cd "$CODEX_ACTION_WORKDIR"
          --output-last-message "$CODEX_ACTION_OUTPUT"
        )
        if [[ -n "$MODEL_INPUT" ]]; then
          args+=(--model "$MODEL_INPUT")
        fi
        if [[ -n "$REASONING_EFFORT_INPUT" ]]; then
          args+=(-c "model_reasoning_effort=\"$REASONING_EFFORT_INPUT\"")
        fi
        if [[ -n "$CODEX_ACTION_SCHEMA" ]]; then
          args+=(--output-schema "$CODEX_ACTION_SCHEMA")
        fi

        printf '%s\n' "$INSTRUCTIONS_INPUT" | codex "${args[@]}" -

    - name: Show final Codex output
      if: ${{ always() }}
      shell: bash
      run: |
        if [[ ! -s "${CODEX_ACTION_OUTPUT:-}" ]]; then
          echo "Codex did not produce a final message."
          exit 0
        fi
        echo "::group::Codex final output"
        sed 's/^/Codex | /' "$CODEX_ACTION_OUTPUT"
        echo "::endgroup::"
        {
          echo "## Codex final output"
          echo
          cat "$CODEX_ACTION_OUTPUT"
        } >> "$GITHUB_STEP_SUMMARY"
