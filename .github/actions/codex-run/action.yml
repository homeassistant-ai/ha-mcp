name: Run Codex agent
description: Run arbitrary caller-provided instructions with Codex in the checked-out repository.

inputs:
  instructions:
    description: Instructions passed to Codex verbatim on stdin.
    required: false
    default: ""
  instructions-file:
    description: Optional repository-relative file passed to Codex verbatim instead of instructions.
    required: false
    default: ""
  codex-auth:
    description: Raw auth.json content stored in the CODEX_AUTH secret.
    required: true
  codex-version:
    description: Exact @openai/codex version to install.
    required: false
    default: "0.151.0"
  working-directory:
    description: Repository-relative directory used as the Codex working root.
    required: false
    default: "."
  sandbox:
    description: Codex filesystem sandbox (read-only or workspace-write).
    required: false
    default: read-only
  allow-shell:
    description: Whether Codex may execute shell commands. Disable for attacker-controlled context.
    required: false
    default: "true"
  timeout-minutes:
    description: Maximum duration of the Codex invocation; keep below the caller job timeout.
    required: false
    default: "10"
  model:
    description: Optional model override. Empty uses the authenticated account default.
    required: false
    default: ""
  reasoning-effort:
    description: Optional reasoning effort override.
    required: false
    default: ""
  output-schema:
    description: Optional repository-relative JSON Schema for the final response.
    required: false
    default: ""

outputs:
  output-path:
    description: Absolute path to the final Codex message.
    value: ${{ steps.prepare.outputs.output-path }}
  auth-path:
    description: Absolute path to auth.json after Codex exits.
    value: ${{ steps.prepare.outputs.auth-path }}
  original-auth-path:
    description: Absolute path to the pre-run auth.json snapshot.
    value: ${{ steps.prepare.outputs.original-auth-path }}
  codex-version:
    description: Installed Codex CLI version.
    value: ${{ steps.install.outputs.codex-version }}

runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      env:
        CODEX_AUTH_INPUT: ${{ inputs.codex-auth }}
        INSTRUCTIONS_INPUT: ${{ inputs.instructions }}
        INSTRUCTIONS_FILE_INPUT: ${{ inputs.instructions-file }}
        WORKING_DIRECTORY_INPUT: ${{ inputs.working-directory }}
        SANDBOX_INPUT: ${{ inputs.sandbox }}
        ALLOW_SHELL_INPUT: ${{ inputs.allow-shell }}
        TIMEOUT_MINUTES_INPUT: ${{ inputs.timeout-minutes }}
        OUTPUT_SCHEMA_INPUT: ${{ inputs.output-schema }}
      run: |
        set -euo pipefail

        if [[ -z "${CODEX_AUTH_INPUT:-}" ]]; then
          echo "::error::The CODEX_AUTH secret is missing."
          exit 1
        fi
        if [[ -n "${INSTRUCTIONS_INPUT:-}" && -n "${INSTRUCTIONS_FILE_INPUT:-}" ]]; then
          echo "::error::Set instructions or instructions-file, not both."
          exit 1
        fi
        if [[ -z "${INSTRUCTIONS_INPUT:-}" && -z "${INSTRUCTIONS_FILE_INPUT:-}" ]]; then
          echo "::error::Codex instructions must not be empty."
          exit 1
        fi
        case "$SANDBOX_INPUT" in
          read-only|workspace-write) ;;
          *)
            echo "::error::sandbox must be read-only or workspace-write."
            exit 1
            ;;
        esac
        allow_shell="${ALLOW_SHELL_INPUT,,}"
        if [[ "$allow_shell" != "true" && "$allow_shell" != "false" ]]; then
          echo "::error::allow-shell must be true or false."
          exit 1
        fi
        if [[ ! "$TIMEOUT_MINUTES_INPUT" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::timeout-minutes must be a positive integer."
          exit 1
        fi

        case "$WORKING_DIRECTORY_INPUT" in
          /*) workdir_candidate="$WORKING_DIRECTORY_INPUT" ;;
          *) workdir_candidate="$GITHUB_WORKSPACE/$WORKING_DIRECTORY_INPUT" ;;
        esac
        workdir="$(realpath -m "$workdir_candidate")"
        case "$workdir/" in
          "$GITHUB_WORKSPACE/"*) ;;
          *)
            echo "::error::working-directory must stay inside GITHUB_WORKSPACE."
            exit 1
            ;;
        esac
        if [[ ! -d "$workdir" ]]; then
          echo "::error::working-directory does not point to a directory."
          exit 1
        fi

        credential_root="$RUNNER_TEMP/codex-action-credentials"
        mkdir -p "$credential_root"
        chmod 700 "$credential_root"
        codex_home="$(mktemp -d "$credential_root/home.XXXXXX")"
        chmod 700 "$codex_home"
        auth_path="$codex_home/auth.json"
        original_auth_path="$(mktemp "$credential_root/original.XXXXXX.json")"
        printf '%s' "$CODEX_AUTH_INPUT" > "$auth_path"
        chmod 600 "$auth_path"
        jq -e 'type == "object" and (.auth_mode | type == "string")' "$auth_path" >/dev/null
        cp "$auth_path" "$original_auth_path"
        chmod 600 "$original_auth_path"

        output_path="$(mktemp "$RUNNER_TEMP/codex-last-message.XXXXXX.md")"
        instructions_path="$(mktemp "$RUNNER_TEMP/codex-instructions.XXXXXX.txt")"
        if [[ -n "$INSTRUCTIONS_FILE_INPUT" ]]; then
          case "$INSTRUCTIONS_FILE_INPUT" in
            /*) instructions_candidate="$INSTRUCTIONS_FILE_INPUT" ;;
            *) instructions_candidate="$GITHUB_WORKSPACE/$INSTRUCTIONS_FILE_INPUT" ;;
          esac
          instructions_source="$(realpath -m "$instructions_candidate")"
          case "$instructions_source/" in
            "$GITHUB_WORKSPACE/"*) ;;
            *)
              echo "::error::instructions-file must stay inside GITHUB_WORKSPACE."
              exit 1
              ;;
          esac
          if [[ ! -f "$instructions_source" ]]; then
            echo "::error::instructions-file does not point to a file."
            exit 1
          fi
          cp "$instructions_source" "$instructions_path"
        else
          printf '%s' "$INSTRUCTIONS_INPUT" > "$instructions_path"
        fi
        if [[ ! -s "$instructions_path" ]]; then
          echo "::error::Codex instructions must not be empty."
          exit 1
        fi
        chmod 600 "$instructions_path"

        schema_path=""
        if [[ -n "$OUTPUT_SCHEMA_INPUT" ]]; then
          case "$OUTPUT_SCHEMA_INPUT" in
            /*) schema_candidate="$OUTPUT_SCHEMA_INPUT" ;;
            *) schema_candidate="$GITHUB_WORKSPACE/$OUTPUT_SCHEMA_INPUT" ;;
          esac
          schema_path="$(realpath -m "$schema_candidate")"
          if [[ ! -f "$schema_path" ]]; then
            echo "::error::output-schema does not point to a file."
            exit 1
          fi
        fi

        profile_name=ci-action
        profile_path="$codex_home/$profile_name.config.toml"
        case "$SANDBOX_INPUT" in
          read-only) parent_profile=:read-only ;;
          workspace-write) parent_profile=:workspace ;;
        esac
        {
          printf 'default_permissions = "%s"\n\n' "$profile_name"
          printf '[shell_environment_policy]\n'
          printf 'inherit = "core"\n\n'
          printf '[permissions.%s]\n' "$profile_name"
          printf 'extends = "%s"\n\n' "$parent_profile"
          printf '[permissions.%s.filesystem]\n' "$profile_name"
          printf '"%s" = "deny"\n' "$credential_root"
        } > "$profile_path"
        chmod 600 "$profile_path"

        {
          echo "CODEX_HOME=$codex_home"
          echo "CODEX_ACTION_WORKDIR=$workdir"
          echo "CODEX_ACTION_OUTPUT=$output_path"
          echo "CODEX_ACTION_INSTRUCTIONS=$instructions_path"
          echo "CODEX_ACTION_SCHEMA=$schema_path"
          echo "CODEX_ACTION_ALLOW_SHELL=$allow_shell"
          echo "CODEX_ACTION_TIMEOUT_MINUTES=$TIMEOUT_MINUTES_INPUT"
          echo "CODEX_ACTION_PROFILE=$profile_name"
        } >> "$GITHUB_ENV"
        {
          echo "output-path=$output_path"
          echo "auth-path=$auth_path"
          echo "original-auth-path=$original_auth_path"
        } >> "$GITHUB_OUTPUT"

    - id: install
      shell: bash
      env:
        CODEX_VERSION_INPUT: ${{ inputs.codex-version }}
      run: |
        set -euo pipefail
        if [[ ! "$CODEX_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::codex-version must be an exact semantic version."
          exit 1
        fi
        npm install --global --no-audit --no-fund "@openai/codex@$CODEX_VERSION_INPUT"
        installed="$(codex --version | awk '{print $2}')"
        if [[ "$installed" != "$CODEX_VERSION_INPUT" ]]; then
          echo "::error::Expected Codex $CODEX_VERSION_INPUT, installed $installed."
          exit 1
        fi
        echo "codex-version=$installed" >> "$GITHUB_OUTPUT"
        echo "Using Codex CLI $installed"

    - name: Prepare Bubblewrap sandbox on Ubuntu
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail

        sudo apt-get update --quiet
        sudo apt-get install --yes --no-install-recommends \
          apparmor-profiles \
          apparmor-utils \
          bubblewrap

        profile_source=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
        profile_target=/etc/apparmor.d/bwrap-userns-restrict
        if [[ -f "$profile_source" ]]; then
          sudo install -m 0644 "$profile_source" "$profile_target"
          sudo apparmor_parser -r "$profile_target"
          echo "Loaded the Bubblewrap AppArmor profile."
        elif [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" == "1" ]]; then
          echo "::error::Bubblewrap requires an AppArmor profile on this restricted runner."
          exit 1
        fi

        bwrap --version

    - name: Verify credential isolation
      shell: bash
      run: |
        set -euo pipefail
        codex sandbox \
          --profile "$CODEX_ACTION_PROFILE" \
          --permission-profile "$CODEX_ACTION_PROFILE" \
          --cd "$CODEX_ACTION_WORKDIR" \
          -- \
          bash -c '[[ ! -r "$1" && ! -r "$2" ]]' \
          _ \
          "$CODEX_HOME/auth.json" \
          "${{ steps.prepare.outputs.original-auth-path }}"

    - id: agent
      name: Run Codex
      shell: bash
      env:
        INSTRUCTIONS_INPUT: ${{ inputs.instructions }}
        SANDBOX_INPUT: ${{ inputs.sandbox }}
        MODEL_INPUT: ${{ inputs.model }}
        REASONING_EFFORT_INPUT: ${{ inputs.reasoning-effort }}
      run: |
        set -euo pipefail

        args=(
          exec
          --profile "$CODEX_ACTION_PROFILE"
          --strict-config
          -c apps._default.enabled=false
          --ephemeral
          --color never
          --cd "$CODEX_ACTION_WORKDIR"
          --output-last-message "$CODEX_ACTION_OUTPUT"
        )
        if [[ -n "$MODEL_INPUT" ]]; then
          args+=(--model "$MODEL_INPUT")
        fi
        if [[ -n "$REASONING_EFFORT_INPUT" ]]; then
          args+=(-c "model_reasoning_effort=\"$REASONING_EFFORT_INPUT\"")
        fi
        if [[ -n "$CODEX_ACTION_SCHEMA" ]]; then
          args+=(--output-schema "$CODEX_ACTION_SCHEMA")
        fi
        if [[ "$CODEX_ACTION_ALLOW_SHELL" == "false" ]]; then
          args+=(--disable shell_tool)
        fi

        set +e
        timeout --signal=TERM --kill-after=30s \
          "${CODEX_ACTION_TIMEOUT_MINUTES}m" \
          codex "${args[@]}" - \
          < "$CODEX_ACTION_INSTRUCTIONS"
        codex_status=$?
        set -e
        if [[ "$codex_status" -eq 124 ]]; then
          echo "::error::Codex exceeded the ${CODEX_ACTION_TIMEOUT_MINUTES}-minute invocation timeout."
        fi
        exit "$codex_status"

    - name: Show final Codex output
      if: ${{ always() }}
      shell: bash
      run: |
        if [[ ! -s "${CODEX_ACTION_OUTPUT:-}" ]]; then
          echo "Codex did not produce a final message."
          exit 0
        fi
        echo "::group::Codex final output"
        sed 's/^/Codex | /' "$CODEX_ACTION_OUTPUT"
        echo "::endgroup::"
        {
          echo "## Codex final output"
          echo
          cat "$CODEX_ACTION_OUTPUT"
        } >> "$GITHUB_STEP_SUMMARY"
