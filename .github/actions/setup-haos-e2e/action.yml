name: Prepare HAOS E2E runtime
description: Restore or build the shared HAOS image and install its test runtime

inputs:
  force-local-build:
    description: Build the qcow2 locally even when the shared cache has a hit
    required: false
    default: "false"
  python-version:
    description: Python version used by the E2E test environment
    required: true
  save-cache:
    description: Whether this lane is the sole writer for a cache miss
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Compute image cache key
      id: key
      # Cache invalidates when any input baked into the qcow2 changes. The
      # git ls-tree object IDs make the key reproducible without mtime noise.
      #
      # INVARIANT: keep this block byte-identical to the cache-key block in
      # build-haos-test-image.yml. Its master build primes the same key; a miss
      # here builds from the PR merge ref instead of falling back to a stale image.
      shell: bash
      run: |
        hash=$(git ls-tree -r HEAD \
          tests/haos_image_build \
          tests/initial_test_state \
          custom_components/ha_mcp_tools \
          homeassistant-addon-webhook-proxy \
          | sha256sum | cut -d' ' -f1 | head -c16)
        echo "cache-key=haos-image-$hash" >> "$GITHUB_OUTPUT"

    - name: Restore image from cache
      id: restore-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /tmp/haos-test-image.qcow2
        key: ${{ steps.key.outputs.cache-key }}

    - name: Report image-acquisition path
      shell: bash
      run: |
        echo "::notice title=HAOS image cache::cache-hit=${{ steps.restore-cache.outputs.cache-hit }} key=${{ steps.key.outputs.cache-key }}"

    - name: Install QEMU + OVMF + libguestfs
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          qemu-system-x86 qemu-utils ovmf xz-utils curl libguestfs-tools sshpass
        # Ubuntu installs the kernel image as 0600 root:root, while libguestfs's
        # unprivileged supermin builder must read it. This is the documented
        # https://libguestfs.org/guestfs-faq.1.html#kernel-permissions workaround.
        sudo chmod +r /boot/vmlinuz-*

    - name: Enable KVM group permissions
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Free disk space for the local build
      # A miss downloads ~1.5 GB, expands to ~7 GB, and grows the qcow2 to
      # roughly 12 GB while baking. The runner's ~14 GB root disk needs the
      # unused preinstalled SDKs removed. Keep /opt/hostedtoolcache because its
      # Python is on PATH for build_image.py.
      if: steps.restore-cache.outputs.cache-hit != 'true' || inputs.force-local-build == 'true'
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
          /usr/local/lib/android /usr/local/.ghcup
        sudo apt-get clean
        docker system prune -af --volumes || true
        df -h /

    - name: Install build-script Python dependencies
      if: steps.restore-cache.outputs.cache-hit != 'true' || inputs.force-local-build == 'true'
      shell: bash
      run: pip install -r tests/haos_image_build/requirements.txt

    - name: Build image locally
      if: steps.restore-cache.outputs.cache-hit != 'true' || inputs.force-local-build == 'true'
      shell: bash
      run: |
        python3 tests/haos_image_build/build_image.py --verbose \
          --output /tmp/haos-test-image.qcow2

    - name: Save image to cache
      # Exactly one parallel lane may write this shared 12 GB cache key. Other
      # lanes still build on a simultaneous miss but avoid the losing tar/zstd
      # upload and actions/cache "another job may be creating this cache" race.
      if: inputs.save-cache == 'true' && steps.restore-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /tmp/haos-test-image.qcow2
        key: ${{ steps.key.outputs.cache-key }}

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "latest"

    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Install test dependencies
      shell: bash
      run: uv sync --all-extras --dev

    - name: Confirm image present
      shell: bash
      run: ls -lh /tmp/haos-test-image.qcow2
