name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy.yml'
      - 'scripts/generate_star_history.py'
      - 'site/**'
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./site
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate star history charts
        # The built-in token cannot access GitHub's restricted stargazer history.
        env:
          GITHUB_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN }}
        run: >-
          python3 ../scripts/generate_star_history.py
          --repository "${{ github.repository }}"
          --output-dir public/star-history

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: |
          npm install --global npm@12.0.2
          npm ci

      - name: Build with Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./site/dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
