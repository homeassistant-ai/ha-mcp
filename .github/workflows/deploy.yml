name: Deploy to GitHub Pages

# The site is built from the `stable` tag, not master, so the published setup
# instructions always match the current stable release. A site change merged
# to master goes live at the next stable release, or sooner by dispatching
# this workflow with another `ref`. That override lasts only until the next
# scheduled or release-driven rebuild.
#
# Stable releases arrive through workflow_run rather than a release or tag
# trigger: the github-pages environment only lets runs on `master` deploy,
# and workflow_run runs on the default branch, while release and tag-push
# runs carry the tag as their ref. Dev pre-releases come from a different
# workflow and never trigger a deploy.
on:
  workflow_run:
    workflows: ["Release Publish"]
    types: [completed]
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build the site from (default: the stable tag)"
        required: false
        default: stable
        type: string

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  finalized:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - if: github.event_name != 'workflow_run'
        run: ':'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'workflow_run'
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/read-finalized-release
      - id: release
        if: github.event_name == 'workflow_run'
        uses: ./.github/actions/read-finalized-release
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          run-id: ${{ github.event.workflow_run.id }}

  build:
    # Release Publish finalizes `stable` only once the package and integration
    # asset are usable. Do not build docs ahead of that handoff.
    needs: finalized
    if: ${{ github.event_name != 'workflow_run' || needs.finalized.outputs.tag != '' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./site
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Release events use their verified finalized tag. Other events keep
          # the existing stable/default or explicit manual-ref behavior.
          ref: ${{ inputs.ref || needs.finalized.outputs.tag || 'stable' }}

      - name: Generate star history charts
        # The built-in token cannot access GitHub's restricted stargazer history.
        env:
          GITHUB_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN }}
        run: >-
          python3 ../scripts/generate_star_history.py
          --repository "${{ github.repository }}"
          --output-dir public/star-history

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Corepack is bundled only through Node 24; `corepack npm ci` enforces packageManager.
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: corepack npm ci

      - name: Build with Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./site/dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
