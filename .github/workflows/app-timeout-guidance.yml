name: App timeout guidance regression
on:
  push:
    branches: [ci/app-timeout-guidance]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras --dev
      - name: Prove timeout and app-scope regressions fail before the fix
        run: |
          git fetch --depth=1 origin 91a72df369572c419e0ce7e77b3c9d5a3ccd4a40
          git show 91a72df369572c419e0ce7e77b3c9d5a3ccd4a40:src/ha_mcp/tools/tools_addons.py > src/ha_mcp/tools/tools_addons.py
          git show 91a72df369572c419e0ce7e77b3c9d5a3ccd4a40:src/ha_mcp/tools/addon_connection_hints.py > src/ha_mcp/tools/addon_connection_hints.py
          status=0
          uv run pytest tests/src/unit/test_addon_connection_hints.py --tb=short --maxfail=0 --junitxml=red.xml || status=$?
          git restore src/ha_mcp/tools/tools_addons.py src/ha_mcp/tools/addon_connection_hints.py
          test "$status" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('red.xml').getroot()
          assert not root.findall('.//error')
          failures = root.findall('.//failure')
          assert len(failures) == 4
          assert all('restart' in (failure.text or '') or "'port' parameter" in (failure.text or '') for failure in failures)
          PY
      - name: Run app proxy regression suite
        run: uv run pytest tests/src/unit/test_tools_addons.py tests/src/unit/test_addon_connection_hints.py --tb=short --maxfail=0
      - name: Check changed Python formatting
        run: uv run ruff format --check --diff src/ha_mcp/tools/addon_connection_hints.py src/ha_mcp/tools/tools_addons.py tests/src/unit/test_addon_connection_hints.py tests/src/unit/test_tools_addons.py
