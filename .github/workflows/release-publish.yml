name: Release Publish

on:
  # Trigger after SemVer Release completes
  workflow_run:
    workflows: ["SemVer Release"]
    types: [completed]
    branches: [ main, master ]
  # Also support manual dispatch
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: release-publish
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # A produced tag survives an unrelated SemVer app-publishing failure.
    if: ${{ github.repository == 'homeassistant-ai/ha-mcp' && github.ref == 'refs/heads/master' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: master
          fetch-depth: 0

      - name: Select the release from its producing run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_run ]; then
            # Gated/no-change runs have no release artifact. Master may have
            # advanced since a real release: never infer this run's tag from it.
            COUNT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "stable-release-tag")] | length')
            if [ "$COUNT" -eq 0 ]; then
              echo "No release was recorded by this SemVer run."
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh run download "$TRIGGER_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name stable-release-tag --dir "$RUNNER_TEMP/release-metadata"
            TAG=$(cat "$RUNNER_TEMP/release-metadata/release-tag.txt")
          else
            TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*dev*')
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Read metadata from the selected release tag
        id: version
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Stop an old completed run before any mutable channel is published.
          if git rev-parse --verify refs/tags/stable >/dev/null 2>&1 && \
            ! git merge-base --is-ancestor 'stable^{commit}' "$RELEASE_TAG^{commit}"; then
            echo "::notice::$RELEASE_TAG predates stable; ignoring this old retry."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(git show "$RELEASE_TAG:pyproject.toml" \
            | grep '^version = ' | sed 's/version = "\(.*\)"/\1/')
          [ "v$VERSION" = "$RELEASE_TAG" ]
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "Building from $RELEASE_TAG, regardless of later master commits."

  publish_pypi:
    name: Publish PyPI package
    needs: prepare
    if: ${{ needs.prepare.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ha-mcp
    permissions:
      contents: read
      id-token: write  # Required for PyPI trusted publishing
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.release_tag }}
          fetch-depth: 0
          # Required for the bundled skills (resources/skills-vendor is a
          # git submodule). Without this, `uv build` packages an empty
          # skills directory and stdio/PyPI installs report
          # "Skills directory not found" at runtime — issue #1280. The
          # dev publish path (publish-dev.yml) already sets this; aligning
          # the stable path closes the gap between the two channels.
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.4"

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist
          skip-existing: true

  finalize_github_release:
    name: Finalize stable GitHub release
    needs: [prepare, publish_pypi]
    if: ${{ github.repository == 'homeassistant-ai/ha-mcp' && github.ref == 'refs/heads/master' && needs.prepare.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: publisher

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.release_tag }}
          path: release-source
          fetch-depth: 0

      - name: Generate GitHub App token for the stable alias
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
        continue-on-error: true

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.4"

      - name: Finalize only after the package and requested asset are ready
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          uv run -s publisher/scripts/finalize_github_release.py \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --hacs release-source/hacs.json \
            --component release-source/custom_components/ha_mcp_tools/manifest.json \
            --pyproject release-source/pyproject.toml --checkout release-source

      - name: Record finalized stable tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: printf '%s\n' "$RELEASE_TAG" > finalized-release-tag.txt

      - name: Signal successful finalization to docs and mirror
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: finalized-release-tag
          path: finalized-release-tag.txt
          if-no-files-found: error
          overwrite: true

  publish_docker:
    name: Publish Docker image
    needs: [prepare, finalize_github_release]
    if: ${{ needs.prepare.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required to push to GHCR
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.release_tag }}
          fetch-depth: 0
          # Required for the bundled skills (resources/skills-vendor is a
          # git submodule). The Dockerfile COPYs src/ into the image, so
          # an uninitialized submodule would ship a skills-less stable
          # Docker image — same root cause as the PyPI fix above (#1280).
          submodules: true

      - name: Protect mutable image tags on a partial old rerun
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$CURRENT" != "v$VERSION" ]; then
            echo "::error::v$VERSION is no longer the current release; refusing to move stable/latest images."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest
            type=raw,value=stable

      - name: Build and push Docker image
        uses: ./.github/actions/docker-build-python-base-fallback
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Match architectures supported by uv base image
          # uv image only provides amd64 and arm64, not 32-bit platforms
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ env.VERSION }}

  publish_mcp:
    name: Publish MCP server manifest
    needs: [publish_pypi, publish_docker, prepare]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.prepare.outputs.should_publish == 'true' }}
    permissions:
      contents: read
      id-token: write  # Required for MCP Registry OIDC authentication
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.version }}
    steps:
      - name: Report upstream job results
        run: |
          echo "PyPI publish conclusion: ${{ needs.publish_pypi.result }}"
          echo "Docker publish conclusion: ${{ needs.publish_docker.result }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.release_tag }}
          fetch-depth: 0

      - name: Install MCP Publisher CLI
        if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
        env:
          # Pinned instead of `releases/latest` so an upstream re-point can't
          # inject an unverified binary into this id-token: write job. Bump both
          # values together on a mcp-publisher update; the sha256 is for the
          # linux/amd64 artifact (ubuntu-latest runner). Upstream ships a
          # checksums.txt, but fetching it from the same release is no trust
          # anchor, so the hash is pinned here. Renovate/Dependabot can't track
          # a bare curl, so this is a manual pin with a benign failure mode:
          # last job, PyPI/Docker already published, workflow_dispatch re-runnable.
          MCP_PUBLISHER_VERSION: v1.7.9
          MCP_PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_${os}_${arch}.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Render server manifest for publish
        if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
        run: |
          set -euo pipefail
          python scripts/render_server_manifest.py \
            --input server.json \
            --output server.json \
            --version "$VERSION" \
            --oci-image "$IMAGE"
          cat server.json

      - name: Install uv
        if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.4"

      - name: Validate server manifest
        if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
        run: |
          set -euo pipefail
          uv run --frozen python scripts/validate_server_manifest.py server.json

      - name: Login to MCP Registry
        if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
        run: |
          set +e  # Don't exit on error
          OUTPUT=$(./mcp-publisher publish --server server.json 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          # If publish succeeded, we're done
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✓ Successfully published to MCP Registry"
            exit 0
          fi

          # If version already exists, treat as success
          if echo "$OUTPUT" | grep -qi "cannot publish duplicate version\|version.*already.*exist\|already.*published"; then
            echo "⚠ Version $VERSION already exists in MCP Registry (published previously)"
            echo "✓ Treating as success"
            exit 0
          fi

          # Any other error is a real failure
          echo "✗ Failed to publish to MCP Registry"
          exit $EXIT_CODE

      - name: Skip MCP publish
        if: ${{ needs.publish_pypi.result != 'success' || needs.publish_docker.result != 'success' }}
        run: |
          echo "Skipping MCP publish because one or more upstream publish jobs failed."
