name: HAOS E2E Tests (stdio)

# Runs the complete E2E suite against real HAOS while the server-under-test is
# the installed ha-mcp command connected through stdio JSON-RPC. This is a
# separate parallel lane so transport coverage does not extend the existing
# external HAOS lane's wall time.
# Its setup is intentionally duplicated from haos-e2e-tests.yml so adding this
# lane cannot alter the established HAOS jobs. Keep the image cache-key command
# byte-identical to the other HAOS consumers and build-haos-test-image.yml.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pytest_args:
        description: 'Extra pytest args (e.g. "-k test_simple_connection") for targeted iteration'
        type: string
        required: false
        default: ''
      force_local_build:
        description: 'Build the qcow2 locally even on a cache hit'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  UV_CACHE_DIR: /tmp/.uv-cache
  LIBGUESTFS_BACKEND: direct

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Classify changed files
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Fail closed: only a successfully resolved, non-empty, docs-only PR
          # may skip a required heavy job.
          run=true
          if [ "${{ github.event_name }}" = "pull_request" ] \
            && git fetch --depth=1 origin "$BASE_REF" \
            && base_sha=$(git rev-parse "origin/$BASE_REF") \
            && changed=$(git diff --name-only --diff-filter=ACMRD "$base_sha" HEAD) \
            && [ -n "$changed" ]; then
            echo "Changed files:"; printf '%s\n' "$changed" | sed 's/^/  /'
            run=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                homeassistant-addon/*.md|homeassistant-addon-dev/*.md|homeassistant-addon-webhook-proxy/*.md|custom_components/ha_mcp_tools/*.md)
                  continue ;;
                homeassistant-addon/*|homeassistant-addon-dev/*|homeassistant-addon-webhook-proxy/*|custom_components/ha_mcp_tools/*|tests/haos_image_build/*|tests/initial_test_state/*)
                  run=true; break ;;
                *.md|*.mdx|docs/*|site/*)
                  continue ;;
                *)
                  run=true; break ;;
              esac
            done <<< "$changed"
          else
            echo "Non-PR event or unresolved diff — running suite (fail-closed)."
          fi
          echo "run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  haos-e2e-stdio:
    name: HAOS E2E Tests (stdio)
    needs: changes
    # A skipped job reports Success to the required status check. Skipping
    # therefore requires the classifier to have succeeded and explicitly said
    # false. The status function is also deliberate: without !cancelled(), an
    # implicit success() can skip this suite when the classifier fails, while an
    # empty output can otherwise look like docs-only and fail open. Any result
    # except an explicit successful false runs the lane.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The full suite reads the vendored skills submodule.
          submodules: true
          # Full history keeps merge-ref git operations and the object-ID cache
          # key deterministic.
          fetch-depth: 0

      - name: Compute image cache key
        id: key
        run: |
          hash=$(git ls-tree -r HEAD \
            tests/haos_image_build \
            tests/initial_test_state \
            custom_components/ha_mcp_tools \
            homeassistant-addon-webhook-proxy \
            | sha256sum | cut -d' ' -f1 | head -c16)
          echo "cache-key=haos-image-$hash" >> "$GITHUB_OUTPUT"

      - name: Restore image from cache
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/haos-test-image.qcow2
          key: ${{ steps.key.outputs.cache-key }}

      - name: Report image-acquisition path
        run: |
          echo "::notice title=HAOS image cache::cache-hit=${{ steps.restore-cache.outputs.cache-hit }} key=${{ steps.key.outputs.cache-key }}"

      - name: Install QEMU + OVMF + libguestfs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf xz-utils curl libguestfs-tools sshpass
          sudo chmod +r /boot/vmlinuz-*

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space for the local build
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/lib/android /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h /

      - name: Install build-script Python deps
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: pip install -r tests/haos_image_build/requirements.txt

      - name: Build image locally
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: |
          python3 tests/haos_image_build/build_image.py --verbose \
            --output /tmp/haos-test-image.qcow2

      # The external HAOS lane is the sole writer for this shared key. A
      # simultaneous cache miss can build here, but this parallel lane must not
      # race it with a second cache save.

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: uv sync --all-extras --dev

      - name: Confirm image present
        run: ls -lh /tmp/haos-test-image.qcow2

      - name: Run full E2E suite through stdio against HAOS
        # Keep self-restarting addon tests away from concurrent workers. The
        # stdio lane normally skips them because they are inaddon-only, but
        # retaining the two-phase contract makes that isolation fail-safe if
        # their transport coverage is widened later.
        run: |
          cd tests
          # PYTEST_ARGS is intentionally word-split into individual pytest args.
          # shellcheck disable=SC2086
          uv run pytest src/e2e/ \
            -n2 --dist loadscope -v --tb=short --maxfail=0 \
            -m "not addon_disruptive" $PYTEST_ARGS
          # shellcheck disable=SC2086
          uv run pytest src/e2e/ \
            -n0 -v --tb=short --maxfail=0 \
            -m addon_disruptive $PYTEST_ARGS \
            || { rc=$?; [ "$rc" -eq 5 ] && echo "no disruptive tests in selection"; [ "$rc" -eq 5 ]; }
        env:
          HAMCP_ENV_FILE: "tests/.env.test"
          HAOS_TEST_IMAGE_PATH: /tmp/haos-test-image.qcow2
          HAOS_TEST_MODE: stdio
          # conftest injects this bare token into HACS inside the guest so its
          # repository calls do not hit the shared-IP unauthenticated rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTEST_ARGS: ${{ github.event.inputs.pytest_args }}

      - name: Extract HA diagnostics from booted qcow2
        if: always()
        run: |
          sudo chmod +r /boot/vmlinuz-* || true
          mkdir -p /tmp/haos-diagnostics
          cp /tmp/haos-build/haos-serial.log /tmp/haos-diagnostics/bake-serial.log 2>/dev/null || true
          # xdist boots per-worker overlays; the base image is not the runtime
          # state that a parallel test failure needs for diagnosis.
          shopt -s nullglob
          targets=(/tmp/haos-test-image-gw*.qcow2)
          if [ ${#targets[@]} -eq 0 ]; then
            targets=(/tmp/haos-test-image.qcow2)
          fi
          if [ ! -f "${targets[0]}" ] && [ -f /tmp/haos-build/haos-test-image.qcow2 ]; then
            targets=(/tmp/haos-build/haos-test-image.qcow2)
          fi
          for img in "${targets[@]}"; do
            label=$(basename "$img" .qcow2)
            outdir=/tmp/haos-diagnostics/$label
            mkdir -p "$outdir"
            echo "=== extracting diagnostics from $img ==="
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : ll /supervisor/homeassistant \
              > "$outdir/config-dir-listing.txt" 2>&1 \
              || echo "directory listing failed for $img"
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : tar-out /supervisor/homeassistant/.storage "$outdir/storage.tar" \
              || echo ".storage tar-out failed for $img"
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : glob copy-out '/supervisor/homeassistant/*.log*' "$outdir/" \
              || echo "log glob copy failed for $img"
            cat "$outdir/config-dir-listing.txt" || true
          done
          ls -laR /tmp/haos-diagnostics/ || true
          # The injected GitHub token is persisted in .storage (and therefore in
          # storage.tar), so diagnostics must be scrubbed before artifact upload.
          python3 scripts/redact_diagnostics_secrets.py /tmp/haos-diagnostics

      - name: Upload HAOS diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: haos-stdio-diagnostics
          path: |
            /tmp/haos-diagnostics/
            /tmp/haos-e2e-serial.log
          if-no-files-found: warn
          retention-days: 7
