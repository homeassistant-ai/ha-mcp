name: Webhook Proxy — Promote Dev to Stable

# Manual promotion: copy the dev add-on onto the stable add-on (reverse-rename
# mcp_proxy_dev -> mcp_proxy, restore stable identity, swap the DOCS.md flavor
# banner) and bump stable's own version line. Opens a draft PR;
# AGENTS.md/CHANGELOG.md are left for a human.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump for the new stable version"
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install ha-mcp, ruff + pytest
        # The unit conftest imports ha_mcp and quickjs and loads Core's test
        # plugin, so install the dev group's pinned pytest-homeassistant (it
        # brings pytest and Core) and quickjs-ng.
        run: |
          set -euo pipefail
          pins=$(python3 -c 'import tomllib; print(" ".join(d for d in tomllib.load(open("pyproject.toml", "rb"))["dependency-groups"]["dev"] if isinstance(d, str) and d.startswith(("pytest-homeassistant==", "quickjs-ng=="))))')
          # shellcheck disable=SC2086 # one argument per pin
          pip install -e . ruff pytest-timeout $pins

      - name: Run the promote transform in place
        id: promote
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          NEW=$(python3 scripts/webhook_proxy_sync.py --direction promote --bump "$BUMP")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "New stable version: $NEW"

      # The committed-tree drift guards are sync-point invariants: they skip in
      # per-PR CI (dev intentionally runs ahead of stable between promotes) and
      # run HERE, right after the transform, as its acceptance gate.
      - name: Verify transform exactness (drift guards)
        env:
          WEBHOOK_PROXY_TREES_SYNCED: "1"
        run: python3 -m pytest tests/src/unit/test_webhook_proxy_sync.py -q

      - name: Commit on a branch and open a draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.ref_name }}
          NEW_VERSION: ${{ steps.promote.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="promote-webhook-proxy/$NEW_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add homeassistant-addon-webhook-proxy/ \
            homeassistant-addon-webhook-proxy-dev/config.yaml \
            homeassistant-addon-webhook-proxy-dev/mcp_proxy_dev/manifest.json
          git commit -m "chore(addon): promote webhook-proxy dev -> stable $NEW_VERSION"
          git push -u origin "$BRANCH"
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Generated by the \`webhook-proxy-promote\` workflow (\`workflow_dispatch\`).

          It copied the dev add-on onto the stable add-on, reverse-renamed the
          \`mcp_proxy_dev\` identity back to \`mcp_proxy\`, restored the stable
          mutual-exclusion constants, and set the stable version to \`$NEW_VERSION\`.
          It also rebased the dev flavor's version line onto the new stable
          (next stable patch + \`.dev1\`), so no follow-up reset PR is needed
          for the version alone.

          The transform syncs code + identity + version + \`DOCS.md\` (component
          token rename plus the flavor-banner swap; canonical banners live in
          \`DOCS_BANNERS\` in the sync script). \`AGENTS.md\` and \`CHANGELOG.md\`
          are intentionally left untouched — give them a manual look before
          merging.
          EOF
          gh pr create --draft --base "$BASE_REF" --head "$BRANCH" \
            --title "chore(addon): promote webhook-proxy dev -> stable $NEW_VERSION" \
            --body-file "$RUNNER_TEMP/pr-body.md"
