name: Webhook Proxy — Post-Promote Reset Dispatch

# The promotion flow's missing link: after a promote PR merges, the dev
# version line must be rebased onto the new stable ("Reset Dev from Stable" —
# right after a promote the two trees are code-identical, so the reset's
# effect is the version-line rebase). That step was tribal knowledge behind a
# manual dispatch; this fires it automatically when a promote PR merges.
# workflow_dispatch is one of the two event types the default GITHUB_TOKEN is
# permitted to trigger, so no PAT is needed. The merge itself is performed by
# a human, so this pull_request event always fires even though the promote PR
# was opened by a workflow.
on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  actions: write

jobs:
  dispatch-reset:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'promote-webhook-proxy/')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Reset Dev from Stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run webhook-proxy-reset-dev.yml
          --repo "$GITHUB_REPOSITORY" --ref master
