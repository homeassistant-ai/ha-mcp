name: Issue 2687 standalone OAuth reproduction

on:
  push:
    branches: [fix/issue-2687-oauth-hacs]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-2687-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      HAMCP_ENV_FILE: "tests/.env.test"
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
      - name: Install development environment on runner
        run: |
          uv python install 3.13
          uv sync --all-extras --dev --frozen
      - name: Focused unit tests
        working-directory: tests
        run: >-
          uv run pytest src/unit/test_hacs_actions.py
          src/unit/test_hacs_auto_refresh.py src/unit/test_websocket_client.py
          src/unit/test_websocket_late_release.py src/unit/test_oauth.py
          --tb=short -q --junitxml=unit-results.xml
      - name: Real Home Assistant and standalone OAuth reproduction
        working-directory: tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run pytest src/e2e/workflows/hacs/test_oauth_credentials.py
          -v --tb=short --maxfail=0 --junitxml=oauth-results.xml
          --log-cli-level=INFO
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: issue-2687-results
          path: tests/*-results.xml
