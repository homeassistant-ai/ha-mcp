name: Dev HA environment

# A live HA test instance behind temporary Cloudflare tunnels, for testing a
# branch against a real HA without using your own: Docker or HAOS, with the
# server standalone, embedded in the component, or as the app (HAOS). Run it
# from your fork, never from homeassistant-ai/ha-mcp. It follows track_ref and
# applies each new commit the way a user's update would. The tunnel URLs are
# only in the `dev-ha-env-urls` artifact, encrypted to the RSA public key the
# run was started with. Cancel the run when done.
# Usage: docs/dev-ha-env.md
on:
  workflow_dispatch:
    inputs:
      track_ref:
        description: Branch of this repository to run (server, component and test config)
        required: true
      public_key:
        description: "Base64 of a throwaway RSA public key (PEM); the tunnel URLs are encrypted to it. See docs/dev-ha-env.md"
        required: true
      platform:
        description: Home Assistant install type
        type: choice
        options: [docker, haos]
        default: docker
      server:
        description: "How the server runs: standalone beside HA, embedded in the component, or the app (haos only)"
        type: choice
        options: [standalone, embedded, app]
        default: embedded
      no_component:
        description: Without the ha_mcp_tools File & YAML Tools entry (like the no-tools E2E lanes)
        type: boolean
        default: false
      strict_bps:
        description: Strict best-practices mode, the default agents meet (standalone and embedded)
        type: boolean
        default: true
      ha_image:
        description: "docker only: HA container image (empty = current stable; accepts version or beta tags)"
        default: ""
      minutes:
        description: How long to keep the instance up (max 330)
        default: "330"

permissions:
  contents: read

concurrency:
  group: dev-ha-env-${{ inputs.track_ref }}-${{ inputs.platform }}-${{ inputs.server }}-${{ inputs.no_component }}
  cancel-in-progress: true

env:
  TRACK_REF: ${{ inputs.track_ref }}
  E2E_NO_TOOLS_ENTRY: ${{ inputs.no_component && '1' || '' }}
  DEVENV_STRICT_BPS: ${{ inputs.strict_bps }}
  HAMCP_ENV_FILE: tests/.env.test
  # A fixed host port survives container restarts, so the tunnel target holds.
  HA_TEST_PORT: "8123"
  MCP_PORT: "8086"
  LIBGUESTFS_BACKEND: direct
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  env:
    # Upstream runners are shared CI capacity; contributors run this on forks.
    if: github.repository != 'homeassistant-ai/ha-mcp'
    runs-on: ${{ inputs.platform == 'haos' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    timeout-minutes: 355
    steps:
      - name: Check inputs
        env:
          PUBLIC_KEY: ${{ inputs.public_key }}
          PLATFORM: ${{ inputs.platform }}
          SERVER: ${{ inputs.server }}
        run: |
          KEY="$RUNNER_TEMP/url-key.pem"
          printf '%s' "$PUBLIC_KEY" | openssl base64 -d -A > "$KEY" || true
          # Trial-encrypt as the URLs will be, so a non-RSA or too-small key
          # fails here rather than after HA has booted. The URL file can reach
          # 236 bytes; 470 is a 4096-bit key's OAEP limit.
          if ! head -c 470 /dev/zero | openssl pkeyutl -encrypt -pubin -inkey "$KEY" \
            -pkeyopt rsa_padding_mode:oaep -out /dev/null; then
            echo "::error::public_key must be a base64 4096-bit RSA public key. See docs/dev-ha-env.md."
            exit 1
          fi
          if [ "$PLATFORM" = docker ] && [ "$SERVER" = app ]; then
            echo "::error::The app needs Supervisor: use platform haos."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: devenv
          persist-credentials: false
          sparse-checkout: .github/dev-ha-env/hold.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TRACK_REF }}
          path: src
          fetch-depth: 0
          submodules: recursive

      - name: Compute HAOS image cache keys
        if: inputs.platform == 'haos'
        id: key
        working-directory: src
        run: |
          # The exact key is the e2e lanes' (an image primed on master is
          # reused as is). The component is baked into the image but the
          # holder can replace it live, so a component-only change falls back
          # to any image with the same base inputs (prefix) and the holder
          # applies the branch's component at boot instead of a rebuild.
          hash=$(git ls-tree -r HEAD \
            tests/haos_image_build \
            tests/initial_test_state \
            custom_components/ha_mcp_tools \
            homeassistant-addon-webhook-proxy \
            | grep -v '\.md$' | sha256sum | cut -d' ' -f1 | head -c16)
          echo "cache-key=haos-image-$hash" >> "$GITHUB_OUTPUT"
          tree() { git ls-tree -r HEAD "$@" | grep -v '\.md$' | sha256sum | cut -d' ' -f1 | head -c16; }
          base=$(tree tests/haos_image_build tests/initial_test_state homeassistant-addon-webhook-proxy)
          component=$(tree custom_components/ha_mcp_tools)
          echo "base-prefix=haos-image-devenv-$base-" >> "$GITHUB_OUTPUT"
          echo "devenv-key=haos-image-devenv-$base-$component" >> "$GITHUB_OUTPUT"
      - name: Restore HAOS image from cache
        if: inputs.platform == 'haos'
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/haos-test-image.qcow2
          key: ${{ steps.key.outputs.cache-key }}
          restore-keys: |
            ${{ steps.key.outputs.devenv-key }}
            ${{ steps.key.outputs.base-prefix }}
      - name: Install QEMU + OVMF + libguestfs
        if: inputs.platform == 'haos'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf xz-utils curl libguestfs-tools sshpass
          sudo chmod +r /boot/vmlinuz-*
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build HAOS image (cache miss)
        if: inputs.platform == 'haos' && steps.restore-cache.outputs.cache-matched-key == ''
        working-directory: src
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/lib/android /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af --volumes || true
          pip install -r tests/haos_image_build/requirements.txt
          python3 tests/haos_image_build/build_image.py --verbose \
            --output /tmp/haos-test-image.qcow2
      - name: Save HAOS image to this fork's cache
        if: inputs.platform == 'haos' && steps.restore-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/haos-test-image.qcow2
          key: ${{ steps.key.outputs.cache-key }}
      - name: Save HAOS image under its base key too
        # Also after an exact hit, so the image an e2e prime left is reachable
        # by prefix once this branch's component changes. Never after a prefix
        # hit: that image carries another commit's component.
        if: inputs.platform == 'haos' && (steps.restore-cache.outputs.cache-matched-key == '' || steps.restore-cache.outputs.cache-matched-key == steps.key.outputs.cache-key)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/haos-test-image.qcow2
          key: ${{ steps.key.outputs.devenv-key }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.20"
      - name: Install test dependencies
        working-directory: src
        run: uv sync --all-extras --dev
      - name: Install cloudflared
        env:
          # The binary runs beside the instance and the job token, so pin it
          # and check its digest.
          CLOUDFLARED_VERSION: "2026.9.3"
          CLOUDFLARED_SHA256: 77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2
        run: |
          curl -fsSL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-linux-amd64"
          echo "$CLOUDFLARED_SHA256  cloudflared" | sha256sum -c -
          chmod +x cloudflared

      - name: Boot HA and open the tunnels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
          SERVER: ${{ inputs.server }}
          HA_IMAGE: ${{ inputs.ha_image }}
          DEVENV_MINUTES: ${{ inputs.minutes }}
          DEVENV_TARGETS: ${{ github.workspace }}/targets.json
          # A prefix cache hit restored an image baked with another commit's
          # component (neither the exact nor the current devenv key matched);
          # the holder applies the branch's copy at boot.
          DEVENV_COMPONENT_STALE: ${{ (inputs.platform == 'haos' && steps.restore-cache.outputs.cache-matched-key != '' && steps.restore-cache.outputs.cache-matched-key != steps.key.outputs.cache-key && steps.restore-cache.outputs.cache-matched-key != steps.key.outputs.devenv-key) && '1' || '' }}
        run: |
          [ "$DEVENV_MINUTES" -le 330 ] 2>/dev/null || DEVENV_MINUTES=330
          export DEVENV_MINUTES
          if [ "$PLATFORM" = haos ]; then
            export HAOS_TEST_IMAGE_PATH=/tmp/haos-test-image.qcow2
            case "$SERVER" in
              standalone) export HAOS_TEST_MODE=external ;;
              embedded) export HAOS_TEST_MODE=embedded ;;
              app) export HAOS_TEST_MODE=inaddon ;;
            esac
          else
            # Dev sessions follow stable independently of the E2E fixture pin.
            export HA_TEST_IMAGE="${HA_IMAGE:-ghcr.io/home-assistant/home-assistant:stable}"
            if [ "$SERVER" = embedded ]; then export E2E_BACKEND=embedded; fi
          fi
          # Anyone can read a public fork's logs and artifacts, and anyone with a
          # tunnel URL can drive the instance with the public test credentials:
          # the URLs and secret path are masked in logs and published encrypted.
          SECRET="mcp-$(openssl rand -hex 16)"
          echo "::add-mask::$SECRET"
          export MCP_SECRET_PATH="/$SECRET"
          cp devenv/.github/dev-ha-env/hold.py src/tests/src/e2e/test_dev_ha_env_hold.py
          cd src/tests
          # Not an E2E lane: pytest only runs the holder, which keeps one
          # instance up. `python -m pytest` keeps the lane-shape checks off it.
          nohup uv run python -m pytest src/e2e/test_dev_ha_env_hold.py -v -s --timeout=0 \
            -p no:randomly > ../../env.log 2>&1 &
          echo $! > ../../hold.pid
          cd ../..
          for i in $(seq 1 360); do
            [ -s targets.json ] && break
            kill -0 "$(cat hold.pid)" 2>/dev/null || break
            sleep 5
          done
          if [ ! -s targets.json ]; then echo "HA never came up"; tail -150 env.log; exit 1; fi
          tunnel() {
            nohup ./cloudflared tunnel --no-autoupdate --url "$1" > "$2" 2>&1 &
            echo $! >> tunnel.pids
            url=""
            for i in $(seq 1 60); do
              url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$2" | head -1)
              [ -n "$url" ] && break
              sleep 2
            done
            [ -n "$url" ] || { echo "A tunnel never came up"; exit 1; }
            echo "::add-mask::$url"
            echo "::add-mask::${url#https://}"
          }
          target() { python3 -c "import json,sys;print(json.load(open('targets.json'))[sys.argv[1]])" "$1"; }
          tunnel "$(target ha)" tunnel-ha.log
          HA_URL=$url
          tunnel "$(target mcp)" tunnel-mcp.log
          MCP_URL=$url
          printf 'HA:  %s\nMCP: %s%s\n' "$HA_URL" "$MCP_URL" "$(target mcp_path)" > urls.txt
          mkdir out
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/url-key.pem" \
            -pkeyopt rsa_padding_mode:oaep -in urls.txt -out out/dev-ha-env-urls.enc
          rm urls.txt targets.json
          grep STATUS env.log | tail -3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dev-ha-env-urls
          path: out/dev-ha-env-urls.enc
          retention-days: 1
      - name: Keep running
        run: |
          while kill -0 "$(cat hold.pid)" 2>/dev/null; do
            sleep 60
            grep -E "STATUS|Traceback|Error" env.log | tail -3 || true
            for pid in $(cat tunnel.pids); do
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "::error::A tunnel exited, so its URL is dead. Start the run again."
                exit 1
              fi
            done
          done
          tail -80 env.log
      - name: Logs
        if: always()
        run: |
          docker ps --format '{{.Image}} {{.Status}}' || true
          tail -200 env.log || true
          tail -100 server.log || true
