name: Codex example - hello world

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-auth-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  hello-world:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run arbitrary instructions
        id: codex
        uses: ./.github/actions/codex-run
        with:
          codex-auth: ${{ secrets.CODEX_AUTH }}
          sandbox: read-only
          timeout-minutes: "5"
          instructions: |
            Respond with exactly: Hello world

      - name: Verify the caller's expectation
        env:
          OUTPUT_PATH: ${{ steps.codex.outputs.output-path }}
        run: |
          set -euo pipefail
          actual="$(tr -d '\r\n' < "$OUTPUT_PATH")"
          if [[ "$actual" != "Hello world" ]]; then
            echo "::error::Expected 'Hello world', received '$actual'."
            exit 1
          fi

      - name: Validate secret-writer PAT and persist auth
        if: ${{ always() }}
        uses: ./.github/actions/codex-update-auth
        with:
          codex-auth-path: ${{ steps.codex.outputs.auth-path }}
          original-codex-auth: ${{ steps.codex.outputs.original-auth-path }}
          gh-token: ${{ secrets.CODEX_AUTH_PAT }}
          repository: ${{ github.repository }}
          force-update: "true"
