name: Codex example - hello world

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-auth-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  hello-world:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run arbitrary instructions
        id: codex
        uses: ./.github/actions/codex-run
        with:
          codex-auth: ${{ secrets.CODEX_AUTH }}
          sandbox: read-only
          timeout-minutes: "5"
          instructions: |
            Run this shell command exactly once:

            if [[ "$(cat '${{ runner.temp }}/codex-action-state/visibility-probe.txt' 2>/dev/null || true)" == 'EXPOSED' ]]; then printf 'sandbox profile missing'; else printf 'Hello world'; fi

            Then respond with exactly its stdout and nothing else.

      - name: Verify the caller's expectation
        env:
          OUTPUT_PATH: ${{ steps.codex.outputs.output-path }}
        run: |
          set -euo pipefail
          normalized="$(mktemp "$RUNNER_TEMP/codex-output-normalized.XXXXXX")"
          expected="$(mktemp "$RUNNER_TEMP/codex-output-expected.XXXXXX")"
          tr -d '\r' < "$OUTPUT_PATH" > "$normalized"
          printf 'Hello world' > "$expected"
          if ! cmp -s "$expected" "$normalized"; then
            echo "::error::Codex output did not exactly match 'Hello world'."
            exit 1
          fi

      - name: Validate secret-writer PAT and persist auth
        if: ${{ always() }}
        uses: ./.github/actions/codex-update-auth
        with:
          codex-auth-path: ${{ steps.codex.outputs.auth-path }}
          original-codex-auth: ${{ steps.codex.outputs.original-auth-path }}
          gh-token: ${{ secrets.CODEX_AUTH_PAT }}
          repository: ${{ github.repository }}
          force-update: "true"
