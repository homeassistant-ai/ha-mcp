name: HAOS E2E Tests (beta)

# Both beta HAOS lanes live in this file (#2292 / #2302). They keep their
# existing job ids, names, steps, and shared ``haos-beta-image-*`` cache key
# for a qcow2 baked with the current beta OS, Supervisor, and Core.
# `haos-e2e-inaddon-beta` is the sole writer of that cache;
# `haos-e2e-embedded-beta` restores only (and can build locally on a miss).
#
# Both lanes run for every user-originated master push, the nightly schedule,
# and manual dispatch. The embedded lane waits for the cache-writing inaddon
# lane so a cache miss does not start two identical image builds.

on:
  # Test committed ha-mcp code against upcoming beta OS, Supervisor, and Core
  # releases. Run on each user-originated master update so regressions from our
  # changes surface after merge, and nightly so deliberate upstream beta
  # changes that require an ha-mcp adaptation surface before stable release.
  #
  # Do not run on pull_request pushes: stable HAOS lanes cover PR changes,
  # while maintainers own beta compatibility fixes after changes land.
  push:
    branches: [master]
  schedule:
    # 03:17 UTC is 11:17 PM EDT.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      pytest_args:
        description: 'Extra pytest args (e.g. "-k test_simple_connection") for targeted iteration'
        type: string
        required: false
        default: ''
      pytest_paths:
        description: 'Test paths to run (default: full src/e2e/ — markers handle external_only / haos_only skips)'
        type: string
        required: false
        default: 'src/e2e/'
      force_local_build:
        description: 'Build the qcow2 locally even on a cache hit (ignore the cached image)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Push and scheduled runs are full compatibility checks, so a newer one
# supersedes an older one. Manual dispatches may target only part of the suite;
# give each one a unique group so it cannot cancel or replace a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'full' }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  UV_CACHE_DIR: /tmp/.uv-cache
  LIBGUESTFS_BACKEND: direct

jobs:
  # Decide once whether beta is currently distinct from stable. The gate checks
  # one thing: whether beta.json and stable.json name the same OS, Supervisor,
  # and Core. When they do, the stable HAOS lanes' image (baked from
  # Renovate-managed stable pins; keyed on the bake inputs, so it is rebaked
  # whenever those change and
  # otherwise lives until cache eviction) is taken to cover it, and
  # both lanes below are skipped on push and schedule; a manual dispatch
  # always runs. Each lane still resolves the versions itself for its cache
  # key and build inputs.
  resolve-beta:
    name: Resolve beta versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      superfluous: ${{ steps.compare.outputs.superfluous }}

    steps:
      - name: Compare the beta channel with stable
        id: compare
        run: |
          beta=$(curl --fail --silent --show-error \
            https://version.home-assistant.io/beta.json)
          stable=$(curl --fail --silent --show-error \
            https://version.home-assistant.io/stable.json)
          # Each value is captured separately so a failing python3 call aborts
          # the job. A ``read`` over a failed substitution would leave the
          # variables empty, make the comparison below trivially true, and skip
          # both lanes silently; the fail-safe direction here is to run them.
          os_re='^[0-9]+\.[0-9]+([.]rc[0-9]+)?$'
          supervisor_re='^[0-9]{4}\.[0-9]{1,2}\.[0-9]+([.]dev[0-9]+)?$'
          core_re='^[0-9]{4}\.[0-9]{1,2}\.[0-9]+([.]dev[0-9]+|b[0-9]+)?$'
          check() {
            if [ -z "$2" ]; then
              echo "::error::Empty $1 version in the channel metadata"
              exit 1
            fi
            if ! [[ "$2" =~ $3 ]]; then
              echo "::error::Unexpected $1 version: $2"
              exit 1
            fi
          }
          beta_supervisor=$(python3 -c \
            'import json, sys; print(json.load(sys.stdin)["supervisor"])' \
            <<<"$beta") || exit 1
          beta_core=$(python3 -c \
            'import json, sys; print(json.load(sys.stdin)["homeassistant"]["qemux86-64"])' \
            <<<"$beta") || exit 1
          stable_supervisor=$(python3 -c \
            'import json, sys; print(json.load(sys.stdin)["supervisor"])' \
            <<<"$stable") || exit 1
          stable_core=$(python3 -c \
            'import json, sys; print(json.load(sys.stdin)["homeassistant"]["qemux86-64"])' \
            <<<"$stable") || exit 1
          beta_os=$(python3 -c \
            'import json, sys; print(json.load(sys.stdin)["hassos"]["ova"])' \
            <<<"$beta") || exit 1
          stable_os=$(python3 -c \
            'import json, sys; print(json.load(sys.stdin)["hassos"]["ova"])' \
            <<<"$stable") || exit 1
          check "beta OS" "$beta_os" "$os_re"
          check "stable OS" "$stable_os" "$os_re"
          check "beta Supervisor" "$beta_supervisor" "$supervisor_re"
          check "beta Core" "$beta_core" "$core_re"
          check "stable Supervisor" "$stable_supervisor" "$supervisor_re"
          check "stable Core" "$stable_core" "$core_re"
          superfluous=false
          if [ "$beta_os" = "$stable_os" ] && [ "$beta_supervisor" = "$stable_supervisor" ] && [ "$beta_core" = "$stable_core" ]; then
            superfluous=true
            echo "::notice::Beta (OS $beta_os, Supervisor $beta_supervisor, Core $beta_core) equals stable; skipping the beta lanes"
          fi
          echo "superfluous=$superfluous" >> "$GITHUB_OUTPUT"

  haos-e2e-inaddon-beta:
    name: HAOS E2E Tests (inaddon beta)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    needs: resolve-beta
    if: github.event_name == 'workflow_dispatch' || needs.resolve-beta.outputs.superfluous != 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
          # Full history so merge-ref git operations resolve cleanly.
          fetch-depth: 0

      - name: Resolve current beta OS, Supervisor, and Core versions
        id: versions
        run: |
          metadata=$(curl --fail --silent --show-error \
            https://version.home-assistant.io/beta.json)
          supervisor_version=$(python3 -c \
            'import json, sys; print(json.load(sys.stdin)["supervisor"])' \
            <<<"$metadata")
          core_version=$(python3 -c \
            'import json, sys; print(json.load(sys.stdin)["homeassistant"]["qemux86-64"])' \
            <<<"$metadata")
          if ! [[ "$supervisor_version" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+([.]dev[0-9]+)?$ ]]; then
            echo "::error::Unexpected beta Supervisor version: $supervisor_version"
            exit 1
          fi
          if ! [[ "$core_version" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+([.]dev[0-9]+|b[0-9]+)?$ ]]; then
            echo "::error::Unexpected beta Core version: $core_version"
            exit 1
          fi
          os_version=$(python3 -c \
            'import json, sys; print(json.load(sys.stdin)["hassos"]["ova"])' \
            <<<"$metadata")
          if ! [[ "$os_version" =~ ^[0-9]+\.[0-9]+([.]rc[0-9]+)?$ ]]; then
            echo "::error::Unexpected beta OS version: $os_version"
            exit 1
          fi
          echo "os_version=$os_version" >> "$GITHUB_OUTPUT"
          echo "supervisor_version=$supervisor_version" >> "$GITHUB_OUTPUT"
          echo "core_version=$core_version" >> "$GITHUB_OUTPUT"

      - name: Compute beta image cache key
        id: key
        # Both beta lanes restore this byte-identical image. The three upstream
        # versions prevent an older beta image from satisfying a newer run;
        # the hash invalidates it when any hashed repository bake input changes.
        run: |
          hash=$(git ls-tree -r HEAD \
            tests/haos_image_build \
            tests/initial_test_state \
            custom_components/ha_mcp_tools \
            homeassistant-addon-webhook-proxy \
            | sha256sum | cut -d' ' -f1 | head -c16)
          echo "cache-key=haos-beta-image-${{ steps.versions.outputs.os_version }}-${{ steps.versions.outputs.supervisor_version }}-${{ steps.versions.outputs.core_version }}-$hash" >> "$GITHUB_OUTPUT"

      - name: Restore image from cache
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/haos-beta-test-image.qcow2
          key: ${{ steps.key.outputs.cache-key }}

      - name: Report beta image cache result
        # Reports the cache lookup result; a forced local build may still run
        # after a hit.
        run: |
          echo "::notice title=HAOS image cache::cache-hit=${{ steps.restore-cache.outputs.cache-hit }} key=${{ steps.key.outputs.cache-key }}"

      - name: Install QEMU + OVMF + libguestfs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf xz-utils curl libguestfs-tools sshpass
          sudo chmod +r /boot/vmlinuz-*

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space for the local build
        # On a cache miss (or a forced rebuild) the qcow2 is built locally;
        # its download (~1.5 GB xz) + decompress (~7 GB qcow2) + boot +
        # app install peaks at the edge of the runner's ~14 GB SSD, so
        # prune the ~30 GB of preinstalled tooling the bake does not use.
        # Keep /opt/hostedtoolcache: Python from there is on PATH for
        # build_image.py. See haos-e2e-tests.yml for the full rationale.
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/lib/android /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h /

      - name: Install build-script Python deps (cache miss or forced rebuild)
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: pip install -r tests/haos_image_build/requirements.txt

      - name: Build image locally (cache miss or forced rebuild)
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        env:
          HAOS_BUILD_OS_VERSION: ${{ steps.versions.outputs.os_version }}
          HAOS_BUILD_SUPERVISOR_CHANNEL: beta
          HAOS_BUILD_SUPERVISOR_MIN_VERSION: ${{ steps.versions.outputs.supervisor_version }}
          HAOS_BUILD_CORE_VERSION: ${{ steps.versions.outputs.core_version }}
        run: |
          python3 tests/haos_image_build/build_image.py --verbose \
            --output /tmp/haos-beta-test-image.qcow2

      - name: Compress beta image for Actions cache
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: |
          qemu-img convert -c -O qcow2 \
            /tmp/haos-beta-test-image.qcow2 \
            /tmp/haos-beta-test-image.qcow2.compressed
          mv /tmp/haos-beta-test-image.qcow2.compressed \
            /tmp/haos-beta-test-image.qcow2
          qemu-img check /tmp/haos-beta-test-image.qcow2
          bytes=$(stat -c%s /tmp/haos-beta-test-image.qcow2)
          if [ "$bytes" -lt 1073741824 ]; then
            echo "::error::Compressed beta qcow2 is suspiciously small: $bytes bytes"
            exit 1
          fi

      - name: Save beta image cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/haos-beta-test-image.qcow2
          key: ${{ steps.key.outputs.cache-key }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.7"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: uv sync --all-extras --dev

      - name: Confirm image present
        run: ls -lh /tmp/haos-beta-test-image.qcow2

      - name: Run inaddon E2E suite
        # HAOS_TEST_MODE=inaddon flips conftest.py's HAOS dispatch into
        # the inaddon branch: app source is overwritten with PR source before
        # boot, Supervisor is asked to update/rebuild that app, and mcp_client
        # uses HTTP transport to the app's MCP endpoint.
        #
        # Mirrors the stable inaddon lane's full-suite selection.
        # external_only-marked tests skip automatically.
        #
        # -n2 --dist loadscope: pytest-xdist parallelizes across 2 workers,
        # each booting its own QEMU (per-worker port offset + qcow2 overlay
        # — see _haos_worker_setup in tests/src/e2e/conftest.py). Same
        # rationale as the external HAOS workflow (#1350).
        # Two phases (live-found isolation flaw): addon_disruptive tests
        # self-restart the dev app, killing any OTHER worker's in-flight
        # MCP call (ClosedResourceError server-side; 300s client hang). The
        # parallel run excludes them; a single-worker phase runs them after,
        # when nothing else can be in flight.
        run: |
          cd tests
          # Inputs are data, intentionally word-split into pytest arguments.
          # shellcheck disable=SC2086
          uv run pytest $PYTEST_PATHS \
            -n2 --dist loadscope -v --tb=short --maxfail=0 \
            -m "not addon_disruptive" $PYTEST_ARGS
          # shellcheck disable=SC2086
          uv run pytest $PYTEST_PATHS \
            -n0 -v --tb=short --maxfail=0 \
            -m addon_disruptive $PYTEST_ARGS \
            || { rc=$?; [ "$rc" -eq 5 ] && echo "no disruptive tests in selection"; [ "$rc" -eq 5 ]; }
        env:
          HAMCP_ENV_FILE: "tests/.env.test"
          HAOS_TEST_IMAGE_PATH: /tmp/haos-beta-test-image.qcow2
          HAOS_TEST_MODE: inaddon
          HAOS_EXPECTED_OS_VERSION: ${{ steps.versions.outputs.os_version }}
          HAOS_EXPECTED_SUPERVISOR_CHANNEL: beta
          HAOS_EXPECTED_SUPERVISOR_MIN_VERSION: ${{ steps.versions.outputs.supervisor_version }}
          PYTEST_PATHS: ${{ github.event.inputs.pytest_paths || 'src/e2e/' }}
          PYTEST_ARGS: ${{ github.event.inputs.pytest_args }}
          HAOS_EXPECTED_CORE_VERSION: ${{ steps.versions.outputs.core_version }}
          # Feeds conftest's HACS token injection (qcow2 pre-boot edit)
          # so HACS repo adds don't hit the unauthenticated shared-IP
          # GitHub rate limit — the recurring HACS-install flake.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract HAOS + app diagnostics from booted qcow2 (always)
        if: always()
        run: |
          sudo chmod +r /boot/vmlinuz-* || true
          mkdir -p /tmp/haos-inaddon-beta-diagnostics
          # A bake-stage failure leaves its serial log + image under
          # /tmp/haos-build (build_image.py's work dir); capture them so
          # the artifact is never empty on the failure hardest to see
          # (2026-08-05: day-of-release HA 2026.8.0 bake timeouts shipped
          # an empty artifact).
          cp /tmp/haos-build/haos-serial.log /tmp/haos-inaddon-beta-diagnostics/bake-serial.log 2>/dev/null || true
          # The parallel xdist phase boots one backing-file overlay per worker.
          # The later serial addon_disruptive phase uses worker ID master and
          # boots the base image directly. Overlays persist after the session,
          # so probe every overlay plus the base when present to capture state
          # from both phases. If the bake failed before either path existed,
          # probe the half-baked build image instead.
          shopt -s nullglob
          targets=(/tmp/haos-beta-test-image-gw*.qcow2)
          if [ -f /tmp/haos-beta-test-image.qcow2 ]; then
            targets+=(/tmp/haos-beta-test-image.qcow2)
          fi
          if [ ${#targets[@]} -eq 0 ] && [ -f /tmp/haos-build/haos-test-image.qcow2 ]; then
            targets=(/tmp/haos-build/haos-test-image.qcow2)
          fi
          for img in "${targets[@]}"; do
            label=$(basename "$img" .qcow2)
            outdir=/tmp/haos-inaddon-beta-diagnostics/$label
            mkdir -p "$outdir"
            echo "=== extracting diagnostics from $img ==="
            # /supervisor/homeassistant/.storage state + log files (HA Core).
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : ll /supervisor/homeassistant \
              > "$outdir/config-dir-listing.txt" 2>&1 \
              || echo "directory listing failed for $img"
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : tar-out /supervisor/homeassistant/.storage "$outdir/storage.tar" \
              || echo ".storage tar-out failed for $img"
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : glob copy-out '/supervisor/homeassistant/*.log*' "$outdir/" \
              || echo "log glob copy failed for $img"
            # App-specific: capture the dev app's source directory and its
            # config.yaml version after refresh, so we can verify the PR source
            # actually landed on the booted overlay. Supervisor 2026.06.0
            # (home-assistant/supervisor#6865) renamed the on-disk local store
            # (addons/local -> apps/local, migrated on boot), so probe BOTH roots;
            # the live one lands, the other no-ops under the || echo guard.
            for store in apps addons; do
              guestfish --ro -a "$img" run \
                : mount /dev/sda8 / \
                : ll "/supervisor/$store/local/ha_mcp_dev" \
                >> "$outdir/addon-dir-listing.txt" 2>&1 \
                || echo "addon dir listing failed for $img ($store/local)"
              guestfish --ro -a "$img" run \
                : mount /dev/sda8 / \
                : copy-out "/supervisor/$store/local/ha_mcp_dev/config.yaml" "$outdir/" \
                || echo "addon config.yaml copy-out failed for $img ($store/local)"
            done
            echo "--- [$label] config dir listing ---"
            cat "$outdir/config-dir-listing.txt" || true
            echo "--- [$label] addon dir listing ---"
            cat "$outdir/addon-dir-listing.txt" || true
            echo "--- [$label] addon config.yaml ---"
            cat "$outdir/config.yaml" || true
          done
          ls -laR /tmp/haos-inaddon-beta-diagnostics/ || true
          # The HACS token injection (conftest pre-boot edit) puts GITHUB_TOKEN
          # into core.config_entries inside the extracted storage.tar files.
          # Redact them (fail-closed: an unredactable tar is deleted) so no
          # credential persists into the downloadable artifact.
          python3 scripts/redact_diagnostics_secrets.py /tmp/haos-inaddon-beta-diagnostics

      - name: Upload HAOS inaddon diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: haos-inaddon-beta-diagnostics
          path: |
            /tmp/haos-inaddon-beta-diagnostics/
            # conftest's finally-block dumps HA Core + Supervisor logs into
            # /tmp/haos-diagnostics; surface those too so we can see why
            # ``addons/{slug}/update`` failed with "unknown error".
            /tmp/haos-diagnostics/
            /tmp/haos-e2e-serial.log
          if-no-files-found: warn
          retention-days: 7

  haos-e2e-embedded-beta:
    name: HAOS E2E Tests (embedded beta)
    # Wait for the sole cache writer to finish priming a new beta image. Still
    # run if the inaddon suite fails after saving it, and build locally if that
    # lane failed before the save; only a cancelled workflow suppresses this.
    needs: [resolve-beta, haos-e2e-inaddon-beta]
    if: ${{ !cancelled() && needs.resolve-beta.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.resolve-beta.outputs.superfluous != 'true') }}
    runs-on: ubuntu-22.04
    # The embedded beta lane receives extra headroom for the per-worker runtime
    # package installation inside the resource-constrained QEMU guest.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Required for tests/src/e2e/tools/test_skills_resources.py — the
          # skills bundle lives at src/ha_mcp/resources/skills-vendor.
          submodules: true
          # Full history so merge-ref git operations resolve cleanly.
          fetch-depth: 0

      - name: Resolve current beta OS, Supervisor, and Core versions
        id: versions
        run: |
          metadata=$(curl --fail --silent --show-error \
            https://version.home-assistant.io/beta.json)
          supervisor_version=$(python3 -c \
            'import json, sys; print(json.load(sys.stdin)["supervisor"])' \
            <<<"$metadata")
          core_version=$(python3 -c \
            'import json, sys; print(json.load(sys.stdin)["homeassistant"]["qemux86-64"])' \
            <<<"$metadata")
          if ! [[ "$supervisor_version" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+([.]dev[0-9]+)?$ ]]; then
            echo "::error::Unexpected beta Supervisor version: $supervisor_version"
            exit 1
          fi
          if ! [[ "$core_version" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+([.]dev[0-9]+|b[0-9]+)?$ ]]; then
            echo "::error::Unexpected beta Core version: $core_version"
            exit 1
          fi
          os_version=$(python3 -c \
            'import json, sys; print(json.load(sys.stdin)["hassos"]["ova"])' \
            <<<"$metadata")
          if ! [[ "$os_version" =~ ^[0-9]+\.[0-9]+([.]rc[0-9]+)?$ ]]; then
            echo "::error::Unexpected beta OS version: $os_version"
            exit 1
          fi
          echo "os_version=$os_version" >> "$GITHUB_OUTPUT"
          echo "supervisor_version=$supervisor_version" >> "$GITHUB_OUTPUT"
          echo "core_version=$core_version" >> "$GITHUB_OUTPUT"

      - name: Compute beta image cache key
        id: key
        # Both beta lanes restore this byte-identical image. The three upstream
        # versions prevent an older beta image from satisfying a newer run;
        # the hash invalidates it when any hashed repository bake input changes.
        run: |
          hash=$(git ls-tree -r HEAD \
            tests/haos_image_build \
            tests/initial_test_state \
            custom_components/ha_mcp_tools \
            homeassistant-addon-webhook-proxy \
            | sha256sum | cut -d' ' -f1 | head -c16)
          echo "cache-key=haos-beta-image-${{ steps.versions.outputs.os_version }}-${{ steps.versions.outputs.supervisor_version }}-${{ steps.versions.outputs.core_version }}-$hash" >> "$GITHUB_OUTPUT"

      - name: Restore image from cache
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/haos-beta-test-image.qcow2
          key: ${{ steps.key.outputs.cache-key }}

      - name: Report beta image cache result
        # Reports the cache lookup result; a forced local build may still run
        # after a hit.
        run: |
          echo "::notice title=HAOS image cache::cache-hit=${{ steps.restore-cache.outputs.cache-hit }} key=${{ steps.key.outputs.cache-key }}"

      - name: Install QEMU + OVMF + libguestfs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf xz-utils curl libguestfs-tools sshpass
          sudo chmod +r /boot/vmlinuz-*

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space for the local build
        # On a cache miss (or a forced rebuild) the qcow2 is built locally; its
        # download (~1.5 GB xz) + decompress (~7 GB qcow2) + boot + app install
        # peaks at the edge of the runner's ~14 GB SSD, so prune the ~30 GB of
        # preinstalled tooling the bake does not use. Keep /opt/hostedtoolcache:
        # Python from there is on PATH for build_image.py. See haos-e2e-tests.yml
        # for the full rationale.
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/lib/android /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h /

      - name: Install build-script Python deps (cache miss or forced rebuild)
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: pip install -r tests/haos_image_build/requirements.txt

      - name: Build image locally (cache miss or forced rebuild)
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        env:
          HAOS_BUILD_OS_VERSION: ${{ steps.versions.outputs.os_version }}
          HAOS_BUILD_SUPERVISOR_CHANNEL: beta
          HAOS_BUILD_SUPERVISOR_MIN_VERSION: ${{ steps.versions.outputs.supervisor_version }}
          HAOS_BUILD_CORE_VERSION: ${{ steps.versions.outputs.core_version }}
        run: |
          python3 tests/haos_image_build/build_image.py --verbose \
            --output /tmp/haos-beta-test-image.qcow2

      # The inaddon beta lane is the sole saver for this shared beta key. This
      # dependent lane restores the primed image, or builds locally if the
      # writer failed before saving it.

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.7"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: uv sync --all-extras --dev

      - name: Confirm image present
        run: ls -lh /tmp/haos-beta-test-image.qcow2

      - name: Run full E2E suite against the HAOS embedded server
        # HAOS_TEST_MODE=embedded flips conftest.py's HAOS dispatch into the
        # embedded branch: pre-boot it stages the feature-flag override next to
        # the wheel staging, then the session fixture enables the baked-disabled
        # in-process server entry once, waits for the in-process server's webhook, and
        # mcp_client drives that webhook for the whole suite. external_only tests
        # (out-of-process server unreachable by test-process env/monkeypatch) and
        # the self-referential haos_only embedded smoke module skips automatically.
        #
        # -n2 --dist loadscope: same per-worker QEMU/overlay parallelism as the
        # other HAOS lanes (#1350); --maxfail=0 overrides pytest.ini's --maxfail=3
        # so triage sees the full failure surface.
        run: |
          cd tests
          # Inputs are data, intentionally word-split into pytest arguments.
          # shellcheck disable=SC2086
          uv run pytest $PYTEST_PATHS \
            -n2 --dist loadscope -v --tb=short --maxfail=0 $PYTEST_ARGS
        env:
          HAMCP_ENV_FILE: "tests/.env.test"
          HAOS_TEST_IMAGE_PATH: /tmp/haos-beta-test-image.qcow2
          HAOS_TEST_MODE: embedded
          HAOS_EXPECTED_OS_VERSION: ${{ steps.versions.outputs.os_version }}
          HAOS_EXPECTED_SUPERVISOR_CHANNEL: beta
          HAOS_EXPECTED_SUPERVISOR_MIN_VERSION: ${{ steps.versions.outputs.supervisor_version }}
          HAOS_EXPECTED_CORE_VERSION: ${{ steps.versions.outputs.core_version }}
          PYTEST_PATHS: ${{ github.event.inputs.pytest_paths || 'src/e2e/' }}
          PYTEST_ARGS: ${{ github.event.inputs.pytest_args }}
          # Feeds conftest's HACS token injection (qcow2 pre-boot edit) so HACS
          # repo adds don't hit the unauthenticated shared-IP GitHub rate limit —
          # the recurring HACS-install flake.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract HA diagnostics from booted qcow2 (always)
        if: always()
        run: |
          sudo chmod +r /boot/vmlinuz-* || true
          mkdir -p /tmp/haos-embedded-beta-diagnostics
          # A bake-stage failure leaves its serial log + image under
          # /tmp/haos-build (build_image.py's work dir); capture them so
          # the artifact is never empty on the failure hardest to see
          # (2026-08-05: day-of-release HA 2026.8.0 bake timeouts shipped
          # an empty artifact).
          cp /tmp/haos-build/haos-serial.log /tmp/haos-embedded-beta-diagnostics/bake-serial.log 2>/dev/null || true
          # Under pytest-xdist (-n2) each worker boots its OWN backing-file overlay
          # (haos-beta-test-image-<worker>.qcow2); the base /tmp/haos-beta-test-image.qcow2 is
          # never booted, so the enabled in-process server entry + the in-process
          # server's runtime state live on the OVERLAYS, not the base. Probe every
          # overlay; fall back to the base only for a single-worker (master) run.
          shopt -s nullglob
          targets=(/tmp/haos-beta-test-image-gw*.qcow2)
          if [ ${#targets[@]} -eq 0 ]; then
            targets=(/tmp/haos-beta-test-image.qcow2)
          fi
          if [ ! -f "${targets[0]}" ] && [ -f /tmp/haos-build/haos-test-image.qcow2 ]; then
            # Bake-stage failure: probe the half-baked image instead.
            targets=(/tmp/haos-build/haos-test-image.qcow2)
          fi
          for img in "${targets[@]}"; do
            label=$(basename "$img" .qcow2)
            outdir=/tmp/haos-embedded-beta-diagnostics/$label
            mkdir -p "$outdir"
            echo "=== extracting diagnostics from $img ==="
            # Full config-dir listing (captures whatever HA writes, incl. the
            # in-process server's .ha_mcp data dir + any repair issue).
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : ll /supervisor/homeassistant \
              > "$outdir/config-dir-listing.txt" 2>&1 \
              || echo "directory listing failed for $img"
            # .storage carries core.config_entries — the in-process server entry's
            # state (loaded / setup_error / not_loaded) is the first thing to
            # check when the webhook never came up.
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : tar-out /supervisor/homeassistant/.storage "$outdir/storage.tar" \
              || echo ".storage tar-out failed for $img"
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : glob copy-out '/supervisor/homeassistant/*.log*' "$outdir/" \
              || echo "log glob copy failed for $img"
            echo "--- [$label] config dir listing ---"
            cat "$outdir/config-dir-listing.txt" || true
          done
          ls -laR /tmp/haos-embedded-beta-diagnostics/ || true
          # The HACS token injection (conftest pre-boot edit) puts GITHUB_TOKEN
          # into core.config_entries inside the extracted storage.tar files.
          # Redact them (fail-closed: an unredactable tar is deleted) so no
          # credential persists into the downloadable artifact.
          python3 scripts/redact_diagnostics_secrets.py /tmp/haos-embedded-beta-diagnostics

      - name: Upload HAOS embedded diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: haos-embedded-beta-diagnostics
          path: |
            /tmp/haos-embedded-beta-diagnostics/
            # conftest's HAOS finally-block dumps HA Core + Supervisor runtime
            # logs into /tmp/haos-diagnostics; surface those too — HA on HAOS logs
            # to stdout (no file), so ha-core-runtime.log is the only place the
            # in-process server's install/start errors appear.
            /tmp/haos-diagnostics/
            /tmp/haos-e2e-serial.log
          if-no-files-found: warn
          retention-days: 7
