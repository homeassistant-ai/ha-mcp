name: Slash agent review event

# This workflow may come from a PR merge ref. It receives no secrets and executes
# no checkout or PR code. Its completion wakes the default-branch controller,
# which independently reads and authorizes the current GitHub state.
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions: {}

# Let every notification finish: concurrency cancellation adds failure
# annotations to PR checks during review bursts. The controller serializes
# actual agent work by session and revalidates whether work is still needed.

jobs:
  notify:
    name: Slash review event
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Review activity is available for the trusted controller.'
