name: Locale Sync

# Machine-translate stale and missing catalog strings AFTER merge, on a daily
# schedule, and push the result straight to master with the release App
# credential — the same pattern (and ruleset bypass) as sync-tool-docs.yml
# and the version-bump bots. PRs that change English strings merge without
# owing translations — fork PRs exactly like same-repo ones (the previous
# in-PR flow could not reach fork branches at all and pushed bot commits
# onto contributors' branches when it could).
#
# scripts/translate_locales.py diffs the English-source baseline, translates
# exactly the changed/missing keys via the Gemini API, regenerates the
# derived catalogs, and repins the baseline. Untranslated merges accumulate
# as baseline drift, so one run picks up everything merged since the last
# one — and a hand-translated change repins the baseline in its own PR, so
# the bot never touches a string a human translated: it only ever rewrites
# keys whose English moved out from under them, or that no locale carries.
#
# Verification is split in two: every returned string is validated before it
# is written (placeholder, markup and panel-link parity, in the script), and
# after a clean run the completeness suite in
# tests/src/unit/test_locale_parity.py runs here under
# LOCALE_COMPLETENESS_CHECKS=1 — the same checks PR CI skips. It failing is
# the signal a human is owed: the engine pasted English back, a hand edit
# broke parity, or a feature-gated tool's parsed docstring changed and needs
# its stub confirmed + scripts/update_locale_baseline.py (see AGENTS.md
# § Translations). On that failure nothing is pushed and the run goes red —
# machine translations are recomputable, so dropping them loses nothing.
#
# Rate limits / outages degrade loudly, never silently: a partial run
# (daily quota, engine outage, network) still pushes whatever finished plus
# a progress file (tests/src/unit/locale_sync_progress.json) the next run
# resumes from — spent quota is never wasted — and the job fails so the gap
# stays visible. Re-running this workflow (or just waiting for tomorrow's
# cron) is the recovery procedure. The fallback when the engine is down is a
# human: hand-translate, run generate_locales.py + update_locale_baseline.py,
# and open an ordinary PR — hand-edits always win.
#
# The push deliberately carries NO [skip ci], unlike sync-tool-docs.yml:
# sync-integration-mirror, publish-dev and addon-publish-dev reacting to it
# is how the translated catalogs actually ship. There is no retrigger loop —
# this workflow runs on cron, not on push.

on:
  schedule:
    # Daily, off the hour to dodge GitHub's cron rush.
    - cron: '26 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Shared group for every workflow that pushes to master (hotfix-release,
# semver-release, addon-publish-dev, sync-tool-docs): a bot push landing
# while semantic-release is mid-run aborts the release un-retryably
# ("Upstream branch ... has changed"), so master writers must not overlap.
# cancel-in-progress must be false: a running release must never be
# cancelled by a locale sync.
concurrency:
  group: master-write
  cancel-in-progress: false
  # queue: max keeps every queued run waiting FIFO. The default single-slot
  # queue evicts the OLDER pending run when a new one queues, which could
  # silently drop a queued release behind a bot run.
  queue: max

jobs:
  translate:
    name: Translate and land locale updates
    # workflow_dispatch on a non-default ref would translate that ref's tree
    # and push the result to master — refuse it. schedule always runs on
    # the default branch.
    if: >-
      github.event_name == 'schedule' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # The script bounds itself at TRANSLATE_TIME_BUDGET_SECONDS (2400s) and
    # degrades resumably when it trips; this is the backstop around install,
    # verification and the push, and should never fire.
    timeout-minutes: 55

    steps:
    - uses: actions/checkout@v7
      with:
        # The push below authenticates explicitly with the App token;
        # nothing here needs an ambient credential.
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: Install dependencies
      run: uv sync --dev

    - name: Translate stale and missing strings
      id: translate
      # continue-on-error so partial progress (e.g. a free-tier daily cap hit
      # halfway through) is still landed; the job is failed at the end so the
      # gap stays visible and a rerun continues from it.
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Below timeout-minutes so the script hits its own bound first and
        # degrades resumably (progress recorded, partial work exported).
        TRANSLATE_TIME_BUDGET_SECONDS: "2400"
      run: uv run python scripts/translate_locales.py

    - name: Stage locale changes
      id: export
      run: |
        git add src/ha_mcp/settings_ui/locales src/ha_mcp/settings_ui/settings.js \
                custom_components/ha_mcp_tools/translations \
                homeassistant-addon/translations homeassistant-addon-dev/translations \
                tests/src/unit/locale_source_baseline.json
        # The progress sidecar exists only after a partial run; a bare git add
        # of a nonexistent pathspec is exit 128. Stage it when present, and
        # stage its deletion when a successful run just cleared a tracked one.
        progress=tests/src/unit/locale_sync_progress.json
        if [ -f "$progress" ] || git ls-files --error-unmatch "$progress" >/dev/null 2>&1; then
          git add "$progress"
        fi
        if git diff --staged --quiet; then
          echo "No translation updates."
          echo "have_patch=false" >> "$GITHUB_OUTPUT"
        else
          echo "have_patch=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Verify translated-catalog completeness
      id: verify
      # Runs even with no diff: a clean no-op run over a stale tree (a held
      # feature-gated key awaiting stub review, a hand edit that broke
      # parity) must still go red. Skipped after a partial run — the state
      # is incomplete by construction and the job already fails for it.
      if: steps.translate.outcome == 'success'
      continue-on-error: true
      env:
        LOCALE_COMPLETENESS_CHECKS: "1"
      run: uv run pytest tests/src/unit/test_locale_parity.py -q

    - name: Generate GitHub App token
      id: app-token
      if: steps.export.outputs.have_patch == 'true'
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.RELEASE_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      continue-on-error: true

    - name: Commit and push to master
      # A completed run whose verification FAILED is the one case that must
      # not land unattended — nothing is pushed and the job goes red; the
      # translations are recomputable, so dropping them loses nothing. A
      # partial run pushes: its incompleteness is expected, quantified, and
      # resumable, and every string it did write passed per-string
      # validation.
      if: >-
        steps.export.outputs.have_patch == 'true' &&
        !(steps.translate.outcome == 'success' && steps.verify.outcome == 'failure')
      env:
        PUSH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN }}
      run: |
        # This job's permissions are contents: read, so the default
        # GITHUB_TOKEN cannot push — an App/PAT credential with a ruleset
        # bypass is required, same as sync-tool-docs.yml. Fail loudly
        # instead of pretending.
        if [ -z "$PUSH_TOKEN" ]; then
          echo "::error::No push credential: the release App token could not be minted and RELEASE_TOKEN is unset. Configure RELEASE_APP_ID/RELEASE_APP_PRIVATE_KEY or RELEASE_TOKEN."
          exit 1
        fi
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git commit -m "chore(internal): machine-translate locale updates"
        # master can advance between this job's checkout and its push whenever
        # any PR merges in the same window, which rejects a bare push as a
        # non-fast-forward (the master-write concurrency group only
        # serialises the workflows in the group, not ordinary merges). Rebase
        # onto the latest master and retry before giving up. Unlike
        # sync-tool-docs, a conflict IS possible here — a hand-translation
        # merging mid-run — and losing to it is correct: abort, go red, and
        # let the next run recompute against the hand edit (which wins).
        for attempt in 1 2 3 4 5; do
          if git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:master; then
            echo "Pushed locale updates (attempt ${attempt})."
            exit 0
          fi
          echo "Push rejected on attempt ${attempt}; rebasing onto origin/master and retrying."
          git pull --rebase origin master || {
            git rebase --abort 2>/dev/null || true
            echo "::error::Rebase onto origin/master failed (likely a racing locale edit); nothing pushed — the next run will redo the work against it."
            exit 1
          }
        done
        echo "::error::Could not push locale updates after 5 attempts."
        exit 1

    - name: Surface partial or failed runs
      if: >-
        !cancelled() &&
        (steps.translate.outcome != 'success' || steps.verify.outcome == 'failure')
      run: |
        if [ "${{ steps.translate.outcome }}" != "success" ]; then
          echo "::error::scripts/translate_locales.py did not finish cleanly; finished strings (if any) were pushed and the remainder is recorded in the progress file. Re-run this workflow — or let tomorrow's cron — continue from it, or hand-translate per AGENTS.md § Translations."
        fi
        if [ "${{ steps.verify.outcome }}" = "failure" ]; then
          echo "::error::the completeness suite failed after a clean translate run, so nothing was pushed — a human is owed. Common cause: a feature-gated tool's parsed docstring changed; confirm the stub still describes the tool and run scripts/update_locale_baseline.py. The pytest output above names exactly what is off."
        fi
        exit 1
