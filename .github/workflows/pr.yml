name: PR 2790 supplemental branch checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component-version-gate:
    name: Component Version Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: 175f43008d2e914d9ffa5fd5c63ca7a5d797da8b
      - name: Component version and server pin match the server version
        run: |
          python3 - <<'PY'
          import json, re, sys, tomllib
          sys.path.insert(0, "custom_components/ha_mcp_tools")
          from server_pin import server_pins
          server = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          manifest = json.load(open("custom_components/ha_mcp_tools/manifest.json"))
          const = open("custom_components/ha_mcp_tools/const.py").read()
          pins = server_pins(manifest["requirements"])
          found = {
              "manifest.json version": (manifest["version"], server),
              "manifest.json server pin": (
                  pins[0] if len(pins) == 1 else pins, f"ha-mcp=={server}"),
              "const.py COMPONENT_VERSION": (
                  m.group(1) if (m := re.search(
                      r'^COMPONENT_VERSION = "([^"]+)"', const, re.M)) else None,
                  server),
          }
          wrong = {k: v for k, v in found.items() if v[0] != v[1]}
          for key, (value, expected) in wrong.items():
              print(f"::error::{key} is {value!r}, but pyproject.toml's version "
                    f"{server!r} needs {expected!r}. semantic-release stamps these "
                    "at release time; restore them "
                    "(docs/agents/custom-component.md#version-cycle).")
          sys.exit(1 if wrong else 0)
          PY

  ratchet-baselines:
    name: Ratchet baselines against PR base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 175f43008d2e914d9ffa5fd5c63ca7a5d797da8b
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.23'
          python-version: '3.13'
      - run: uv sync --dev
      - name: Run original PR base-comparison commands
        run: |
          base_sha=$(git cat-file -p HEAD | sed -n '/^$/q; s/^parent //p' | head -n 1)
          git fetch --depth=1 origin "$base_sha"
          status=0
          uv run python scripts/module_size_ratchet.py --base "$base_sha" || status=1
          uv run python scripts/duplicate_code_ratchet.py --base "$base_sha" || status=1
          exit "$status"
  codeql-actions:
    name: CodeQL actions security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 175f43008d2e914d9ffa5fd5c63ca7a5d797da8b
      - name: Set up CodeQL CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extensions install github/gh-codeql
          gh codeql set-version latest
      - name: Analyze GitHub Actions with the default security suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh codeql database create "$RUNNER_TEMP/ha-mcp-db-actions" --language=actions --build-mode=none --source-root .
          gh codeql database analyze "$RUNNER_TEMP/ha-mcp-db-actions" codeql/actions-queries:codeql-suites/actions-code-scanning.qls --format=sarif-latest --output actions-security.sarif --download
      - name: Gate on findings
        run: python3 scripts/codeql_quality_gate.py actions-security.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() || failure()
        with:
          name: pr2790-actions-security
          path: actions-security.sarif
