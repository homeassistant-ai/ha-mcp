name: PR 2790 dependency proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-proof:
    name: Compatibility checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
      - name: Install dependencies on runner
        run: uv sync --all-extras --dev
      - name: Check dependency contract after the fix
        run: uv run pytest tests/src/unit/test_vendored_fastmcp.py::test_pyproject_covers_each_vendored_runtime_requirement --maxfail=0 --tb=short -v
      - name: Check categorized search after the fix
        if: success() || failure()
        run: uv run pytest tests/src/unit/test_search_pinned_results.py tests/src/unit/test_search_compact_results.py tests/src/unit/test_component_search_schema.py tests/src/unit/test_categorized_search.py --maxfail=0 --tb=short -v
