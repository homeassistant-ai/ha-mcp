name: HAOS E2E Tests

# Every PR-triggered HAOS lane lives in this file (#2292 / #2302). Each lane
# used to be its own workflow, and each of those carried an identical copy of
# the "Detect relevant changes" classifier job — so a single PR push started
# six checkouts on six runners to compute the same docs-only answer six times.
# One `changes` job now feeds all six lanes.
#
# The lanes themselves are unchanged: same job ids, same job NAMES (they are
# required status checks, so the names are a branch-protection contract), same
# steps, same env, same timeouts, and the same shared ``haos-image-*`` cache
# key. The external `haos-e2e` lane is still the sole writer of that cache;
# every other lane restores only.
#
# One behavioral change comes with the merge: a manual dispatch now runs ALL
# SIX lanes, where dispatching a single lane's file previously ran that lane
# alone. Narrow a dispatch with the `pytest_args` / `pytest_paths` inputs
# rather than by picking a file.
#
# Image resolution strategy (per lane, per run):
#   1. Try GitHub Actions cache (keyed on HAOS version + build inputs)
#   2. On a cache miss, build locally (build_image.py); only `haos-e2e` saves
#
# One job per lane on purpose: the qcow2 stays on that runner's local disk
# through build -> test, so there's no cross-job upload+download of the ~7 GB
# image (previously cost ~5 min per PR).

on:
  # No workflow-level `paths:` filter on purpose. These checks are REQUIRED
  # status checks, and a path-filtered workflow that doesn't trigger leaves the
  # required check Pending forever, wedging the merge of any PR that doesn't
  # touch the listed paths. Instead we trigger on every PR and let the
  # `changes` job below decide whether the heavy suites run: a job skipped via
  # `if:` reports Success to a required check (unlike a workflow-level
  # path-skip, which reports nothing). See the `changes` job for the run/skip
  # rule (skip only pure docs/website; addon + bake inputs always run).
  pull_request:
  workflow_dispatch:
    inputs:
      pytest_args:
        description: 'Extra pytest args (e.g. "-k test_simple_connection") for targeted iteration'
        type: string
        required: false
        default: ''
      pytest_paths:
        description: 'Test paths to run (default: full src/e2e/ — markers handle external_only / haos_only skips)'
        type: string
        required: false
        default: 'src/e2e/'
      force_local_build:
        description: 'Build the qcow2 locally even on a cache hit (ignore the cached image)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  UV_CACHE_DIR: /tmp/.uv-cache
  # libguestfs defaults to libvirt which isn't running on GitHub-hosted
  # runners (per-user libvirtd socket missing for the unprivileged
  # runner UID). Direct backend bypasses libvirt and uses QEMU directly.
  LIBGUESTFS_BACKEND: direct

jobs:
  # Gate the heavy suite: run on any code/test/config/addon change, skip ONLY
  # when every changed file is pure docs/website. Skipping happens at the JOB
  # level (via `if:` below) so a skipped run reports Success to the required
  # check; a workflow-level `paths:` skip would instead report nothing and
  # wedge the merge. Add-on + bake-input dirs are baked into the qcow2, so
  # their non-doc files DO affect the suite and always count as code.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Classify changed files
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Fail-closed gate: default to RUNNING the suite; skip ONLY when we can
          # prove the PR changed nothing but docs/website. Any classifier failure
          # (non-PR event, base fetch / rev-parse / diff error, empty diff) leaves
          # run=true — branch protection treats a skipped REQUIRED job as passing,
          # so a fail-open classifier could let code merge untested.
          run=true
          if [ "${{ github.event_name }}" = "pull_request" ] \
            && git fetch --depth=1 origin "$BASE_REF" \
            && base_sha=$(git rev-parse "origin/$BASE_REF") \
            && changed=$(git diff --name-only --diff-filter=ACMRD "$base_sha" HEAD) \
            && [ -n "$changed" ]; then
            echo "Changed files:"; printf '%s\n' "$changed" | sed 's/^/  /'
            run=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                # Markdown docs inside the addon / component dirs are user-facing
                # docs (DOCS.md, README, CHANGELOG), not bake inputs — they don't
                # change what the suite tests, so they skip like any other docs.
                homeassistant-addon/*.md|homeassistant-addon-dev/*.md|homeassistant-addon-webhook-proxy/*.md|custom_components/ha_mcp_tools/*.md)
                  continue ;;
                # Bake inputs / addon dirs are baked into the qcow2 / shipped —
                # their non-doc files change what the suite tests, so they count as code.
                homeassistant-addon/*|homeassistant-addon-dev/*|homeassistant-addon-webhook-proxy/*|custom_components/ha_mcp_tools/*|tests/haos_image_build/*|tests/initial_test_state/*)
                  run=true; break ;;
                # Pure docs / website do not, on their own, warrant the suite.
                *.md|*.mdx|docs/*|site/*)
                  continue ;;
                # Anything else (code, tests, config, workflows, lockfile, ...) runs.
                *)
                  run=true; break ;;
              esac
            done <<< "$changed"
          else
            echo "Non-PR event or unresolved diff — running suite (fail-closed)."
          fi
          echo "run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  haos-e2e:
    name: HAOS E2E Tests
    needs: changes
    # A skipped job reports Success to the required status check (unlike a
    # workflow-level path-skip, which never reports). See the `changes` job.
    # Skipping requires a classifier that SUCCEEDED and said `false` out loud.
    # Two ways this used to fail open: an `if:` with no status-check function
    # implicitly ANDs with success(), so a failed classifier skipped this suite
    # and reported Success (a runner hiccup in a 5-minute filter job waving code
    # through untested); and an empty `run` — which is what a non-success
    # classifier leaves behind — read the same as "docs-only". Any value other
    # than `false` now runs. `!cancelled()` keeps a real cancellation cancelling.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Required for tests/src/e2e/tools/test_skills_resources.py — the
          # skills bundle lives at src/ha_mcp/resources/skills-vendor.
          submodules: true
          # Full history so merge-ref git operations resolve cleanly.
          fetch-depth: 0

      - name: Compute image cache key
        id: key
        # Cache invalidates when ANY input that gets baked into the qcow2
        # changes — build script (addon list / HAOS pin), initial_test_state
        # (seed config + recorder DB + .storage), and the custom components
        # the bake stages into /config. git ls-tree uses object IDs so the
        # hash is reproducible across runs (no mtime noise like `find`
        # would have).
        #
        # INVARIANT: these paths MUST be mirrored by the master-push trigger
        # in build-haos-test-image.yml so the published image stays in step
        # with this cache key. A cache miss now rebuilds locally from the
        # merge-ref rather than serving a stale image. (Regression history:
        # #1374 knx merge broke every open PR's HAOS E2E run until a manual
        # dispatch, back when a miss fell through to a stale GHCR pull.)
        run: |
          hash=$(git ls-tree -r HEAD \
            tests/haos_image_build \
            tests/initial_test_state \
            custom_components/ha_mcp_tools \
            homeassistant-addon-webhook-proxy \
            | sha256sum | cut -d' ' -f1 | head -c16)
          echo "cache-key=haos-image-$hash" >> "$GITHUB_OUTPUT"

      - name: Restore image from cache
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/haos-test-image.qcow2
          key: ${{ steps.key.outputs.cache-key }}

      - name: Report image-acquisition path
        # Surfaces whether this run restored the (master-primed) Actions
        # cache or falls through to a local build, so the cache-prime's
        # effect is observable in the run summary.
        run: |
          echo "::notice title=HAOS image cache::cache-hit=${{ steps.restore-cache.outputs.cache-hit }} key=${{ steps.key.outputs.cache-key }}"

      - name: Install QEMU + OVMF + libguestfs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf xz-utils curl libguestfs-tools sshpass
          # Ubuntu installs the kernel image as 0600 root:root, but
          # libguestfs's supermin appliance builder needs to read it as
          # the invoking (unprivileged) user. Documented at
          # https://libguestfs.org/guestfs-faq.1.html#kernel-permissions
          # (search "kernel image is not readable") — workaround is to
          # relax perms on /boot/vmlinuz-*.
          sudo chmod +r /boot/vmlinuz-*

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space for the local build
        # On a cache miss (or a forced rebuild) the qcow2 is built locally;
        # its download (~1.5 GB xz) + decompress (~7 GB qcow2) + boot +
        # addon-install (qcow2 grows to ~12 GB apparent) + ``cp`` to
        # /tmp/haos-test-image.qcow2 peaks at the edge of the runner's
        # ~14 GB SSD, so prune the ~30 GB of preinstalled tooling (dotnet,
        # swift, ghc, android sdk) the bake does not use. Keep
        # ``/opt/hostedtoolcache``: Python from there is on PATH for
        # build_image.py.
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/lib/android /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h /

      - name: Install build-script Python deps (cache miss or forced rebuild)
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: pip install -r tests/haos_image_build/requirements.txt

      - name: Build image locally (cache miss or forced rebuild)
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: |
          python3 tests/haos_image_build/build_image.py --verbose \
            --output /tmp/haos-test-image.qcow2

      - name: Save image to cache (cache miss only)
        # Save whenever the runtime cache missed so the locally-built
        # qcow2 populates the shared key and future runs restore it
        # instead of rebuilding. This is the sole writer for the shared
        # cache key (#1407 + #1428); the other five lanes intentionally
        # don't save, see the block comment at the same position in
        # the ``haos-e2e-inaddon`` job below.
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/haos-test-image.qcow2
          key: ${{ steps.key.outputs.cache-key }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: uv sync --all-extras --dev

      - name: Confirm image present
        run: ls -lh /tmp/haos-test-image.qcow2

      - name: Run full E2E suite against HAOS backend
        # HAOS_TEST_IMAGE_PATH switches the e2e/conftest.py dispatch from
        # testcontainer → HAOS-QEMU. Same fixture chain, same test code.
        # haos_only tests under tests/src/e2e/haos_only/ run here; tests
        # that need testcontainer-specific behavior (file mounts, etc.)
        # are marked container_only and skip automatically.
        #
        # -n2 --dist loadscope: pytest-xdist parallelizes across 2 workers,
        # each booting its own QEMU (per-worker port offset + qcow2 overlay
        # — see _haos_worker_setup in tests/src/e2e/conftest.py). loadscope
        # keeps all tests in the same module on the same worker so each
        # worker amortizes its boot cost. 4-vCPU/16-GB runner fits 2x
        # QEMU at -smp 2 -m 4096 each (#1350).
        #
        # --maxfail=0 overrides pytest.ini's --maxfail=3 so we see the full
        # failure surface for triage — early-terminating loses signal.
        run: |
          cd tests
          # Dispatch inputs reach the shell through env (below), never by
          # direct interpolation into this script — same shape as the beta
          # lanes. Both stay unquoted for word splitting.
          uv run pytest $PYTEST_PATHS \
            -n2 --dist loadscope -v --tb=short --maxfail=0 $PYTEST_ARGS
        env:
          PYTEST_PATHS: ${{ github.event.inputs.pytest_paths || 'src/e2e/' }}
          PYTEST_ARGS: ${{ github.event.inputs.pytest_args }}
          HAMCP_ENV_FILE: "tests/.env.test"
          HAOS_TEST_IMAGE_PATH: /tmp/haos-test-image.qcow2
          # Feeds conftest's HACS token injection (qcow2 pre-boot edit)
          # so HACS repo adds don't hit the unauthenticated shared-IP
          # GitHub rate limit — the recurring HACS-install flake.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract HA diagnostics from booted qcow2 (always)
        # First lists what's actually present in /supervisor/homeassistant
        # (so missing files in artifact uploads are diagnosable), then
        # tar-out the whole .storage + log files to a local tarball.
        # Reads-only mount so the qcow2 isn't mutated.
        if: always()
        run: |
          sudo chmod +r /boot/vmlinuz-* || true
          mkdir -p /tmp/haos-diagnostics
          # Bake-stage failures leave their image + serial log under
          # /tmp/haos-build (build_image.py's work dir), not the test-run
          # paths probed below - without this the whole diagnostics
          # artifact is empty exactly when the failure is hardest to see
          # (the 2026-08-05 bake timeouts against the day-of-release HA
          # 2026.8.0 shipped a 263-byte artifact). Capture the bake
          # serial log and point the guestfish probes at whichever qcow2
          # exists.
          cp /tmp/haos-build/haos-serial.log /tmp/haos-diagnostics/bake-serial.log 2>/dev/null || true
          QCOW2=/tmp/haos-test-image.qcow2
          [ -f "$QCOW2" ] || QCOW2=/tmp/haos-build/haos-test-image.qcow2
          # Probe: full directory listing of HA's config dir. Captures
          # whatever HA actually writes (log filenames vary by config).
          guestfish --ro -a "$QCOW2" run \
            : mount /dev/sda8 / \
            : ll /supervisor/homeassistant \
            > /tmp/haos-diagnostics/config-dir-listing.txt 2>&1 \
            || echo "directory listing failed"
          # Pull everything log-shaped + the .storage tree out as a tar.
          # tar-out includes the full subtree so anything-named-log gets
          # captured; .storage gives us config_entries + other state.
          guestfish --ro -a "$QCOW2" run \
            : mount /dev/sda8 / \
            : tar-out /supervisor/homeassistant/.storage /tmp/haos-diagnostics/storage.tar \
            || echo ".storage tar-out failed"
          # Same for any log files in the config root.
          guestfish --ro -a "$QCOW2" run \
            : mount /dev/sda8 / \
            : glob copy-out '/supervisor/homeassistant/*.log*' /tmp/haos-diagnostics/ \
            || echo "log glob copy failed"
          ls -la /tmp/haos-diagnostics/ || true
          echo '--- config dir listing ---'
          cat /tmp/haos-diagnostics/config-dir-listing.txt || true
          # The HACS token injection (conftest pre-boot edit) puts GITHUB_TOKEN
          # into core.config_entries inside the extracted storage.tar. Redact
          # it (fail-closed: an unredactable tar is deleted) so no credential
          # persists into the downloadable artifact.
          python3 scripts/redact_diagnostics_secrets.py /tmp/haos-diagnostics

      - name: Upload HAOS diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: haos-diagnostics
          path: |
            /tmp/haos-diagnostics/
            /tmp/haos-e2e-serial.log
          if-no-files-found: warn
          retention-days: 7

  haos-e2e-embedded:
    name: HAOS E2E Tests (embedded)
    needs: changes
    # A skipped job reports Success to the required status check (unlike a
    # workflow-level path-skip, which never reports). See the `changes` job.
    # Skipping requires a classifier that SUCCEEDED and said `false` out loud.
    # Two ways this used to fail open: an `if:` with no status-check function
    # implicitly ANDs with success(), so a failed classifier skipped this suite
    # and reported Success (a runner hiccup in a 5-minute filter job waving code
    # through untested); and an empty `run` — which is what a non-success
    # classifier leaves behind — read the same as "docs-only". Any value other
    # than `false` now runs. `!cancelled()` keeps a real cancellation cancelling.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    runs-on: ubuntu-22.04
    # 60 (vs the external/inaddon lanes' 45): the embedded lane pays a per-worker
    # session-setup cost the others don't — enabling the entry kicks off a runtime
    # pip install of the whole fastmcp tree INSIDE the resource-constrained QEMU
    # guest (~minutes) before the webhook answers, and both xdist workers pay it in
    # parallel at the front of the run. The extra headroom covers that bring-up.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Required for tests/src/e2e/tools/test_skills_resources.py — the
          # skills bundle lives at src/ha_mcp/resources/skills-vendor.
          submodules: true
          # Full history so merge-ref git operations resolve cleanly.
          fetch-depth: 0

      - name: Compute image cache key
        id: key
        # Shared with every other HAOS lane in this file (``haos-e2e``,
        # ``haos-e2e-inaddon``, ``haos-e2e-stdio``,
        # ``haos-e2e-embedded-no-tools``, ``haos-e2e-inaddon-no-tools``): all
        # six lanes consume the same byte-identical qcow2. The bake seeds the
        # in-process MCP server config entry (of ha_mcp_tools) into the image
        # (build_image._stage_embedded_server_integration), and the per-worker
        # wheel/feature-flag staging happens IN-VM at test time on each worker's
        # overlay — never on the cached base — so this lane needs no distinct key.
        # ``custom_components/ha_mcp_tools`` is already one of the hashed
        # paths, so a change to the integration invalidates the shared image.
        run: |
          hash=$(git ls-tree -r HEAD \
            tests/haos_image_build \
            tests/initial_test_state \
            custom_components/ha_mcp_tools \
            homeassistant-addon-webhook-proxy \
            | sha256sum | cut -d' ' -f1 | head -c16)
          echo "cache-key=haos-image-$hash" >> "$GITHUB_OUTPUT"

      - name: Restore image from cache
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/haos-test-image.qcow2
          key: ${{ steps.key.outputs.cache-key }}

      - name: Report image-acquisition path
        run: |
          echo "::notice title=HAOS image cache::cache-hit=${{ steps.restore-cache.outputs.cache-hit }} key=${{ steps.key.outputs.cache-key }}"

      - name: Install QEMU + OVMF + libguestfs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf xz-utils curl libguestfs-tools sshpass
          sudo chmod +r /boot/vmlinuz-*

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space for the local build
        # On a cache miss (or a forced rebuild) the qcow2 is built locally; its
        # download (~1.5 GB xz) + decompress (~7 GB qcow2) + boot + addon-install
        # peaks at the edge of the runner's ~14 GB SSD, so prune the ~30 GB of
        # preinstalled tooling the bake does not use. Keep /opt/hostedtoolcache:
        # Python from there is on PATH for build_image.py. See the haos-e2e job
        # above for the full rationale.
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/lib/android /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h /

      - name: Install build-script Python deps (cache miss or forced rebuild)
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: pip install -r tests/haos_image_build/requirements.txt

      - name: Build image locally (cache miss or forced rebuild)
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: |
          python3 tests/haos_image_build/build_image.py --verbose \
            --output /tmp/haos-test-image.qcow2

      # No cache-save step here on purpose. The external lane (``haos-e2e``)
      # computes the same cache key (#1407) and is the SOLE saver of the
      # shared qcow2; the other five lanes only restore from that shared
      # key. All six lanes start in parallel on the same PR
      # push, so having only one saver avoids the "another job may be creating
      # this cache" race + the wasted tar+zstd write of a 12 GB image. The
      # shared-key bet is safe because all six consume the SAME byte-identical
      # base: the key hashes bake-input paths only, and every PR-level source /
      # feature-flag override happens in-VM at test time on each worker's overlay
      # (see stage_embedded_server_wheel_in_qcow2 /
      # stage_embedded_server_feature_flags_in_qcow2 / refresh_recorder_in_qcow2
      # in conftest.py) — never on the cached base.

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: uv sync --all-extras --dev

      - name: Confirm image present
        run: ls -lh /tmp/haos-test-image.qcow2

      - name: Run full E2E suite against the HAOS embedded server
        # HAOS_TEST_MODE=embedded flips conftest.py's HAOS dispatch into the
        # embedded branch: pre-boot it stages the feature-flag override next to
        # the wheel staging, then the session fixture enables the baked-disabled
        # in-process server entry once, waits for the in-process server's webhook, and
        # mcp_client drives that webhook for the whole suite. external_only tests
        # (out-of-process server unreachable by test-process env/monkeypatch) and
        # the 3 self-referential haos_only embedded smoke tests skip automatically.
        #
        # -n2 --dist loadscope: same per-worker QEMU/overlay parallelism as the
        # other HAOS lanes (#1350); --maxfail=0 overrides pytest.ini's --maxfail=3
        # so triage sees the full failure surface.
        run: |
          cd tests
          # Dispatch inputs reach the shell through env (below), never by
          # direct interpolation into this script — same shape as the beta
          # lanes. Both stay unquoted for word splitting.
          uv run pytest $PYTEST_PATHS \
            -n2 --dist loadscope -v --tb=short --maxfail=0 $PYTEST_ARGS
        env:
          PYTEST_PATHS: ${{ github.event.inputs.pytest_paths || 'src/e2e/' }}
          PYTEST_ARGS: ${{ github.event.inputs.pytest_args }}
          HAMCP_ENV_FILE: "tests/.env.test"
          HAOS_TEST_IMAGE_PATH: /tmp/haos-test-image.qcow2
          HAOS_TEST_MODE: embedded
          # Feeds conftest's HACS token injection (qcow2 pre-boot edit) so HACS
          # repo adds don't hit the unauthenticated shared-IP GitHub rate limit —
          # the recurring HACS-install flake.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract HA diagnostics from booted qcow2 (always)
        if: always()
        run: |
          sudo chmod +r /boot/vmlinuz-* || true
          mkdir -p /tmp/haos-embedded-diagnostics
          # A bake-stage failure leaves its serial log + image under
          # /tmp/haos-build (build_image.py's work dir); capture them so
          # the artifact is never empty on the failure hardest to see
          # (2026-08-05: day-of-release HA 2026.8.0 bake timeouts shipped
          # an empty artifact).
          cp /tmp/haos-build/haos-serial.log /tmp/haos-embedded-diagnostics/bake-serial.log 2>/dev/null || true
          # Under pytest-xdist (-n2) each worker boots its OWN backing-file overlay
          # (haos-test-image-<worker>.qcow2); the base /tmp/haos-test-image.qcow2 is
          # never booted, so the enabled in-process server entry + the in-process
          # server's runtime state live on the OVERLAYS, not the base. Probe every
          # overlay; fall back to the base only for a single-worker (master) run.
          shopt -s nullglob
          targets=(/tmp/haos-test-image-gw*.qcow2)
          if [ ${#targets[@]} -eq 0 ]; then
            targets=(/tmp/haos-test-image.qcow2)
          fi
          if [ ! -f "${targets[0]}" ] && [ -f /tmp/haos-build/haos-test-image.qcow2 ]; then
            # Bake-stage failure: probe the half-baked image instead.
            targets=(/tmp/haos-build/haos-test-image.qcow2)
          fi
          for img in "${targets[@]}"; do
            label=$(basename "$img" .qcow2)
            outdir=/tmp/haos-embedded-diagnostics/$label
            mkdir -p "$outdir"
            echo "=== extracting diagnostics from $img ==="
            # Full config-dir listing (captures whatever HA writes, incl. the
            # in-process server's .ha_mcp data dir + any repair issue).
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : ll /supervisor/homeassistant \
              > "$outdir/config-dir-listing.txt" 2>&1 \
              || echo "directory listing failed for $img"
            # .storage carries core.config_entries — the in-process server entry's
            # state (loaded / setup_error / not_loaded) is the first thing to
            # check when the webhook never came up.
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : tar-out /supervisor/homeassistant/.storage "$outdir/storage.tar" \
              || echo ".storage tar-out failed for $img"
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : glob copy-out '/supervisor/homeassistant/*.log*' "$outdir/" \
              || echo "log glob copy failed for $img"
            echo "--- [$label] config dir listing ---"
            cat "$outdir/config-dir-listing.txt" || true
          done
          ls -laR /tmp/haos-embedded-diagnostics/ || true
          # The HACS token injection (conftest pre-boot edit) puts GITHUB_TOKEN
          # into core.config_entries inside the extracted storage.tar files.
          # Redact them (fail-closed: an unredactable tar is deleted) so no
          # credential persists into the downloadable artifact.
          python3 scripts/redact_diagnostics_secrets.py /tmp/haos-embedded-diagnostics

      - name: Upload HAOS embedded diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: haos-embedded-diagnostics
          path: |
            /tmp/haos-embedded-diagnostics/
            # conftest's HAOS finally-block dumps HA Core + Supervisor runtime
            # logs into /tmp/haos-diagnostics; surface those too — HA on HAOS logs
            # to stdout (no file), so ha-core-runtime.log is the only place the
            # in-process server's install/start errors appear.
            /tmp/haos-diagnostics/
            /tmp/haos-e2e-serial.log
          if-no-files-found: warn
          retention-days: 7

  haos-e2e-inaddon:
    name: HAOS E2E Tests (inaddon)
    needs: changes
    # A skipped job reports Success to the required status check (unlike a
    # workflow-level path-skip, which never reports). See the `changes` job.
    # Skipping requires a classifier that SUCCEEDED and said `false` out loud.
    # Two ways this used to fail open: an `if:` with no status-check function
    # implicitly ANDs with success(), so a failed classifier skipped this suite
    # and reported Success (a runner hiccup in a 5-minute filter job waving code
    # through untested); and an empty `run` — which is what a non-success
    # classifier leaves behind — read the same as "docs-only". Any value other
    # than `false` now runs. `!cancelled()` keeps a real cancellation cancelling.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
          # Full history so merge-ref git operations resolve cleanly.
          fetch-depth: 0

      - name: Compute image cache key
        id: key
        # Shared with the ``haos-e2e`` lane and every other HAOS lane in
        # this file: all six consume the same qcow2. The bake
        # (build_image.py::build) unconditionally calls
        # stage_dev_addon_source + install_ha_mcp_dev_addon, so the baked
        # image is already addon-baked and works for both tiers. Inaddon's
        # refresh_dev_addon_source_in_qcow2 overwrites the addon source at
        # test time, so PR-level addon changes don't need to invalidate the
        # cache here.
        run: |
          hash=$(git ls-tree -r HEAD \
            tests/haos_image_build \
            tests/initial_test_state \
            custom_components/ha_mcp_tools \
            homeassistant-addon-webhook-proxy \
            | sha256sum | cut -d' ' -f1 | head -c16)
          echo "cache-key=haos-image-$hash" >> "$GITHUB_OUTPUT"

      - name: Restore image from cache
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/haos-test-image.qcow2
          key: ${{ steps.key.outputs.cache-key }}

      - name: Report image-acquisition path
        # Surfaces whether this run restored the (master-primed) Actions
        # cache or falls through to a local build, so the cache-prime's
        # effect is observable in the run summary.
        run: |
          echo "::notice title=HAOS image cache::cache-hit=${{ steps.restore-cache.outputs.cache-hit }} key=${{ steps.key.outputs.cache-key }}"

      - name: Install QEMU + OVMF + libguestfs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf xz-utils curl libguestfs-tools sshpass
          sudo chmod +r /boot/vmlinuz-*

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space for the local build
        # On a cache miss (or a forced rebuild) the qcow2 is built locally;
        # its download (~1.5 GB xz) + decompress (~7 GB qcow2) + boot +
        # addon-install peaks at the edge of the runner's ~14 GB SSD, so
        # prune the ~30 GB of preinstalled tooling the bake does not use.
        # Keep /opt/hostedtoolcache: Python from there is on PATH for
        # build_image.py. See the haos-e2e job above for the full rationale.
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/lib/android /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h /

      - name: Install build-script Python deps (cache miss or forced rebuild)
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: pip install -r tests/haos_image_build/requirements.txt

      - name: Build image locally (cache miss or forced rebuild)
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: |
          python3 tests/haos_image_build/build_image.py --verbose \
            --output /tmp/haos-test-image.qcow2

      # No cache-save step here on purpose. The external lane (``haos-e2e``)
      # computes the same cache key (#1407) and always tries to save the
      # same qcow2; all six lanes start in
      # parallel on the same PR push, so whichever lost the save race
      # was burning ~25s on a tar+zstd-write of a 12 GB qcow2 that
      # the actions/cache service then refused with
      # "another job may be creating this cache." Letting only the
      # external lane save eliminates the wasted work without
      # changing what gets cached — the other five lanes still restore from
      # the shared key on the next run.
      #
      # The shared-key bet is safe because all six lanes consume the SAME
      # byte-identical qcow2: the cache key hashes the bake-input paths
      # only, so a cache miss builds one qcow2 that the saving lane writes
      # to the shared key for all six to restore, and PR-level addon/source
      # overrides happen *in-VM at test time* (see
      # ``refresh_dev_addon_source_in_qcow2`` /
      # ``refresh_recorder_in_qcow2`` in conftest.py) on each
      # worker's per-worker overlay — never on the base qcow2 that
      # gets cached.

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: uv sync --all-extras --dev

      - name: Confirm image present
        run: ls -lh /tmp/haos-test-image.qcow2

      - name: Run inaddon E2E suite
        # HAOS_TEST_MODE=inaddon flips conftest.py's HAOS dispatch into
        # the inaddon branch: addon source is overwritten with PR source
        # before boot, Supervisor update is triggered, mcp_client uses
        # HTTP transport to the addon's MCP endpoint.
        #
        # v1: targets src/e2e/haos_only/ only (canary tier). Widen via
        # workflow_dispatch pytest_paths input once the inaddon plumbing
        # is stable. external_only-marked tests skip automatically.
        #
        # -n2 --dist loadscope: pytest-xdist parallelizes across 2 workers,
        # each booting its own QEMU (per-worker port offset + qcow2 overlay
        # — see _haos_worker_setup in tests/src/e2e/conftest.py). Same
        # rationale as the external HAOS workflow (#1350).
        # Two phases (live-found isolation flaw): addon_disruptive tests
        # self-restart the dev addon, killing any OTHER worker's in-flight
        # MCP call (ClosedResourceError server-side; 300s client hang). The
        # parallel run excludes them; a single-worker phase runs them after,
        # when nothing else can be in flight.
        run: |
          cd tests
          # Dispatch inputs reach the shell through env (below), never by
          # direct interpolation into this script — same shape as the beta
          # lanes. Both stay unquoted for word splitting.
          uv run pytest $PYTEST_PATHS \
            -n2 --dist loadscope -v --tb=short --maxfail=0 \
            -m "not addon_disruptive" $PYTEST_ARGS
          uv run pytest $PYTEST_PATHS \
            -n0 -v --tb=short --maxfail=0 \
            -m addon_disruptive $PYTEST_ARGS \
            || { rc=$?; [ "$rc" -eq 5 ] && echo "no disruptive tests in selection"; [ "$rc" -eq 5 ]; }
        env:
          PYTEST_PATHS: ${{ github.event.inputs.pytest_paths || 'src/e2e/' }}
          PYTEST_ARGS: ${{ github.event.inputs.pytest_args }}
          HAMCP_ENV_FILE: "tests/.env.test"
          HAOS_TEST_IMAGE_PATH: /tmp/haos-test-image.qcow2
          HAOS_TEST_MODE: inaddon
          # Feeds conftest's HACS token injection (qcow2 pre-boot edit)
          # so HACS repo adds don't hit the unauthenticated shared-IP
          # GitHub rate limit — the recurring HACS-install flake.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract HAOS + addon diagnostics from booted qcow2 (always)
        if: always()
        run: |
          sudo chmod +r /boot/vmlinuz-* || true
          mkdir -p /tmp/haos-inaddon-diagnostics
          # A bake-stage failure leaves its serial log + image under
          # /tmp/haos-build (build_image.py's work dir); capture them so
          # the artifact is never empty on the failure hardest to see
          # (2026-08-05: day-of-release HA 2026.8.0 bake timeouts shipped
          # an empty artifact).
          cp /tmp/haos-build/haos-serial.log /tmp/haos-inaddon-diagnostics/bake-serial.log 2>/dev/null || true
          # In pytest-xdist (parallel) mode each worker boots its OWN
          # backing-file overlay (haos-test-image-<worker>.qcow2); the base
          # /tmp/haos-test-image.qcow2 is never booted, so the per-PR source
          # refresh and the HA Core runtime state live on the OVERLAYS, not
          # the base. The overlays persist after the session (the worker
          # fixture registers no teardown unlink), and guestfish reads them
          # through their absolute backing path. Probe every overlay; fall
          # back to the base image only for a single-worker (master) run that
          # mutates it directly. #1594 secondary defect: the old step probed
          # only the un-refreshed base, so the addon-dir / config.yaml checks
          # could never observe the refresh result they claimed to verify.
          shopt -s nullglob
          targets=(/tmp/haos-test-image-gw*.qcow2)
          if [ ${#targets[@]} -eq 0 ]; then
            targets=(/tmp/haos-test-image.qcow2)
          fi
          if [ ! -f "${targets[0]}" ] && [ -f /tmp/haos-build/haos-test-image.qcow2 ]; then
            # Bake-stage failure: probe the half-baked image instead.
            targets=(/tmp/haos-build/haos-test-image.qcow2)
          fi
          for img in "${targets[@]}"; do
            label=$(basename "$img" .qcow2)
            outdir=/tmp/haos-inaddon-diagnostics/$label
            mkdir -p "$outdir"
            echo "=== extracting diagnostics from $img ==="
            # /supervisor/homeassistant/.storage state + log files (HA Core).
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : ll /supervisor/homeassistant \
              > "$outdir/config-dir-listing.txt" 2>&1 \
              || echo "directory listing failed for $img"
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : tar-out /supervisor/homeassistant/.storage "$outdir/storage.tar" \
              || echo ".storage tar-out failed for $img"
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : glob copy-out '/supervisor/homeassistant/*.log*' "$outdir/" \
              || echo "log glob copy failed for $img"
            # Addon-specific: capture the dev addon's source dir AND its
            # config.yaml version after refresh, so we can verify the PR source
            # actually landed on the booted overlay. Supervisor 2026.06.0
            # (home-assistant/supervisor#6865) renamed the on-disk local store
            # (addons/local -> apps/local, migrated on boot), so probe BOTH roots;
            # the live one lands, the other no-ops under the || echo guard.
            for store in apps addons; do
              guestfish --ro -a "$img" run \
                : mount /dev/sda8 / \
                : ll "/supervisor/$store/local/ha_mcp_dev" \
                >> "$outdir/addon-dir-listing.txt" 2>&1 \
                || echo "addon dir listing failed for $img ($store/local)"
              guestfish --ro -a "$img" run \
                : mount /dev/sda8 / \
                : copy-out "/supervisor/$store/local/ha_mcp_dev/config.yaml" "$outdir/" \
                || echo "addon config.yaml copy-out failed for $img ($store/local)"
            done
            echo "--- [$label] config dir listing ---"
            cat "$outdir/config-dir-listing.txt" || true
            echo "--- [$label] addon dir listing ---"
            cat "$outdir/addon-dir-listing.txt" || true
            echo "--- [$label] addon config.yaml ---"
            cat "$outdir/config.yaml" || true
          done
          ls -laR /tmp/haos-inaddon-diagnostics/ || true
          # The HACS token injection (conftest pre-boot edit) puts GITHUB_TOKEN
          # into core.config_entries inside the extracted storage.tar files.
          # Redact them (fail-closed: an unredactable tar is deleted) so no
          # credential persists into the downloadable artifact.
          python3 scripts/redact_diagnostics_secrets.py /tmp/haos-inaddon-diagnostics

      - name: Upload HAOS inaddon diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: haos-inaddon-diagnostics
          path: |
            /tmp/haos-inaddon-diagnostics/
            # conftest's finally-block dumps HA Core + Supervisor logs into
            # /tmp/haos-diagnostics; surface those too so we can see why
            # ``addons/{slug}/update`` failed with "unknown error".
            /tmp/haos-diagnostics/
            /tmp/haos-e2e-serial.log
          if-no-files-found: warn
          retention-days: 7

