name: Renovate

on:
  schedule:
    # Run every Tuesday at 15:00 UTC (after Dependabot on Monday)
    - cron: '0 15 * * 2'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - info
          - warn
          - error

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The default GITHUB_TOKEN cannot push commits that modify any file
      # under .github/workflows/ — GitHub blocks workflow-file mutations
      # from GITHUB_TOKEN for security reasons. Renovate needs to touch
      # those files (the # renovate: annotations sit alongside image: pins
      # in pr.yml, e2e-tests.yml, performance-tests.yml), so we mint a
      # short-lived installation token from a dedicated GitHub App that
      # has Workflows: write.
      - name: Generate Renovate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          # Without this the vulnerabilityAlerts carve-out in renovate.json is
          # dead: an installation token that lists any permission-* input drops
          # every permission it does not name, including vulnerability_alerts.
          permission-vulnerability-alerts: read
          # Renovate publishes a stability status check on every branch it
          # writes (minimumReleaseAge). Without commit-status access GitHub
          # answers 404 rather than 403, Renovate reads that as the repository
          # having changed, and aborts the WHOLE run right after writing its
          # first branch: no PR, no dependency dashboard, nothing else
          # processed. The app installation must grant this too; the token can
          # only ever narrow what the installation already has.
          permission-statuses: write
          permission-workflows: write

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc # v46.2.4
        with:
          configurationFile: renovate.json
          renovate-version: 44.50.1
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
