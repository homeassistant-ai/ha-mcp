name: Sync Ratchet Baselines

# Pull requests only check the module-size and duplicate-code ratchets against
# their baselines and never edit them: every pull request touching a listed
# file would otherwise rewrite the same two files and conflict with the next.
# After a merge this lowers both baselines to master's files and commits them.
on:
  push:
    branches: [master]
    paths:
      - '**/*.py'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.ts'
      - '**/*.astro'
      # Its ruff extend-exclude decides which files the ratchets count.
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

# Shared group for every workflow that pushes to master (semver-release,
# addon-publish-dev, locale-sync, sync-tool-docs): a push landing while
# semantic-release is mid-run aborts the release un-retryably ("Upstream
# branch ... has changed"), so master writers must not overlap. This also
# keeps sync runs from overlapping each other. cancel-in-progress must be
# false: a running release must never be cancelled by a baseline sync.
concurrency:
  group: master-write
  cancel-in-progress: false
  # queue: max keeps every queued run waiting FIFO. The default single-slot
  # queue evicts the OLDER pending run when a new one queues, which could
  # silently drop a queued release behind a bot push.
  queue: max

jobs:
  sync-ratchet-baselines:
    name: Lower the ratchet baselines
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        app-id: ${{ secrets.RELEASE_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        permission-contents: write
      continue-on-error: true

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # Use app token to bypass branch protection ruleset
        token: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.13'

    # Both scripts use only the standard library. Each fails, after writing
    # what it can, when master itself breaks its ratchet.
    - name: Lower the baselines
      run: |
        status=0
        python scripts/module_size_ratchet.py || status=1
        python scripts/duplicate_code_ratchet.py || status=1
        exit "$status"

    - name: Commit and push if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add tests/src/unit/module_size_baseline.json tests/src/unit/duplicate_code_baseline.json
        if git diff --staged --quiet; then
          echo "No baseline changes to sync."
          exit 0
        fi
        git commit -m "chore(internal): sync ratchet baselines after merge [skip ci]"
        # master can advance between this job's checkout and its push whenever
        # any unrelated PR merges in the same window, which rejects a bare push
        # as a non-fast-forward (the master-write concurrency group only
        # serialises the workflows in the group, not ordinary merges). Rebase
        # onto the latest master and retry before giving up. Pull requests do
        # not edit the baselines, so the rebase has nothing to conflict with.
        for attempt in 1 2 3 4 5; do
          if git push; then
            echo "Synced ratchet baselines (attempt ${attempt})."
            exit 0
          fi
          echo "Push rejected on attempt ${attempt}; rebasing onto origin/master and retrying."
          # A conflicted/failed rebase leaves rebase-in-progress state and the
          # remaining attempts would fail for a misleading reason — abort and
          # surface the real error instead.
          git pull --rebase origin master || {
            git rebase --abort 2>/dev/null || true
            echo "::error::Rebase onto origin/master failed; aborting retries."
            exit 1
          }
        done
        echo "::error::Could not push the ratchet baseline sync after 5 attempts."
        exit 1
