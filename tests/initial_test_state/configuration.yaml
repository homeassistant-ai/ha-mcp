
# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  # Bind YAML packages under a NON-default folder name ("custom_packages",
  # not "packages") so the e2e suite exercises ha_config_set_yaml's runtime
  # packages-folder detection (#1854) instead of the hardcoded default. The
  # tool keeps "packages" as a fallback, so tests writing to packages/*.yaml
  # still pass.
  packages: !include_dir_named custom_packages

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# NO `http:` BLOCK HERE, DELIBERATELY. HA 2026.8 moved HTTP config into a
# storage-backed store (Settings UI) and turned YAML into a ONE-SHOT
# migration that lands as an unconfirmed *pending trial*: Core serves it,
# schedules a revert 5 minutes later, and — when nothing promotes it —
# reverts to the stored config and RESTARTS Core. That restart landed
# mid-suite and killed the tail of the external HAOS lane. The same release
# also changed the Supervisor-managed default port from 8123 to 80, so the
# reverted config is not even the port this suite talks to.
# The settings this block used to carry (server_port 8123, plus the
# use_x_forwarded_for/trusted_proxies proxy pair) now live in
# .storage/http as a CONFIRMED `stable` config with yaml_migration_done
# already true — no migration, no trial, no revert, no repair issue, and
# Core stays on 8123 on every backend. Add HTTP settings there, not here.

demo:

# Helper used by the pagination tests in test_history.py and test_logbook.py.
# Defined here so the entity always exists at HA boot; the recorder DB ships
# with pre-baked state-change rows for it (see scripts/bake_pagination_seed.py
# and the timestamp-refresh hook in conftest.py).
input_number:
  e2e_pagination_seed:
    name: E2E Pagination Seed
    min: 0
    max: 1000
    step: 1
    initial: 0
    mode: box

# YAML-configured template sensors providing the `sensor.demo_temperature`
# and `sensor.demo_outside_temperature` names that several existing e2e
# tests reference (test_helper_crud.py, test_config_entry_flow.py). The
# bare `demo:` line above does NOT create entities in modern HA — the
# demo integration is config-flow-only since it was migrated — so without
# these YAML fixtures those tests passed only because HA helper configs
# accept unknown entity IDs (the helper's state would be 'unknown' at
# runtime, but the helper itself was created successfully).
#
# These same fixtures double as the non-helper integration entity for
# tests/src/e2e/workflows/entities/test_show_as.py — YAML template
# entities aren't reachable via ha_config_set_helper (which uses the
# config-flow API), so they're a legitimate "integration-provided" fixture
# for proving ha_set_entity works on entities with no helper alternative.
template:
  - sensor:
      - name: demo Temperature
        unique_id: e2e_demo_temperature
        state: "{{ 22.5 }}"
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
      - name: demo Outside Temperature
        unique_id: e2e_demo_outside_temperature
        state: "{{ 10.0 }}"
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"