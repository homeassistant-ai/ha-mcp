---
# GENERATED FILE — do not edit. Translations live in
# src/ha_mcp/settings_ui/locales/sr.json (keys addon.*, features.*, advanced.*,
# backup.fields.*, addon_stable.*); regenerate with: python scripts/generate_locales.py
configuration:
  verify_ssl:
    name: Верификуј TLS сертификате
    description: 'Верификуј TLS сертификат Home Assistant сервера. Искључите ово само
      на поузданој мрежи, за самопотписани сертификат или непоклапање назива домаћина:
      ово смањује сигурност преноса.'
  ha_tool_concurrency:
    name: Истовременост Home Assistant алата
    description: Опционални лимит за спољне позиве Home Assistant алата у свим сесијама.
      Интерна REST, WebSocket и истовременост разгранавања по алатима остају непромењени.
      0 задржава неограничено понашање. Позив који чека капацитет неуспешно се завршава
      након 60 секунди. Опсег 0–32.
  custom_instructions:
    name: Прилагођена упутства сервера
    description: Текст послат сваком AI асистенту који се повеже, као део упутстава
      MCP сервера — на пример где се чувају белешке о домаћинству и када их треба
      читати или ажурирати. Такође део упутства Home Assistant агента за разговор
      (Assist) који користе овај скуп алата. Користите га за смернице које треба да
      стигну до свих ваших клијената одједном; нека буде кратко и без тајни. Оставите
      празно да ништа не додајете. Захтева поновно покретање; клијенти виде промену
      када се поново повежу.
  enable_tool_search:
    name: Омогући претрагу алата
    description: 'Замените цео каталог алата откривањем заснованим на претрази. Смањује
      контекст мировања за око 90%, на приближно 5K токена. ⚠️ Немојте ово омогућавати
      у клијентима који имају сопствену уграђену претрагу алата / одложене алате (claude.ai,
      Claude Desktop, Claude Code) — два слоја претраге су у сукобу, а уграђена претрага
      алата клијента је ту бољи избор; оставите ово искљученим. Да ли су алати одложени
      зависи од комбинације вашег клијента и модела: користите ово када ваше подешавање
      учитава цео каталог унапред — модели без матерње одложених алата (нпр. Gemini,
      OpenAI компатибилни локални модели, Claude Haiku), клијенти који убацују све
      шеме алата без обзира на модел (нпр. GitHub Copilot CLI), или мањи прозори контекста.
      Неки Codex модели и ChatGPT такође укључују одложене алате — проверите свој
      клијент/модел директно да бисте потврдили његове функције како не бисте ово
      остављали омогућеним без потребе. Алати се проналазе преко ha_search_tools и
      извршавају се преко категоризованих проксија (читање/писање/брисање). Захтева
      поновно покретање апликације (add-on) да би ступило на снагу — затим поново
      повежите или освежите MCP сервер у свом AI клијенту како би поново учитао листу
      алата. Само поновно покретање апликације (add-on) НЕ освежава кеширану листу
      алата клијента; ово важи након промене било ког подешавања овде.'
  tool_search_max_results:
    name: Максималан број резултата претраге алата
    description: Максималан број сакривених алата враћених по позиву ha_search_tools
      када је претрага алата омогућена; закачени алат који се рангира у оквиру тог
      горњег броја додаје се као кратак унос само са именом на врху. Мање вредности
      (2-3) штеде токена контекста, али могу пропустити релевантне алате. Захтева
      поновно покретање. Опсег 2–10.
  enable_tool_security_policies:
    name: Омогући безбедносне политике алата (напредно)
    description: Заштитите позиве алата са високим улогом (контрола браве/аларма,
      писање аутоматизација итд.) одобрењем корисника. Када се позве заштићени алат,
      агент говори кориснику да отвори картицу Безбедносне политике алата у веб интерфејсу
      и кликне на Одобри пре него што се позив настави. Правила за појединачне алате
      са опционим условима аргумената конфигуришу се на картици Безбедносне политике
      алата. Подразумевано искључено. Захтева поновно покретање да би ступило на снагу.
  enable_security_policy_tool:
    name: Дозволи AI агентима да уређују безбедносне политике алата
    description: 'Региструје алат ha_manage_security_policy, који омогућава повезаним
      AI агентима да читају и мењају безбедносне политике алата — укључујући уклањање
      капија за одобравање. Искључено по дефиницији. Независно од горенаведене опције
      Безбедносне политике алата: ово контролише ко може да уређује правила, а не
      да ли се она примењују. Алат не може да види или одлучује о одобравањима на
      чекању. Да бисте задржали човека у петљи, закључајте алат пре него што га омогућите:
      укључите "security gated" за Управљање безбедносним политикама на картици Алати
      у веб интерфејсу. Захтева поновно покретање да би ступило на снагу.'
  read_only_mode:
    name: Режим само за читање
    description: Искључује све алате за писање и уклања могућност да алати врше било
      какве операције писања или деструктивне позиве. Мешовити алати за читање/писање
      — резервне копије, апликације (add-ons), енергетске преференције, гласовни цевоводи
      и режим кода када је омогућен — остају доступни са блокираним операцијама писања.
      Исти прекидач као на картици Алати у веб интерфејсу. Подразумевано искључено.
      Захтева поновно покретање да би ступило на снагу.
  redact_secrets:
    name: Цензуриши тајне податке
    description: Уклања тајне из одговора алата пре него што стигну до AI асистент-а.
      Опције апликације (add-on) и поља интеграције означена као лозинке се замењују
      маркером за постављено/празно (тако да питање „да ли су ови акредитиви конфигурисани?“
      остаје одговорено), а други одговори алата се чисте од тајних вредности које
      је сервер већ видео (вредности краће од 6 карактера се прескачу, јер би замена
      ситних фрагмената оштетила неповезани излаз). Остала поља се не откривају, осим
      приватних кључева у опцијама апликације и назива опција апликације наведених
      испод. Искључено по дефинитивној поставци.
  redact_app_option_keys:
    name: Додатни кључеви опција апликације за цензурисање
    description: Имена опција апликације (add-on) које треба затамнити попут поља
      за лозинку, за апликације чија шема чува тајну као обичан текст (на пример backup_password).
      Одвојите имена запетама или новим редовима. Име се примењује на сваку апликацију;
      напишите app_slug:name да бисте га ограничили на једну апликацију. Именовање
      групе опција обухвата сваку опцију у њој. Користи се само док је опција Редиговање
      тајни укључена. Подразумевано је празно.
  ipv6_allowed_networks:
    name: Додатне дозвољене IPv6 мреже
    description: 'IPv6 клијенти приступају сопственом порту овог сервера само из локалне
      мреже: loopback, link-local, unique local (fc00::/7) и мреже на које је Home
      Assistant домаћин директно повезан. IPv4 није погођен. Наведите друге IPv6 мреже
      које треба дозволити, одвојене зарезима или новим редовима (на пример 2001:db8:5::/48).
      Додавање ::/0 дозвољава сваког IPv6 клијента, укључујући и оне са интернета
      ако ваш рутер пропушта долазни IPv6 саобраћај.'
  enable_mandatory_bps:
    name: Прикачи вештине добре праксе при упису
    description: 'Главни прекидач за функцију испоруке садржаја вештина за алат за
      упис (issue #1182). Када је омогућено (по дефинитивној поставци), шест алата
      за упис конфигурације (аутоматизације, скрипте, сцене, помоћници, контролне
      табле, сирови YAML) прикаче канонске референтне датотеке са добром праксом за
      Home Assistant под `skill_content` при сваком успешном упису, плус аутоматски
      уграђују било које референтне одељке на које се позивају упозорења добре праксе.
      Сваки алат такође излаже параметар `MandatoryBPS` по позиву који агент може
      подесити на false при наредним позивима када једном има садржај. Када је овај
      главни прекидач искључен, НИКАКАВ skill_content не излази без обзира на параметар
      по позиву или упозорења о доброј пракси. Препоручује се УКЉУЧЕНО као први избор;
      искључите само за моделе са веома малим прозорчићима контекста. Искључивање
      овога може деградирати тачност уписа. Захтева поновно покретање да би ступило
      на снагу.'
  enable_strict_mandatory_bps:
    name: Режим строге добре праксе
    description: 'Строги режим: спречава клијента да користи алат док не докаже да
      је прочитао добре праксе. Док је укључено, шест алата за упис добре праксе (аутоматизације,
      скрипте, сцене, помоћници, контролне табле, сирови YAML) су блокирани и враћају
      грешку која усмерава клијента да прочита вештину добре праксе преко ha_get_skill_guide
      и проследи кључ за потврду који тамо добије. Док је укључено, алат ha_get_skill_guide
      је закључан као укључен — он је једини издавач кључа за потврду. Подређено опцији
      „Прикачи вештине добре праксе при упису“ изнад и неактивно док је тај родитељ
      искључен. Захтева поновно покретање да би ступило на снагу.'
  enable_auto_backup:
    name: Аутоматско прављење резервних копија измена
    description: Сачувајте снимак ентитета пре сваког позива алата за писање или брисање
      који га мења. Док је ово искључено, алати за датотеке и сирови YAML (ha_write_file,
      ha_delete_file, ha_config_set_yaml) одбијају писање.
  auto_backup_throttle_minutes:
    name: Ограничение аутоматских резервних копија (минути)
    description: Колико често аутоматска резервна копија може да ухвати исти ентитет.
      0 хвата при сваком писању; N изнад 0 хвата највише један снимак по N минута
      по ентитету. Опсег 0–1440.
  auto_backup_retain_per_entity:
    name: Задржавање аутоматских резервних копија (по ентитету)
    description: Највећи број сачуваних снимака по ентитету. Сваки нови снимак уклања
      најстарије снимке изнад овог броја. Опсег 1–10000.
  enable_snapshot_actions:
    name: Дозволи акције пуних снимка Home Assistant-а
    description: Дозволите AI асистентима да управљају пуним снимцима Home Assistant-а
      преко ha_manage_backup и еквивалентних услуга за резервне копије и команди у
      ha_call_service. Искључивање овога блокира сваку акцију снимка, укључујући и
      листу. Брисање снимка је доступно само кроз ha_manage_backup и такође захтева
      Дозволи брисање снимка. Уређивање резервних копија и акције резервних копија
      које особа обавља у веб корисничком интерфејсу подешавања остају доступни.
  backup_read_only:
    name: Учини управљање резервним копијама само за читање
    description: Дозволите AI асистентима да листују, прегледају и пореде резервне
      копије измена, као и да листују пуне снимке Home Assistant-а када су акције
      снимка омогућене. Блокирајте ручно креирање резервних копија, враћање (укључујући
      враћање измена) и брисање, укључујући еквивалентне услуге резервних копија и
      команде у ha_call_service. Аутоматске резервне копије пре измена се настављају.
      Акције резервних копија које особа обавља у веб корисничком интерфејсу подешавања
      остају доступне.
  enable_snapshot_delete:
    name: Дозволи брисање снимка
    description: Дозволи алату ha_manage_backup да брише пуне Home Assistant резервне
      копије. Резервна копија може бити последњи начин опоравка након погрешне промене,
      па особа мора ово ручно да омогући. Заказане резервне копије, најновија резервна
      копија и оне млађе од минималне старости остају заштићене.
  snapshot_delete_min_age_days:
    name: Минимална старост снимка за брисање (дани)
    description: Колико старог снимак мора бити, у данима, пре него што се може обрисати.
      0 искључује ограничење старости; најновији снимак и заказане резервне копије
      остају заштићени. Опсег 0–365.
  disabled_tools:
    name: Искључени алати (раздвојени запетама)
    description: Алати наведени овде су принудно искључени и закључани у веб интерфејсу
      Подешавања (картица Алати) — не могу се поново омогућити тамо без претходног
      поништавања ове опције. Мали скуп обавезних алата (ha_search, ha_get_overview,
      ha_get_state, ha_report_issue, ha_manage_backup) не може се искључити и наставља
      да ради чак и ако су наведени овде. ha_get_skill_guide се може искључити само
      док је режим строгих најбољих пракси (enable_strict_mandatory_bps) искључен.
      Имена алата раздвојена запетама (нпр. ha_call_event,ha_eval_template).
  pinned_tools:
    name: Закачени алати (раздвојени запетама)
    description: Алати наведени овде су закључано закачени — појављују се на врху
      картице Алати и не могу се откачити из веб интерфејса Подешавања без претходног
      поништавања ове опције. Корисно у комбинацији са Претрагом алата. Имена алата
      раздвојена запетама.
  secret_path:
    name: Замена путање за тајне
    description: 'Опциона прилагођена HTTP путања за MCP сервер. Оставите празно да
      бисте користили аутоматски генерисану безбедну путању.

      '
