---
# GENERATED FILE — do not edit. Translations live in
# src/ha_mcp/settings_ui/locales/ko.json (keys addon.*, features.*, advanced.*,
# backup.fields.*, addon_stable.*); regenerate with: python scripts/generate_locales.py
configuration:
  verify_ssl:
    name: Verify TLS certificates
    description: 'Verify the Home Assistant server''s TLS certificate. Turn this off
      only on a trusted network, for a self-signed certificate or a hostname mismatch:
      it weakens transport security.'
  ha_tool_concurrency:
    name: Home Assistant 도구 동시성
    description: Optional limit on outer Home Assistant tool calls across all sessions.
      Internal REST, WebSocket, and per-tool fan-out concurrency is unchanged. 0 keeps
      unlimited behavior. A call waiting for capacity fails after 60 seconds. Range
      0–32.
  backup_hint:
    name: Backup hint level
    description: How strongly AI assistants are told to suggest a full Home Assistant
      backup before risky changes. It changes only this hint; automatic edit backups
      have their own setting.
  enable_tool_search:
    name: 도구 검색 사용
    description: '전체 도구 카탈로그 대신 검색 기반 탐색을 사용합니다. 대기 상태 컨텍스트를 약 90% 줄여 약 5K 토큰 수준으로
      낮춥니다. ⚠️ 자체 도구 검색이나 지연 로딩 도구 기능을 갖춘 클라이언트(claude.ai, Claude Desktop, Claude
      Code)에서는 켜지 마세요. 두 검색 계층이 충돌하며, 그런 환경에서는 클라이언트 내장 도구 검색이 더 낫습니다. 도구가 지연 로딩되는지는
      클라이언트와 모델 조합에 따라 다릅니다. 전체 카탈로그를 처음부터 모두 불러오는 환경(네이티브 지연 로딩 도구가 없는 모델(예: Gemini,
      OpenAI 호환 로컬 모델, Claude Haiku), 모델과 무관하게 모든 도구 스키마를 인라인으로 넣는 클라이언트(예: GitHub
      Copilot CLI), 컨텍스트 창이 작은 경우)에서 사용하세요. 일부 Codex 모델과 ChatGPT도 지연 로딩 도구를 지원하므로,
      불필요하게 켜 두지 않도록 사용 중인 클라이언트/모델의 기능을 직접 확인하세요. 도구는 ha_search_tools로 찾고 범주별 프록시(읽기/쓰기/삭제)를
      통해 실행됩니다. 적용하려면 앱(애드온)을 다시 시작한 뒤, AI 클라이언트에서 MCP 서버에 다시 연결하거나 새로 고쳐 도구 목록을 다시
      불러오게 하세요. 앱(애드온)만 다시 시작해서는 클라이언트에 캐시된 도구 목록이 갱신되지 않으며, 이는 여기의 어떤 설정을 바꾸든 마찬가지입니다.'
  tool_search_max_results:
    name: 도구 검색 최대 결과 수
    description: Maximum number of hidden tools returned per ha_search_tools call
      when tool search is enabled; a pinned tool that ranks inside that top count
      is added as a short name-only entry on top of it. Lower values (2-3) save context
      tokens but may miss relevant tools. Requires restart. Range 2–10.
  enable_tool_security_policies:
    name: 도구 보안 정책 사용(고급)
    description: 위험도가 높은 도구 호출(잠금·경보 제어, 자동화 쓰기 등)에 사용자 승인을 요구합니다. 보호된 도구가 호출되면 에이전트는
      사용자에게 웹 UI의 도구 보안 정책 탭을 열고 승인을 누르라고 안내하며, 그 후에야 호출이 진행됩니다. 인수 조건을 선택적으로 붙일 수
      있는 도구별 규칙은 도구 보안 정책 탭에서 설정합니다. 기본값은 꺼짐입니다. 적용하려면 다시 시작해야 합니다.
  enable_security_policy_tool:
    name: AI 에이전트가 도구 보안 정책을 편집하도록 허용
    description: ha_manage_security_policy 도구를 등록합니다. 이 도구를 통해 연결된 AI 에이전트가 도구 보안
      정책을 읽고 다시 쓸 수 있으며, 여기에는 승인 게이트를 제거하는 것도 포함됩니다. 기본값은 꺼짐입니다. 위의 도구 보안 정책 옵션과는
      별개로, 규칙이 적용되는지가 아니라 누가 규칙을 편집할 수 있는지를 결정합니다. 이 도구는 대기 중인 승인을 보거나 결정할 수 없습니다.
      사람이 개입하는 절차를 유지하려면 켜기 전에 먼저 이 도구를 게이팅하세요. 웹 UI의 도구 탭에서 보안 정책 관리 도구의 "보안 게이트"를
      켜면 됩니다. 적용하려면 다시 시작해야 합니다.
  read_only_mode:
    name: 읽기 전용 모드
    description: 모든 쓰기 도구를 끄고, 도구가 쓰기 또는 파괴적 호출을 하지 못하게 합니다. 읽기와 쓰기가 섞인 도구(백업, 앱(애드온),
      에너지 환경설정, 음성 파이프라인, 활성화된 경우 코드 모드)는 쓰기 작업만 차단된 채 계속 사용할 수 있습니다. 웹 UI 도구 탭의 토글과
      같은 설정입니다. 기본값은 꺼짐입니다. 적용하려면 다시 시작해야 합니다.
  redact_secrets:
    name: 비밀 정보 가리기
    description: 도구 응답이 AI 어시스턴트에 전달되기 전에 비밀 정보를 가립니다. 앱(애드온) 옵션과 통합 구성요소 필드 중 비밀번호로
      표시된 항목은 설정됨/비어 있음 표시로 대체되어 "이 자격 증명이 설정되어 있는가?"라는 질문에는 여전히 답할 수 있으며, 다른 도구 응답에서도
      서버가 이미 확인한 비밀 값이 제거됩니다(6자 미만인 값은 건너뜁니다. 짧은 조각을 치환하면 관련 없는 출력까지 망가지기 때문입니다).
      스키마에서 비밀번호로 표시하지 않은 필드는 감지할 수 없습니다. 기본값은 꺼짐입니다.
  enable_mandatory_bps:
    name: 쓰기 시 모범 사례 스킬 첨부
    description: '쓰기 도구 스킬 콘텐츠 전달 기능(이슈 #1182)의 마스터 스위치입니다. 켜져 있으면(기본값) 여섯 개의 설정 쓰기
      도구(자동화, 스크립트, 장면, 헬퍼, 대시보드, 원시 YAML)가 쓰기에 성공할 때마다 Home Assistant 표준 모범 사례 참조
      파일을 `skill_content`에 첨부하고, 모범 사례 경고가 인용한 참조 섹션도 자동으로 함께 넣습니다. 각 도구는 호출 단위 `MandatoryBPS`
      매개변수도 제공하므로, 에이전트가 콘텐츠를 확보한 뒤에는 이후 호출에서 false로 설정할 수 있습니다. 이 마스터 스위치가 꺼져 있으면
      호출 단위 매개변수나 모범 사례 경고와 관계없이 skill_content가 전혀 전달되지 않습니다. 켜 두는 것을 우선 권장하며, 컨텍스트
      창이 매우 작은 모델에서만 끄세요. 끄면 쓰기 정확도가 떨어질 수 있습니다. 적용하려면 다시 시작해야 합니다.'
  enable_strict_mandatory_bps:
    name: 엄격 모범 사례 모드
    description: 엄격 모드입니다. 클라이언트가 모범 사례를 읽었다는 것을 증명하기 전까지 도구를 사용하지 못하게 막습니다. 켜져 있는
      동안에는 모범 사례가 적용되는 여섯 개의 쓰기 도구(자동화, 스크립트, 장면, 헬퍼, 대시보드, 원시 YAML)가 차단되고, ha_get_skill_guide로
      모범 사례 스킬을 읽은 뒤 거기서 받은 확인 키를 다시 전달하라는 오류를 반환합니다. 또한 켜져 있는 동안 ha_get_skill_guide
      도구는 활성 상태로 잠깁니다. 확인 키를 발급하는 유일한 도구이기 때문입니다. 위의 "쓰기 시 모범 사례 스킬 첨부" 옵션의 하위 항목이며,
      상위 옵션이 꺼져 있으면 아무 효과가 없습니다. 적용하려면 다시 시작해야 합니다.
  enable_auto_backup:
    name: 편집 시 자동 백업
    description: Save a snapshot of an entity before each write or delete tool call
      changes it. While this is off, the file and raw-YAML tools (ha_write_file, ha_delete_file,
      ha_config_set_yaml) refuse to write.
  auto_backup_throttle_minutes:
    name: Auto-backup throttle (minutes)
    description: How often auto-backup may capture the same entity. 0 captures on
      every write; N above 0 captures at most one snapshot per N minutes per entity.
      Range 0–1440.
  auto_backup_retain_per_entity:
    name: Auto-backup retention (per entity)
    description: The most snapshots kept per entity. Each new capture removes the
      oldest snapshots above this number. Range 1–10000.
  enable_snapshot_actions:
    name: 전체 Home Assistant 스냅샷 작업 허용
    description: Allow AI assistants to manage full Home Assistant snapshots through
      ha_manage_backup and the equivalent backup services and commands in ha_call_service.
      Turning this off blocks every snapshot action, including listing. Snapshot deletion
      is only available through ha_manage_backup and also requires Allow snapshot
      deletion. Edit backups and the backup actions a person takes in the web settings
      UI remain available.
  backup_read_only:
    name: 백업 관리 읽기 전용으로 설정
    description: Allow AI assistants to list, view, and diff edit backups, and list
      full HA snapshots when snapshot actions are enabled. Block manual backup create,
      restore (including edit restores), and delete, including the equivalent backup
      services and commands in ha_call_service. Automatic pre-edit backups continue.
      The backup actions a person takes in the web settings UI remain available.
  enable_snapshot_delete:
    name: 스냅숏 삭제 허용
    description: Allow ha_manage_backup to delete full Home Assistant snapshots. A
      snapshot may be the last way back after a mistaken change, so a person must
      turn this on. Scheduled backups, the newest snapshot and snapshots younger than
      the minimum age stay protected.
  snapshot_delete_min_age_days:
    name: 삭제 가능한 최소 스냅숏 보관 기간(일)
    description: How old a snapshot must be, in days, before it can be deleted. 0
      turns off the age limit; the newest snapshot and scheduled backups stay protected.
      Range 0–365.
  disabled_tools:
    name: 비활성화할 도구(쉼표로 구분)
    description: '여기에 나열한 도구는 강제로 꺼지고 웹 설정 UI(도구 탭)에서 잠깁니다. 이 옵션을 먼저 해제하지 않으면 거기서
      다시 켤 수 없습니다. 소수의 필수 도구(ha_search, ha_get_overview, ha_get_state, ha_report_issue,
      ha_manage_backup)는 비활성화할 수 없으며 여기에 적어도 계속 동작합니다. ha_get_skill_guide는 엄격 모범 사례
      모드(enable_strict_mandatory_bps)가 꺼져 있을 때만 비활성화할 수 있습니다. 도구 이름을 쉼표로 구분해 입력하세요(예:
      ha_call_event,ha_eval_template).'
  pinned_tools:
    name: 고정할 도구(쉼표로 구분)
    description: 여기에 나열한 도구는 고정 상태로 잠깁니다. 도구 탭 맨 위에 표시되며, 이 옵션을 먼저 해제하지 않으면 웹 설정 UI에서
      고정을 해제할 수 없습니다. 도구 검색과 함께 쓰면 유용합니다. 도구 이름을 쉼표로 구분해 입력하세요.
  secret_path:
    name: 비밀 경로 재정의
    description: 'MCP 서버에 사용할 사용자 지정 HTTP 경로입니다(선택). 자동 생성된 안전한 경로를 쓰려면 비워 두세요.

      '
