---
# GENERATED FILE — do not edit. Translations live in
# src/ha_mcp/settings_ui/locales/az.json (keys addon.*, features.*, advanced.*,
# backup.fields.*, addon_stable.*); regenerate with: python scripts/generate_locales.py
configuration:
  verify_ssl:
    name: SSL sertifikatlarını yoxla
    description: TLS yoxlamasını yalnız etibarlı şəbəkələrdə söndürün. Yenidən başlatmaq
      tələb olunur.
  ha_tool_concurrency:
    name: Home Assistant alətlərinin paralel icrası
    description: Bütün sessiyalar üzrə Home Assistant alətlərinin üst səviyyəli çağırışlarının
      eyni vaxtda icrası üçün istəyə bağlı limit. Daxili REST, WebSocket və hər alətin
      daxilində şaxələnən çağırışların paralel icrası dəyişmir. 0 məhdudiyyətsiz davranışı
      saxlayır. İcra üçün boş yer gözləyən çağırış 60 saniyədən sonra uğursuz olur.
      Aralıq 0–32. Yenidən başlatmaq tələb olunur. Range 0–32.
  backup_hint:
    name: Ehtiyat nüsxə tövsiyəsinin səviyyəsi
    description: Riskli yazma əməliyyatlarından əvvəl HA-nın tam anlıq nüsxəsini yaratmaq
      üçün LLM-ə verilən tövsiyənin nə dərəcədə təkidli olmasını idarə edir.
  enable_tool_search:
    name: Alət axtarışını aktivləşdir
    description: 'Tam alət kataloqunu axtarış əsasında aşkarlama ilə əvəz edin. Boşdayanma
      zamanı kontekst həcmini təxminən 90% azaldaraq təqribən 5K tokenə endirir. ⚠️
      Öz daxili alət axtarışı / təxirə salınmış alətləri olan müştərilərdə (claude.ai,
      Claude Desktop, Claude Code) bunu aktivləşdirməyin — iki axtarış qatı toqquşur
      və həmin müştərilərdə daxili alət axtarışı daha yaxşı seçimdir; bunu deaktiv
      saxlayın. Alətlərin təxirə salınıb-salınmaması müştəri və model birləşməsindən
      asılıdır: quruluşunuz tam kataloqu əvvəlcədən yükləyirsə, bundan istifadə edin
      — təxirə salınmış alətləri özündə dəstəkləməyən modellər (məs. Gemini, OpenAI
      ilə uyğun lokal modellər, Claude Haiku), modeldən asılı olmayaraq bütün alət
      sxemlərini birbaşa kontekstə daxil edən müştərilər (məs. GitHub Copilot CLI)
      və ya daha kiçik kontekst pəncərələri üçün. Bəzi Codex modelləri və ChatGPT
      də təxirə salınmış alətləri dəstəkləyir — bu seçimi lazımsız yerə aktiv saxlamamaq
      üçün müştərinizin/modelinizin funksiyalarını birbaşa yoxlayın. Alətlər ha_search_tools
      vasitəsilə tapılır və kateqoriyalara ayrılmış proksilər (oxuma/yazma/silmə)
      vasitəsilə icra olunur. Qüvvəyə minməsi üçün tətbiqi (əlavəni) yenidən başlatmaq
      tələb olunur — sonra alət siyahısının yenidən yüklənməsi üçün AI müştərinizdə
      MCP serverinə yenidən qoşulun və ya onu yeniləyin. Təkcə tətbiqi (əlavəni) yenidən
      başlatmaq müştərinin keşindəki alət siyahısını yeniləmir; bu, buradakı istənilən
      parametr dəyişdirildikdən sonra keçərlidir.'
  tool_search_max_results:
    name: Alət axtarışında maksimum nəticə sayı
    description: 'Alət axtarışı aktiv olduqda hər ha_search_tools çağırışı üçün qaytarılan
      gizli alətlərin maksimum sayı; həmin yuxarı sayda yer alan bərkidilmiş alət
      onun üzərinə qısa yalnız ad daxiletməsi kimi əlavə edilir. Aşağı qiymətlər (2-3)
      kontekst tokenlərinə qənaət edir, lakin uyğun alətləri qaçıra bilər. Aralıq:
      2-10. Yenidən başladılmasını tələb edir. Range 2–10.'
  enable_tool_security_policies:
    name: Alətlərin təhlükəsizlik siyasətlərini aktivləşdir (qabaqcıl)
    description: Ciddi nəticələr doğura bilən alət çağırışları (kilid/siqnalizasiya
      idarəetməsi, avtomatlaşdırmaların yazılması və s.) üçün istifadəçi təsdiqi tələb
      edir. Qorunan alət çağırıldıqda agent istifadəçidən veb interfeysdə Alətlərin
      təhlükəsizlik siyasətləri bölməsini açmağı və çağırışın davam etməsi üçün Təsdiqlə
      düyməsinə basmağı istəyir. Hər alət üçün qaydalar və istəyə bağlı arqument şərtləri
      Alətlərin təhlükəsizlik siyasətləri bölməsində konfiqurasiya olunur. Standart
      olaraq deaktivdir. Qüvvəyə minməsi üçün yenidən başlatma tələb olunur.
  enable_security_policy_tool:
    name: AI agentlərinə alətlərin təhlükəsizlik siyasətlərini redaktə etməyə icazə
      ver
    description: 'Qoşulmuş AI agentlərinə alətlərin təhlükəsizlik siyasətlərini oxumağa
      və yenidən yazmağa imkan verən ha_manage_security_policy alətini qeydiyyata
      alır — bu, təsdiq tələblərinin çıxarılmasını da əhatə edir. Standart olaraq
      deaktivdir. Yuxarıdakı Alətlərin təhlükəsizlik siyasətləri seçimindən asılı
      deyil: bu seçim qaydaların tətbiq olunmasını deyil, onları kimin redaktə edə
      biləcəyini idarə edir. Alət gözləyən təsdiq sorğularını görə və ya onlar barədə
      qərar verə bilməz. İnsan nəzarətini saxlamaq üçün aləti aktivləşdirməzdən əvvəl
      ona təsdiq tələbi qoyun: veb interfeysin Alətlər vərəqində Təhlükəsizlik siyasətini
      idarə et aləti üçün "security gated" seçimini aktivləşdirin. Qüvvəyə minməsi
      üçün yenidən başlatmaq tələb olunur.'
  read_only_mode:
    name: Yalnız oxuma rejimi
    description: Bütün yazma alətlərini söndürür və alətlərin hər hansı yazma və ya
      dağıdıcı əməliyyat çağırışı etmə imkanını aradan qaldırır. Həm oxuma, həm də
      yazma funksiyası olan alətlər — ehtiyat nüsxələr, tətbiqlər (əlavələr), enerji
      tərcihləri, səs emalı ardıcıllıqları və aktiv olduqda kod rejimi — yazma əməliyyatları
      bloklanmaqla istifadəyə açıq qalır. Veb interfeysin Alətlər bölməsindəki seçimlə
      eynidir. Standart olaraq deaktivdir. Qüvvəyə minməsi üçün yenidən başlatma tələb
      olunur.
  redact_secrets:
    name: Məxfi məlumatları gizlət
    description: Alət cavabları AI köməkçisinə çatmazdan əvvəl onlardan məxfi məlumatları
      gizlədir. Parol kimi işarələnmiş tətbiq (əlavə) seçimləri və inteqrasiya sahələri
      təyin edilib/boş göstəricisi ilə əvəz olunur (beləliklə, "bu giriş məlumatı
      konfiqurasiya edilibmi?" sualını cavablandırmaq mümkün qalır), digər alət cavabları
      isə serverin artıq gördüyü məxfi dəyərlərdən təmizlənir (6 simvoldan qısa dəyərlər
      nəzərə alınmır, çünki kiçik fraqmentlərin əvəzlənməsi əlaqəsiz çıxışı korlayardı).
      Sxemdə parol kimi işarələnməyən sahələr aşkarlana bilmir. Standart olaraq deaktivdir.
  enable_mandatory_bps:
    name: Yazma zamanı ən yaxşı təcrübələr üzrə bacarıq təlimatlarını əlavə et
    description: 'Yazma alətlərinin bacarıq məzmunu təqdim etməsi funksiyası üçün
      əsas seçim (problem #1182). Aktiv olduqda (standart vəziyyət) altı konfiqurasiya
      yazma aləti (avtomatlaşdırmalar, skriptlər, səhnələr, köməkçilər, idarə panelləri,
      xam YAML) hər uğurlu yazmada Home Assistant üzrə ən yaxşı təcrübələrin əsas
      istinad fayllarını `skill_content` daxilində əlavə edir, həmçinin ən yaxşı təcrübə
      xəbərdarlıqlarında istinad edilən bölmələri avtomatik daxil edir. Hər alət həmçinin
      hər çağırış üçün `MandatoryBPS` parametri təqdim edir; agent məzmunu əldə etdikdən
      sonra sonrakı çağırışlarda bunu false edə bilər. Bu əsas seçim deaktiv olduqda
      çağırış parametrindən və ya BP xəbərdarlıqlarından asılı olmayaraq HEÇ BİR skill_content
      göndərilmir. İlk seçim kimi aktiv saxlanması tövsiyə olunur; yalnız çox kiçik
      kontekst pəncərələri olan modellər üçün söndürün. Bunun söndürülməsi yazma dəqiqliyini
      azalda bilər. Qüvvəyə minməsi üçün yenidən başlatma tələb olunur.'
  enable_strict_mandatory_bps:
    name: Ən yaxşı təcrübələrə ciddi riayət rejimi
    description: 'Ciddi rejim: müştəri ən yaxşı təcrübələri oxuduğunu sübut edənədək
      onun alətdən istifadəsinə mane olur. Aktiv olduqda ən yaxşı təcrübələrə əsaslanan
      altı yazma aləti (avtomatlaşdırmalar, skriptlər, səhnələr, köməkçilər, idarə
      panelləri, xam YAML) bloklanır və müştərini ha_get_skill_guide vasitəsilə ən
      yaxşı təcrübələr üzrə bacarıq təlimatını oxumağa və oradan aldığı təsdiq açarını
      geri ötürməyə yönəldən xəta qaytarır. Aktiv olduqda ha_get_skill_guide aləti
      aktiv vəziyyətdə kilidlənir — təsdiq açarını yalnız o təqdim edir. Yuxarıdakı
      "Attach best-practice skills on writes" seçiminə tabedir və həmin seçim deaktiv
      olduqda təsirsizdir. Qüvvəyə minməsi üçün yenidən başlatma tələb olunur.'
  enable_auto_backup:
    name: Redaktələr üçün avtomatik ehtiyat nüsxə yarat
    description: Avtomatik ehtiyat nüsxələmə ilə əhatə olunan hər yazma və ya dağıdıcı
      alət çağırışından əvvəl anlıq nüsxə yaradın.
  auto_backup_throttle_minutes:
    name: Tezlik məhdudiyyəti (dəqiqə)
    description: Hər obyekt üzrə tezlik məhdudiyyəti. 0 = hər yazmada; N > 0 = hər
      N dəqiqədə ən çox bir ehtiyat nüsxə. Aralıq 0–1440. Range 0–1440.
  auto_backup_retain_per_entity:
    name: Hər obyekt üçün saxlanılan nüsxə sayı
    description: Hər obyekt üçün saxlanılan anlıq nüsxələrin maksimum sayı (1–10000).
      Köhnələri növbə ilə silinir. Range 1–10000.
  enable_snapshot_actions:
    name: Allow full HA snapshot actions
    description: Allow AI assistants to manage full Home Assistant snapshots through
      ha_manage_backup and the equivalent backup services and commands in ha_call_service.
      Turning this off blocks every snapshot action, including listing. Snapshot deletion
      is only available through ha_manage_backup and also requires Allow snapshot
      deletion. Edit backups and the backup actions a person takes in the web settings
      UI remain available.
  backup_read_only:
    name: Make backup management read-only
    description: Allow AI assistants to list, view, and diff edit backups, and list
      full HA snapshots when snapshot actions are enabled. Block manual backup create,
      restore (including edit restores), and delete, including the equivalent backup
      services and commands in ha_call_service. Automatic pre-edit backups continue.
      The backup actions a person takes in the web settings UI remain available.
  enable_snapshot_delete:
    name: Anlıq nüsxələrin silinməsinə icazə ver
    description: Planlaşdırılmış, ən yeni və kifayət qədər köhnəlməmiş anlıq nüsxələrin
      qorunmasını saxlamaqla ha_manage_backup alətinə tam HA anlıq nüsxələrini silməyə
      icazə verin.
  snapshot_delete_min_age_days:
    name: Silmək üçün anlıq nüsxənin minimum yaşı (gün)
    description: Anlıq nüsxənin silinməsi üçün yaradılmasından ən azı bu qədər vaxt
      keçməlidir. Aralıq 0–365. Range 0–365.
  disabled_tools:
    name: Deaktiv alətlər (vergüllə ayrılmış)
    description: Burada sadalanan alətlər məcburi söndürülür və veb Parametrlər interfeysində
      (Alətlər vərəqində) kilidlənir — əvvəlcə bu seçimdəki təyinatı ləğv etmədən
      onları orada yenidən aktivləşdirmək mümkün deyil. Məcburi alətlərin kiçik bir
      qrupu (ha_search, ha_get_overview, ha_get_state, ha_report_issue, ha_manage_backup)
      söndürülə bilməz və burada sadalansa belə işləməyə davam edir. ha_get_skill_guide
      yalnız ən yaxşı təcrübələrə ciddi riayət rejimi (enable_strict_mandatory_bps)
      deaktiv olduqda söndürülə bilər. Vergüllə ayrılmış alət adları (məs. ha_call_event,ha_eval_template).
  pinned_tools:
    name: Sancaqlanmış alətlər (vergüllə ayrılmış)
    description: Burada sadalanan alətlər sancaqlanmış vəziyyətdə kilidlənir — Alətlər
      vərəqinin yuxarısında görünür və əvvəlcə bu seçimdəki təyinatı ləğv etmədən
      veb Parametrlər interfeysindən sancaqlarını çıxarmaq mümkün deyil. Alət axtarışı
      ilə birlikdə faydalıdır. Vergüllə ayrılmış alət adları.
  secret_path:
    name: Gizli yolun əvəzlənməsi
    description: 'MCP serveri üçün istəyə bağlı fərdi HTTP yolu. Avtomatik yaradılmış
      təhlükəsiz yoldan istifadə etmək üçün boş saxlayın.

      '
