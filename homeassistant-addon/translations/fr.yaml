---
# GENERATED FILE — do not edit. Translations live in
# src/ha_mcp/settings_ui/locales/fr.json (keys addon.*, features.*, advanced.*,
# backup.fields.*, addon_stable.*); regenerate with: python scripts/generate_locales.py
configuration:
  verify_ssl:
    name: Vérifier les certificats SSL
    description: Désactivez la vérification TLS uniquement sur les réseaux de confiance.
      Redémarrage requis.
  ha_tool_concurrency:
    name: Concurrence des outils Home Assistant
    description: Limite optionnelle sur les appels d'outils Home Assistant externes
      pour toutes les sessions. La concurrence interne pour REST, WebSocket et par
      outil reste inchangée. 0 conserve un comportement illimité. Un appel en attente
      de capacité échoue après 60 secondes. Plage de 0 à 32. Redémarrage requis. Range
      0–32.
  backup_hint:
    name: Niveau d'indication de sauvegarde
    description: Contrôle la force avec laquelle le LLM est invité à effectuer un
      instantané HA complet avant les écritures risquées.
  enable_tool_search:
    name: Activer la recherche d'outils
    description: 'Remplacer le catalogue complet d''outils par une découverte basée
      sur la recherche. Réduit le contexte inactif d''environ 90 %, à environ 5K jetons.
      ⚠️ N''activez PAS cette option dans les clients disposant de leur propre recherche
      d''outils intégrée / d''outils différés (claude.ai, Claude Desktop, Claude Code)
      — les deux couches de recherche entrent en conflit, et la recherche d''outils
      intégrée du client constitue le meilleur choix dans ce cas ; laissez cette option
      désactivée. Le fait que les outils soient différés dépend de votre association
      client et modèle : utilisez cette option lorsque votre configuration charge
      le catalogue complet au départ — modèles sans outils différés natifs (par ex.
      Gemini, modèles locaux compatibles OpenAI, Claude Haiku), clients qui intègrent
      tous les schémas d''outils quel que soit le modèle (par ex. GitHub Copilot CLI),
      ou fenêtres de contexte plus petites. Certains modèles Codex et ChatGPT incluent
      également des outils différés — vérifiez directement votre client/modèle pour
      confirmer ses fonctionnalités afin de ne pas laisser cette option activée inutilement.
      Les outils sont trouvés via ha_search_tools et exécutés via des proxys catégorisés
      (lecture/écriture/suppression). Nécessite un redémarrage de l''application (add-on)
      pour prendre effet — puis reconnectez ou actualisez le serveur MCP dans votre
      client IA afin qu''il recharge la liste des outils. Le seul redémarrage de l''application
      (add-on) ne met PAS à jour la liste des outils mise en cache par un client ;
      cela s''applique après la modification de n''importe quel paramètre ici.'
  tool_search_max_results:
    name: Résultats max. de la recherche d'outils
    description: 'Nombre maximal d''outils cachés renvoyés par appel ha_search_tools
      lorsque la recherche d''outils est activée ; un outil épinglé qui se classe
      dans ce nombre maximal est ajouté en tant qu''entrée courte avec uniquement
      le nom en plus. Des valeurs plus faibles (2-3) économisent des jetons de contexte
      mais peuvent manquer des outils pertinents. Plage : 2-10. Nécessite un redémarrage.
      Range 2–10.'
  enable_tool_security_policies:
    name: Activer les politiques de sécurité des outils (avancé)
    description: Contrôle les appels d'outils à enjeux élevés (contrôle des serrures/alarmes,
      écritures d'automatisations, etc.) derrière une approbation utilisateur. Lorsqu'un
      outil protégé est appelé, l'agent dit à l'utilisateur d'ouvrir l'onglet Politiques
      de sécurité des outils dans l'interface Web et de cliquer sur Approuver avant
      que l'appel ne continue. Les règles par outil avec conditions d'argument optionnelles
      sont configurées dans l'onglet Politiques de sécurité des outils. Désactivé
      par défaut. Nécessite un redémarrage pour prendre effet.
  enable_security_policy_tool:
    name: Permettre aux agents IA de modifier les politiques de sécurité des outils
    description: 'Enregistre l''outil ha_manage_security_policy, qui permet aux agents
      IA connectés de lire et de réécrire les politiques de sécurité des outils —
      y compris la suppression des portes d''approbation. Désactivé par défaut. Indépendant
      de l''option Politiques de sécurité des outils ci-dessus : ceci contrôle qui
      peut modifier les règles, et non si elles sont appliquées. L''outil ne peut
      pas voir ou décider des approbations en attente. Pour garder un humain dans
      la boucle, soumettez l''outil à une approbation avant de l''activer : activez
      « soumis à la sécurité » pour Gérer la politique de sécurité dans l''onglet
      Outils de l''interface web. Nécessite un redémarrage pour prendre effet.'
  read_only_mode:
    name: Mode lecture seule
    description: Désactive tous les outils d'écriture et supprime la capacité des
      outils d'effectuer des appels d'écriture ou destructifs. Les outils mixtes lecture/écriture
      — sauvegardes, applications (add-ons), préférences énergétiques, pipelines vocaux
      et mode code lorsqu'il est activé — restent disponibles avec leurs opérations
      d'écriture bloquées. Même interrupteur que l'onglet Outils de l'interface Web.
      Désactivé par défaut. Nécessite un redémarrage pour prendre effet.
  redact_secrets:
    name: Masquer les secrets
    description: Masque les secrets des réponses des outils avant qu'ils n'atteignent
      l'assistant IA. Les options de l'application (add-on) et les champs d'intégration
      marqués comme des mots de passe sont remplacés par un marqueur défini/vide (afin
      que la question "ce secret est-il configuré ?" puisse toujours recevoir une
      réponse), et les autres réponses des outils sont nettoyées des valeurs secrètes
      déjà vues par le serveur (les valeurs de moins de 6 caractères sont ignorées,
      car le remplacement de minuscules fragments corromprait des sorties sans rapport).
      Les champs non marqués comme mots de passe par leur schéma ne peuvent pas être
      détectés. Désactivé par défaut.
  enable_mandatory_bps:
    name: Attacher les compétences de bonnes pratiques aux écritures
    description: 'Interrupteur principal pour la fonction de livraison de contenu
      de compétences d''outils d''écriture (problème #1182). Lorsqu''il est activé
      (par défaut), les six outils d''écriture de configuration (automatisations,
      scripts, scènes, assistants, tableaux de bord, YAML brut) attachent les fichiers
      de référence canoniques des bonnes pratiques Home Assistant sous `skill_content`
      à chaque écriture réussie, plus l''intégration automatique de toutes les sections
      de référence citées par les avertissements de bonnes pratiques. Chaque outil
      expose également un paramètre `MandatoryBPS` par appel que l''agent peut définir
      sur false lors des appels suivants une fois qu''il a le contenu. Lorsque cet
      interrupteur principal est désactivé, AUCUN skill_content n''est émis, indépendamment
      du paramètre par appel ou des avertissements BP. Recommandé ACTIVÉ comme premier
      choix ; désactivez uniquement pour les modèles avec de très petites fenêtres
      de contexte. Désactiver ceci peut dégrader la précision des écritures. Nécessite
      un redémarrage pour prendre effet.'
  enable_strict_mandatory_bps:
    name: Mode strict de bonnes pratiques
    description: 'Mode strict : empêche le client d''utiliser l''outil jusqu''à ce
      qu''il puisse prouver qu''il a lu les bonnes pratiques. Lorsqu''il est activé,
      les six outils d''écriture de bonnes pratiques (automatisations, scripts, scènes,
      assistants, tableaux de bord, YAML brut) sont bloqués et renvoient une erreur
      dirigeant le client vers la compétence de bonnes pratiques via ha_get_skill_guide
      et lui demandant de renvoyer la clé d''accusé de réception obtenue. Lorsqu''il
      est activé, l''outil ha_get_skill_guide est verrouillé activé — il est le seul
      éditeur de la clé d''accusé de réception. Enfant de l''option « Attacher les
      compétences de bonnes pratiques aux écritures » ci-dessus et inerte lorsque
      ce parent est désactivé. Nécessite un redémarrage pour prendre effet.'
  enable_auto_backup:
    name: Sauvegardes automatiques des modifications
    description: Capture un instantané avant chaque appel d'outil d'écriture ou destructeur
      encapsulé.
  auto_backup_throttle_minutes:
    name: Limitation (minutes)
    description: Limitation par entité. 0 = chaque écriture ; N > 0 = au plus une
      sauvegarde par N minutes. Plage 0–1440. Range 0–1440.
  auto_backup_retain_per_entity:
    name: Conserver par entité
    description: Nombre maximum d'instantanés conservés par entité (1–10000). Les
      plus anciens sont retirés. Range 1–10000.
  enable_snapshot_actions:
    name: Autoriser les actions d'instantané complet de Home Assistant
    description: Permettre aux assistants IA de gérer les instantanés complets de
      Home Assistant via ha_manage_backup ainsi que les services et commandes de sauvegarde
      équivalents dans ha_call_service. Désactiver cette option bloque toutes les
      actions d'instantané, y compris le listage. La suppression d'instantanés n'est
      possible que via ha_manage_backup et nécessite également l'autorisation de suppression
      d'instantanés. Les modifications de sauvegardes et les actions humaines sur
      cette page restent disponibles.
  backup_read_only:
    name: Rendre la gestion des sauvegardes en lecture seule
    description: Permettre aux assistants IA de lister, d'afficher et de comparer
      les sauvegardes de modification, ainsi que de lister les instantanés complets
      de Home Assistant lorsque les actions d'instantané sont activées. Bloque la
      création, la restauration (y compris les restaurations de modification) et la
      suppression manuelles de sauvegardes, ainsi que les services et commandes de
      sauvegarde équivalents dans ha_call_service. Les sauvegardes automatiques avant
      modification continuent. Les actions humaines sur cette page restent disponibles.
  enable_snapshot_delete:
    name: Autoriser la suppression d'instantanés
    description: Permet à ha_manage_backup de supprimer les instantanés HA complets,
      tout en protégeant les instantanés planifiés, les plus récents et ceux trop
      récents.
  snapshot_delete_min_age_days:
    name: Âge minimum de l'instantané pour suppression (jours)
    description: Un instantané doit avoir au moins cet âge avant d'être supprimé.
      Plage 0–365. Range 0–365.
  disabled_tools:
    name: Outils désactivés (séparés par des virgules)
    description: Les outils listés ici sont forcément désactivés et verrouillés dans
      l'interface Web des paramètres (onglet Outils) — ils ne peuvent pas être réactivés
      là-bas sans d'abord supprimer cette option. Un petit ensemble d'outils obligatoires
      (ha_search, ha_get_overview, ha_get_state, ha_report_issue, ha_manage_backup)
      ne peut pas être désactivé et continue de fonctionner même s'il est listé ici.
      ha_get_skill_guide ne peut être désactivé que lorsque le mode strict de bonnes
      pratiques (enable_strict_mandatory_bps) est désactivé. Noms d'outils séparés
      par des virgules (p. ex. ha_call_event,ha_eval_template).
  pinned_tools:
    name: Outils épinglés (séparés par des virgules)
    description: Les outils listés ici sont verrouillés épinglés — ils apparaissent
      en haut de l'onglet Outils et ne peuvent pas être retirés de l'interface Web
      des paramètres sans d'abord supprimer cette option. Utile en combinaison avec
      la recherche d'outils. Noms d'outils séparés par des virgules.
  secret_path:
    name: Remplacement du chemin secret
    description: 'Chemin HTTP personnalisé optionnel pour le serveur MCP. Laissez
      vide pour utiliser le chemin sécurisé généré automatiquement.

      '
