---
# GENERATED FILE — do not edit. Translations live in
# src/ha_mcp/settings_ui/locales/es.json (keys addon.*, features.*,
# addon_stable.*); regenerate with: python scripts/generate_locales.py
configuration:
  backup_hint:
    name: Nivel de sugerencia de instantánea completa de HA (para el LLM)
    description: 'Ajusta la redacción de la indicación que el LLM ve en la descripción
      de la

      herramienta `ha_manage_backup(scope=''snapshot'')` sobre cuándo sugerir una

      copia de seguridad completa de Home Assistant antes de operaciones

      arriesgadas (p. ej. borrados masivos de dispositivos). Afecta ÚNICAMENTE a

      esa frase dirigida al LLM.


      Para instantáneas automáticas por edición de automatizaciones / scripts /

      auxiliares / etc., usa la opción independiente **Activar copia de

      seguridad automática de las ediciones** que aparece más abajo.'
  secret_path:
    name: Ruta secreta personalizada
    description: 'Ruta HTTP personalizada opcional para el servidor MCP. Déjala vacía
      para usar la ruta segura generada automáticamente.

      '
  enable_tool_search:
    name: Activar la búsqueda de herramientas
    description: 'Reemplaza el catálogo completo de herramientas por un descubrimiento
      basado en búsquedas. Reduce el contexto inactivo en aproximadamente un 90 %,
      a unos 5K tokens. ⚠️ NO habilites esto en clientes que tengan su propia búsqueda
      de herramientas integrada / herramientas diferidas (claude.ai, Claude Desktop,
      Claude Code); ambas capas de búsqueda entran en conflicto y la búsqueda de herramientas
      integrada del cliente es la mejor opción en ese caso; déjalo desactivado. El
      hecho de que las herramientas se diferieran depende de tu combinación de cliente
      y modelo: úsalo cuando tu configuración cargue el catálogo completo de entrada
      (modelos sin herramientas diferidas nativas, por ejemplo, Gemini, modelos locales
      compatibles con OpenAI, Claude Haiku), clientes que insertan todos los esquemas
      de herramientas sin importar el modelo (por ejemplo, GitHub Copilot CLI), o
      ventanas de contexto más pequeñas. Algunos modelos de Codex y ChatGPT también
      incluyen herramientas diferidas; comprueba directamente tu cliente/modelo para
      confirmar sus características y no dejar esto habilitado innecesariamente. Las
      herramientas se encuentran mediante ha_search_tools y se ejecutan a través de
      proxies categorizados (lectura/escritura/eliminación). Requiere reiniciar la
      app (add-on) para que surta efecto; a continuación, reconecta o actualiza el
      servidor MCP en tu cliente de IA para que recargue la lista de herramientas.
      Reiniciar solo la app (add-on) NO actualiza la lista de herramientas almacenada
      en caché del cliente; esto se aplica después de cambiar cualquier configuración
      aquí.'
  tool_search_max_results:
    name: Máximo de resultados de la búsqueda de herramientas
    description: 'Número máximo de herramientas que devuelve ha_search_tools cuando
      la búsqueda de herramientas está activada. Los valores bajos (2-3) ahorran tokens
      de contexto pero pueden dejar fuera herramientas relevantes. Rango: 2-10. Requiere
      reiniciar.'
  enable_tool_security_policies:
    name: Activar las políticas de seguridad de herramientas (avanzado)
    description: Somete a aprobación del usuario las llamadas a herramientas de alto
      riesgo (control de cerraduras y alarmas, escritura de automatizaciones, etc.).
      Cuando se llama a una herramienta protegida, el agente indica al usuario que
      abra la pestaña Políticas de seguridad de herramientas en la interfaz web y
      pulse Aprobar antes de que la llamada continúe. Las reglas por herramienta,
      con condiciones opcionales sobre los argumentos, se configuran en esa misma
      pestaña. Desactivado de forma predeterminada. Requiere reiniciar para que surta
      efecto.
  enable_security_policy_tool:
    name: Permitir que los agentes de IA editen las políticas de seguridad de la herramienta
    description: 'Registra la herramienta ha_manage_security_policy, que permite a
      los agentes de IA conectados leer y reescribir las políticas de seguridad de
      la herramienta — incluyendo la eliminación de las puertas de aprobación. Desactivado
      por defecto. Independiente de la opción Políticas de seguridad de la herramienta
      de arriba: esto controla quién puede editar las reglas, no si se aplican. La
      herramienta no puede ver ni decidir aprobaciones pendientes. Para mantener a
      un humano en el bucle, protege la herramienta antes de habilitarla: activa "security
      gated" para Manage Security Policy en la pestaña Herramientas de la interfaz
      de usuario web. Requiere un reinicio para que surta efecto.'
  read_only_mode:
    name: Modo de solo lectura
    description: Desactiva todas las herramientas de escritura y elimina la capacidad
      de las herramientas para realizar llamadas de escritura o destructivas. Las
      herramientas mixtas de lectura/escritura (copias de seguridad, Apps (add-ons),
      preferencias de energía, canales de voz y el modo de código cuando está habilitado)
      siguen estando disponibles con sus operaciones de escritura bloqueadas. Es el
      mismo conmutador que en la pestaña Tools de la interfaz web. Desactivado por
      defecto. Requiere reiniciar para que surta efecto.
  redact_secrets:
    name: Redactar secretos
    description: Elimina información confidencial de las respuestas de las herramientas
      antes de que lleguen al asistente de IA. Las opciones de la app (add-on) y los
      campos de integración marcados como contraseñas se reemplazan por un marcador
      de establecido/vacío (para que "¿está esta credencial configurada?" siga teniendo
      respuesta), y las respuestas de otras herramientas se depuran de valores secretos
      que el servidor ya ha visto (se omiten los valores de menos de 6 caracteres,
      ya que reemplazar fragmentos diminutos corrompería resultados no relacionados).
      Los campos no marcados como contraseñas por su esquema no se pueden detectar.
      Desactivado por defecto.
  enable_mandatory_bps:
    name: Adjuntar skills de buenas prácticas en las escrituras
    description: 'Interruptor principal de la entrega de contenido de skills en las
      herramientas de escritura (issue #1182). Cuando está activado (predeterminado),
      las seis herramientas de escritura de configuración (automatizaciones, scripts,
      escenas, auxiliares, paneles, YAML en bruto) adjuntan los archivos de referencia
      canónicos de buenas prácticas de Home Assistant en `skill_content` tras cada
      escritura correcta, y además incrustan automáticamente las secciones de referencia
      citadas por los avisos de buenas prácticas. Cada herramienta expone también
      un parámetro `MandatoryBPS` por llamada que el agente puede poner a false en
      llamadas posteriores una vez que tiene el contenido. Con este interruptor principal
      desactivado NO se envía ningún skill_content, independientemente del parámetro
      por llamada o de los avisos de buenas prácticas. Se recomienda dejarlo activado;
      desactívalo solo para modelos con ventanas de contexto muy pequeñas. Desactivarlo
      puede degradar la precisión de las escrituras. Requiere reiniciar para que surta
      efecto.'
  enable_strict_mandatory_bps:
    name: Modo estricto de buenas prácticas
    description: 'Modo estricto: impide que el cliente use la herramienta hasta que
      pueda demostrar que ha leído las buenas prácticas. Mientras está activo, las
      seis herramientas de escritura sujetas a buenas prácticas (automatizaciones,
      scripts, escenas, auxiliares, paneles, YAML en bruto) quedan bloqueadas y devuelven
      un error que indica al cliente que lea la skill de buenas prácticas mediante
      ha_get_skill_guide y devuelva la clave de confirmación que obtiene allí. Mientras
      está activo, la herramienta ha_get_skill_guide queda forzada como activada:
      es la única que publica esa clave de confirmación. Depende de la opción "Adjuntar
      skills de buenas prácticas en las escrituras" de arriba y es inerte mientras
      esa opción principal esté desactivada. Requiere reiniciar para que surta efecto.'
  ha_tool_concurrency:
    name: Home Assistant request concurrency
    description: Maximum concurrent tool workloads and requests sent to Home Assistant
      across all sessions. Keep at 1 on resource-constrained systems.
  disabled_tools:
    name: Herramientas desactivadas (separadas por comas)
    description: 'Las herramientas indicadas aquí quedan forzadas a desactivadas y
      bloqueadas en la interfaz web de ajustes (pestaña Herramientas): no se pueden
      volver a activar allí sin quitar antes esta opción. Un pequeño conjunto de herramientas
      obligatorias (ha_search, ha_get_overview, ha_get_state, ha_report_issue, ha_manage_backup)
      no se puede desactivar y sigue funcionando aunque se indique aquí. ha_get_skill_guide
      solo se puede desactivar mientras el modo estricto de buenas prácticas (enable_strict_mandatory_bps)
      esté desactivado. Nombres de herramientas separados por comas (p. ej. ha_call_event,ha_eval_template).'
  pinned_tools:
    name: Herramientas fijadas (separadas por comas)
    description: 'Las herramientas indicadas aquí quedan fijadas de forma bloqueada:
      aparecen en la parte superior de la pestaña Herramientas y no se pueden desfijar
      desde la interfaz web de ajustes sin quitar antes esta opción. Resulta útil
      en combinación con la búsqueda de herramientas. Nombres de herramientas separados
      por comas.'
  enable_auto_backup:
    name: Activar copia de seguridad automática de las ediciones
    description: 'Captura una instantánea por entidad antes de cada llamada envuelta
      de herramienta MCP de escritura/destructiva (automatización, script, escena,
      asistente, panel, recurso de panel, etiqueta, categoría, grupo, zona, área,
      calendario, tarea, entidad, dispositivo, integración y herramientas de eliminación/borrado
      de elementos relacionados). El límite de frecuencia de la copia de seguridad
      automática establece la frecuencia con la que esto ocurre: 0 (predeterminado)
      captura en cada llamada de este tipo, N>0 como máximo una instantánea cada N
      minutos por entidad. Las instantáneas se guardan como archivos YAML en /data/ha_mcp_backups/
      (anular mediante HAMCP_BACKUP_DIR) y se listan, restauran o eliminan a través
      de la pestaña "Copias de seguridad" en la interfaz de usuario de configuración
      web o mediante ha_manage_backup(scope=''edits'', ...). Para esos dominios, la
      captura es de "mejor esfuerzo" — un fallo registra una ADVERTENCIA y la escritura
      procede. Las herramientas de archivo y YAML sin procesar son la excepción: ha_write_file,
      ha_delete_file y ha_config_set_yaml tratan la instantánea como una condición
      previa, por lo que una escritura a través de ellas se rechaza mientras esto
      está desactivado, y una captura fallida la bloquea. Activado por defecto; desmarcar
      desactiva las capturas de "mejor esfuerzo" y deja fuera de servicio las herramientas
      de archivo y YAML sin procesar con ellas. Requiere un reinicio para que surta
      efecto.'
  auto_backup_throttle_minutes:
    name: Limitación de la copia automática (minutos)
    description: Ventana de limitación por entidad. 0 (predeterminado) captura una
      instantánea en cada escritura cubierta. N>0 captura como mucho una instantánea
      cada N minutos por entidad. Rango 0–1440.
  auto_backup_retain_per_entity:
    name: Retención de copias automáticas (por entidad)
    description: Número máximo de instantáneas conservadas por entidad. Las instantáneas
      más antiguas que superen este límite se rotan en cada captura correcta. Predeterminado
      100, rango 1–10000.
  enable_snapshot_delete:
    name: Permitir la eliminación de instantáneas
    description: 'Permite que ha_manage_backup elimine archivos tarball de instantáneas
      completas de HA (scope=''snapshot'', action=''delete''). Desactivado de forma
      predeterminada: una instantánea puede ser el último punto de recuperación tras
      un cambio equivocado, así que una persona debe autorizarlo aquí expresamente.
      Incluso estando activado, las copias de seguridad programadas, la instantánea
      más reciente que quede y todo lo más nuevo que el mínimo de antigüedad de abajo
      siguen protegidos.'
  snapshot_delete_min_age_days:
    name: Antigüedad mínima de la instantánea para eliminarla (días)
    description: Una instantánea debe tener al menos esta antigüedad para poder eliminarse.
      Rango 0–365; 0 desactiva el mínimo (las protecciones de la instantánea más reciente
      y de las copias programadas siguen aplicándose). Predeterminado 7.
  verify_ssl:
    name: Verificar el certificado TLS
    description: Verifica el certificado TLS del servidor de Home Assistant. La app
      (add-on) se conecta a través del proxy del Supervisor, por lo que normalmente
      esto no tiene efecto y debe permanecer habilitado. Desactívalo solo si has reconfigurado
      la app (add-on) para comunicarse con HA a través de un nombre de host HTTPS
      público con un certificado autofirmado o un error de coincidencia en el nombre
      de host. Desactivarlo debilita la seguridad del transporte; déjalo activado
      a menos que sepas que lo necesitas. Requiere reiniciar para aplicar los cambios.
