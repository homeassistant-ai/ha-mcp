      with a set/empty marker (so "is this credential configured?" stays answerable),
      and other tool responses are scrubbed of secret values the server has already
      seen (values shorter than 6 characters are skipped, since replacing tiny fragments
      would corrupt unrelated output). Fields not marked as passwords by their schema
      cannot be detected. Off by default.
