---
configuration:
  backup_hint:
    name: HA naQ snapshot chupmeH pat (LLM-vaD)
    description: |-
      Qobbogh mIw qaSpa' Home Assistant tarball backup naQ chupmeH
      `ha_manage_backup(scope='snapshot')` jan DelmeH ghItlhDaq LLMvaD
      'anglu'bogh qeS mu'mey choH. chovnatlh janmey law' teqmeH mIw.
      LLM-vaD QInvam wa' neH SIgh.

      automation / script / helper / latlh choH Hoch qaSpa' nuv
      vangnISbe'taHvIS snapshot chenmoHmeH, bIngDaq **choHmey
      auto-backup yIQotlhHa'** DuH pIm yIlo'.
  secret_path:
    name: pegh He le'
    description: |
      MCP turwI'vaD HTTP He le' wIvlaHlu'. chIm yIpol; vaj He pegh chenmoH pat.
  enable_tool_search:
    name: janmey nejwI' yIQotlhHa'
    description: >-
      janmey naQ qa'meH nejlu'taHvIS tu'lu'bogh janmey neH 'ang.
      lo'be'lu'taHvIS context 46K tokenvo' 5K tokenDaq machmoH.
      ⚠️ Claude Sonnet Opus ghap Dalo'chugh, yIchu'Qo' — jan nejmeH
      pat / deferred tools luqeng modelmeyvetlh, 'ej patmaj nIS.
      Claude tlhej ha-mcp jan nej Dalo'meH, wa'DIch Claude jan nej
      pat yIchu'Ha'; pagh yIchu'Ha'taH. native deferred tools
      ghajbe'bogh LLMmey (chovnatlh Claude Haiku, SumDaq Qapbogh
      OpenAI-compatible models) ghap context Qorwagh mach ghajbogh
      LLMmey neHvaD yIlo'. ha_search_tools vegh janmey tu'lu',
      'ej laD/ghItlh/teq proxy Seghmey vegh lo'lu'. QapchoHmeH
      add-on Dataghqa'moHnIS — ghIq jan tetlh chu' laDmeH AI nIqHomlIjDaq
      MCP turwI' yIrarqa' pagh AI nIqHomlIj jan tetlh yIlaDqa'.
      add-on neH Dataghqa'moHchugh, AI nIqHom jan tetlh ngeqlu'bogh
      chu'moHbe'lu'; naDev DuH Hoch DachoHta'DI'
      mIwvam yIqaSmoH.
  enable_tool_security_policies:
    name: jan Hung chutmey tIQotlhHa' ('Itlh)
    description: >-
      jan Qob lo'lu'DI' (ngaQ/alarm SeH, automation ghItlh, latlh)
      lo'wI' chaw' poQmoH. jan Hunglu'bogh lo'DI', agent jatlh:
      web UI-Daq jan Hung chutmey jIH yIpoS 'ej QaptaHmeH lajmeH
      leQ yIwIv. jan HochvaD chutmey, argument wanI'mey wIvlaHbogh je
      jan Hung chutmey jIHDaq cherlu'. motlh chu'Ha'lu'. QapchoHmeH
      add-on Dataghqa'moHnIS.
  read_only_mode:
    name: laDlaH neH mIw
    description: >-
      jan ghItlh Hoch chu'Ha', 'ej janmeyvaD ghItlhmeH Qaw'meH je
      Qum chaw' teq. laD/ghItlh mIwmey ghajbogh janmey (backups,
      add-ons, energy DuHmey, ghogh pipelines, code mode chu'lu'chugh
      je) tu'lu'taH, 'ach ghItlh mIwmey botlu'. web UI janmey jIHDaq
      rap leQ. motlh chu'Ha'lu'. QapchoHmeH add-on Dataghqa'moHnIS.
  enable_mandatory_bps:
    name: ghItlhDI' mIw nIvmey yIchel
    description: >-
      jan ghItlh laH De' nobmeH pat wa'DIch SeH (issue #1182).
      chu'lu'chugh (motlh), config ghItlh janmey jav
      (automations, scripts, scenes, helpers, dashboards, YAML raw)
      ghItlh Qap HochDaq `skill_content` bIngDaq Home Assistant
      mIw QaQ paq teywI'mey motlh chel; mIw QaQ ghuHmey
      bopbogh paq 'ay'mey Hoch chel je. Hoch janDaq
      `MandatoryBPS` parameter tu'lu'; De' laDta'DI' agent,
      ghIq jan rI'DI' false wIvlaH. wa'DIch leQvam
      chu'Ha'lu'chugh, skill_content noblu'be'chu', per-call
      parameter BP ghuHmey ghap ram. wa'DIch wIv'e' ON chuplu';
      context Qorwagh machqu' ghajbogh modelvaD neH yIchu'Ha'.
      leQvam chu'Ha'lu'chugh, ghItlhlu'DI' Qagh law' qaSlaH. QapchoHmeH add-on
      Dataghqa'moHnIS.
  enable_strict_mandatory_bps:
    name: mIw QaQ pabmeH mIw tlhoy
    description: >-
      mIw tlhoy: mIw QaQ laDta' 'e' tobmeH AI nIqHom poQ; tobpa'
      jan lo'laHbe'. chu'lu'taHvIS, mIw QaQ ghItlh janmey jav
      (automations, scripts, scenes, helpers, dashboards, YAML raw)
      botlu', 'ej Qagh QIn agentvaD jatlh: ha_get_skill_guide vegh
      mIw QaQ skill yIlaD, 'ej pa' Suqbogh lajta'ghach ngoq
      yInobqa'. chu'lu'taHvIS, ha_get_skill_guide chu'taH net
      poQ — lajta'ghach ngoq neH 'ang janvam. DungDaq
      "ghItlhDI' mIw nIvmey yIchel" DuH puq 'oH, 'ej DuHvetlh
      chu'Ha'lu'chugh Qapbe'. QapchoHmeH add-on Dataghqa'moHnIS.
  enable_auto_backup:
    name: choHmey auto-backup yIQotlhHa'
    description: >-
      MCP jan ghItlh/Qaw' Hoch qaSpa' Dol snapshot pol
      (automation, script, scene, helper, dashboard, label, category,
      group, zone, area, calendar, todo, Dol, integration, latlh
      teq/polHa' janmey je). /data/ha_mcp_backups/ bIngDaq YAML
      teywI'pu' snapshotmey pollu' (HAMCP_BACKUP_DIR vegh qa'laH),
      'ej web DuHmey UI Backups jIHDaq pagh
      ha_manage_backup(scope='edits', ...) vegh tetlhlu',
      polqa'lu', Qaw'lu' ghap. nID neH — Qagh QonoSDaq ghuH
      ghItlhlu', 'ach mIw ghItlh botbe'. motlh chu'lu';
      wIvHa'meH yIwIvHa'. QapchoHmeH add-on Dataghqa'moHnIS.
  auto_backup_throttle_minutes:
    name: auto-backup poH veH (tup)
    description: >-
      Dol HochvaD poH veH. 0 (motlh) wIvlu'chugh, ghItlh
      Hoch qaSpa' snapshot chenmoH. N>0 wIvlu'chugh, Hoch N tupDaq
      Dol HochvaD wa' snapshot neH chenmoH. veH 0–1440.
  auto_backup_retain_per_entity:
    name: auto-backup polmeH mI' (Dol Hoch)
    description: >-
      Dol HochvaD snapshotmey polbogh mI' jenqu'. Hoch
      polta'ghach QapDI', snapshotmey ngo' veH juSbogh Qaw'lu'.
      motlh 100; veH 1–10000.
  enable_snapshot_delete:
    name: snapshot Qaw'meH chaw' yInob
    description: >-
      HA snapshot tarballmey naQ Qaw'laH ha_manage_backup
      (scope='snapshot', action='delete'). motlh chu'Ha'lu' —
      choH muj qaSpu'DI' cheghmeH snapshot Qav 'oHlaH, vaj naDev
      nuv wIv poQlu'. chu'lu'chugh je, backups nablu'bogh,
      snapshot chu'qu' ratlhbogh. bIngDaq ngo' veH tu'lu';
      snapshot ngo'be'chugh Qaw'laHbe'lu'.
  snapshot_delete_min_age_days:
    name: snapshot Qaw'meH ngo' veH (jaj)
    description: >-
      snapshot Qaw'laHlu'pa' ngo'nIS. veH 0–365; 0 wIvlu'chugh
      veH chu'Ha' (snapshot chu'qu' backups nablu'bogh je HungtaH).
      motlh 7.
  verify_ssl:
    name: TLS certificate yI'ol
    description: >-
      Home Assistant turwI' TLS certificate lugh 'e' yI'ol.
      Supervisor proxy vegh rar add-on, vaj motlh pagh choH.
      add-on Dacherqa'ta' 'ej HochvaD poSbogh HTTPS hostname, nIteb
      'ollu'bogh certificate, pagh hostname muj lo'chugh neH yIchu'Ha'.
      chu'Ha'lu'chugh Qum Hung pujmoH — poQbe'chugh yIchu'taH.
      QapchoHmeH add-on Dataghqa'moHnIS.
  tool_search_max_results:
    name: jan nej mI' jenqu'
    description: >-
      jan nej chu'lu'taHvIS ha_search_tools nobbogh janmey mI'
      jenqu'. mI' mach (2-3) wIvlu'chugh context tokenmey pol,
      'ach janmey lI' 'op leghbe'laH. veH 2-10. QapchoHmeH
      add-on Dataghqa'moHnIS.
  disabled_tools:
    name: janmey luQotlhlu'bogh (comma-mey)
    description: >-
      naDev lutetlhlu'bogh janmey luchu'Ha'lu' 'ej web DuHmey UI
      (janmey jIH)Daq ngaQ — naDev DuH teqbe'lu'pa' pa'
      luchu'qa'laHbe'lu'. janmey lupoQlu'bogh mach
      (ha_search, ha_get_overview, ha_get_state, ha_report_issue,
      ha_manage_backup) luchu'Ha'laHbe'lu', 'ej naDev lutetlhlu'chugh
      je QaptaH. mIw QaQ tlhoy
      (enable_strict_mandatory_bps) chu'Ha'lu'taHvIS neH
      ha_get_skill_guide chu'Ha'laHlu'. comma-mey lo'ta' jan
      pongmey tIghItlh (chovnatlh ha_call_event,ha_eval_template).
  pinned_tools:
    name: janmey lungu'lu'bogh (comma-mey)
    description: >-
      naDev lutetlhlu'bogh janmey luwIvlu' 'ej ngaQ — janmey jIH
      DungDaq lu'anglu', 'ej web DuHmey UI-Daq DuHvam
      teqbe'lu'pa' luwIvHa'laHbe'lu'. jan nej pat tlhej lo'lu'DI'
      lI'. comma-mey lo'ta' jan pongmey tIghItlh.
