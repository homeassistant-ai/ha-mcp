---
# GENERATED FILE — do not edit. Translations live in
# src/ha_mcp/settings_ui/locales/zh-Hans.json (keys addon.*, features.*, advanced.*,
# backup.fields.*, addon_stable.*); regenerate with: python scripts/generate_locales.py
configuration:
  verify_ssl:
    name: 验证 TLS 证书
    description: 验证 Home Assistant 服务器的 TLS 证书。仅在受信任的网络上、针对自签名证书或主机名不匹配的情况关闭此选项：这会削弱传输安全性。
  ha_tool_concurrency:
    name: Home Assistant 工具并发数
    description: 跨所有会话的外部 Home Assistant 工具调用的可选限制。内部 REST、WebSocket 和每个工具的分发并发性保持不变。0
      表示保持无限制行为。等待容量的调用将在 60 秒后失败。 范围 0–32。
  backup_hint:
    name: 备份提示级别
    description: 向 AI 助手提示在进行有风险的更改之前建议进行完整 Home Assistant 备份的强烈程度。它仅更改此提示；自动编辑备份有其自己的设置。
  enable_tool_search:
    name: 启用工具搜索
    description: 将完整的工具目录替换为基于搜索的发现。可将空闲上下文减少约 90%，至大约 5K 个 token。⚠️ 请勿在具有内置工具搜索/延迟工具功能的客户端（claude.ai、Claude
      Desktop、Claude Code）中启用此功能 — 两个搜索层会发生冲突，而客户端的内置工具搜索在此类情况下是更好的选择；请将其关闭。工具是否延迟加载取决于您的客户端和模型组合：在您的设置会预先加载完整目录时使用此功能
      — 不支持原生延迟工具的模型（例如 Gemini、OpenAI 兼容的本地模型、Claude Haiku）、无论模型如何都内联所有工具架构的客户端（例如
      GitHub Copilot CLI），或较小的上下文窗口。某些 Codex 模型和 ChatGPT 也包含延迟工具 — 请直接检查您的客户端/模型以确认其功能，以免不必要地启用此功能。通过
      ha_search_tools 查找工具，并通过分类代理（读/写/删除）执行。需要重启应用（add-on）才能生效 — 然后在您的 AI 客户端中重新连接或刷新
      MCP 服务器以重新加载工具列表。仅重启应用（add-on）并不会刷新客户端缓存的工具列表；这在更改此处的任何设置后适用。
  tool_search_max_results:
    name: 工具搜索最大结果数
    description: 启用工具搜索时，每次 ha_search_tools 调用返回的隐藏工具的最大数量；排名前列的置顶工具将作为仅包含名称的条目额外添加在上方。较低的值（2-3）可节省上下文
      Token，但可能会遗漏相关工具。需要重启。 范围 2–10。
  enable_tool_security_policies:
    name: 启用工具安全策略（高级）
    description: 将高风险工具调用（锁具/报警控制、自动化写入等）置于用户审批之后。当调用受保护工具时，智能体会提示用户打开 Web UI 中的工具安全策略选项卡并点击批准，调用才会继续。逐工具规则及可选的参数条件在工具安全策略选项卡中配置。默认关闭。需要重启才能生效。
  enable_security_policy_tool:
    name: 允许 AI 代理编辑工具安全策略
    description: 注册 ha_manage_security_policy 工具，该工具允许连接的 AI 代理读取和重写工具安全策略 — 包括移除批准门。默认关闭。独立于上面的“工具安全策略”选项：这控制的是谁可以编辑规则，而不是规则是否被强制执行。该工具无法查看或决定待批准项。为了保持人工参与，请在启用该工具之前对其进行门控：在
      Web UI 的“工具”标签页中，为“Manage Security Policy”打开“security gated”选项。需要重启才能生效。
  read_only_mode:
    name: 只读模式
    description: 关闭所有写入工具，并移除工具执行任何写入或破坏性调用的能力。混合读写工具（备份、应用（附加组件）、能源偏好设置、语音管道，以及启用时的代码模式）在保持可用的同时，其写入操作会被阻止。与网页端
      UI 的“工具”标签页使用相同的开关。默认关闭。需要重启才能生效。
  redact_secrets:
    name: 遮盖密文
    description: 在工具响应到达 AI 助手之前，对其机密信息进行红线遮掩（脱敏）。应用（附加组件）选项和标记为密码的集成字段将被替换为已设置/空标记（以便“此凭据是否已配置？”保持可回答状态），并且其他工具响应将被清除服务器已见过的机密值（长度小于
      6 个字符的值将被跳过，因为替换微小的片段会破坏不相关的输出）。其架构未标记为密码的字段无法被检测到。默认关闭。
  enable_mandatory_bps:
    name: 写入时附加最佳实践技能
    description: '写入工具技能内容投递功能（issue #1182）的主开关。启用时（默认），六个配置写入工具（自动化、脚本、场景、辅助元素、仪表盘、原始
      YAML）会在每次成功写入时于 `skill_content` 下附加规范的 Home Assistant 最佳实践参考文件，并自动嵌入最佳实践警告引用的任何参考章节。每个工具还暴露一个逐调用
      `MandatoryBPS` 参数，智能体在获得内容后的后续调用中可将其设为 false。当此主开关关闭时，无论逐调用参数或 BP 警告如何，都不会输出
      skill_content。建议默认开启；仅在上下文窗口极小的模型上才禁用。关闭可能降低写入准确性。需要重启才能生效。'
  enable_strict_mandatory_bps:
    name: 严格最佳实践模式
    description: 严格模式：在客户端能证明已阅读最佳实践之前，阻止其使用该工具。开启时，六个最佳实践写入工具（自动化、脚本、场景、辅助元素、仪表盘、原始
      YAML）会被阻止并返回错误，指引客户端通过 ha_get_skill_guide 阅读最佳实践技能并回传在那里获得的确认密钥。开启时，ha_get_skill_guide
      工具被锁定启用——它是确认密钥的唯一发布方。为上方“写入时附加最佳实践技能”选项的子项，当其父项关闭时无效。需要重启才能生效。
  enable_auto_backup:
    name: 自动备份编辑
    description: 在每次写入或删除工具调用修改实体之前保存其实体快照。关闭此选项后，文件和原始 YAML 工具（ha_write_file、ha_delete_file、ha_config_set_yaml）将拒绝写入。
  auto_backup_throttle_minutes:
    name: 自动备份限流（分钟）
    description: 自动备份捕获同一实体的频率。设置为 0 表示每次写入时都捕获；大于 0 的 N 表示每个实体每 N 分钟最多捕获一个快照。 范围
      0–1440。
  auto_backup_retain_per_entity:
    name: 自动备份保留数量（每个实体）
    description: 每个实体保留的最快照数量。每次新的捕获都会删除超出此数量的最旧快照。 范围 1–10000。
  enable_snapshot_actions:
    name: 允许完整的 Home Assistant 快照操作
    description: 允许 AI 助手通过 ha_manage_backup 以及 ha_call_service 中的等效备份服务和命令来管理完整的
      Home Assistant 快照。关闭此选项将阻止所有快照操作，包括列出快照。快照删除仅能通过 ha_manage_backup 进行，并且还需要启用“允许删除快照”。在网页设置
      UI 中由人工执行的编辑备份和备份操作仍然可用。
  backup_read_only:
    name: 将备份管理设为只读
    description: 允许 AI 助手列出、查看和对比编辑备份，并在启用快照操作时列出完整的 HA 快照。阻止手动创建、恢复（包括编辑恢复）和删除备份，包括
      ha_call_service 中的等效备份服务和命令。自动预编辑备份将继续运行。在网页设置 UI 中由人工执行的备份操作仍然可用。
  enable_snapshot_delete:
    name: 允许删除快照
    description: 允许 ha_manage_backup 删除完整的 Home Assistant 快照。快照可能是错误更改后恢复的最后途径，因此必须由人工开启此选项。计划备份、最新快照以及未满最小保留期限的快照将继续受到保护。
  snapshot_delete_min_age_days:
    name: 可删除快照的最小年龄（天）
    description: 快照必须达到多少天才能被删除。0 表示关闭年龄限制；最新快照和计划备份将继续受到保护。 范围 0–365。
  disabled_tools:
    name: 已禁用的工具（以逗号分隔）
    description: 此处列出的工具会被强制关闭，并在网页设置界面（“工具”选项卡）中锁定——在取消此选项之前无法在那里重新启用。少数必备工具（ha_search、ha_get_overview、ha_get_state、ha_report_issue、ha_manage_backup）无法禁用，即使列在此处也会继续运行。ha_get_skill_guide
      仅在严格最佳实践模式（enable_strict_mandatory_bps）关闭时才能禁用。以逗号分隔的工具名称（例如 ha_call_event,ha_eval_template）。
  pinned_tools:
    name: 已固定的工具（以逗号分隔）
    description: 此处列出的工具会被锁定为固定——它们显示在“工具”选项卡顶部，且在取消此选项之前无法从网页设置界面取消固定。与工具搜索搭配使用时很有用。以逗号分隔的工具名称。
  secret_path:
    name: 密钥路径覆盖
    description: 'MCP 服务器的可选自定义 HTTP 路径。留空则使用自动生成的安全路径。

      '
