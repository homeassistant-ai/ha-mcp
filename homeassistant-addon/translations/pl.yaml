---
# GENERATED FILE — do not edit. Translations live in
# src/ha_mcp/settings_ui/locales/pl.json (keys addon.*, features.*, advanced.*,
# backup.fields.*, addon_stable.*); regenerate with: python scripts/generate_locales.py
configuration:
  verify_ssl:
    name: Weryfikuj certyfikaty TLS
    description: 'Weryfikuje certyfikat TLS serwera Home Assistant. Wyłącz tę opcję
      tylko w zaufanej sieci, dla certyfikatu z podpisem własnym lub niezgodności
      nazwy hosta: osłabia to bezpieczeństwo transportu.'
  ha_tool_concurrency:
    name: Współbieżność narzędzi Home Assistant
    description: Opcjonalny limit zewnętrznych wywołań narzędzi Home Assistant we
      wszystkich sesjach. Współbieżność wewnętrznych żądań REST, WebSocket oraz rozgałęzień
      na narzędzie pozostaje bez zmian. Wartość 0 oznacza brak limitu. Wywołanie oczekujące
      na wolne zasoby zakończy się niepowodzeniem po 60 sekundach. Zakres 0–32.
  backup_hint:
    name: Poziom podpowiedzi kopii zapasowej
    description: Jak stanowczo asystenci AI są instruowani, aby sugerować pełną kopię
      zapasową Home Assistant przed ryzykownymi zmianami. Zmienia to tylko tę podpowiedź;
      automatyczne kopie zapasowe edycji mają własne ustawienie.
  enable_tool_search:
    name: Włącz wyszukiwanie narzędzi
    description: 'Zastąp pełny katalog narzędzi wyszukiwaniem. Zmniejsza bezczynny
      kontekst o około 90%, do około 5K tokenów. ⚠️ NIE włączaj tego w klientach z
      własnym wbudowanym wyszukiwaniem narzędzi / odroczonymi narzędziami (claude.ai,
      Claude Desktop, Claude Code) — obie warstwy wyszukiwania będą w konflikcie,
      a wbudowane wyszukiwanie narzędzi klienta jest w tym przypadku lepszym wyborem;
      pozostaw to wyłączone. To, czy narzędzia są odraczane, zależy od kombinacji
      klienta i modelu: użyj tego, gdy konfiguracja ładowała pełny katalog na początku
      — modele bez natywnych odroczonych narzędzi (np. Gemini, modele lokalne kompatybilne
      z OpenAI, Claude Haiku), klienci, którzy wstawiają wszystkie schematy narzędzi
      niezależnie od modelu (np. GitHub Copilot CLI), lub mniejsze okna kontekstu.
      Niektóre modele Codex i ChatGPT również zawierają odroczone narzędzia — sprawdź
      bezpośrednio swojego klienta/model, aby potwierdzić jego funkcje, aby nie pozostawiać
      tego włączonego niepotrzebnie. Narzędzia są wyszukiwane przez ha_search_tools
      i wykonywane za pośrednictwem skategoryzowanych serwerów proxy (odczyt/zapis/usuwanie).
      Wymaga ponownego uruchomienia aplikacji (dodatku), aby zaczęło obowiązywać —
      następnie połącz się ponownie lub odśwież serwer MCP w kliencie AI, aby załadował
      listę narzędzi ponownie. Samo ponowne uruchomienie aplikacji (dodatku) NIE odświeża
      listy narzędzi w pamięci podręcznej klienta; dotyczy to zmiany dowolnego ustawienia
      tutaj.'
  tool_search_max_results:
    name: Maksymalna liczba wyników wyszukiwania narzędzi
    description: Maksymalna liczba ukrytych narzędzi zwracanych w jednym wywołaniu
      ha_search_tools, gdy wyszukiwanie narzędzi jest włączone; przypięte narzędzie
      mieszczące się w tym limicie jest dodawane jako krótki wpis zawierający tylko
      nazwę na samej górze. Niższe wartości (2-3) oszczędzają tokeny kontekstu, ale
      mogą pominąć powiązane narzędzia. Wymaga ponownego uruchomienia. Zakres 2–10.
  enable_tool_security_policies:
    name: Włącz zasady bezpieczeństwa narzędzi (zaawansowane)
    description: Zabezpiecz wywołania narzędzi wysokiego ryzyka (kontrola zamków/alarmów,
      zapisy automatyzacji itp.) za zgodą użytkownika. Gdy wywoływane jest zabezpieczone
      narzędzie, agent informuje użytkownika, aby otworzył zakładkę „Zasady bezpieczeństwa
      narzędzi” w interfejsie sieciowym i kliknął „Zatwierdź”, zanim wywołanie zostanie
      wykonane. Reguły dla poszczególnych narzędzi z opcjonalnymi warunkami argumentów
      są konfigurowane w zakładce „Zasady bezpieczeństwa narzędzi”. Domyślnie wyłączone.
      Wymaga ponownego uruchomienia, aby zmiany weszły w życie.
  enable_security_policy_tool:
    name: Zezwól agentom AI na edycję zasad bezpieczeństwa narzędzi
    description: 'Rejestruje narzędzie ha_manage_security_policy, które pozwala połączonym
      agentom AI czytać i przepisywać polityki bezpieczeństwa narzędzi — w tym usuwanie
      bramek zatwierdzeń. Domyślnie wyłączone. Niezależnie od opcji Polityki bezpieczeństwa
      narzędzi powyżej: to kontroluje, kto może edytować zasady, a nie to, czy są
      one egzekwowane. Narzędzie nie może widzieć ani decydować o oczekujących zatwierdzeniach.
      Aby utrzymać człowieka w pętli, ustaw bramkę dla narzędzia przed jego włączeniem:
      włącz „security gated” dla Manage Security Policy w zakładce Narzędzia interfejsu
      webowego. Wymaga ponownego uruchomienia, aby zmiany weszły w życie.'
  read_only_mode:
    name: Tryb tylko do odczytu
    description: Wyłącza wszystkie narzędzia zapisujące oraz usuwa możliwość wykonywania
      przez narzędzia jakichkolwiek wywołań zapisujących lub destrukcyjnych. Mieszane
      narzędzia do odczytu i zapisu — kopie zapasowe, aplikacje (dodatki), preferencje
      energii, potoki głosowe oraz tryb kodu, gdy jest włączony — pozostają dostępne
      z zablokowanymi operacjami zapisu. Ten sam przełącznik co na karcie Narzędzia
      w interfejsie webowym. Domyślnie wyłączony. Wymaga ponownego uruchomienia, aby
      zacząć obowiązywać.
  redact_secrets:
    name: Redaguj sekrety
    description: Usuwa poufne dane z odpowiedzi narzędzi, zanim dotrą one do asystenta
      AI. Opcje aplikacji (dodatku) i pola integracji oznaczone jako hasła są zastępowane
      znacznikiem ustawienia/pustej wartości (dzięki czemu na pytanie "czy to poświadczenie
      jest skonfigurowane?" nadal można odpowiedzieć), a inne odpowiedzi narzędzi
      są czyszczone z poufnych wartości, które serwer już widział (wartości krótsze
      niż 6 znaków są pomijane, ponieważ zastępowanie malutkich fragmentów mogłoby
      uszkodzić powiązane dane wyjściowe). Pola nieoznaczone jako hasła przez ich
      schemat nie mogą zostać wykryte. Domyślnie wyłączone.
  enable_mandatory_bps:
    name: Dołącz umiejętności najlepszych praktyk przy zapisach
    description: 'Główny przełącznik funkcji dostarczania treści umiejętności narzędzi
      do zapisu (problem #1182). Gdy włączone (domyślnie), sześć narzędzi do zapisu
      konfiguracji (automatyzacje, skrypty, sceny, pomocnicy, panele, surowy YAML)
      dołącza kanoniczne pliki referencyjne najlepszych praktyk Home Assistant w sekcji
      `skill_content` przy każdym udanym zapisie, plus automatycznie osadza wszelkie
      sekcje referencyjne cytowane w ostrzeżeniach dotyczących najlepszych praktyk.
      Każde narzędzie udostępnia również parametr `MandatoryBPS` dla każdego wywołania,
      który agent może ustawić na „fałsz” w kolejnych wywołaniach, gdy już posiada
      treść. Gdy ten główny przełącznik jest wyłączony, ŻADNA treść `skill_content`
      nie jest wysyłana, niezależnie od parametru dla każdego wywołania lub ostrzeżeń
      BP. Zalecane WŁĄCZONE jako pierwszy wybór; wyłącz tylko dla modeli z bardzo
      małymi oknami kontekstowymi. Wyłączenie tej opcji może obniżyć dokładność zapisu.
      Wymaga ponownego uruchomienia, aby zmiany weszły w życie.'
  enable_strict_mandatory_bps:
    name: Tryb ścisłych najlepszych praktyk
    description: 'Tryb ścisły: uniemożliwia klientowi korzystanie z narzędzia, dopóki
      nie udowodni, że zapoznał się z najlepszymi praktykami. Gdy włączony, sześć
      narzędzi do zapisu najlepszych praktyk (automatyzacje, skrypty, sceny, pomocnicy,
      panele, surowy YAML) jest blokowanych i zwraca błąd, nakazując klientowi zapoznanie
      się z umiejętnościami najlepszych praktyk za pomocą ha_get_skill_guide i przekazanie
      z powrotem klucza potwierdzenia, który tam uzyska. Gdy włączony, narzędzie ha_get_skill_guide
      jest zablokowane i włączone — jest jedynym wydawcą klucza potwierdzenia. Opcja
      podrzędna opcji „Dołącz umiejętności najlepszych praktyk przy zapisach” powyżej
      i nieaktywna, gdy opcja nadrzędna jest wyłączona. Wymaga ponownego uruchomienia,
      aby zmiany weszły w życie.'
  enable_auto_backup:
    name: Automatyczne tworzenie kopii zapasowych edycji
    description: Zapisuje migawkę encji przed jej zmianą przez każde wywołanie narzędzia
      zapisu lub usuwania. Gdy ta opcja jest wyłączona, narzędzia plików i surowego
      YAML-a (ha_write_file, ha_delete_file, ha_config_set_yaml) odmawiają zapisu.
  auto_backup_throttle_minutes:
    name: Ograniczenie częstotliwości automatycznych kopii zapasowych (w minutach)
    description: Jak często kopia zapasowa może zostać utworzona dla tej samej encji.
      Wartość 0 tworzy kopię przy każdym zapisie; wartość N większa niż 0 tworzy co
      najwyżej jedną migawkę na N minut dla danej encji. Zakres 0–1440.
  auto_backup_retain_per_entity:
    name: Zachowywanie automatycznych kopii zapasowych (na encję)
    description: Maksymalna liczba zachowywanych migawek na encję. Każde nowe utrwalenie
      usuwa najstarsze migawki ponad tę liczbę. Zakres 1–10000.
  enable_snapshot_actions:
    name: Zezwalaj na działania na pełnych migawkach Home Assistant
    description: Pozwala asystentom AI zarządzać pełnymi migawkami Home Assistant
      za pomocą ha_manage_backup oraz odpowiednich usług i poleceń tworzenia kopii
      zapasowych w ha_call_service. Wyłączenie tej opcji blokuje wszystkie działania
      na migawkach, w tym ich listowanie. Usuwanie migawek jest dostępne wyłącznie
      przez ha_manage_backup i wymaga także włączenia opcji Zezwól na usuwanie migawek.
      Edycja kopii zapasowych oraz działania na kopiach zapasowych wykonywane przez
      użytkownika w interfejsie ustawień webowych pozostają dostępne.
  backup_read_only:
    name: Ustaw zarządzanie kopiami zapasowymi jako tylko do odczytu
    description: Pozwala asystentom AI na listowanie, przeglądanie i porównywanie
      (diff) kopii zapasowych edycji oraz listowanie pełnych migawek HA, gdy działania
      na migawkach są włączone. Blokuje ręczne tworzenie, przywracanie (w tym przywracanie
      edycji) i usuwanie kopii zapasowych, w tym odpowiadające im usługi i polecenia
      kopii zapasowych w ha_call_service. Automatyczne kopie zapasowe przed edycją
      są nadal tworzone. Działania na kopiach zapasowych wykonywane przez użytkownika
      w interfejsie ustawień webowych pozostają dostępne.
  enable_snapshot_delete:
    name: Zezwól na usuwanie migawek
    description: Pozwala ha_manage_backup usuwać pełne migawki Home Assistant. Migawka
      może być ostatnią deską ratunku po omyłkowej zmianie, dlatego użytkownik musi
      włączyć tę opcję. Zaplanowane kopie zapasowe, najnowsza migawka oraz migawki
      młodsze niż minimalny wiek pozostają chronione.
  snapshot_delete_min_age_days:
    name: Minimalny wiek migawki do usunięcia (dni)
    description: Minimalny wiek migawki w dniach, po którym może zostać usunięta.
      Wartość 0 wyłącza limit wieku; najnowsza migawka oraz zaplanowane kopie zapasowe
      pozostają chronione. Zakres 0–365.
  disabled_tools:
    name: Wyłączone narzędzia (oddzielone przecinkami)
    description: Narzędzia wymienione tutaj są wymuszone na wyłączone i zablokowane
      w interfejsie użytkownika Ustawień (zakładka Tools) — nie można ich ponownie
      włączyć bez wcześniejszego wyłączenia tej opcji. Niewielki zestaw obowiązkowych
      narzędzi (ha_search, ha_get_overview, ha_get_state, ha_report_issue, ha_manage_backup)
      nie może zostać wyłączony i działa nadal, nawet jeśli jest tutaj wymieniony.
      ha_get_skill_guide może zostać wyłączony tylko wtedy, gdy tryb ścisłych najlepszych
      praktyk (enable_strict_mandatory_bps) jest wyłączony. Nazwy narzędzi oddzielone
      przecinkami (np. ha_call_event,ha_eval_template).
  pinned_tools:
    name: Przypięte narzędzia (oddzielone przecinkami)
    description: Narzędzia wymienione tutaj są zablokowane jako przypięte — pojawiają
      się na górze zakładki „Narzędzia” i nie można ich odpiąć z interfejsu ustawień
      sieciowych bez wcześniejszego usunięcia tej opcji. Przydatne w połączeniu z
      wyszukiwaniem narzędzi. Nazwy narzędzi oddzielone przecinkami.
  secret_path:
    name: Nadpisanie tajnej ścieżki
    description: 'Opcjonalna niestandardowa ścieżka HTTP dla serwera MCP. Pozostaw
      puste, aby użyć automatycznie generowanej bezpiecznej ścieżki.

      '
