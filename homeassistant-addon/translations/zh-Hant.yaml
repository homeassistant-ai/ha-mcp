---
# GENERATED FILE — do not edit. Translations live in
# src/ha_mcp/settings_ui/locales/zh-Hant.json (keys addon.*, features.*, advanced.*,
# backup.fields.*, addon_stable.*); regenerate with: python scripts/generate_locales.py
configuration:
  verify_ssl:
    name: 驗證 SSL 憑證
    description: 僅在受信網路中停用 TLS 驗證。需要重新啟動。
  ha_tool_concurrency:
    name: Home Assistant 工具並行數
    description: 跨所有工作階段對外部 Home Assistant 工具呼叫的選擇性限制。內部 REST、WebSocket 及每個工具的分發並行數保持不變。0
      表示維持無限制行為。等待容量的呼叫會在 60 秒後失敗。範圍 0–32。需要重新啟動。 Range 0–32.
  backup_hint:
    name: 備份提示層級
    description: 控制在進行有風險的寫入之前，提示 LLM 進行完整 HA 快照的強度。
  enable_tool_search:
    name: 啟用工具搜尋
    description: 使用基於搜尋的探索來取代完整的工具目錄。可將閒置上下文減少約 90%，降至約 5K 個 Token。⚠️ 如果用戶端本身具有內建工具搜尋／延遲工具功能（claude.ai、Claude
      Desktop、Claude Code），請勿啟用此功能——這兩個搜尋層會發生衝突，而用戶端內建的工具搜尋在此處是更好的選擇；請保持關閉。工具是否被延遲取決於您的用戶端與模型組合：當您的設定會預先載入完整目錄時請使用此功能——適用於沒有原生延遲工具的模型（例如
      Gemini、相容 OpenAI 的本地模型、Claude Haiku）、無論模型為何都內嵌所有工具結構描述的用戶端（例如 GitHub Copilot
      CLI），或是較小的上下文視窗。部分 Codex 模型和 ChatGPT 也包含延遲工具——請直接檢查您的用戶端／模型以確認其功能，以免不必要地保持啟用。工具是透過
      ha_search_tools 尋找，並透過分類代理（讀取／寫入／刪除）執行。需要重新啟動應用程式（附加元件）才會生效——然後請在您的 AI 用戶端中重新連線或重新整理
      MCP 伺服器，以便重新載入工具列表。單獨重新啟動應用程式（附加元件）並不會重新整理用戶端快取的工具列表；這適用於變更此處的任何設定之後。
  tool_search_max_results:
    name: 工具搜尋最大結果數
    description: 啟用工具搜尋時，每次 ha_search_tools 呼叫所傳回的隱藏工具最大數量；排名在前幾名之內的釘選工具會以僅顯示名稱的簡短條目形式額外加入最上方。較低的值
      (2-3) 可節省上下文符記，但可能會漏掉相關工具。範圍：2-10。需要重新啟動。 Range 2–10.
  enable_tool_security_policies:
    name: 啟用工具安全性策略（進階）
    description: 將高風險工具呼叫（鎖定／警報控制、自動化寫入等）限制在使用者核准之後。當呼叫受保護的工具時，代理程式會指示使用者在網頁 UI 中開啟「工具安全性策略」分頁並點擊「核准」，然後呼叫才會繼續。具備選用引數條件的個別工具規則可在「工具安全性策略」分頁中進行設定。預設為關閉。需要重新啟動才能生效。
  enable_security_policy_tool:
    name: 允許 AI 代理程式編輯工具安全性策略
    description: 註冊 ha_manage_security_policy 工具，該工具允許連線的 AI 代理程式讀取和重寫工具安全性策略，包括移除批准閘道。預設為關閉。與上方的「工具安全性策略」選項獨立：這控制誰可以編輯規則，而不是是否強制執行它們。該工具無法看到或決定待處理的批准。若要將人類納入控制流程中，請在啟用該工具之前加上閘道：在網頁
      UI 的「工具」分頁中，將「Manage Security Policy」切換為「security gated」。需要重新啟動才能生效。
  read_only_mode:
    name: 唯讀模式
    description: 將所有寫入工具關閉，並移除工具進行任何寫入或具破壞性呼叫的能力。混合讀取／寫入工具（備份、應用程式（附加元件）、能源偏好設定、語音管線，以及啟用時的程式碼模式）將保持可用，但其寫入操作會被封鎖。與網頁
      UI「工具」分頁中的切換開關相同。預設為關閉。需要重新啟動才能生效。
  redact_secrets:
    name: 遮蔽機密資訊
    description: 在工具回應到達 AI 助理之前，將其中的機密資訊遮蔽。應用程式（附加元件）選項以及標記為密碼的整合欄位會被替換為已設定／空白標記（以便「此憑證是否已設定？」保持可回答），並且其他工具回應中會清除伺服器已經看過的機密值（小於
      6 個字元的實值會被略過，因為替換微小片段會損壞不相關的輸出）。其結構定義未標記為密碼的欄位無法被偵測。預設為關閉。需要重新啟動才能生效。
  enable_mandatory_bps:
    name: 寫入時附加最佳實踐技能
    description: '寫入工具技能內容傳遞功能的主開關（issue #1182）。啟用時（預設），六個設定寫入工具（自動化、指令碼、場景、輔助程式、儀表板、原始
      YAML）會在每次成功寫入時，於 `skill_content` 下方附加標準的 Home Assistant 最佳實踐參考檔案，並自動嵌入最佳實踐警告所引用的任何參考章節。每個工具也公開了每次呼叫皆有的
      `MandatoryBPS` 參數，一旦代理程式取得內容，便可在後續呼叫中將其設定為 false。當此主開關關閉時，無論每次呼叫的參數或最佳實踐警告為何，都不會發出任何
      skill_content。建議作為首選保持「開啟」；僅對上下文視窗非常小的模型進行停用。關閉此功能可能會降低寫入準確度。需要重新啟動才能生效。'
  enable_strict_mandatory_bps:
    name: 嚴格最佳實踐模式
    description: 嚴格模式：防止用戶端在證明其已閱讀最佳做法之前使用該工具。啟用後，六個最佳做法寫入工具（automations、scripts、scenes、helpers、dashboards、raw
      YAML）將被封鎖並傳回錯誤，指示用戶端透過 ha_get_skill_guide 閱讀最佳做法技能並傳回其在該處獲得的確認金鑰。啟用後，ha_get_skill_guide
      工具將被鎖定為啟用狀態——它是確認金鑰的唯一發布者。上方「Attach best-practice skills on writes」選項的子選項，當該父選項關閉時處於非作用中狀態。需要重新啟動才能生效。
  enable_auto_backup:
    name: 自動備份編輯
    description: 在每個包裝的寫入或破壞性工具呼叫之前擷取快照。
  auto_backup_throttle_minutes:
    name: 節流（分鐘）
    description: 每個實體的節流。0 = 每次寫入；N > 0 = 每 N 分鐘最多一次備份。範圍 0–1440。 Range 0–1440.
  auto_backup_retain_per_entity:
    name: 每個實體保留數量
    description: 每個實體保留的最大快照數（1–10000）。較舊的快照將會被輪替清除。 Range 1–10000.
  enable_snapshot_actions:
    name: Allow full HA snapshot actions
    description: Allow AI assistants to manage full Home Assistant snapshots through
      ha_manage_backup and the equivalent backup services and commands in ha_call_service.
      Turning this off blocks every snapshot action, including listing. Snapshot deletion
      is only available through ha_manage_backup and also requires Allow snapshot
      deletion. Edit backups and the backup actions a person takes in the web settings
      UI remain available.
  backup_read_only:
    name: Make backup management read-only
    description: Allow AI assistants to list, view, and diff edit backups, and list
      full HA snapshots when snapshot actions are enabled. Block manual backup create,
      restore (including edit restores), and delete, including the equivalent backup
      services and commands in ha_call_service. Automatic pre-edit backups continue.
      The backup actions a person takes in the web settings UI remain available.
  enable_snapshot_delete:
    name: 允許刪除快照
    description: 允許 ha_manage_backup 刪除完整的 HA 快照，同時保持排程、最新以及過於年輕的快照受到保護。
  snapshot_delete_min_age_days:
    name: 允許刪除的最小快照天數（天）
    description: 快照必須達到此最低天數才能被刪除。範圍 0–365。 Range 0–365.
  disabled_tools:
    name: 停用的工具（以逗號分隔）
    description: 此處列出的工具會被強制關閉並在網頁設定 UI（「工具」分頁）中鎖定 — 若不先取消此選項，將無法在該處重新啟用。一小組強制性工具（ha_search、ha_get_overview、ha_get_state、ha_report_issue、ha_manage_backup）無法停用，即使列在此處也會繼續執行。ha_get_skill_guide
      僅能在嚴格最佳實務模式（enable_strict_mandatory_bps）關閉時停用。以逗號分隔的工具名稱（例如 ha_call_event,ha_eval_template）。
  pinned_tools:
    name: 固定的工具（以逗號分隔）
    description: 此處列出的工具會被鎖定固定 — 牠們會顯示在「工具」分頁的最上方，若不先取消此選項，將無法從網頁設定 UI 取消固定。結合「工具搜尋」使用非常實用。以逗號分隔的工具名稱。
  secret_path:
    name: 密鑰路徑覆寫
    description: 'MCP 伺服器的選用自訂 HTTP 路徑。保持空白以使用自動產生的安全路徑。

      '
