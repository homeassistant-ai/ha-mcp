---
# GENERATED FILE — do not edit. Translations live in
# src/ha_mcp/settings_ui/locales/sv.json (keys addon.*, features.*, advanced.*,
# backup.fields.*, addon_stable.*); regenerate with: python scripts/generate_locales.py
configuration:
  verify_ssl:
    name: Verify TLS certificates
    description: 'Verify the Home Assistant server''s TLS certificate. Turn this off
      only on a trusted network, for a self-signed certificate or a hostname mismatch:
      it weakens transport security.'
  ha_tool_concurrency:
    name: Samtidighet för Home Assistant-verktyg
    description: Optional limit on outer Home Assistant tool calls across all sessions.
      Internal REST, WebSocket, and per-tool fan-out concurrency is unchanged. 0 keeps
      unlimited behavior. A call waiting for capacity fails after 60 seconds. Range
      0–32.
  backup_hint:
    name: Backup hint level
    description: How strongly AI assistants are told to suggest a full Home Assistant
      backup before risky changes. It changes only this hint; automatic edit backups
      have their own setting.
  enable_tool_search:
    name: Aktivera verktygssökning
    description: 'Ersätt hela verktygskatalogen med sökbaserad upptäckt. Minskar inaktiv
      kontext med ungefär 90 %, till cirka 5K tokens. ⚠️ Aktivera INTE detta i klienter
      med inbyggd verktygssökning / uppskjutna verktyg (claude.ai, Claude Desktop,
      Claude Code) – de två söklagren krockar, och klientens inbyggda verktygssökning
      är det bättre valet där; lämna denna avstängd. Huruvida verktyg skjuts upp beror
      på din klient- och modellkombination: använd detta när din konfiguration läser
      in hela katalogen i förväg – modeller utan inbyggda uppskjutna verktyg (t.ex.
      Gemini, OpenAI-kompatibla lokala modeller, Claude Haiku), klienter som infogar
      alla verktygsscheman oavsett modell (t.ex. GitHub Copilot CLI), eller mindre
      kontextfönster. Vissa Codex-modeller och ChatGPT inkluderar också uppskjutna
      verktyg – kontrollera din klient/modell direkt för att bekräfta dess funktioner
      så att du inte lämnar detta aktiverat i onödan. Verktyg hittas via ha_search_tools
      och exekveras via kategoriserade proxyservrar (läs/skriv/ta bort). Kräver omstart
      av appen (tillägget) för att träda i kraft – återanslut eller uppdatera sedan
      MCP-servern i din AI-klient så att den läser om verktygslistan. Enbart omstart
      av appen (tillägget) uppdaterar INTE en klients cachade verktygslista; detta
      gäller efter att du har ändrat någon inställning här.'
  tool_search_max_results:
    name: Max antal resultat för verktygssökning
    description: Maximum number of hidden tools returned per ha_search_tools call
      when tool search is enabled; a pinned tool that ranks inside that top count
      is added as a short name-only entry on top of it. Lower values (2-3) save context
      tokens but may miss relevant tools. Requires restart. Range 2–10.
  enable_tool_security_policies:
    name: Aktivera verktygssäkerhetspolicyer (avancerat)
    description: Spärra verktygsanrop med hög risk (lås-/larmkontroll, automatiseringsskrivningar,
      etc.) bakom användargodkännande. När ett skyddat verktyg anropas, ber agenten
      användaren att öppna fliken Verktygssäkerhetspolicyer i webbgränssnittet och
      klicka på Godkänn innan anropet fortsätter. Regler per verktyg med valfria argumentvillkor
      konfigureras i fliken Verktygssäkerhetspolicyer. Avstängt som standard. Kräver
      omstart för att träda i kraft.
  enable_security_policy_tool:
    name: Låt AI-agenter redigera verktygens säkerhetspolicyer
    description: 'Registrerar verktyget ha_manage_security_policy, vilket låter anslutna
      AI-agenter läsa och skriva om verktygens säkerhetspolicyer – inklusive att ta
      bort godkännandegrindar. Avstängt som standard. Oberoende av alternativet Verktygssäkerhetspolicyer
      ovan: detta styr vem som kan redigera reglerna, inte om de verkställs. Verktyget
      kan inte se eller besluta om väntande godkännanden. För att behålla en människa
      i loopen, grinda verktyget innan du aktiverar det: slå på "säkerhetsgrindad"
      för Hantera säkerhetspolicy under fliken Verktyg i webbgränssnittet. Kräver
      omstart för att träda i kraft.'
  read_only_mode:
    name: Skrivskyddat läge
    description: Stänger av alla skrivverktyg och tar bort möjligheten för verktyg
      att göra några skrivningar eller destruktiva anrop. Blandade läs-/skrivverktyg
      – säkerhetskopior, appar (tillägg), energipreferenser, röstpipeliner och kodläge
      när det är aktiverat – förblir tillgängliga men med sina skrivåtgärder blockerade.
      Samma reglage som på fliken Tools i webbgränssnittet. Av som standard. Kräver
      omstart för att träda i kraft.
  redact_secrets:
    name: Redigera hemligheter
    description: Döljer hemligheter från verktygssvar innan de når AI-assistenten.
      Appalternativ (tilläggsalternativ) och integrationsfält markerade som lösenord
      ersätts med en markering för satt/tomt (så att "är denna autentiseringsuppgift
      konfigurerad?" fortfarande kan besvaras), och andra verktygssvar rensas från
      hemliga värden som servern redan har sett (värden kortare än 6 tecken hoppas
      över, eftersom utbyte av små fragment skulle korruptera orelaterad utdata).
      Fält som inte är markerade som lösenord av sitt schema kan inte upptäckas. Av
      som standard.
  enable_mandatory_bps:
    name: Bifoga bästa praxis-färdigheter vid skrivningar
    description: 'Huvudbrytare för funktionen för leverans av skrivverktygsfärdighetsinnehåll
      (ärende #1182). När aktiverat (standard), bifogar de sex konfigurationsskrivverktygen
      (automatiseringar, skript, scener, hjälpare, instrumentpaneler, rå YAML) de
      kanoniska Home Assistant bästa praxis-referensfilerna under `skill_content`
      vid varje lyckad skrivning, plus att de automatiskt bäddar in alla referenssektioner
      som citeras av bästa praxis-varningar. Varje verktyg exponerar också en per-anrop
      `MandatoryBPS`-parameter som agenten kan sätta till false vid efterföljande
      anrop när den har innehållet. När denna huvudbrytare är avstängd, skickas INGET
      skill_content ut oavsett per-anrop-parametern eller BP-varningar. Rekommenderas
      PÅ som första val; inaktivera endast för modeller med mycket små kontextfönster.
      Att stänga av detta kan försämra skrivnoggrannheten. Kräver omstart för att
      träda i kraft.'
  enable_strict_mandatory_bps:
    name: Strikt bästa praxis-läge
    description: 'Strikt läge: förhindrar klienten från att använda verktyget tills
      den kan bevisa att den har läst de bästa praxis. När aktiverat, blockeras de
      sex bästa praxis-skrivverktygen (automatiseringar, skript, scener, hjälpare,
      instrumentpaneler, rå YAML) och returnerar ett fel som instruerar klienten att
      läsa bästa praxis-färdigheten via ha_get_skill_guide och skicka tillbaka den
      bekräftelsenyckel den får där. När aktiverat, är verktyget ha_get_skill_guide
      låst aktiverat — det är den enda utgivaren av bekräftelsenyckeln. Underordnad
      alternativet ”Bifoga bästa praxis-färdigheter vid skrivningar” ovan och inaktivt
      när det överordnade alternativet är avstängt. Kräver omstart för att träda i
      kraft.'
  enable_auto_backup:
    name: Automatisk säkerhetskopiering av redigeringar
    description: Save a snapshot of an entity before each write or delete tool call
      changes it. While this is off, the file and raw-YAML tools (ha_write_file, ha_delete_file,
      ha_config_set_yaml) refuse to write.
  auto_backup_throttle_minutes:
    name: Auto-backup throttle (minutes)
    description: How often auto-backup may capture the same entity. 0 captures on
      every write; N above 0 captures at most one snapshot per N minutes per entity.
      Range 0–1440.
  auto_backup_retain_per_entity:
    name: Auto-backup retention (per entity)
    description: The most snapshots kept per entity. Each new capture removes the
      oldest snapshots above this number. Range 1–10000.
  enable_snapshot_actions:
    name: Tillåt fullständiga HA-ögonblicksbildsåtgärder
    description: Allow AI assistants to manage full Home Assistant snapshots through
      ha_manage_backup and the equivalent backup services and commands in ha_call_service.
      Turning this off blocks every snapshot action, including listing. Snapshot deletion
      is only available through ha_manage_backup and also requires Allow snapshot
      deletion. Edit backups and the backup actions a person takes in the web settings
      UI remain available.
  backup_read_only:
    name: Gör säkerhetskopieringshanteringen skrivskyddad
    description: Allow AI assistants to list, view, and diff edit backups, and list
      full HA snapshots when snapshot actions are enabled. Block manual backup create,
      restore (including edit restores), and delete, including the equivalent backup
      services and commands in ha_call_service. Automatic pre-edit backups continue.
      The backup actions a person takes in the web settings UI remain available.
  enable_snapshot_delete:
    name: Tillåt borttagning av ögonblicksbilder
    description: Allow ha_manage_backup to delete full Home Assistant snapshots. A
      snapshot may be the last way back after a mistaken change, so a person must
      turn this on. Scheduled backups, the newest snapshot and snapshots younger than
      the minimum age stay protected.
  snapshot_delete_min_age_days:
    name: Minsta ålder för ögonblicksbild att ta bort (dagar)
    description: How old a snapshot must be, in days, before it can be deleted. 0
      turns off the age limit; the newest snapshot and scheduled backups stay protected.
      Range 0–365.
  disabled_tools:
    name: Inaktiverade verktyg (kommaseparerade)
    description: Verktyg som listas här är tvingade att vara avstängda och låsta i
      webbinställningsgränssnittet (fliken Verktyg) – de kan inte återaktiveras där
      utan att först avmarkera detta alternativ. En liten uppsättning obligatoriska
      verktyg (ha_search, ha_get_overview, ha_get_state, ha_report_issue, ha_manage_backup)
      kan inte inaktiveras och fortsätter att köras även om de listas här. ha_get_skill_guide
      kan endast inaktiveras när strikt bästa praxis-läge (enable_strict_mandatory_bps)
      är avstängt. Kommaseparerade verktygsnamn (t.ex. ha_call_event,ha_eval_template).
  pinned_tools:
    name: Fästa verktyg (kommaseparerade)
    description: Verktyg som listas här är låsta som fästa – de visas överst på fliken
      Verktyg och kan inte lossas från webbinställningsgränssnittet utan att först
      avmarkera detta alternativ. Användbart i kombination med Verktygssökning. Kommaseparerade
      verktygsnamn.
  secret_path:
    name: Åsidosättning av hemlig sökväg
    description: 'Valfri anpassad HTTP-sökväg för MCP-servern. Lämna tom för att använda
      den automatiskt genererade säkra sökvägen.

      '
