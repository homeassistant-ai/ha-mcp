---
# GENERATED FILE — do not edit. Translations live in
# src/ha_mcp/settings_ui/locales/eo.json (keys addon.*, features.*, advanced.*,
# backup.fields.*, addon_stable.*); regenerate with: python scripts/generate_locales.py
configuration:
  verify_ssl:
    name: Verify TLS certificates
    description: 'Verify the Home Assistant server''s TLS certificate. Turn this off
      only on a trusted network, for a self-signed certificate or a hostname mismatch:
      it weakens transport security.'
  ha_tool_concurrency:
    name: Konkureco de hejmaŭtomatigaj iloj de Home Assistant
    description: Optional limit on outer Home Assistant tool calls across all sessions.
      Internal REST, WebSocket, and per-tool fan-out concurrency is unchanged. 0 keeps
      unlimited behavior. A call waiting for capacity fails after 60 seconds. Range
      0–32.
  backup_hint:
    name: Backup hint level
    description: How strongly AI assistants are told to suggest a full Home Assistant
      backup before risky changes. It changes only this hint; automatic edit backups
      have their own setting.
  enable_tool_search:
    name: Ebligi ilo-serĉon
    description: 'Anstataŭigu la plenan il-katalogon per serĉ-bazita malkovro. Reduktas
      senchovan kuntekston je ĉirkaŭ 90%, ĝis proksimume 5K tokenoj. ⚠️ NE ebligu
      ĉi tion en klientoj kun propra enkonstruita il-serĉo / prokrastitaj iloj (claude.ai,
      Claude Desktop, Claude Code) — la du serĉ-tavoloj konfliktas, kaj la enkonstruita
      il-serĉo de la kliento estas la pli bona elekto tie; lasu ĉi tion malŝaltita.
      Ĉu iloj estas prokrastitaj dependas de via kliento kaj modelo-kombinaĵo: uzu
      ĉi tion kiam via agordo ŝarĝas la plenan katalogon frue — modeloj sen denaskaj
      prokrastitaj iloj (ekz. Gemini, OpenAI-kongruaj lokaj modeloj, Claude Haiku),
      klientoj kiuj enlinias ĉiujn il-skemojn sendepende de modelo (ekz. GitHub Copilot
      CLI), aŭ pli malgrandaj kuntekstaj fenestroj. Kelkaj Codex-modeloj kaj ChatGPT
      ankaŭ inkluzivas prokrastitajn ilojn — kontrolu rekte vian klienton/modelon
      por konfirmi ties funkciojn, por ke vi ne lasu ĉi tion ebligita senbezone. Iloj
      estas trovitaj per ha_search_tools kaj ekzekutitaj per kategoriigitaj prokurserviloj
      (legado/skribado/forigo). Postulas restartigon de la programo (aldonaĵo) por
      ekvalidi — tiam reKonekti aŭ aktualigi la MCP-servilon en via AI-kliento por
      ke ĝi reŝarĝu la il-liston. Restartigi la programon (aldonaĵo) sole NE aktualigas
      la kaŝmemoritan il-liston de kliento; ĉi tio aplikiĝas post ŝanĝo de iu ajn
      agordo ĉi tie.'
  tool_search_max_results:
    name: Maksimumaj rezultoj de ilo-serĉo
    description: Maximum number of hidden tools returned per ha_search_tools call
      when tool search is enabled; a pinned tool that ranks inside that top count
      is added as a short name-only entry on top of it. Lower values (2-3) save context
      tokens but may miss relevant tools. Requires restart. Range 2–10.
  enable_tool_security_policies:
    name: Ebligi Ilo-Sekurecajn Politikojn (altnivela)
    description: Gardu alt-riskajn ilo-vokojn (seruro/alarmo-kontrolo, aŭtomatigo-skriboj,
      ktp.) malantaŭ uzant-aprobo. Kiam gardita ilo estas vokita, la agento diras
      al la uzanto malfermi la langeton Ilo-Sekurecaj Politikoj en la TTT-UI kaj klaki
      Aprobi antaŭ ol la voko daŭras. Reguloj por ĉiu ilo kun laŭvolaj argumentaj
      kondiĉoj estas agorditaj en la langeto Ilo-Sekurecaj Politikoj. Malŝaltita defaŭlte.
      Postulas restartigon por ekvalidi.
  enable_security_policy_tool:
    name: Permesi al AI-agentoj redakti ilajn sekurecajn politikojn
    description: 'Registras la ilon ha_manage_security_policy, kiu permesas al konektitaj
      AI-agentoj legi kaj reverki la ilajn sekurecajn politikojn — inkluzive de forigo
      de aprobo-pordoj. Malŝaltita defaŭlte. Sendepende de la opcio ''Iloj Sekurecaj
      Politikoj'' supre: ĉi tio regas, kiu povas redakti la regulojn, ne ĉu ili estas
      plenumitaj. La ilo ne povas vidi aŭ decidi atendajn aprobojn. Por konservi homon
      en la procezo, pordigu la ilon antaŭ ol ebligi ĝin: ŝaltu "sekurece pordigita"
      por ''Administri Sekurecan Politikon'' en la langeto ''Iloj'' de la reta UI.
      Postulas restartigon por efektiviĝi.'
  read_only_mode:
    name: Nur-lega Reĝimo
    description: Malŝaltas ĉiujn skribilojn, kaj forigas la kapablon por iloj fari
      skribajn aŭ detruajn vokojn. Miksitaj leg-skribaj iloj — savkopioj, Apoj (aldonaĵoj),
      energiaj preferoj, voĉaj duktoj, kaj koda reĝimo kiam ebligite — restas haveblaj
      kun siaj skribaj operacioj blokitaj. Sama ŝaltilo kiel la TTT-interfaca langeto
      Iloj. Malŝaltita defaŭlte. Postulas restartigon por ekvalidi.
  redact_secrets:
    name: Redakti Sekretojn
    description: Redaktas sekretojn el ilaj respondon antaŭ ol ili atingas la AI-asistanton.
      Apaj (aldonaĵaj) opcioj kaj integriĝaj kampoj markitaj kiel pasvortoj estas
      anstataŭigitaj per aro/malplena markilo (do "ĉu ĉi tiu akreditaĵo estas agordita?"
      restas respondoebla), kaj aliaj ilaj respondoj estas purigitaj de sekretaj valoroj
      kiujn la servilo jam vidis (valoroj pli mallongaj ol 6 signoj estas preterlasitaj,
      ĉar anstataŭigi etajn fragmentojn koruptus senrilatan eligon). Kampoj ne markitaj
      kiel pasvortoj per sia skemo ne povas esti detektitaj. Malŝaltita defaŭlte.
  enable_mandatory_bps:
    name: Aligi plejbonajn praktikajn kapablojn ĉe skriboj
    description: 'Majstra ŝaltilo por la funkcio de liverado de enhavo de skrib-ila
      kapablo (problemo #1182). Kiam ebligita (defaŭlte), la ses agordaj skrib-iloj
      (aŭtomatigoj, skriptoj, scenoj, helpiloj, paneloj, kruda YAML) aligas la kanonikajn
      Home Assistant plejbonajn praktikajn referencajn dosierojn sub `skill_content`
      ĉe ĉiu sukcesa skribo, plus aŭtomate enigas iujn ajn referencajn sekciojn cititajn
      de plejbonaj praktikaj avertoj. Ĉiu ilo ankaŭ eksponas por-vokan `MandatoryBPS`
      parametron, kiun la agento povas agordi al false ĉe postaj vokoj post kiam ĝi
      havas la enhavon. Kiam ĉi tiu majstra ŝaltilo estas malŝaltita, NENIU skill_content
      eliras sendepende de la por-voka parametro aŭ BP-avertoj. Rekomendita ŜALTITA
      kiel la unua elekto; malŝaltu nur por modeloj kun tre malgrandaj kuntekstaj
      fenestroj. Malŝalti ĉi tion povas malbonigi skriban precizecon. Postulas restartigon
      por ekvalidi.'
  enable_strict_mandatory_bps:
    name: Strikta plejbonaj-praktikoj reĝimo
    description: 'Strikta reĝimo: malhelpas la klienton uzi la ilon ĝis ĝi povas pruvi,
      ke ĝi legis la plejbonajn praktikojn. Dum ŝaltita, la ses plejbonaj-praktikaj
      skrib-iloj (aŭtomatigoj, skriptoj, scenoj, helpiloj, paneloj, kruda YAML) estas
      blokitaj kaj redonas eraron direktante la klienton legi la plejbonajn-praktikajn
      kapablojn per ha_get_skill_guide kaj resendi la agnoskan ŝlosilon, kiun ĝi akiras
      tie. Dum ŝaltita, la ilo ha_get_skill_guide estas ŝlosita ebligita — ĝi estas
      la sola eldonanto de la agnoska ŝlosilo. Infano de la opcio „Aligi plejbonajn
      praktikajn kapablojn ĉe skriboj” supre kaj inerta dum tiu gepatro estas malŝaltita.
      Postulas restartigon por ekvalidi.'
  enable_auto_backup:
    name: Aŭtomataj sekurkopioj de redaktoj
    description: Save a snapshot of an entity before each write or delete tool call
      changes it. While this is off, the file and raw-YAML tools (ha_write_file, ha_delete_file,
      ha_config_set_yaml) refuse to write.
  auto_backup_throttle_minutes:
    name: Auto-backup throttle (minutes)
    description: How often auto-backup may capture the same entity. 0 captures on
      every write; N above 0 captures at most one snapshot per N minutes per entity.
      Range 0–1440.
  auto_backup_retain_per_entity:
    name: Auto-backup retention (per entity)
    description: The most snapshots kept per entity. Each new capture removes the
      oldest snapshots above this number. Range 1–10000.
  enable_snapshot_actions:
    name: Permesi plenajn akompanajn agojn de HA-momentfotoj
    description: Allow AI assistants to manage full Home Assistant snapshots through
      ha_manage_backup and the equivalent backup services and commands in ha_call_service.
      Turning this off blocks every snapshot action, including listing. Snapshot deletion
      is only available through ha_manage_backup and also requires Allow snapshot
      deletion. Edit backups and the backup actions a person takes in the web settings
      UI remain available.
  backup_read_only:
    name: Igi rezervadministradon nur-legebla
    description: Allow AI assistants to list, view, and diff edit backups, and list
      full HA snapshots when snapshot actions are enabled. Block manual backup create,
      restore (including edit restores), and delete, including the equivalent backup
      services and commands in ha_call_service. Automatic pre-edit backups continue.
      The backup actions a person takes in the web settings UI remain available.
  enable_snapshot_delete:
    name: Permesi forigon de momentfotoj
    description: Allow ha_manage_backup to delete full Home Assistant snapshots. A
      snapshot may be the last way back after a mistaken change, so a person must
      turn this on. Scheduled backups, the newest snapshot and snapshots younger than
      the minimum age stay protected.
  snapshot_delete_min_age_days:
    name: Minimuma aĝo de momentfoto por forigi (tagoj)
    description: How old a snapshot must be, in days, before it can be deleted. 0
      turns off the age limit; the newest snapshot and scheduled backups stay protected.
      Range 0–365.
  disabled_tools:
    name: Malaktivigitaj iloj (disigitaj per komoj)
    description: Iloj listigitaj ĉi tie estas devige malŝaltitaj kaj ŝlositaj en la
      reta Agorda UI (langeto 'Iloj') — ili ne povas esti re-ebligitaj tie sen unue
      malaktivigi ĉi tiun opcion. Malgranda aro de devigaj iloj (ha_search, ha_get_overview,
      ha_get_state, ha_report_issue, ha_manage_backup) ne povas esti malaktivigitaj
      kaj daŭre funkcias eĉ se listigitaj ĉi tie. ha_get_skill_guide povas esti malaktivigita
      nur dum la strikta plejbonaj praktikoj reĝimo (enable_strict_mandatory_bps)
      estas malŝaltita. Ilnomoj disigitaj per komoj (ekz. ha_call_event,ha_eval_template).
  pinned_tools:
    name: Fiksitaj iloj (disigitaj per komoj)
    description: Iloj listigitaj ĉi tie estas ŝlositaj fiksitaj — ili aperas ĉe la
      supro de la langeto 'Iloj' kaj ne povas esti malfiksitaj de la reta Agorda UI
      sen unue malaktivigi ĉi tiun opcion. Utila kombine kun 'Ilo-Serĉo'. Ilnomoj
      disigitaj per komoj.
  secret_path:
    name: Anstataŭigo de sekreta vojo
    description: 'Laŭvola kutima HTTP-vojo por la MCP-servilo. Lasu malplena por uzi
      la aŭtomate generitan sekuran vojon.

      '
