---
# GENERATED FILE — do not edit. Translations live in
# src/ha_mcp/settings_ui/locales/it.json (keys addon.*, features.*,
# addon_dev.*); regenerate with: python scripts/generate_locales.py
configuration:
  backup_hint:
    name: Livello del suggerimento di snapshot completo di HA (rivolto all'LLM)
    description: 'Regola il tono del suggerimento che l''LLM vede nella descrizione
      dello

      strumento `ha_manage_backup(scope=''snapshot'')` su quando proporre un

      backup completo di Home Assistant prima di operazioni rischiose (per

      esempio eliminazioni massive di dispositivi). Riguarda SOLTANTO quella

      frase rivolta all''LLM.


      Per gli snapshot automatici a ogni modifica di automazioni / script /

      helper / ecc., usa l''opzione separata **Attiva il backup automatico

      delle modifiche** qui sotto.'
  secret_path:
    name: Percorso segreto personalizzato
    description: 'Percorso HTTP personalizzato facoltativo per il server MCP. Lascialo
      vuoto per usare il percorso sicuro generato automaticamente.

      '
  enable_tool_search:
    name: Attiva la ricerca degli strumenti
    description: 'Sostituisci il catalogo completo degli strumenti con la scoperta
      basata sulla ricerca. Riduce il contesto inattivo di circa il 90%, a circa 5K
      token. ⚠️ NON abilitare questa opzione nei client con la propria ricerca strumenti
      integrata / strumenti differiti (claude.ai, Claude Desktop, Claude Code) — i
      due livelli di ricerca entrano in conflitto, e la ricerca strumenti integrata
      del client è la scelta migliore in quel caso; lasciala disattivata. Se gli strumenti
      sono differiti dipende dalla combinazione client e modello: usa questa opzione
      quando la tua configurazione carica il catalogo completo in anticipo — modelli
      senza strumenti differiti nativi (es. Gemini, modelli locali compatibili con
      OpenAI, Claude Haiku), client che incorporano tutti gli schemi degli strumenti
      indipendentemente dal modello (es. GitHub Copilot CLI), o finestre di contesto
      più piccole. Alcuni modelli Codex e ChatGPT includono anche strumenti differiti
      — controlla direttamente il tuo client/modello per confermarne le funzionalità
      in modo da non lasciare questa opzione abilitata inutilmente. Gli strumenti
      vengono trovati tramite ha_search_tools ed eseguiti tramite proxy categorizzati
      (read/write/delete). Richiede un riavvio per avere effetto.'
  enable_tool_security_policies:
    name: Attiva i criteri di sicurezza degli strumenti (avanzato)
    description: Subordina all'approvazione dell'utente le chiamate agli strumenti
      ad alto rischio (controllo di serrature e allarmi, scrittura di automazioni,
      ecc.). Quando viene chiamato uno strumento controllato, l'agente chiede all'utente
      di aprire la scheda Criteri di sicurezza degli strumenti nell'interfaccia web
      e di fare clic su Approva prima che la chiamata prosegua. Le regole per singolo
      strumento, con condizioni facoltative sugli argomenti, si configurano nella
      scheda Criteri di sicurezza degli strumenti. Disattivato per impostazione predefinita.
      Richiede il riavvio per avere effetto.
  enable_security_policy_tool:
    name: Consenti agli agenti IA di modificare le policy di sicurezza degli strumenti
    description: 'Registra lo strumento ha_manage_security_policy, che consente agli
      agenti IA connessi di leggere e riscrivere le policy di sicurezza degli strumenti
      — inclusa la rimozione dei gate di approvazione. Disattivato per impostazione
      predefinita. Indipendente dall''opzione Policy di Sicurezza degli Strumenti
      sopra: questo controlla chi può modificare le regole, non se vengono applicate.
      Lo strumento non può vedere o decidere le approvazioni in sospeso. Per mantenere
      un essere umano nel ciclo, proteggi lo strumento prima di abilitarlo: attiva
      "protetto da sicurezza" per Gestisci Policy di Sicurezza nella scheda Strumenti
      dell''interfaccia web. Richiede un riavvio per avere effetto.'
  read_only_mode:
    name: Modalità di sola lettura
    description: Disattiva tutti gli strumenti di scrittura e rimuove la capacità
      degli strumenti di effettuare chiamate di scrittura o distruttive. Gli strumenti
      misti di lettura/scrittura — backup, applicazioni (add-on), preferenze energetiche,
      pipeline vocali e la modalità codice quando abilitata — rimangono disponibili
      con le loro operazioni di scrittura bloccate. Stesso interruttore della scheda
      Tools dell'interfaccia web. Disattivato per impostazione predefinita. Richiede
      il riavvio per avere effetto.
  redact_secrets:
    name: Rimuovi Segreti
    description: Rimuove le informazioni riservate dalle risposte degli strumenti
      prima che raggiungano l'assistente IA. Le opzioni dell'applicazione (add-on)
      e i campi di integrazione contrassegnati come password vengono sostituiti con
      un marcatore di impostato/vuoto (in modo che "questa credenziale è configurata?"
      rimanga interrogabile), e le risposte di altri strumenti vengono ripulite dai
      valori segreti che il server ha già visto (i valori più corti di 6 caratteri
      vengono ignorati, poiché la sostituzione di frammenti minuscoli corromperebbe
      output non correlati). I campi non contrassegnati come password dal loro schema
      non possono essere rilevati. Disattivato per impostazione predefinita.
  enable_beta_features:
    name: Attiva le funzioni beta (principale)
    description: ⚠ PERICOLO — questi strumenti possono DANNEGGIARE PERMANENTEMENTE
      la tua installazione di Home Assistant. Scrivono nella tua configurazione YAML,
      nel tuo filesystem, installano componenti personalizzati, eseguono Python arbitrario
      in sandbox e modificano le docstring degli strumenti che l'IA vede. Non c'è
      alcuna garanzia e nessun supporto garantito — li abiliti a TUO RISCHIO. Esegui
      un backup di Home Assistant prima di attivarli, e non abilitarli mai in produzione
      senza uno. Interruttore principale per i sotto-flag sperimentali sottostanti;
      i sotto-flag vengono ignorati a runtime mentre questo interruttore principale
      è disattivato, anche se esplicitamente impostati su true. Lo stesso interruttore
      è anche presente nell'interfaccia utente delle impostazioni web sotto "Funzionalità
      beta (pericolose)" — entrambe le superfici si riflettono a vicenda al riavvio.
  enable_yaml_config_editing:
    name: Attiva la modifica della configurazione YAML (beta)
    description: Funzione beta. Consente agli assistenti di IA di aggiungere, sostituire
      o rimuovere chiavi di primo livello in configuration.yaml e in packages/*.yaml.
      Sono ammesse solo le chiavi in elenco (per esempio template, sensor, command_line,
      mqtt, knx); le chiavi fondamentali come homeassistant, http e recorder sono
      bloccate. Ogni modifica convalida la sintassi YAML, esegue un controllo della
      configurazione e crea un backup automatico. Le modifiche alla maggior parte
      delle chiavi richiedono un riavvio completo di HA per avere effetto. Vedi docs/beta.md
      per i limiti noti. Quando sono disponibili, è preferibile usare gli strumenti
      dedicati (automazioni, script, scene, helper, sensori template). RICHIEDE che
      l'opzione principale «Attiva le funzioni beta» qui sopra (e nell'interfaccia
      web) sia attiva, altrimenti questo sotto-flag viene ignorato in esecuzione a
      prescindere dal valore impostato qui.
  enable_yaml_packages_automation:
    name: Consenti automation in packages/*.yaml
    description: Sotto-opzione della modifica della configurazione YAML. Quando è
      attiva, ha_config_set_yaml accetta yaml_path='automation' all'interno di packages/*.yaml.
      Quando è disattiva, la chiamata viene rifiutata sia lato client sia lato server.
      Lo strumento in modalità storage (ha_config_set_automation) non è interessato.
      Disattivata per impostazione predefinita; ha effetto solo se anche «Attiva la
      modifica della configurazione YAML» qui sopra è attiva.
  enable_yaml_packages_script:
    name: Consenti script in packages/*.yaml
    description: Sotto-opzione della modifica della configurazione YAML. Quando è
      attiva, ha_config_set_yaml accetta yaml_path='script' all'interno di packages/*.yaml.
      Quando è disattiva, la chiamata viene rifiutata sia lato client sia lato server.
      Lo strumento in modalità storage (ha_config_set_script) non è interessato. Disattivata
      per impostazione predefinita; ha effetto solo se anche «Attiva la modifica della
      configurazione YAML» qui sopra è attiva.
  enable_yaml_packages_scene:
    name: Consenti scene in packages/*.yaml
    description: Sotto-opzione della modifica della configurazione YAML. Quando è
      attiva, ha_config_set_yaml accetta yaml_path='scene' all'interno di packages/*.yaml.
      Quando è disattiva, la chiamata viene rifiutata sia lato client sia lato server.
      Lo strumento in modalità storage (ha_config_set_scene) non è interessato. Disattivata
      per impostazione predefinita; ha effetto solo se anche «Attiva la modifica della
      configurazione YAML» qui sopra è attiva.
  enable_yaml_edit_confirm:
    name: Richiedi la conferma per le modifiche YAML (anteprima delle differenze)
    description: 'Sotto-opzione della modifica della configurazione YAML, ATTIVA per
      impostazione predefinita (consigliata). La prima chiamata a ha_config_set_yaml
      restituisce un diff unificato di ciò che verrebbe modificato su disco più un
      token di conferma, e non scrive nulla; la modifica viene applicata solo quando
      la chiamata viene ripetuta con quel token. Esiste perché le modifiche indesiderate
      al di fuori di quella richiesta vengano intercettate prima che finiscano su
      disco (issue #1720). Disattivala solo per risparmiare un passaggio di andata
      e ritorno a ogni modifica.'
  enable_code_mode:
    name: Attiva la sandbox per strumenti personalizzati (beta)
    description: Funzionalità beta. Abilita lo strumento ha_manage_custom_tool, che
      consente agli assistenti IA di creare, eseguire, salvare ed eliminare codice
      Python personalizzato in un ambiente sicuro isolato (sandbox) quando nessun🇹
      strumento integrato è in grado di gestire la richiesta. Il codice viene eseguito
      in un interprete isolato senza accesso al filesystem o di rete arbitrario. Il
      codice nella sandbox può raggiungere l'API REST di HA (api_get/api_post), inviare
      comandi WebSocket (ws_send), chiamare strumenti MCP esistenti (call_tool) o
      rimuovere uno strumento salvato (delete_saved_tool). Gli strumenti salvati persistono
      in /data/saved_tools.json per impostazione predefinita in modo da sopravvivere
      ai riavvii dell'applicazione (add-on) e sono visibili a qualsiasi client in
      grado di connettersi. Vedi docs/beta.md per le limitazioni note. Richiede il
      riavvio per avere effetto. RICHIEDE che l'interruttore principale "Enable beta
      features" sopra (e nell'interfaccia web) sia attivo, altrimenti questo sotto-parametro
      viene ignorato in esecuzione indipendentemente dal valore impostato qui.
  enable_lite_docstrings:
    name: Attiva le docstring ridotte degli strumenti (beta)
    description: 'Funzione beta. Sostituisce le docstring su 15 strumenti ha-mcp pesanti
      (ha_config_get_automation, ha_config_set_automation, ha_config_get_script, ha_config_set_script,
      ha_config_get_scene, ha_config_set_scene, ha_config_list_helpers, ha_config_set_helper,
      ha_config_get_dashboard, ha_config_set_dashboard, ha_call_service, ha_config_set_yaml,
      ha_search, ha_manage_backup, ha_report_issue) con varianti più brevi che rimandano
      i dettagli di schema ed esempio allo strumento ha_get_skill_guide (o alla sua
      risorsa skill://). Un''eccezione: ha_report_issue rimanda invece al campo delle
      istruzioni della propria risposta. La regolazione dell''impostazione del suggerimento
      di backup si applica comunque in modalità ridotta. ATTENZIONE: questo riduce
      l''utilizzo di token inattivi, ma potrebbe peggiorare le prestazioni del LLM
      — le descrizioni ridotte si affidano al fatto che il LLM chiami effettivamente
      lo strumento di competenza o legga la risorsa di competenza per i dettagli,
      cosa non garantita (alcuni modelli salteranno la chiamata allo strumento extra
      e finiranno con meno indicazioni rispetto a prima). Ideale in abbinamento a
      un client che supporta le risorse MCP o con enable_tool_search. Richiede il
      riavvio per avere effetto. RICHIEDE che l''interruttore principale "Enable beta
      features" sopra (e nell''interfaccia web) sia attivo — altrimenti questo sotto-flag
      viene ignorato in esecuzione indipendentemente dal suo valore qui.'
  enable_mandatory_bps:
    name: Allega le skill di buone pratiche alle scritture
    description: 'Interruttore principale della funzione che consegna il contenuto
      delle skill agli strumenti di scrittura (issue #1182). Quando è attivo (impostazione
      predefinita), i sei strumenti di scrittura della configurazione (automazioni,
      script, scene, helper, dashboard, YAML grezzo) allegano i file di riferimento
      canonici sulle buone pratiche di Home Assistant sotto `skill_content` a ogni
      scrittura riuscita e incorporano automaticamente le sezioni di riferimento citate
      dagli avvisi sulle buone pratiche. Ogni strumento espone inoltre un parametro
      `MandatoryBPS` per singola chiamata, che l''agente può impostare su false nelle
      chiamate successive una volta ottenuti i contenuti. Quando questo interruttore
      principale è disattivo NON viene inviato alcun skill_content, a prescindere
      dal parametro per singola chiamata o dagli avvisi sulle buone pratiche. Si consiglia
      di lasciarlo attivo come prima scelta; disattivalo solo per modelli con finestre
      di contesto molto piccole. Disattivarlo può peggiorare l''accuratezza delle
      scritture. Richiede il riavvio per avere effetto.'
  enable_strict_mandatory_bps:
    name: Modalità rigorosa per le buone pratiche
    description: 'Modalità rigorosa: impedisce al client di usare lo strumento finché
      non è in grado di dimostrare di aver letto le buone pratiche. Mentre è attiva,
      i sei strumenti di scrittura soggetti alle buone pratiche (automazioni, script,
      scene, helper, dashboard, YAML grezzo) sono bloccati e restituiscono un errore
      che invita il client a leggere la skill sulle buone pratiche tramite ha_get_skill_guide
      e a restituire la chiave di conferma che ottiene lì. Mentre è attiva, lo strumento
      ha_get_skill_guide resta forzatamente abilitato: è l''unico a pubblicare la
      chiave di conferma. È figlia dell''opzione «Allega le skill di buone pratiche
      alle scritture» qui sopra e resta inerte finché quella è disattivata. Richiede
      il riavvio per avere effetto.'
  enable_filesystem_tools:
    name: Attiva gli strumenti per il filesystem (beta)
    description: 'Imposta HAMCP_ENABLE_FILESYSTEM_TOOLS=true. Abilita l''accesso diretto
      in lettura e scrittura al filesystem di Home Assistant. ATTENZIONE: questo dà
      al server MCP un accesso diretto e delicato ai file del tuo sistema. Attivalo
      solo se ti fidi dell''assistente di IA per le operazioni sui file. Richiede
      il riavvio per avere effetto. RICHIEDE che l''opzione principale «Attiva le
      funzioni beta» qui sopra (e nell''interfaccia web) sia attiva, altrimenti questo
      sotto-flag viene ignorato in esecuzione a prescindere dal valore impostato qui.'
  enable_dashboard_screenshot:
    name: Attiva la modalità screenshot delle dashboard (beta)
    description: Funzionalità beta — disattivata per impostazione predefinita. Aggiunge
      lo strumento ha_get_dashboard_screenshot oltre alle opzioni include_screenshot
      / return_screenshot sugli strumenti di lettura/scrittura delle dashboard, in
      modo che gli assistenti IA possano ispezionare una o più immagini Lovelace responsive
      (ad es. per verificare una dashboard appena creata). Supporta viste denominate
      stabili, batch per cellulare/tablet/desktop e output in formato PNG/JPEG/WebP/BMP.
      Il rendering viene eseguito in un motore separato e opzionale — l'applicazione
      (add-on) "Puppet" di balloob, Chromium senza interfaccia grafica — che installi
      una volta (aggiungi il repository di balloob all'App store, quindi installa
      "Puppet") e a cui fornisci un token di accesso a lungo termine; sulle distribuzioni
      Docker/Container esegui quel motore come sidecar e imposti HAMCP_DASHBOARD_SCREENSHOT_ENGINE_URL.
      Nessun componente pesante viene installato a meno che tu non abiliti questa
      funzione e installi il motore. Richiede il riavvio per avere effetto. RICHIEDE
      che l'interruttore principale "Enable beta features" sopra (e nell'interfaccia
      web) sia attivo, altrimenti questo sotto-parametro viene ignorato in esecuzione
      indipendentemente dal valore impostato qui.
  enable_auto_backup:
    name: Attiva il backup automatico delle modifiche
    description: 'Cattura uno snapshot per entità prima di ogni chiamata a strumenti
      MCP di scrittura/distruttivi (automazione, script, scena, helper, dashboard,
      risorsa dashboard, etichetta, categoria, gruppo, zona, area, calendario, todo,
      entità, dispositivo, integrazione e strumenti di rimozione/eliminazione correlati).
      Il limite di frequenza del backup automatico definisce la frequenza con cui
      ciò avviene: 0 (predefinito) cattura ad ogni chiamata di questo tipo, N>0 al
      massimo uno snapshot ogni N minuti per entità. Gli snapshot vengono salvati
      come file YAML sotto /data/ha_mcp_backups/ (sovrascrivi tramite HAMCP_BACKUP_DIR)
      e elencati, ripristinati o eliminati tramite la scheda Backups nell''interfaccia
      utente delle impostazioni web o tramite ha_manage_backup(scope=''edits'', ...).
      Per questi domini la cattura è al meglio delle possibilità — un fallimento registra
      un WARNING e la scrittura procede. Gli strumenti per file e YAML grezzo sono
      l''eccezione: ha_write_file, ha_delete_file e ha_config_set_yaml trattano lo
      snapshot come una precondizione, quindi una scrittura tramite essi viene rifiutata
      mentre questo è disattivato, e una cattura fallita la blocca. Attivato per impostazione
      predefinita; deselezionando si rinuncia alle catture al meglio delle possibilità
      e si disattivano con esse gli strumenti per file e YAML grezzo. Richiede un
      riavvio per avere effetto.'
  auto_backup_throttle_minutes:
    name: Limitazione del backup automatico (minuti)
    description: Finestra di limitazione per entità. 0 (impostazione predefinita)
      cattura uno snapshot a ogni scrittura coperta. N>0 cattura al massimo uno snapshot
      ogni N minuti per entità. Intervallo 0–1440.
  auto_backup_retain_per_entity:
    name: Conservazione dei backup automatici (per entità)
    description: Numero massimo di snapshot conservati per entità. Gli snapshot più
      vecchi oltre questo limite vengono ruotati a ogni cattura riuscita. Valore predefinito
      100, intervallo 1–10000.
  enable_snapshot_delete:
    name: Consenti l'eliminazione degli snapshot
    description: 'Consente a ha_manage_backup di eliminare gli archivi tarball degli
      snapshot completi di HA (scope=''snapshot'', action=''delete''). Disattivato
      per impostazione predefinita: uno snapshot può essere l''ultimo punto di ripristino
      dopo una modifica sbagliata, quindi deve essere una persona ad autorizzarlo
      qui. Anche quando è attivo, i backup pianificati, lo snapshot più recente rimasto
      e tutto ciò che è più nuovo della soglia di anzianità qui sotto restano protetti.'
  snapshot_delete_min_age_days:
    name: Età minima dello snapshot per l'eliminazione (giorni)
    description: Uno snapshot deve avere almeno questa anzianità per poter essere
      eliminato. Intervallo 0–365; 0 disattiva la soglia (restano comunque valide
      le protezioni dello snapshot più recente e dei backup pianificati). Valore predefinito
      7.
  tool_search_max_results:
    name: Numero massimo di risultati della ricerca degli strumenti
    description: 'Numero massimo di strumenti restituiti da ha_search_tools quando
      la ricerca degli strumenti è attiva. Valori bassi (2-3) risparmiano token di
      contesto ma possono escludere strumenti pertinenti. Intervallo: 2-10. Richiede
      il riavvio.'
  disabled_tools:
    name: Strumenti disattivati (separati da virgole)
    description: 'Gli strumenti elencati qui vengono forzatamente disattivati e bloccati
      nell''interfaccia web delle impostazioni (scheda Strumenti): non possono essere
      riattivati lì senza prima togliere questa opzione. Un piccolo insieme di strumenti
      obbligatori (ha_search, ha_get_overview, ha_get_state, ha_report_issue, ha_manage_backup)
      non può essere disattivato e continua a funzionare anche se elencato qui. ha_get_skill_guide
      può essere disattivato solo mentre la modalità rigorosa per le buone pratiche
      (enable_strict_mandatory_bps) è disattivata. Nomi degli strumenti separati da
      virgole (per esempio ha_call_event,ha_eval_template).'
  pinned_tools:
    name: Strumenti fissati (separati da virgole)
    description: 'Gli strumenti elencati qui restano fissati in modo bloccato: compaiono
      in cima alla scheda Strumenti e non possono essere sganciati dall''interfaccia
      web delle impostazioni senza prima togliere questa opzione. Utile in combinazione
      con la ricerca degli strumenti. Nomi degli strumenti separati da virgole.'
  verify_ssl:
    name: Verifica il certificato TLS
    description: 'Verifica il certificato TLS del server Home Assistant. L''app (componente
      aggiuntivo) si connette tramite il proxy Supervisor, quindi questo normalmente
      non ha effetto e dovrebbe rimanere abilitato. Disabilita solo se hai riconfigurato
      l''app (componente aggiuntivo) per comunicare con HA su un nome host HTTPS pubblico
      con un certificato autofirmato o una discrepanza del nome host. La disabilitazione
      indebolisce la sicurezza del trasporto: lasciala attiva a meno che tu non sappia
      di averne bisogno. Richiede il riavvio per avere effetto.'
