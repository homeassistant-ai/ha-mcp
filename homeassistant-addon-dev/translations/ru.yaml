---
# GENERATED FILE — do not edit. Translations live in
# src/ha_mcp/settings_ui/locales/ru.json (keys addon.*, features.*,
# addon_dev.*); regenerate with: python scripts/generate_locales.py
configuration:
  backup_hint:
    name: Уровень рекомендации полного снимка HA (для LLM)
    description: 'Настраивает формулировку подсказки, которую видит LLM в описании

      инструмента `ha_manage_backup(scope=''snapshot'')`, о том, когда следует

      предложить создание полной резервной копии Home Assistant в виде tar-архива

      перед рискованными операциями (например, массовым удалением устройств).

      Влияет ТОЛЬКО на одно это предложение в подсказке для LLM.


      Для автоматического создания снимков перед каждым изменением автоматизаций,

      скриптов, помощников и т. д. используйте отдельный переключатель

      **Включить автоматическое резервное копирование изменений** ниже.'
  secret_path:
    name: Переопределение секретного пути
    description: 'Необязательный пользовательский HTTP-путь к MCP-серверу. Оставьте
      пустым, чтобы использовать автоматически созданный защищённый путь.

      '
  enable_tool_search:
    name: Включить поиск инструментов
    description: 'Заменяет полный каталог инструментов поиском по запросу. Уменьшает
      неиспользуемый контекст примерно на 90 % — до порядка 5 тыс. токенов. ⚠️ НЕ
      включайте этот параметр в клиентах с собственным встроенным поиском инструментов
      и отложенными инструментами (claude.ai, Claude Desktop, Claude Code): два слоя
      поиска конфликтуют, а встроенный поиск инструментов клиента там — лучший выбор;
      оставьте этот параметр выключенным. Будут ли инструменты отложенными, зависит
      от сочетания клиента и модели: используйте этот параметр, когда ваша конфигурация
      загружает полный каталог сразу — модели без собственных отложенных инструментов
      (например, Gemini, локальные OpenAI-совместимые модели, Claude Haiku), клиенты,
      которые встраивают все схемы инструментов независимо от модели (например, GitHub
      Copilot CLI), или небольшие контекстные окна. Некоторые модели Codex и ChatGPT
      тоже включают отложенные инструменты — уточните непосредственно у своего клиента/модели,
      какие функции он поддерживает, чтобы не оставлять этот параметр включённым без
      необходимости. Инструменты находятся через ha_search_tools и выполняются через
      распределённые по категориям прокси (чтение, запись, удаление). Для применения
      требуется перезапуск.'
  enable_tool_security_policies:
    name: Включить политики безопасности инструментов (расширенная настройка)
    description: Требует подтверждения пользователя для особо важных вызовов инструментов
      (управление замками и сигнализацией, запись автоматизаций и т. д.). Когда вызывается
      защищённый инструмент, агент предлагает пользователю открыть вкладку «Политики
      безопасности инструментов» в веб-интерфейсе и нажать «Одобрить», прежде чем
      вызов будет выполнен. Правила для отдельных инструментов с необязательными условиями
      для аргументов настраиваются на вкладке «Политики безопасности инструментов».
      По умолчанию выключено. Для применения требуется перезапуск.
  enable_security_policy_tool:
    name: Разрешить ИИ-агентам редактировать политики безопасности инструментов
    description: 'Регистрирует инструмент ha_manage_security_policy, который позволяет
      подключенным ИИ-агентам читать и переписывать политики безопасности инструментов
      — включая удаление шлюзов утверждения. По умолчанию выключено. Независимо от
      опции «Политики безопасности инструментов» выше: это контролирует, кто может
      редактировать правила, а не то, применяются ли они. Инструмент не может видеть
      или принимать решения по ожидающим утверждениям. Чтобы человек оставался в процессе,
      ограничьте доступ к инструменту до его включения: включите «security gated»
      для «Manage Security Policy» на вкладке «Инструменты» веб-интерфейса. Требуется
      перезапуск для вступления в силу.'
  read_only_mode:
    name: Режим только для чтения
    description: Отключает все инструменты записи и убирает возможность для инструментов
      выполнять любые операции записи или деструктивные вызовы. Инструменты смешанного
      чтения/записи (резервные копии, приложения (аддоны), настройки энергии, голосовые
      конвейеры и режим кода при включении) остаются доступными с блокировкой операций
      записи. Тот же переключатель, что и на вкладке «Инструменты» в веб-интерфейсе.
      Выключен по умолчанию. Для применения требуется перезапуск.
  redact_secrets:
    name: Скрывать секреты
    description: Удаляет секретные данные из ответов инструментов до того, как они
      попадут к ИИ-ассистенту. Опции приложения (аддона) и поля интеграций, помеченные
      как пароли, заменяются маркером заданного/пустого значения (чтобы оставался
      доступным ответ на вопрос «настроены ли эти учетные данные?»), а в ответах других
      инструментов маскируются секретные значения, которые сервер уже видел (значения
      короче 6 символов пропускаются, так как замена мелких фрагментов приведет к
      повреждению несвязанного вывода). Поля, не помеченные их схемой как пароли,
      обнаружить невозможно. Выключен по умолчанию.
  enable_beta_features:
    name: Включить бета-функции (главный переключатель)
    description: ⚠ ОПАСНО — эти инструменты могут БЕСПОВОРОТНО ПОВРЕДИТЬ вашу установку
      Home Assistant. Они записывают данные в вашу YAML-конфигурацию, файловую систему,
      устанавливают пользовательские компоненты, запускают произвольный Python в песочнице
      и редактируют строки документации инструментов, которые видит ИИ. Гарантия и
      поддержка отсутствуют — вы включаете их на СВОЙ СТРАХ И РИСК. Сделайте резервную
      копию Home Assistant перед включением этой функции и никогда не включайте ее
      в рабочей среде без резервной копии. Главный переключатель для экспериментальных
      подфлагов ниже; подфлаги игнорируются во время выполнения, пока этот главный
      переключатель выключен, даже если они явно установлены в true. Этот же переключатель
      также отображается в пользовательском интерфейсе веб-настроек в разделе "Бета-функции
      (опасно)" — любое изменение отражается на другом после перезапуска.
  enable_yaml_config_editing:
    name: Включить редактирование конфигурации YAML (бета)
    description: Бета-функция. Позволяет ИИ-помощникам добавлять, заменять и удалять
      ключи верхнего уровня в configuration.yaml и packages/*.yaml. Разрешены только
      ключи из белого списка (например, template, sensor, command_line, mqtt, knx);
      основные ключи, такие как homeassistant, http и recorder, заблокированы. Каждое
      изменение проходит проверку синтаксиса YAML и конфигурации, а также создаёт
      автоматическую резервную копию. Для применения изменений большинства ключей
      требуется полный перезапуск HA. Известные ограничения описаны в docs/beta.md.
      По возможности следует использовать специализированные инструменты (для автоматизаций,
      скриптов, сцен, помощников и шаблонных датчиков). ТРЕБУЕТ включённого главного
      переключателя «Включить бета-функции» выше (и в веб-интерфейсе), иначе этот
      подпараметр игнорируется во время выполнения независимо от указанного здесь
      значения.
  enable_yaml_packages_automation:
    name: Разрешить automation в packages/*.yaml
    description: Подпараметр редактирования конфигурации YAML. Если он включён, ha_config_set_yaml
      принимает yaml_path='automation' внутри packages/*.yaml. Если выключен, вызов
      отклоняется и на стороне клиента, и на стороне сервера. Инструмент для режима
      хранения (ha_config_set_automation) не затрагивается. По умолчанию ВЫКЛЮЧЕНО;
      действует, только если расположенный выше параметр «Включить редактирование
      конфигурации YAML» также включён.
  enable_yaml_packages_script:
    name: Разрешить script в packages/*.yaml
    description: Подпараметр редактирования конфигурации YAML. Если он включён, ha_config_set_yaml
      принимает yaml_path='script' внутри packages/*.yaml. Если выключен, вызов отклоняется
      и на стороне клиента, и на стороне сервера. Инструмент для режима хранения (ha_config_set_script)
      не затрагивается. По умолчанию ВЫКЛЮЧЕНО; действует, только если расположенный
      выше параметр «Включить редактирование конфигурации YAML» также включён.
  enable_yaml_packages_scene:
    name: Разрешить scene в packages/*.yaml
    description: Подпараметр редактирования конфигурации YAML. Если он включён, ha_config_set_yaml
      принимает yaml_path='scene' внутри packages/*.yaml. Если выключен, вызов отклоняется
      и на стороне клиента, и на стороне сервера. Инструмент для режима хранения (ha_config_set_scene)
      не затрагивается. По умолчанию ВЫКЛЮЧЕНО; действует, только если расположенный
      выше параметр «Включить редактирование конфигурации YAML» также включён.
  enable_yaml_edit_confirm:
    name: Требовать подтверждение изменений YAML (предпросмотр различий)
    description: 'Подпараметр редактирования конфигурации YAML, по умолчанию ВКЛЮЧЁН
      (рекомендуется). Первый вызов ha_config_set_yaml возвращает унифицированный
      diff с точным представлением будущих изменений на диске и токеном подтверждения,
      ничего не записывая. Изменение записывается только при повторном вызове с этим
      токеном. Это позволяет обнаружить непреднамеренные изменения за пределами запрошенной
      правки до их записи на диск (issue #1720). Отключайте только для экономии одного
      обмена запросом и ответом при каждом изменении.'
  enable_code_mode:
    name: Включить песочницу пользовательских инструментов (бета)
    description: Бета-функция. Включает инструмент ha_manage_custom_tool, который
      позволяет ИИ-ассистентам создавать, запускать, сохранять и удалять пользовательский
      код на Python в защищенной песочнице, когда ни один встроенный инструмент не
      может справиться с запросом. Код выполняется в изолированном интерпретаторе
      без доступа к файловой системе или произвольного сетевого доступа. Код в песочнице
      может обращаться к REST API HA (api_get/api_post), отправлять команды WebSocket
      (ws_send), вызывать существующие MCP-инструменты (call_tool) или удалять сохраненный
      инструмент (delete_saved_tool). Сохраненные инструменты по умолчанию сохраняются
      в /data/saved_tools.json, поэтому они переживают перезапуски приложения (аддона)
      и видны любому клиенту, который может подключиться. См. docs/beta.md для известных
      ограничений. Требуется перезапуск для вступления в силу. ТРЕБУЕТСЯ, чтобы главный
      переключатель «Включить бета-функции» выше (и в веб-интерфейсе) был включен
      — в противном случае этот субобъект игнорируется во время выполнения независимо
      от его значения здесь.
  enable_lite_docstrings:
    name: Включить сокращённые строки документации инструментов (бета)
    description: 'Бета-функция. Заменяет строки документации нескольких объёмных инструментов
      ha-mcp (автоматизации, скрипты, сцены, помощники, панели, ha_call_service, ha_config_set_yaml)
      сокращёнными вариантами, которые переносят описание схем и примеров в инструмент
      ha_get_skill_guide (или его ресурс skill://). ПРЕДУПРЕЖДЕНИЕ: это сокращает
      неиспользуемый объём токенов, но может ухудшить работу LLM, поскольку сокращённые
      описания предполагают, что LLM действительно вызовет инструмент навыка или прочитает
      ресурс навыка для получения подробностей, а это не гарантируется. Некоторые
      модели пропускают дополнительный вызов инструмента и в итоге получают меньше
      указаний, чем раньше. Лучше всего использовать с клиентом, поддерживающим ресурсы
      MCP, или вместе с enable_tool_search. Для применения требуется перезапуск. ТРЕБУЕТ
      включённого главного переключателя «Включить бета-функции» выше (и в веб-интерфейсе),
      иначе этот подпараметр игнорируется во время выполнения независимо от указанного
      здесь значения.'
  enable_mandatory_bps:
    name: Прикреплять навыки с рекомендациями при записи
    description: 'Главный переключатель функции доставки содержимого навыков для инструментов
      записи (issue #1182). Если он включён (по умолчанию), шесть инструментов записи
      конфигурации (автоматизации, скрипты, сцены, помощники, панели и необработанный
      YAML) при каждой успешной записи прикрепляют канонические справочные файлы с
      рекомендациями Home Assistant в поле `skill_content`, а также автоматически
      встраивают все разделы справки, упомянутые в предупреждениях о рекомендациях.
      Каждый инструмент также предоставляет параметр `MandatoryBPS` для отдельного
      вызова, который агент может установить в false при последующих вызовах после
      получения содержимого. Если этот главный переключатель выключен, содержимое
      skill_content НЕ отправляется независимо от параметра отдельного вызова или
      предупреждений BP. Рекомендуется оставить ВКЛЮЧЁННЫМ; отключайте только для
      моделей с очень маленьким контекстным окном. Отключение может снизить точность
      записи. Для применения требуется перезапуск.'
  enable_strict_mandatory_bps:
    name: Строгий режим рекомендаций
    description: 'Строгий режим не позволяет клиенту использовать инструмент, пока
      тот не подтвердит, что прочитал рекомендации. Пока режим включён, шесть использующих
      рекомендации инструментов записи (автоматизации, скрипты, сцены, помощники,
      панели и необработанный YAML) блокируются и возвращают ошибку, предписывающую
      клиенту прочитать навык с рекомендациями через ha_get_skill_guide и передать
      полученный там ключ подтверждения. Пока режим включён, инструмент ha_get_skill_guide
      принудительно включён и заблокирован от отключения: только он выдаёт ключ подтверждения.
      Это дочерний параметр расположенного выше параметра «Прикреплять навыки с рекомендациями
      при записи», который не действует, пока родительский параметр выключен. Для
      применения требуется перезапуск.'
  enable_filesystem_tools:
    name: Включить инструменты файловой системы (бета)
    description: 'Устанавливает HAMCP_ENABLE_FILESYSTEM_TOOLS=true. Разрешает прямой
      доступ на чтение и запись к файловой системе Home Assistant. ПРЕДУПРЕЖДЕНИЕ:
      это даёт MCP-серверу прямой доступ к конфиденциальным файлам вашей системы.
      Включайте только в том случае, если доверяете ИИ-помощнику операции с файлами.
      Для применения требуется перезапуск. ТРЕБУЕТ включённого главного переключателя
      «Включить бета-функции» выше (и в веб-интерфейсе), иначе этот подпараметр игнорируется
      во время выполнения независимо от указанного здесь значения.'
  enable_dashboard_screenshot:
    name: Включить режим снимков панели (бета)
    description: Бета-функция — отключена по умолчанию. Добавляет инструмент ha_get_dashboard_screenshot,
      а также параметры include_screenshot / return_screenshot в инструменты получения/установки
      дашборда, чтобы ИИ-ассистенты могли просматривать одно или несколько адаптивных
      изображений Lovelace (например, чтобы проверить созданный ими дашборд). Поддерживает
      стабильные именованные виды, пакеты для мобильных устройств/планшетов/ПК и вывод
      в форматах PNG/JPEG/WebP/BMP. Рендеринг выполняется в отдельном опциональном
      движке — приложении (аддоне) «Puppet» от balloob, представляющем собой Chromium
      без графического интерфейса, который вы устанавливаете один раз (добавьте репозиторий
      balloob в магазин приложений, затем установите «Puppet») и предоставляете ему
      долговечный токен доступа; в развертываниях Docker/Container вы запускаете этот
      движок как сайдкар и задаете HAMCP_DASHBOARD_SCREENSHOT_ENGINE_URL. Ничего тяжелого
      не устанавливается, пока вы одновременно не включите это и не установите движок.
      Требуется перезапуск для вступления в силу. ТРЕБУЕТСЯ, чтобы главный переключатель
      «Включить бета-функции» выше (и в веб-интерфейсе) был включен — в противном
      случае этот субобъект игнорируется во время выполнения независимо от его значения
      здесь.
  enable_auto_backup:
    name: Включить автоматическое резервное копирование изменений
    description: 'Создает снимок для каждой сущности перед каждым вызовом обернутого
      инструмента MCP для записи/деструктивных операций (automation, script, scene,
      helper, dashboard, dashboard resource, label, category, group, zone, area, calendar,
      todo, entity, device, integration, а также связанные инструменты удаления).
      Ограничитель авторезервного копирования определяет частоту создания снимков:
      0 (по умолчанию) создает снимок при каждом таком вызове, N>0 — не более одного
      снимка на N минут для каждой сущности. Снимки сохраняются как YAML-файлы в директории
      /data/ha_mcp_backups/ (можно переопределить через HAMCP_BACKUP_DIR) и могут
      быть просмотрены, восстановлены или удалены через вкладку «Резервные копии»
      в пользовательском интерфейсе веб-настроек или с помощью ha_manage_backup(scope=''edits'',
      ...). Для этих доменов создание снимка осуществляется по принципу «максимальных
      усилий» — при сбое регистрируется ПРЕДУПРЕЖДЕНИЕ, и запись продолжается. Инструменты
      для работы с файлами и необработанным YAML являются исключением: ha_write_file,
      ha_delete_file и ha_config_set_yaml рассматривают снимок как предварительное
      условие, поэтому запись через них отклоняется, если эта функция отключена, а
      неудачное создание снимка блокирует ее. Включено по умолчанию; снятие флажка
      отключает создание снимков по принципу «максимальных усилий» и выводит из строя
      инструменты для работы с файлами и необработанным YAML. Требуется перезапуск
      для вступления в силу.'
  auto_backup_throttle_minutes:
    name: Интервал автоматического резервного копирования (минуты)
    description: 'Интервал ограничения для каждой сущности. Значение 0 (по умолчанию)
      создаёт снимок при каждой обёрнутой операции записи. При N>0 создаётся не более
      одного снимка сущности за N минут. Диапазон: 0–1440.'
  auto_backup_retain_per_entity:
    name: Хранение автоматических резервных копий (на сущность)
    description: 'Максимальное количество снимков, сохраняемых для каждой сущности.
      При каждом успешном создании снимка более старые снимки сверх этого лимита удаляются
      по ротации. По умолчанию: 100, диапазон: 1–10000.'
  enable_snapshot_delete:
    name: Разрешить удаление снимков
    description: 'Позволяет ha_manage_backup удалять полные tar-архивы снимков HA
      (scope=''snapshot'', action=''delete''). По умолчанию выключено: снимок может
      оказаться последней точкой восстановления после ошибочного изменения, поэтому
      пользователь должен явно разрешить это здесь. Даже после включения защищёнными
      остаются запланированные резервные копии, самый новый из оставшихся снимков
      и всё, что новее указанного ниже минимального возраста.'
  snapshot_delete_min_age_days:
    name: Минимальный возраст снимка для удаления (дни)
    description: 'Снимок можно удалить, только если он не моложе указанного возраста.
      Диапазон: 0–365; значение 0 отключает это ограничение (защита самого нового
      снимка и запланированных резервных копий продолжает действовать). По умолчанию:
      7.'
  tool_search_max_results:
    name: Максимальное количество результатов поиска инструментов
    description: 'Максимальное количество инструментов, возвращаемых ha_search_tools
      при включённом поиске инструментов. Меньшие значения (2–3) экономят токены контекста,
      но могут пропустить подходящие инструменты. Диапазон: 2–10. Требуется перезапуск.'
  disabled_tools:
    name: Отключённые инструменты (через запятую)
    description: 'Перечисленные здесь инструменты принудительно отключаются и блокируются
      в веб-интерфейсе настроек на вкладке «Инструменты»: их нельзя включить там снова,
      не очистив сначала этот параметр. Небольшой набор обязательных инструментов
      (ha_search, ha_get_overview, ha_get_state, ha_report_issue, ha_manage_backup)
      нельзя отключить: они продолжат работать, даже если указаны здесь. ha_get_skill_guide
      можно отключить, только когда строгий режим рекомендаций (enable_strict_mandatory_bps)
      выключен. Укажите имена инструментов через запятую (например, ha_call_event,ha_eval_template).'
  pinned_tools:
    name: Закреплённые инструменты (через запятую)
    description: 'Перечисленные здесь инструменты принудительно закрепляются: они
      отображаются в верхней части вкладки «Инструменты», и их нельзя открепить в
      веб-интерфейсе настроек, не очистив сначала этот параметр. Полезно вместе с
      поиском инструментов. Укажите имена инструментов через запятую.'
  verify_ssl:
    name: Проверять сертификат TLS
    description: Проверять TLS-сертификат сервера Home Assistant. Приложение (аддон)
      подключается через прокси Supervisor, поэтому обычно это не оказывает влияния
      и должно быть включено. Отключайте только в случае перенастройки приложения
      (аддона) для связи с HA по публичному HTTPS-имени хоста с самоподписанным сертификатом
      или несовпадением имени хоста. Отключение снижает безопасность передачи данных
      — оставляйте включенным, только если это необходимо. Требуется перезапуск для
      применения.
