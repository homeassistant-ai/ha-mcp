---
# GENERATED FILE — do not edit. Translations live in
# src/ha_mcp/settings_ui/locales/zh-Hans.json (keys addon.*, features.*, advanced.*,
# backup.fields.*, addon_dev.*); regenerate with: python scripts/generate_locales.py
configuration:
  verify_ssl:
    name: Verify TLS certificates
    description: 'Verify the Home Assistant server''s TLS certificate. Turn this off
      only on a trusted network, for a self-signed certificate or a hostname mismatch:
      it weakens transport security.'
  ha_tool_concurrency:
    name: Home Assistant 工具并发数
    description: Optional limit on outer Home Assistant tool calls across all sessions.
      Internal REST, WebSocket, and per-tool fan-out concurrency is unchanged. 0 keeps
      unlimited behavior. A call waiting for capacity fails after 60 seconds. Range
      0–32.
  backup_hint:
    name: Backup hint level
    description: How strongly AI assistants are told to suggest a full Home Assistant
      backup before risky changes. It changes only this hint; automatic edit backups
      have their own setting.
  enable_beta_features:
    name: 启用测试版功能（主开关）
    description: ⚠ 危险 — 这些工具可能会永久损坏您的 Home Assistant 安装。它们会写入您的 YAML 配置、文件系统，安装自定义组件，运行任意沙盒
      Python 代码，并编辑 AI 可见的工具文档字符串。不提供任何担保和支持保证 — 您需自行承担启用它们的风险。在开启此功能前请务必备份 Home Assistant，切勿在没有备份的情况下在生产环境中启用。这是下方实验性子标志的主开关；当此主开关关闭时，即使子标志被明确设置为
      true，它们在运行时也会被忽略。相同的开关也会在网页设置 UI 的“Beta features (dangerous)”下显示 — 任何一处的更改都会在重启后反映到另一处。
  enable_tool_search:
    name: 启用工具搜索
    description: 用基于搜索的发现取代完整工具目录。将空闲上下文减少约 90%，降至约 5K token。⚠️ 如果客户端自带内置工具搜索/延迟工具（claude.ai、Claude
      Desktop、Claude Code），请勿启用此功能——两层搜索会相互冲突，且在这些客户端中其内置工具搜索是更好的选择；请保持关闭。工具是否延迟取决于客户端与模型的组合：当您的配置会一次性加载完整目录时才使用此功能——例如没有原生延迟工具的模型（如
      Gemini、本地 OpenAI 兼容模型、Claude Haiku）、无论模型如何都会内联全部工具架构的客户端（如 GitHub Copilot CLI），或上下文窗口较小时。部分
      Codex 模型和 ChatGPT 也带有延迟工具——请直接向您的客户端/模型确认其具备哪些功能，以免不必要地保持启用此功能。工具通过 ha_search_tools
      发现，并通过分类代理（读/写/删）执行。需要重启才能生效。
  tool_search_max_results:
    name: 工具搜索最大结果数
    description: Maximum number of hidden tools returned per ha_search_tools call
      when tool search is enabled; a pinned tool that ranks inside that top count
      is added as a short name-only entry on top of it. Lower values (2-3) save context
      tokens but may miss relevant tools. Requires restart. Range 2–10.
  enable_tool_security_policies:
    name: 启用工具安全策略（高级）
    description: 将高风险工具调用（锁具/报警控制、自动化写入等）置于用户审批之后。当调用受保护工具时，智能体会提示用户打开 Web UI 中的工具安全策略选项卡并点击批准，调用才会继续。逐工具规则及可选的参数条件在工具安全策略选项卡中配置。默认关闭。需要重启才能生效。
  enable_security_policy_tool:
    name: 允许 AI 代理编辑工具安全策略
    description: 注册 ha_manage_security_policy 工具，该工具允许连接的 AI 代理读取和重写工具安全策略 — 包括移除批准门。默认关闭。独立于上面的“工具安全策略”选项：这控制的是谁可以编辑规则，而不是规则是否被强制执行。该工具无法查看或决定待批准项。为了保持人工参与，请在启用该工具之前对其进行门控：在
      Web UI 的“工具”标签页中，为“Manage Security Policy”打开“security gated”选项。需要重启才能生效。
  read_only_mode:
    name: 只读模式
    description: 关闭所有写入工具，并移除工具执行任何写入或破坏性调用的能力。混合读写工具（备份、应用（附加组件）、能源偏好设置、语音管道，以及启用时的代码模式）在保持可用的同时，其写入操作会被阻止。与网页端
      UI 的“工具”标签页使用相同的开关。默认关闭。需要重启才能生效。
  redact_secrets:
    name: 遮盖密文
    description: 在工具响应到达 AI 助手之前，对其机密信息进行红线遮掩（脱敏）。应用（附加组件）选项和标记为密码的集成字段将被替换为已设置/空标记（以便“此凭据是否已配置？”保持可回答状态），并且其他工具响应将被清除服务器已见过的机密值（长度小于
      6 个字符的值将被跳过，因为替换微小的片段会破坏不相关的输出）。其架构未标记为密码的字段无法被检测到。默认关闭。
  enable_mandatory_bps:
    name: 写入时附加最佳实践技能
    description: '写入工具技能内容投递功能（issue #1182）的主开关。启用时（默认），六个配置写入工具（自动化、脚本、场景、辅助元素、仪表盘、原始
      YAML）会在每次成功写入时于 `skill_content` 下附加规范的 Home Assistant 最佳实践参考文件，并自动嵌入最佳实践警告引用的任何参考章节。每个工具还暴露一个逐调用
      `MandatoryBPS` 参数，智能体在获得内容后的后续调用中可将其设为 false。当此主开关关闭时，无论逐调用参数或 BP 警告如何，都不会输出
      skill_content。建议默认开启；仅在上下文窗口极小的模型上才禁用。关闭可能降低写入准确性。需要重启才能生效。'
  enable_strict_mandatory_bps:
    name: 严格最佳实践模式
    description: 严格模式：在客户端能证明已阅读最佳实践之前，阻止其使用该工具。开启时，六个最佳实践写入工具（自动化、脚本、场景、辅助元素、仪表盘、原始
      YAML）会被阻止并返回错误，指引客户端通过 ha_get_skill_guide 阅读最佳实践技能并回传在那里获得的确认密钥。开启时，ha_get_skill_guide
      工具被锁定启用——它是确认密钥的唯一发布方。为上方“写入时附加最佳实践技能”选项的子项，当其父项关闭时无效。需要重启才能生效。
  enable_yaml_config_editing:
    name: 启用 YAML 配置编辑（测试版）
    description: 测试版功能。允许 AI 助手在 configuration.yaml 和 packages/*.yaml 中添加、替换或删除顶级键。仅允许白名单键（例如
      template、sensor、command_line、mqtt、knx）；核心键如 homeassistant、http、recorder 被阻止。每次编辑都会校验
      YAML 语法、运行配置检查，并创建自动备份。大多数键的更改需要完整重启 HA 才能生效。已知限制见 docs/beta.md。可用时使用专用工具（自动化、脚本、场景、辅助元素、模板传感器）更佳。需要上方（及
      Web UI 中）的主开关“启用测试版功能”开启——否则无论此处值如何，此子开关在运行时都会被忽略。
  enable_yaml_edit_confirm:
    name: YAML 编辑需确认（差异预览）
    description: 'YAML 配置编辑的子开关，默认开启（推荐）。首次 ha_config_set_yaml 调用会返回磁盘上将精确更改的统一差异，外加一个确认令牌，且不写入任何内容；仅当使用令牌重复该调用时，编辑才会落地。其存在是为了在变更到达磁盘前捕获请求编辑之外的意外更改（issue
      #1720）。仅在每次编辑要省一次往返时关闭。'
  enable_yaml_packages_automation:
    name: 允许 automation 出现在 packages/*.yaml
    description: YAML 配置编辑的子开关。开启时，ha_config_set_yaml 接受 packages/*.yaml 中的 yaml_path='automation'。关闭时，客户端和服务器端都会拒绝该调用。存储模式工具（ha_config_set_automation）不受影响。默认关闭；仅当上方“启用
      YAML 配置编辑”也开启时生效。
  enable_yaml_packages_script:
    name: 允许 script 出现在 packages/*.yaml
    description: YAML 配置编辑的子开关。开启时，ha_config_set_yaml 接受 packages/*.yaml 中的 yaml_path='script'。关闭时，客户端和服务器端都会拒绝该调用。存储模式工具（ha_config_set_script）不受影响。默认关闭；仅当上方“启用
      YAML 配置编辑”也开启时生效。
  enable_yaml_packages_scene:
    name: 允许 scene 出现在 packages/*.yaml
    description: YAML 配置编辑的子开关。开启时，ha_config_set_yaml 接受 packages/*.yaml 中的 yaml_path='scene'。关闭时，客户端和服务器端都会拒绝该调用。存储模式工具（ha_config_set_scene）不受影响。默认关闭；仅当上方“启用
      YAML 配置编辑”也开启时生效。
  enable_lite_docstrings:
    name: 启用精简工具文档字符串（测试版）
    description: Beta 功能。将 15 个较重的 ha-mcp 工具（ha_config_get_automation、ha_config_set_automation、ha_config_get_script、ha_config_set_script、ha_config_get_scene、ha_config_set_scene、ha_config_list_helpers、ha_config_set_helper、ha_config_get_dashboard、ha_config_set_dashboard、ha_call_service、ha_config_set_yaml、ha_search、ha_manage_backup、ha_report_issue）的文档字符串替换为更短的变体，将架构和示例详情推迟到
      ha_get_skill_guide 工具（或其 skill:// 资源）。有一个例外：ha_report_issue 转为推迟到其自身响应的 instructions
      字段。调整备份提示设置在轻量模式下仍然适用。警告：这减少了空闲状态下的 Token 使用量，但可能会降低 LLM 性能 — 精简后的描述依赖于 LLM
      实际调用技能工具或读取技能资源来获取详情，但这无法保证（某些模型会跳过额外的工具调用，最终得到的指导比以前少）。最好与支持 MCP 资源的客户端或启用
      enable_tool_search 搭配使用。需要重启才能生效。要求必须开启上方（以及 Web UI 中的）主“启用 Beta 功能”开关 — 否则此子标志在运行时将被忽略，无论其在此处的值如何。
  enable_filesystem_tools:
    name: 启用文件系统工具（测试版）
    description: 设置 HAMCP_ENABLE_FILESYSTEM_TOOLS=true。启用对您的 Home Assistant 文件系统的直接文件读/写访问。警告：这会让
      MCP 服务器直接读写您的 Home Assistant 文件系统，获得对系统的敏感文件访问权限。仅在信任 AI 助手进行文件操作时才启用。需要重启才能生效。需要上方（及
      Web UI 中）的主开关“启用测试版功能”开启——否则无论此处值如何，此子开关在运行时都会被忽略。
  enable_code_mode:
    name: 启用自定义工具沙箱（测试版）
    description: Beta 功能。启用 ha_manage_custom_tool 工具，当没有内置工具可以处理请求时，该工具允许 AI 助手在安全沙箱中创建、运行、保存和删除自定义
      Python 代码。代码在隔离的解释器中运行，无法访问文件系统或任意网络。沙箱代码可以调用 HA REST API (api_get/api_post)、发送
      WebSocket 命令 (ws_send)、调用现有的 MCP 工具 (call_tool) 或删除已保存的工具 (delete_saved_tool)。保存的工具默认持久化到
      /data/saved_tools.json，以便在应用（附加组件）重启后依然保留，并且可对任何能连接的客户端可见。已知限制请参见 docs/beta.md。需要重启才能生效。要求上方（以及
      Web UI 中）的主“启用 Beta 功能”开关处于开启状态 — 否则此子标志在运行时将被忽略，无论此处的值为何。
  enable_dashboard_screenshot:
    name: 启用仪表盘截图模式（测试版）
    description: Beta 功能 — 默认禁用。添加了 ha_get_dashboard_screenshot 工具以及仪表盘获取/设置工具上的 include_screenshot
      / return_screenshot 选项，使 AI 助手能够检查一个或多个响应式 Lovelace 图像（例如验证刚刚创建的仪表盘）。支持稳定的命名视图、手机/平板/电脑批处理以及
      PNG/JPEG/WebP/BMP 输出。渲染在单独的可选引擎中运行（balloob 的“Puppet”App（加载项）、无头 Chromium）——您只需安装一次（将
      balloob 的仓库添加到 App 商店，然后安装“Puppet”）并提供一个长期访问令牌；在 Docker/Container 部署中，您可以将该引擎作为边车（sidecar）运行并设置
      HAMCP_DASHBOARD_SCREENSHOT_ENGINE_URL。除非您同时启用此功能并安装引擎，否则不会安装任何笨重的组件。需要重启才能生效。要求上方（以及网页
      UI 中的）主“启用 beta 功能”开关必须开启 —— 否则此子标志在运行时将被忽略，无论此处的值如何。
  enable_auto_backup:
    name: 自动备份编辑
    description: Save a snapshot of an entity before each write or delete tool call
      changes it. While this is off, the file and raw-YAML tools (ha_write_file, ha_delete_file,
      ha_config_set_yaml) refuse to write.
  auto_backup_throttle_minutes:
    name: Auto-backup throttle (minutes)
    description: How often auto-backup may capture the same entity. 0 captures on
      every write; N above 0 captures at most one snapshot per N minutes per entity.
      Range 0–1440.
  auto_backup_retain_per_entity:
    name: Auto-backup retention (per entity)
    description: The most snapshots kept per entity. Each new capture removes the
      oldest snapshots above this number. Range 1–10000.
  enable_snapshot_actions:
    name: 允许完整的 Home Assistant 快照操作
    description: Allow AI assistants to manage full Home Assistant snapshots through
      ha_manage_backup and the equivalent backup services and commands in ha_call_service.
      Turning this off blocks every snapshot action, including listing. Snapshot deletion
      is only available through ha_manage_backup and also requires Allow snapshot
      deletion. Edit backups and the backup actions a person takes in the web settings
      UI remain available.
  backup_read_only:
    name: 将备份管理设为只读
    description: Allow AI assistants to list, view, and diff edit backups, and list
      full HA snapshots when snapshot actions are enabled. Block manual backup create,
      restore (including edit restores), and delete, including the equivalent backup
      services and commands in ha_call_service. Automatic pre-edit backups continue.
      The backup actions a person takes in the web settings UI remain available.
  enable_snapshot_delete:
    name: 允许删除快照
    description: Allow ha_manage_backup to delete full Home Assistant snapshots. A
      snapshot may be the last way back after a mistaken change, so a person must
      turn this on. Scheduled backups, the newest snapshot and snapshots younger than
      the minimum age stay protected.
  snapshot_delete_min_age_days:
    name: 可删除快照的最小年龄（天）
    description: How old a snapshot must be, in days, before it can be deleted. 0
      turns off the age limit; the newest snapshot and scheduled backups stay protected.
      Range 0–365.
  disabled_tools:
    name: 已禁用的工具（以逗号分隔）
    description: 此处列出的工具会被强制关闭，并在网页设置界面（“工具”选项卡）中锁定——在取消此选项之前无法在那里重新启用。少数必备工具（ha_search、ha_get_overview、ha_get_state、ha_report_issue、ha_manage_backup）无法禁用，即使列在此处也会继续运行。ha_get_skill_guide
      仅在严格最佳实践模式（enable_strict_mandatory_bps）关闭时才能禁用。以逗号分隔的工具名称（例如 ha_call_event,ha_eval_template）。
  pinned_tools:
    name: 已固定的工具（以逗号分隔）
    description: 此处列出的工具会被锁定为固定——它们显示在“工具”选项卡顶部，且在取消此选项之前无法从网页设置界面取消固定。与工具搜索搭配使用时很有用。以逗号分隔的工具名称。
  secret_path:
    name: 密钥路径覆盖
    description: 'MCP 服务器的可选自定义 HTTP 路径。留空则使用自动生成的安全路径。

      '
