---
# GENERATED FILE — do not edit. Translations live in
# src/ha_mcp/settings_ui/locales/zh-Hant.json (keys addon.*, features.*, advanced.*,
# backup.fields.*, addon_dev.*); regenerate with: python scripts/generate_locales.py
configuration:
  verify_ssl:
    name: 驗證 TLS 憑證
    description: 驗證 Home Assistant 伺服器的 TLS 憑證。僅在受信賴的網路、針對自簽憑證或主機名稱不符的情況下關閉此功能：這會削弱傳輸安全性。
  ha_tool_concurrency:
    name: Home Assistant 工具並行數
    description: 跨所有會話的外層 Home Assistant 工具呼叫的選用限制。內部 REST、WebSocket 及每個工具的分支（fan-out）並行性保持不變。0
      表示維持無限制行為。等待容量的呼叫將在 60 秒後失敗。 範圍 0–32。
  backup_hint:
    name: 備份提示層級
    description: 向 AI 助理提示在進行有風險的變更之前建議進行完整 Home Assistant 備份的強烈程度。它僅會變更此提示；自動編輯備份有其自身的設定。
  enable_beta_features:
    name: 啟用測試版功能 (master)
    description: ⚠ 危險 —— 這些工具可能會永久損壞您的 Home Assistant 安裝。它們會寫入您的 YAML 設定、檔案系統、安裝自訂元件、執行任意沙盒
      Python，以及編輯 AI 看到的工具說明字串。沒有保固且不保證支援 —— 您需自行承擔啟用的風險。啟用前請先建立 Home Assistant 備份，且在沒有備份的情況下切勿在生產環境中啟用。下方實驗性子旗標的主開關；當此主開關關閉時，子旗標在執行階段將被忽略，即使明確設定為
      true 也是如此。相同的切換開關也顯示在網頁設定 UI 的「Beta features (dangerous)」下方 —— 重新啟動後，任一介面都會反映另一個介面的狀態。
  enable_tool_search:
    name: 啟用工具搜尋
    description: 以基於搜尋的探索取代完整的工具目錄。可將閒置上下文減少約 90%，降至約 5K 個 Token。⚠️ 請勿在具有內建工具搜尋／延遲工具功能的用戶端（claude.ai、Claude
      Desktop、Claude Code）中啟用此功能 — 這兩個搜尋層會發生衝突，且在此情況下用戶端的內建工具搜尋是更好的選擇；請保持關閉。工具是否延遲取決於您的用戶端與模型組合：當您的設定在前端載入完整目錄時請使用此功能
      — 不具備原生延遲工具的模型（例如 Gemini、相容 OpenAI 的本機模型、Claude Haiku）、不論模型為何均內嵌所有工具結構定義的用戶端（例如
      GitHub Copilot CLI），或是較小的上下文視窗。某些 Codex 模型和 ChatGPT 也包含延遲工具 — 請直接檢查您的用戶端／模型以確認其功能，以免不必要地保持啟用。工具可透過
      ha_search_tools 尋找，並透過已分類的代理程式（讀取／寫入／刪除）執行。需要重新啟動才能生效。
  tool_search_max_results:
    name: 工具搜尋最大結果數
    description: 啟用工具搜尋時，每次 ha_search_tools 呼叫傳回的隱藏工具數目上限；排名前幾名之內的釘選工具會作為僅有名稱的簡短條目加入其上方。較低的值（2-3）可節省上下文權杖（context
      tokens），但可能會遺漏相關工具。需要重新啟動。 範圍 2–10。
  enable_tool_security_policies:
    name: 啟用工具安全性策略（進階）
    description: 將高風險工具呼叫（鎖定／警報控制、自動化寫入等）限制在使用者核准之後。當呼叫受保護的工具時，代理程式會指示使用者在網頁 UI 中開啟「工具安全性策略」分頁並點擊「核准」，然後呼叫才會繼續。具備選用引數條件的個別工具規則可在「工具安全性策略」分頁中進行設定。預設為關閉。需要重新啟動才能生效。
  enable_security_policy_tool:
    name: 允許 AI 代理程式編輯工具安全性策略
    description: 註冊 ha_manage_security_policy 工具，該工具允許連線的 AI 代理程式讀取和重寫工具安全性策略，包括移除批准閘道。預設為關閉。與上方的「工具安全性策略」選項獨立：這控制誰可以編輯規則，而不是是否強制執行它們。該工具無法看到或決定待處理的批准。若要將人類納入控制流程中，請在啟用該工具之前加上閘道：在網頁
      UI 的「工具」分頁中，將「Manage Security Policy」切換為「security gated」。需要重新啟動才能生效。
  read_only_mode:
    name: 唯讀模式
    description: 將所有寫入工具關閉，並移除工具進行任何寫入或具破壞性呼叫的能力。混合讀取／寫入工具（備份、應用程式（附加元件）、能源偏好設定、語音管線，以及啟用時的程式碼模式）將保持可用，但其寫入操作會被封鎖。與網頁
      UI「工具」分頁中的切換開關相同。預設為關閉。需要重新啟動才能生效。
  redact_secrets:
    name: 遮蔽機密資訊
    description: 在工具回應到達 AI 助理之前，將其中的機密資訊遮蔽。應用程式（附加元件）選項以及標記為密碼的整合欄位會被替換為已設定／空白標記（以便「此憑證是否已設定？」保持可回答），並且其他工具回應中會清除伺服器已經看過的機密值（小於
      6 個字元的實值會被略過，因為替換微小片段會損壞不相關的輸出）。其結構定義未標記為密碼的欄位無法被偵測。預設為關閉。需要重新啟動才能生效。
  enable_mandatory_bps:
    name: 寫入時附加最佳實踐技能
    description: '寫入工具技能內容傳遞功能的主開關（issue #1182）。啟用時（預設），六個設定寫入工具（自動化、指令碼、場景、輔助程式、儀表板、原始
      YAML）會在每次成功寫入時，於 `skill_content` 下方附加標準的 Home Assistant 最佳實踐參考檔案，並自動嵌入最佳實踐警告所引用的任何參考章節。每個工具也公開了每次呼叫皆有的
      `MandatoryBPS` 參數，一旦代理程式取得內容，便可在後續呼叫中將其設定為 false。當此主開關關閉時，無論每次呼叫的參數或最佳實踐警告為何，都不會發出任何
      skill_content。建議作為首選保持「開啟」；僅對上下文視窗非常小的模型進行停用。關閉此功能可能會降低寫入準確度。需要重新啟動才能生效。'
  enable_strict_mandatory_bps:
    name: 嚴格最佳實踐模式
    description: 嚴格模式：防止用戶端在證明其已閱讀最佳做法之前使用該工具。啟用後，六個最佳做法寫入工具（automations、scripts、scenes、helpers、dashboards、raw
      YAML）將被封鎖並傳回錯誤，指示用戶端透過 ha_get_skill_guide 閱讀最佳做法技能並傳回其在該處獲得的確認金鑰。啟用後，ha_get_skill_guide
      工具將被鎖定為啟用狀態——它是確認金鑰的唯一發布者。上方「Attach best-practice skills on writes」選項的子選項，當該父選項關閉時處於非作用中狀態。需要重新啟動才能生效。
  enable_yaml_config_editing:
    name: 啟用 YAML 設定編輯 (beta)
    description: 測試版功能。允許 AI 助理新增、取代或移除 configuration.yaml 和 packages/*.yaml 中的頂層金鑰。僅允許列入白名單的金鑰（例如：template、sensor、command_line、mqtt、knx）；核心金鑰（如
      homeassistant、http 和 recorder）會被封鎖。每次編輯都會驗證 YAML 語法、執行設定檢查並建立自動備份。對大多數金鑰的更改需要完整的
      HA 重新啟動才能生效。已知限制請參閱 docs/beta.md。可行時應優先使用專用工具（automations、scripts、scenes、helpers、template
      sensors）。需要上方（以及網頁 UI 中）的「Enable beta features」主開關處於開啟狀態 —— 否則此子旗標在執行階段將被忽略，無論其在此處的值為何。
  enable_yaml_edit_confirm:
    name: 要求確認 YAML 編輯（差異預覽）
    description: 'YAML 設定編輯的子切換開關，預設為開啟（建議）。第一次 ha_config_set_yaml 呼叫會傳回磁碟上實際變更內容的統一差異（unified
      diff）以及確認權杖，且不會寫入任何內容；只有在使用該權杖重複呼叫時，編輯才會生效。存在的目的是在請求編輯之外的非預期更改到達磁碟之前將其攔截（問題
      #1720）。僅在需要節省每次編輯的一次往返時才關閉。'
  enable_yaml_packages_automation:
    name: 允許 packages/*.yaml 中的 automation
    description: YAML 設定編輯的子切換開關。開啟時，ha_config_set_yaml 接受 packages/*.yaml 內的 yaml_path='automation'。關閉時，該呼叫會在用戶端和伺服器端被拒絕。儲存模式工具
      (ha_config_set_automation) 不受影響。預設為關閉；只有在上方「Enable YAML config editing」也開啟時才會生效。
  enable_yaml_packages_script:
    name: 允許 packages/*.yaml 中的 script
    description: YAML 設定編輯的子切換開關。開啟時，ha_config_set_yaml 接受 packages/*.yaml 內的 yaml_path='script'。關閉時，該呼叫會在用戶端和伺服器端被拒絕。儲存模式工具
      (ha_config_set_script) 不受影響。預設為關閉；只有在上方「Enable YAML config editing」也開啟時才會生效。
  enable_yaml_packages_scene:
    name: 允許 packages/*.yaml 中的 scene
    description: YAML 設定編輯的子切換開關。開啟時，ha_config_set_yaml 接受 packages/*.yaml 內的 yaml_path='scene'。關閉時，該呼叫會在用戶端和伺服器端被拒絕。儲存模式工具
      (ha_config_set_scene) 不受影響。預設為關閉；只有在上方「Enable YAML config editing」也開啟時才會生效。
  enable_lite_docstrings:
    name: 啟用精簡工具說明字串 (beta)
    description: 測試版功能。將 15 個較大型的 ha-mcp 工具（ha_config_get_automation、ha_config_set_automation、ha_config_get_script、ha_config_set_script、ha_config_get_scene、ha_config_set_scene、ha_config_list_helpers、ha_config_set_helper、ha_config_get_dashboard、ha_config_set_dashboard、ha_call_service、ha_config_set_yaml、ha_search、ha_manage_backup、ha_report_issue）的說明文件替換為較短的變體，將結構描述與範例詳細資料延後至
      ha_get_skill_guide 工具（或其 skill:// 資源）。有一個例外：ha_report_issue 則改為延後至其自身回應的指令欄位。微調備份提示設定在精簡模式下依然適用。警告：這會減少閒置
      Token 的使用量，但可能會降低 LLM 的效能 — 簡短的描述依賴 LLM 實際呼叫技能工具或讀取技能資源來取得詳細資料，這無法獲得保證（某些模型會跳過額外的工具呼叫，導致獲得的指引比以前少）。最適合與支援
      MCP 資源的用戶端或 enable_tool_search 一同使用。需要重新啟動才能生效。需要開啟上方（以及網頁 UI 中的）主「啟用測試版功能」切換開關
      — 否則此子旗標在執行階段將被忽略，無論其在此處的值為何。
  enable_filesystem_tools:
    name: 啟用檔案系統工具 (beta)
    description: 設定 HAMCP_ENABLE_FILESYSTEM_TOOLS=true。啟用對 Home Assistant 檔案系統的直接檔案讀取/寫入存取權。警告：這會賦予
      MCP 伺服器對您系統的敏感直接檔案存取權。只有在您信任 AI 助理進行檔案操作時才啟用。需要重新啟動才能生效。需要上方（以及網頁 UI 中）的「Enable
      beta features」主開關處於開啟狀態 —— 否則此子旗標在執行階段將被忽略，無論其在此處的值為何。
  enable_code_mode:
    name: 啟用自訂工具沙盒 (beta)
    description: 測試版功能。啟用 ha_manage_custom_tool 工具，當沒有內建工具能處理請求時，讓 AI 程式助理能在安全沙盒中建立、執行、儲存和刪除自訂
      Python 程式碼。程式碼在沒有檔案系統或任意網路存取權的隔離解譯器中執行。沙盒程式碼可以存取 HA REST API (api_get/api_post)、傳送
      WebSocket 命令 (ws_send)、呼叫現有的 MCP 工具 (call_tool)，或移除已儲存的工具 (delete_saved_tool)。已儲存的工具預設會持久化至
      /data/saved_tools.json，以便在應用程式（附加元件）重新啟動後保留，並且對任何可以連線的用戶端可見。已知限制請參閱 docs/beta.md。需要重新啟動才能生效。需要上方（以及網頁
      UI 中）的「Enable beta features」主開關處於開啟狀態 —— 否則此子旗標在執行階段將被忽略，無論其在此處的值為何。
  enable_dashboard_screenshot:
    name: 啟用儀表板截圖模式 (測試版)
    description: 測試版功能 — 預設為停用。新增 ha_get_dashboard_screenshot 工具，以及儀表板取得/設定工具上的 include_screenshot
      / return_screenshot 選項，讓 AI 助理可以檢查一個或幾個響應式 Lovelace 影像（例如驗證他們剛建立的儀表板）。支援穩定的具名檢視、手機/平板/電腦批次處理，以及
      PNG/JPEG/WebP/BMP 輸出。渲染會在獨立的選用引擎中執行（balloob 的「Puppet」App（附加元件）、無頭 Chromium）—
      您只需要安裝一次（將 balloob 的儲存庫加入 App 商店，然後安裝「Puppet」）並提供長期存取權杖；在 Docker/Container 部署中，您可以將該引擎作為
      sidecar 執行並設定 HAMCP_DASHBOARD_SCREENSHOT_ENGINE_URL。除非您同時啟用此功能並安裝引擎，否則不會安裝任何大型元件。需要重新啟動才能生效。需要開啟上方（以及網頁
      UI 中的）主「啟用測試版功能」切換開關 — 否則此子旗標在執行階段將被忽略，無論其在此處的值為何。
  enable_auto_backup:
    name: 自動備份編輯
    description: 在每次寫入或刪除工具呼叫變更實體之前，儲存實體的快照。當此功能關閉時，檔案與原始 YAML 工具（ha_write_file、ha_delete_file、ha_config_set_yaml）將拒絕寫入。
  auto_backup_throttle_minutes:
    name: 自動備份節流（分鐘）
    description: 自動備份擷取同一實體的頻率。0 表示每次寫入時擷取；大於 0 的 N 表示每個實體每 N 分鐘最多擷取一個快照。 範圍 0–1440。
  auto_backup_retain_per_entity:
    name: 自動備份保留數量（每個實體）
    description: 每個實體保留的快照數量上限。每次新的擷取都會移除超過此數量的最舊快照。 範圍 1–10000。
  enable_snapshot_actions:
    name: 允許完整的 Home Assistant 快照操作
    description: 允許 AI 助理透過 ha_manage_backup 以及 ha_call_service 中的對應備份服務和指令來管理完整的
      Home Assistant 快照。關閉此功能會封鎖所有快照動作，包括列出快照。刪除快照僅能透過 ha_manage_backup 進行，且需要啟用「允許刪除快照」。使用者在網頁設定介面中進行的備份編輯與備份動作仍然可用。
  backup_read_only:
    name: 將備份管理設為唯讀
    description: 允許 AI 助理列出、檢視及比對（diff）編輯備份，並在啟用快照動作時列出完整的 HA 快照。封鎖手動建立備份、還原（包含編輯還原）與刪除，包含
      ha_call_service 中的對應備份服務和指令。自動編輯前備份將繼續運作。使用者在網頁設定介面中進行的備份動作仍然可用。
  enable_snapshot_delete:
    name: 允許刪除快照
    description: 允許 ha_manage_backup 刪除完整的 Home Assistant 快照。快照可能是發生錯誤變更後的最後復原手段，因此必須由使用者手動開啟此功能。排程備份、最新快照以及小於最低保留期限的快照將受到保護。
  snapshot_delete_min_age_days:
    name: 允許刪除的最小快照天數（天）
    description: 快照在可被刪除之前必須保留的天數。0 表示關閉年限限制；最新快照與排程備份將受到保護。 範圍 0–365。
  disabled_tools:
    name: 停用的工具（以逗號分隔）
    description: 此處列出的工具會被強制關閉並在網頁設定 UI（「工具」分頁）中鎖定 — 若不先取消此選項，將無法在該處重新啟用。一小組強制性工具（ha_search、ha_get_overview、ha_get_state、ha_report_issue、ha_manage_backup）無法停用，即使列在此處也會繼續執行。ha_get_skill_guide
      僅能在嚴格最佳實務模式（enable_strict_mandatory_bps）關閉時停用。以逗號分隔的工具名稱（例如 ha_call_event,ha_eval_template）。
  pinned_tools:
    name: 固定的工具（以逗號分隔）
    description: 此處列出的工具會被鎖定固定 — 牠們會顯示在「工具」分頁的最上方，若不先取消此選項，將無法從網頁設定 UI 取消固定。結合「工具搜尋」使用非常實用。以逗號分隔的工具名稱。
  secret_path:
    name: 密鑰路徑覆寫
    description: 'MCP 伺服器的選用自訂 HTTP 路徑。保持空白以使用自動產生的安全路徑。

      '
