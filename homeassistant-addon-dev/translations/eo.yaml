---
# GENERATED FILE — do not edit. Translations live in
# src/ha_mcp/settings_ui/locales/eo.json (keys addon.*, features.*, advanced.*,
# backup.fields.*, addon_dev.*); regenerate with: python scripts/generate_locales.py
configuration:
  verify_ssl:
    name: Verify TLS certificates
    description: 'Verify the Home Assistant server''s TLS certificate. Turn this off
      only on a trusted network, for a self-signed certificate or a hostname mismatch:
      it weakens transport security.'
  ha_tool_concurrency:
    name: Konkureco de hejmaŭtomatigaj iloj de Home Assistant
    description: Optional limit on outer Home Assistant tool calls across all sessions.
      Internal REST, WebSocket, and per-tool fan-out concurrency is unchanged. 0 keeps
      unlimited behavior. A call waiting for capacity fails after 60 seconds. Range
      0–32.
  backup_hint:
    name: Backup hint level
    description: How strongly AI assistants are told to suggest a full Home Assistant
      backup before risky changes. It changes only this hint; automatic edit backups
      have their own setting.
  enable_beta_features:
    name: Ebligi beta-funkciojn (majstra)
    description: ⚠ DANĜERO — ĉi tiuj iloj povas PERMANENTE DAMAĜI vian Home Assistant-instalaĵon.
      Ili skribas al via YAML-agordo, via dosiersistemo, instalas kutimajn komponantojn,
      rulas arbitran sandbokseitan Python-kodon, kaj redaktas ilajn dokumentŝnurojn,
      kiujn la AI vidas. Ne ekzistas garantio kaj neniu subtena promeso — vi ebligas
      ilin je via PROPRIA RISKO. Faru sekurkopion de Home Assistant antaŭ ol ŝalti
      ĉi tion, kaj neniam ebligu en produktado sen unu. Ĉefa pordo por la eksperimentaj
      sub-flagoj sube; sub-flagoj estas ignoritaj dum rultempo dum ĉi tiu ĉefa estas
      malŝaltita, eĉ kiam eksplicite agordita al true. La sama ŝaltilo ankaŭ aperas
      en la retaj agordoj sub "Beta features (dangerous)" — ambaŭ surfacoj reflektas
      unu la alian post restartigo.
  enable_tool_search:
    name: Ebligi ilo-serĉon
    description: 'Anstataŭigi la plenan ilo-katalogon per serĉ-bazita malkovro. Reduktas
      neaktivan kuntekston je proksimume 90%, al ĉirkaŭ 5K ĵetonoj. ⚠️ NE ebligu ĉi
      tion en klientoj kun sia propra enkonstruita ilo-serĉo / prokrastitaj iloj (claude.ai,
      Claude Desktop, Claude Code) — la du serĉtavoloj konfliktas, kaj la enkonstruita
      ilo-serĉo de la kliento estas la pli bona elekto tie; lasu ĉi tion malŝaltita.
      Ĉu iloj estas prokrastitaj dependas de via kliento kaj modelo-kombino: uzu ĉi
      tion kiam via agordo ŝarĝas la plenan katalogon antaŭe — modeloj sen denaskaj
      prokrastitaj iloj (ekz. Gemini, OpenAI-kongruaj lokaj modeloj, Claude Haiku),
      klientoj kiuj enlinigas ĉiujn ilo-skemojn sendepende de modelo (ekz. GitHub
      Copilot CLI), aŭ pli malgrandaj kuntekstaj fenestroj. Iuj Codex-modeloj kaj
      ChatGPT ankaŭ inkluzivas prokrastitajn ilojn — kontrolu vian klienton/modelon
      rekte por konfirmi ĝiajn funkciojn, por ke vi ne lasu ĉi tion ebligita senbezone.
      Iloj estas trovitaj per ha_search_tools kaj ekzekutitaj per kategoriigitaj prokuriloj
      (legi/skribi/forigi). Postulas restartigon por ekvalidi.'
  tool_search_max_results:
    name: Maksimumaj rezultoj de ilo-serĉo
    description: Maximum number of hidden tools returned per ha_search_tools call
      when tool search is enabled; a pinned tool that ranks inside that top count
      is added as a short name-only entry on top of it. Lower values (2-3) save context
      tokens but may miss relevant tools. Requires restart. Range 2–10.
  enable_tool_security_policies:
    name: Ebligi Ilo-Sekurecajn Politikojn (altnivela)
    description: Gardu alt-riskajn ilo-vokojn (seruro/alarmo-kontrolo, aŭtomatigo-skriboj,
      ktp.) malantaŭ uzant-aprobo. Kiam gardita ilo estas vokita, la agento diras
      al la uzanto malfermi la langeton Ilo-Sekurecaj Politikoj en la TTT-UI kaj klaki
      Aprobi antaŭ ol la voko daŭras. Reguloj por ĉiu ilo kun laŭvolaj argumentaj
      kondiĉoj estas agorditaj en la langeto Ilo-Sekurecaj Politikoj. Malŝaltita defaŭlte.
      Postulas restartigon por ekvalidi.
  enable_security_policy_tool:
    name: Permesi al AI-agentoj redakti ilajn sekurecajn politikojn
    description: 'Registras la ilon ha_manage_security_policy, kiu permesas al konektitaj
      AI-agentoj legi kaj reverki la ilajn sekurecajn politikojn — inkluzive de forigo
      de aprobo-pordoj. Malŝaltita defaŭlte. Sendepende de la opcio ''Iloj Sekurecaj
      Politikoj'' supre: ĉi tio regas, kiu povas redakti la regulojn, ne ĉu ili estas
      plenumitaj. La ilo ne povas vidi aŭ decidi atendajn aprobojn. Por konservi homon
      en la procezo, pordigu la ilon antaŭ ol ebligi ĝin: ŝaltu "sekurece pordigita"
      por ''Administri Sekurecan Politikon'' en la langeto ''Iloj'' de la reta UI.
      Postulas restartigon por efektiviĝi.'
  read_only_mode:
    name: Nur-lega Reĝimo
    description: Malŝaltas ĉiujn skribilojn, kaj forigas la kapablon por iloj fari
      skribajn aŭ detruajn vokojn. Miksitaj leg-skribaj iloj — savkopioj, Apoj (aldonaĵoj),
      energiaj preferoj, voĉaj duktoj, kaj koda reĝimo kiam ebligite — restas haveblaj
      kun siaj skribaj operacioj blokitaj. Sama ŝaltilo kiel la TTT-interfaca langeto
      Iloj. Malŝaltita defaŭlte. Postulas restartigon por ekvalidi.
  redact_secrets:
    name: Redakti Sekretojn
    description: Redaktas sekretojn el ilaj respondon antaŭ ol ili atingas la AI-asistanton.
      Apaj (aldonaĵaj) opcioj kaj integriĝaj kampoj markitaj kiel pasvortoj estas
      anstataŭigitaj per aro/malplena markilo (do "ĉu ĉi tiu akreditaĵo estas agordita?"
      restas respondoebla), kaj aliaj ilaj respondoj estas purigitaj de sekretaj valoroj
      kiujn la servilo jam vidis (valoroj pli mallongaj ol 6 signoj estas preterlasitaj,
      ĉar anstataŭigi etajn fragmentojn koruptus senrilatan eligon). Kampoj ne markitaj
      kiel pasvortoj per sia skemo ne povas esti detektitaj. Malŝaltita defaŭlte.
  enable_mandatory_bps:
    name: Aligi plejbonajn praktikajn kapablojn ĉe skriboj
    description: 'Majstra ŝaltilo por la funkcio de liverado de enhavo de skrib-ila
      kapablo (problemo #1182). Kiam ebligita (defaŭlte), la ses agordaj skrib-iloj
      (aŭtomatigoj, skriptoj, scenoj, helpiloj, paneloj, kruda YAML) aligas la kanonikajn
      Home Assistant plejbonajn praktikajn referencajn dosierojn sub `skill_content`
      ĉe ĉiu sukcesa skribo, plus aŭtomate enigas iujn ajn referencajn sekciojn cititajn
      de plejbonaj praktikaj avertoj. Ĉiu ilo ankaŭ eksponas por-vokan `MandatoryBPS`
      parametron, kiun la agento povas agordi al false ĉe postaj vokoj post kiam ĝi
      havas la enhavon. Kiam ĉi tiu majstra ŝaltilo estas malŝaltita, NENIU skill_content
      eliras sendepende de la por-voka parametro aŭ BP-avertoj. Rekomendita ŜALTITA
      kiel la unua elekto; malŝaltu nur por modeloj kun tre malgrandaj kuntekstaj
      fenestroj. Malŝalti ĉi tion povas malbonigi skriban precizecon. Postulas restartigon
      por ekvalidi.'
  enable_strict_mandatory_bps:
    name: Strikta plejbonaj-praktikoj reĝimo
    description: 'Strikta reĝimo: malhelpas la klienton uzi la ilon ĝis ĝi povas pruvi,
      ke ĝi legis la plejbonajn praktikojn. Dum ŝaltita, la ses plejbonaj-praktikaj
      skrib-iloj (aŭtomatigoj, skriptoj, scenoj, helpiloj, paneloj, kruda YAML) estas
      blokitaj kaj redonas eraron direktante la klienton legi la plejbonajn-praktikajn
      kapablojn per ha_get_skill_guide kaj resendi la agnoskan ŝlosilon, kiun ĝi akiras
      tie. Dum ŝaltita, la ilo ha_get_skill_guide estas ŝlosita ebligita — ĝi estas
      la sola eldonanto de la agnoska ŝlosilo. Infano de la opcio „Aligi plejbonajn
      praktikajn kapablojn ĉe skriboj” supre kaj inerta dum tiu gepatro estas malŝaltita.
      Postulas restartigon por ekvalidi.'
  enable_yaml_config_editing:
    name: Ebligi redaktadon de YAML-agordo (beta)
    description: Beta-funkcio. Permesas al AI-asistantoj aldoni, anstataŭigi, aŭ forigi
      ĉefnivelajn ŝlosilojn en configuration.yaml kaj packages/*.yaml. Nur blanklistigitaj
      ŝlosiloj estas permesitaj (ekz., template, sensor, command_line, mqtt, knx);
      kernaj ŝlosiloj kiel homeassistant, http, kaj recorder estas blokitaj. Ĉiu redakto
      validigas YAML-sintakson, rulas agordan kontrolon, kaj kreas aŭtomatan sekurkopion.
      Ŝanĝoj al plej multaj ŝlosiloj postulas plenan HA-restartigon por ekvalidi.
      Vidu docs/beta.md por konataj limigoj. Dedikataj iloj (automations, scripts,
      scenes, helpers, template sensors) estu preferataj kiam disponeblaj. POSTULAS
      ke la ĉefa ŝaltilo "Enable beta features" supre (kaj en la reta UI) estu ŝaltita
      — alie ĉi tiu sub-flago estas ignorita dum rultempo sendepende de ĝia valoro
      ĉi tie.
  enable_yaml_edit_confirm:
    name: Postuli konfirmon por YAML-redaktoj (diferenca antaŭvido)
    description: 'Sub-ŝaltilo de redaktado de YAML-agordo, defaŭlte ŜALTITA (rekomendita).
      La unua voko de ha_config_set_yaml redonas unuigitan diferencon de ĝuste kio
      ŝanĝiĝus sur disko plus konfirman ĵetonon kaj skribas nenion; la redakto nur
      realiĝas kiam la voko estas ripetita kun tiu ĵetono. Ekzistas por ke neintencitaj
      ŝanĝoj ekster la petita redakto estu kaptitaj antaŭ ol ili atingas diskon (issue
      #1720). Malŝaltu nur por ŝpari unu rondveturon per redakto.'
  enable_yaml_packages_automation:
    name: Permesi aŭtomatigon en packages/*.yaml
    description: Sub-ŝaltilo de redaktado de YAML-agordo. Kiam ŝaltita, ha_config_set_yaml
      akceptas yaml_path='automation' ene de packages/*.yaml. Kiam malŝaltita, la
      voko estas malakceptita kaj klient-flanke kaj servil-flanke. La ilo en stokada
      reĝimo (ha_config_set_automation) estas netuŝita. Defaŭlte MALŜALTITA; efikas
      nur kiam "Ebligi redaktadon de YAML-agordo" supre estas ankaŭ ŝaltita.
  enable_yaml_packages_script:
    name: Permesi skripton en packages/*.yaml
    description: Sub-ŝaltilo de redaktado de YAML-agordo. Kiam ŝaltita, ha_config_set_yaml
      akceptas yaml_path='script' ene de packages/*.yaml. Kiam malŝaltita, la voko
      estas malakceptita kaj klient-flanke kaj servil-flanke. La ilo en stokada reĝimo
      (ha_config_set_script) estas netuŝita. Defaŭlte MALŜALTITA; efikas nur kiam
      "Ebligi redaktadon de YAML-agordo" supre estas ankaŭ ŝaltita.
  enable_yaml_packages_scene:
    name: Permesi scenon en packages/*.yaml
    description: Sub-ŝaltilo de redaktado de YAML-agordo. Kiam ŝaltita, ha_config_set_yaml
      akceptas yaml_path='scene' ene de packages/*.yaml. Kiam malŝaltita, la voko
      estas malakceptita kaj klient-flanke kaj servil-flanke. La ilo en stokada reĝimo
      (ha_config_set_scene) estas netuŝita. Defaŭlte MALŜALTITA; efikas nur kiam "Ebligi
      redaktadon de YAML-agordo" supre estas ankaŭ ŝaltita.
  enable_lite_docstrings:
    name: Ebligi malpezajn ilajn dokumentŝnurojn (beta)
    description: 'Beta-funkcio. Anstataŭigas la dokumentajn signovicojn ĉe 15 pezaj
      ha-mcp-iloj (ha_config_get_automation, ha_config_set_automation, ha_config_get_script,
      ha_config_set_script, ha_config_get_scene, ha_config_set_scene, ha_config_list_helpers,
      ha_config_set_helper, ha_config_get_dashboard, ha_config_set_dashboard, ha_call_service,
      ha_config_set_yaml, ha_search, ha_manage_backup, ha_report_issue) per pli mallongaj
      variantoj, kiuj prokrastas la detalojn de skemo kaj ekzemplo al la ilo ha_get_skill_guide
      (aŭ ĝia risurco skill://). Unu escepto: ha_report_issue prokrastas anstataŭe
      al la instrukcia kampo de sia propra respondo. Agordi la konservan konsilon
      (Backup-hint) ankoraŭ validas en malpeza reĝimo. ATENTO: ĉi tio malpliigas la
      uzadon de neaktivaj signetoj (tokens), sed povas malbonigi la LLM-efikecon —
      la fortonĉitaj priskriboj dependas de tio, ke la LLM fakte vokas la lertan ilon
      aŭ legas la lertan risurcon por detaloj, kio ne estas garantiita (kelkaj modeloj
      preterlasos la ekstran ilvokon kaj finos kun malpli da gvidado ol antaŭe). Plej
      bone uzata kune kun kliento kiu subtenas MCP-risurcojn aŭ kun enable_tool_search.
      Postulas restartigon por ekvalidi. POSTULAS, ke la ĉefa ŝaltilo "Enable beta
      features" supre (kaj en la reta interfaco) estu enŝaltita — alie ĉi tiu sub-flago
      estas ignorata dum rulado sendepende de sia valoro ĉi tie.'
  enable_filesystem_tools:
    name: Ebligi dosiersistemajn ilojn (beta)
    description: 'Agordas HAMCP_ENABLE_FILESYSTEM_TOOLS=true. Ebligas rektan dosier-leg/skriban
      aliron al via Home Assistant-dosiersistemo. AVERTO: Ĉi tio donas al la MCP-servilo
      senteman rektan dosier-aliron al via sistemo. Ebligu nur se vi fidas la AI-asistanton
      kun dosieroperacioj. Postulas restartigon por ekvalidi. POSTULAS ke la ĉefa
      ŝaltilo "Enable beta features" supre (kaj en la reta UI) estu ŝaltita — alie
      ĉi tiu sub-flago estas ignorita dum rultempo sendepende de ĝia valoro ĉi tie.'
  enable_code_mode:
    name: Ebligi kutiman ilon sandbokson (beta)
    description: Beta-funkcio. Ebligas la ilon ha_manage_custom_tool, kiu permesas
      al AI-asistantoj krei, ruli, konservi kaj forigi personigitajn Python-kodojn
      en sekura sablokesto kiam neniu enkonstruita ilo povas trakti la peton. Kodo
      ruliĝas en izolita interpretilo sen dosiersistemo aŭ propra reta aliro. Sablokesta
      kodo povas trafi la HA REST API (api_get/api_post), sendi WebSocket-komandojn
      (ws_send), voki ekzistantajn MCP-ilojn (call_tool), aŭ forigi konservitan ilon
      (delete_saved_tool). Konservitaj iloj persistas al /data/saved_tools.json defaŭlte
      por ke ili postvivu restartigojn de la apo (aldonaĵo), kaj estas videblaj al
      ajna kliento kiu povas konektiĝi. Vidu docs/beta.md por konataj limigoj. Postulas
      restartigon por ekvalidi. POSTULAS ke la ĉefa ŝaltilo "Enable beta features"
      supre (kaj en la TTT-interfaco) estu ŝaltita — alie ĉi tiu subflago estas ignorata
      dum rultempo sendepende de sia valoro ĉi tie.
  enable_dashboard_screenshot:
    name: Ebligi panelan ekrankaptan reĝimon (beta)
    description: Beta-funkcio — malŝaltita defaŭlte. Aldonas la ilon ha_get_dashboard_screenshot
      plus opciojn include_screenshot / return_screenshot ĉe la panelaj get/set-iloj,
      por ke AI-asistantoj povu inspekti unu aŭ pli respondemajn Lovelace-bildojn
      (ekz. por kontroli panelon kiun ili ĝuste kreis). Subtenas stabilajn nomitajn
      vidojn, poŝtelefonajn/tabulkomputilajn/tabulajn arojn, kaj PNG/JPEG/WebP/BMP-eligon.
      Teksturigo ruliĝas en aparta, libervola motoro — la "Puppet" App (aldonaĵo)
      de balloob, senkapa Chromium — kiun vi instalas unufoje (aldonu la deponejon
      de balloob al la Aldona Butiko, poste instalu "Puppet") kaj donas longdaŭran
      alirtokonon; ĉe Docker/Container-deplojoj vi ruli tiun motoron kiel flankan
      ujon kaj agordas HAMCP_DASHBOARD_SCREENSHOT_ENGINE_URL. Neniopeza estas instalita
      krom se vi kaj ebligas ĉi tion kaj instalas la motoron. Postulas restartigon
      por ekvalidi. POSTULAS ke la ĉefa ŝaltilo "Enable beta features" supre (kaj
      en la TTT-interfaco) estu ŝaltita — alie ĉi tiu subflago estas ignorata dum
      rultempo sendepende de sia valoro ĉi tie.
  enable_auto_backup:
    name: Aŭtomataj sekurkopioj de redaktoj
    description: Save a snapshot of an entity before each write or delete tool call
      changes it. While this is off, the file and raw-YAML tools (ha_write_file, ha_delete_file,
      ha_config_set_yaml) refuse to write.
  auto_backup_throttle_minutes:
    name: Auto-backup throttle (minutes)
    description: How often auto-backup may capture the same entity. 0 captures on
      every write; N above 0 captures at most one snapshot per N minutes per entity.
      Range 0–1440.
  auto_backup_retain_per_entity:
    name: Auto-backup retention (per entity)
    description: The most snapshots kept per entity. Each new capture removes the
      oldest snapshots above this number. Range 1–10000.
  enable_snapshot_actions:
    name: Permesi plenajn akompanajn agojn de HA-momentfotoj
    description: Allow AI assistants to manage full Home Assistant snapshots through
      ha_manage_backup and the equivalent backup services and commands in ha_call_service.
      Turning this off blocks every snapshot action, including listing. Snapshot deletion
      is only available through ha_manage_backup and also requires Allow snapshot
      deletion. Edit backups and the backup actions a person takes in the web settings
      UI remain available.
  backup_read_only:
    name: Igi rezervadministradon nur-legebla
    description: Allow AI assistants to list, view, and diff edit backups, and list
      full HA snapshots when snapshot actions are enabled. Block manual backup create,
      restore (including edit restores), and delete, including the equivalent backup
      services and commands in ha_call_service. Automatic pre-edit backups continue.
      The backup actions a person takes in the web settings UI remain available.
  enable_snapshot_delete:
    name: Permesi forigon de momentfotoj
    description: Allow ha_manage_backup to delete full Home Assistant snapshots. A
      snapshot may be the last way back after a mistaken change, so a person must
      turn this on. Scheduled backups, the newest snapshot and snapshots younger than
      the minimum age stay protected.
  snapshot_delete_min_age_days:
    name: Minimuma aĝo de momentfoto por forigi (tagoj)
    description: How old a snapshot must be, in days, before it can be deleted. 0
      turns off the age limit; the newest snapshot and scheduled backups stay protected.
      Range 0–365.
  disabled_tools:
    name: Malaktivigitaj iloj (disigitaj per komoj)
    description: Iloj listigitaj ĉi tie estas devige malŝaltitaj kaj ŝlositaj en la
      reta Agorda UI (langeto 'Iloj') — ili ne povas esti re-ebligitaj tie sen unue
      malaktivigi ĉi tiun opcion. Malgranda aro de devigaj iloj (ha_search, ha_get_overview,
      ha_get_state, ha_report_issue, ha_manage_backup) ne povas esti malaktivigitaj
      kaj daŭre funkcias eĉ se listigitaj ĉi tie. ha_get_skill_guide povas esti malaktivigita
      nur dum la strikta plejbonaj praktikoj reĝimo (enable_strict_mandatory_bps)
      estas malŝaltita. Ilnomoj disigitaj per komoj (ekz. ha_call_event,ha_eval_template).
  pinned_tools:
    name: Fiksitaj iloj (disigitaj per komoj)
    description: Iloj listigitaj ĉi tie estas ŝlositaj fiksitaj — ili aperas ĉe la
      supro de la langeto 'Iloj' kaj ne povas esti malfiksitaj de la reta Agorda UI
      sen unue malaktivigi ĉi tiun opcion. Utila kombine kun 'Ilo-Serĉo'. Ilnomoj
      disigitaj per komoj.
  secret_path:
    name: Anstataŭigo de sekreta vojo
    description: 'Laŭvola kutima HTTP-vojo por la MCP-servilo. Lasu malplena por uzi
      la aŭtomate generitan sekuran vojon.

      '
